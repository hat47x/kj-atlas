[project]
name = "kj-atlas-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "alembic",
  "fastapi<0.137",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "sqlalchemy",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "pytest",
  "httpx",
]

[tool.pytest.ini_options]
pythonpath = [
  "src",
]
markers = [
  "postgres: tests that require PostgreSQL",
  "auth_level1: required AuthContext contract coverage",
  "auth_level2: conditional federation fixture coverage",
]

[tool.ruff]
target-version = "py310"
line-length = 100
