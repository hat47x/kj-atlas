[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kj-atlas-backend"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "alembic",
  "cryptography",
  "fastapi<0.137",
  "httpx",
  "pydantic",
  "pydantic-settings",
  "pyjwt",
  "sqlalchemy",
  "uvicorn",
]

[project.optional-dependencies]
test = [
  "pytest",
  "httpx",
  "ruff==0.15.22",
]
# SAAS-TENANT-01 AC-5: driver for `postgresql+psycopg` (see
# kj_atlas_api.db._normalize_database_url). Only needed to run the
# `postgres`-marked tests (README.md "tenant RLSの実地matrix"); not a
# runtime dependency of the app itself (production DB URL scheme is
# postgresql+asyncpg, normalized at import time).
postgres = [
  "psycopg[binary]",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = [
  "--strict-markers",
]
pythonpath = [
  "src",
]
markers = [
  "postgres: tests that require PostgreSQL",
  "auth_level1: required AuthContext contract coverage",
  "auth_level2: conditional federation fixture coverage",
]

[tool.ruff]
target-version = "py310"
line-length = 100
