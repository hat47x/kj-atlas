services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-kj_atlas}
      POSTGRES_USER: ${POSTGRES_USER:-kj_atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kj_atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kj_atlas} -d ${POSTGRES_DB:-kj_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kj_atlas_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      KJ_ATLAS_DATABASE_URL: ${KJ_ATLAS_DATABASE_URL:-postgresql+asyncpg://kj_atlas:kj_atlas@db:5432/kj_atlas}
      KJ_ATLAS_LLM_PROVIDER: ${KJ_ATLAS_LLM_PROVIDER:-none}
    command: sh -c "alembic upgrade head && uvicorn kj_atlas_api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-/api}
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - api

volumes:
  kj_atlas_pgdata:
