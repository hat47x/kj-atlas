services:
  db:
    image: postgres:16-alpine
    environment:
      # Private adapter boundary only: map public SUI_* -> vendor-defined POSTGRES_* (not user-facing keys)
      POSTGRES_DB: ${SUI_POSTGRES_DB:-sui_sensemaking}
      POSTGRES_USER: ${SUI_POSTGRES_USER:-sui_sensemaking}
      POSTGRES_PASSWORD: ${SUI_POSTGRES_PASSWORD:-sui_sensemaking}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUI_POSTGRES_USER:-sui_sensemaking} -d ${SUI_POSTGRES_DB:-sui_sensemaking}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - sui_sensemaking_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      # Derive the default DB URL from the same POSTGRES_* vars the db service uses,
      # so setting SUI_POSTGRES_PASSWORD alone keeps api and db credentials consistent.
      - SUI_RUNTIME_PROFILE=${SUI_RUNTIME_PROFILE:-evaluation}
      - SUI_DATABASE_URL=${SUI_DATABASE_URL:-postgresql+asyncpg://${SUI_POSTGRES_USER:-sui_sensemaking}:${SUI_POSTGRES_PASSWORD:-sui_sensemaking}@db:5432/${SUI_POSTGRES_DB:-sui_sensemaking}}
      - SUI_LLM_PROVIDER=${SUI_LLM_PROVIDER:-none}
      - SUI_APP_REVISION
      # Pass-through only when set on the host (unset stays unset in the container,
      # not an empty string) -- ENV-COMPOSE-01 Phase 2. Never given a default here:
      # an empty-string default would silently disable the protection these keys
      # exist to provide, the opposite of "unset stays unset".
      - SUI_API_KEY
      - SUI_ALLOW_JIT_PROVISIONING
    command: sh -c "alembic upgrade head && uvicorn sui_sensemaking_api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # python:slim has no curl; use the stdlib over the exec form to avoid shell quoting.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        SUI_FRONTEND_API_BASE: /api
        SUI_RUNTIME_PROFILE: ${SUI_RUNTIME_PROFILE:-evaluation}
        SUI_APP_REVISION: ${SUI_APP_REVISION:-unknown}
    ports:
      # Loopback-only by design (DEPLOY-NET-01): omitting the host IP here would
      # bind 0.0.0.0, exposing this unauthenticated evaluation stack to the whole
      # LAN. SUI_WEB_PORT changes the port, never the bind address.
      - "127.0.0.1:${SUI_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  sui_sensemaking_pgdata:
