services:
  db:
    image: postgres:16-alpine
    environment:
      # Private adapter boundary only: map public KJ_ATLAS_* -> vendor-defined POSTGRES_* (not user-facing keys)
      POSTGRES_DB: ${KJ_ATLAS_POSTGRES_DB:-kj_atlas}
      POSTGRES_USER: ${KJ_ATLAS_POSTGRES_USER:-kj_atlas}
      POSTGRES_PASSWORD: ${KJ_ATLAS_POSTGRES_PASSWORD:-kj_atlas}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KJ_ATLAS_POSTGRES_USER:-kj_atlas} -d ${KJ_ATLAS_POSTGRES_DB:-kj_atlas}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kj_atlas_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      # Derive the default DB URL from the same POSTGRES_* vars the db service uses,
      # so setting KJ_ATLAS_POSTGRES_PASSWORD alone keeps api and db credentials consistent.
      - KJ_ATLAS_RUNTIME_PROFILE=${KJ_ATLAS_RUNTIME_PROFILE:-evaluation}
      - KJ_ATLAS_DATABASE_URL=${KJ_ATLAS_DATABASE_URL:-postgresql+asyncpg://${KJ_ATLAS_POSTGRES_USER:-kj_atlas}:${KJ_ATLAS_POSTGRES_PASSWORD:-kj_atlas}@db:5432/${KJ_ATLAS_POSTGRES_DB:-kj_atlas}}
      - KJ_ATLAS_LLM_PROVIDER=${KJ_ATLAS_LLM_PROVIDER:-none}
      # Pass-through only when set on the host (unset stays unset in the container,
      # not an empty string) -- ENV-COMPOSE-01 Phase 2. Never given a default here:
      # an empty-string default would silently disable the protection these keys
      # exist to provide, the opposite of "unset stays unset".
      - KJ_ATLAS_API_KEY
      - KJ_ATLAS_ALLOW_JIT_PROVISIONING
      - KJ_ATLAS_APP_REVISION
    command: sh -c "alembic upgrade head && uvicorn kj_atlas_api.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      # python:slim has no curl; use the stdlib over the exec form to avoid shell quoting.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        KJ_ATLAS_FRONTEND_API_BASE: ${KJ_ATLAS_FRONTEND_API_BASE:-/api}
        KJ_ATLAS_RUNTIME_PROFILE: ${KJ_ATLAS_RUNTIME_PROFILE:-evaluation}
        KJ_ATLAS_APP_REVISION: ${KJ_ATLAS_APP_REVISION:-unknown}
    ports:
      # Loopback-only by design (DEPLOY-NET-01): omitting the host IP here would
      # bind 0.0.0.0, exposing this unauthenticated evaluation stack to the whole
      # LAN. KJ_ATLAS_WEB_PORT changes the port, never the bind address.
      - "127.0.0.1:${KJ_ATLAS_WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kj_atlas_pgdata:
