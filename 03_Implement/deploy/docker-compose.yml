services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${KJ_ATLAS_POSTGRES_DB:-${POSTGRES_DB:-kj_atlas}}
      POSTGRES_USER: ${KJ_ATLAS_POSTGRES_USER:-${POSTGRES_USER:-kj_atlas}}
      POSTGRES_PASSWORD: ${KJ_ATLAS_POSTGRES_PASSWORD:-${POSTGRES_PASSWORD:-kj_atlas}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KJ_ATLAS_POSTGRES_USER:-${POSTGRES_USER:-kj_atlas}} -d ${KJ_ATLAS_POSTGRES_DB:-${POSTGRES_DB:-kj_atlas}}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - kj_atlas_pgdata:/var/lib/postgresql/data

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
    environment:
      KJ_ATLAS_DATABASE_URL: ${KJ_ATLAS_DATABASE_URL:-postgresql+asyncpg://kj_atlas:kj_atlas@db:5432/kj_atlas}
      KJ_ATLAS_LLM_PROVIDER: ${KJ_ATLAS_LLM_PROVIDER:-none}
    command: sh -c "alembic upgrade head && uvicorn kj_atlas_api.main:app --host 0.0.0.0 --port 8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE: ${KJ_ATLAS_VITE_API_BASE:-${VITE_API_BASE:-/api}}
    ports:
      - "${KJ_ATLAS_WEB_PORT:-${WEB_PORT:-8080}}:80"
    depends_on:
      - api

volumes:
  kj_atlas_pgdata:
