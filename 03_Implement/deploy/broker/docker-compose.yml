# Identity Broker (Keycloak) for kj-atlas SaaS multi-tenant authentication.
#
# Usage:
#   cd 03_Implement/deploy
#   docker compose -f docker-compose.yml -f broker/docker-compose.yml up -d
#
# This adds Keycloak as the SAML→OIDC broker in front of kj-atlas.
# The broker:
#   - Aggregates multiple external IdPs (Google, Azure AD, SAML IdPs)
#   - Issues signed RS256 JWTs with tenant_ref claim
#   - Handles OAuth 2.0 / OIDC authorization code grant + PKCE
#
# Architecture:
#   Browser → Keycloak (login) → kj-atlas API (JWT verification)

services:
  broker:
    image: quay.io/keycloak/keycloak:26.0
    container_name: kj-atlas-broker
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 18080
      KC_HOSTNAME: localhost
      KC_PROXY_HEADERS: xforwarded
    ports:
      - "18080:18080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/18080 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q 200",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - kj_atlas_keycloak_data:/opt/keycloak/data
    networks:
      - default

volumes:
  kj_atlas_keycloak_data:
