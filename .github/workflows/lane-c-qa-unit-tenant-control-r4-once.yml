name: Lane C QA UNIT tenant control R4 once

on:
  push:
    branches:
      - test/lane-c-qa-unit-tenant-control-r4-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Verify focused tenant session unit chain
        working-directory: 03_Implement/frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npx vitest run \
            src/ui/TenantSessionControl.test.ts \
            src/ui/TenantSessionRuntimeGate.test.ts \
            src/ui/TenantSessionBootstrapGate.test.ts

      - name: Verify full frontend unit suite
        working-directory: 03_Implement/frontend
        run: npm run test

      - name: Record QA-UNIT fourth-batch evidence
        env:
          RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md')
          text = path.read_text(encoding='utf-8')

          old_scope = '- Scope: `01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md`、初回実行バッチの`03_Implement/frontend/src/domain/view/hierarchy_level.ts`・同`.test.ts`・`App.tsx`、および2026-09-07第2バッチの`03_Implement/frontend/src/ui/TenantSessionRuntimeGate.test.ts`・`03_Implement/frontend/package.json`・`package-lock.json`。'
          new_scope = '- Scope: `01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md`、初回実行バッチの`03_Implement/frontend/src/domain/view/hierarchy_level.ts`・同`.test.ts`・`App.tsx`、2026-09-07第2バッチの`03_Implement/frontend/src/ui/TenantSessionRuntimeGate.test.ts`・`03_Implement/frontend/package.json`・`package-lock.json`、第3バッチの`03_Implement/frontend/src/ui/TenantSessionBootstrapGate.test.ts`、および第4バッチの`03_Implement/frontend/src/ui/TenantSessionControl.test.ts`。'
          if text.count(old_scope) != 1:
              raise SystemExit(f'unexpected current Scope count: {text.count(old_scope)}')
          text = text.replace(old_scope, new_scope, 1)

          old_oos = '- Out of Scope: CI設定変更、Vitest全体の`node`環境変更、テスト都合の製品挙動変更。第2バッチでは対象test fileだけにDOM環境を与え、`TenantSessionRuntimeGate.tsx`本体は変更しない。'
          new_oos = '- Out of Scope: CI設定変更、Vitest全体の`node`環境変更、テスト都合の製品挙動変更。第2〜4バッチは必要なtest fileだけをfile-local `happy-dom`で実行し、対象component本体の挙動は変更しない。'
          if text.count(old_oos) != 1:
              raise SystemExit(f'unexpected current Out of Scope count: {text.count(old_oos)}')
          text = text.replace(old_oos, new_oos, 1)

          marker = '## 2026-09-07 第4バッチ — TenantSessionControlの実change境界'
          if marker in text:
              raise SystemExit('fourth-batch evidence already present')

          section = f'''\n\n{marker}\n\n第2・第3バッチで導入したfile-local `happy-dom` の実component harnessを、同じtenant-session UIだからという理由だけで横展開せず、欠陥検知価値を再棚卸しした。次候補には `TenantSessionControl` を選定した。\n\n### 選定理由\n\n`TenantSessionControl.test.ts` は、serverが返した `availableTenants` だけをoptionとして表示することと、純粋関数 `resolveAllowedTenantSelection` がactive tenant・未知tenant・invalid sessionを拒否することは検証していた。一方、実componentの `<select onChange>` がそのresolverを必ず経由して `onRequestTenantChange` を呼ぶという**イベント配線そのもの**はSSRでは一度も実行されていなかった。\n\nこの境界が崩れると、helper単体はfail-closedのままでも、component側の将来refactorでhelperを迂回し、DOM valueをそのままtenant切替要求へ渡す回帰をunit層で見逃し得る。tenant切替はactive storage/auth scopeの変更へつながるため、単なる表示テストより欠陥検知優先度が高い。\n\n### 追加した検証\n\n`TenantSessionControl.test.ts`だけをfile-local `happy-dom`へ切り替え、React `createRoot` + `act` で実componentをmountするテストを1件追加した。製品componentは変更していない。\n\n- server-returned `tenant-b` を実select changeで選ぶと、`onRequestTenantChange("tenant-b")` が1回だけ通知される。\n- DOMへ `attacker-tenant` optionを後付けしてchange eventを発火しても、server-returned `availableTenants` に存在しないためcallbackは呼ばれない。\n- active tenant `tenant-a` を選んでもcallbackは呼ばれない。\n\nこれにより、optionの見た目だけでなく `UI event -> resolveAllowedTenantSelection -> callback` の実配線をfail-closed境界として固定する。helperの単体テストは残し、DOM testをhelperテストの代用品にはしない。\n\n### 検証結果\n\n- tested branch head: `{os.environ['TESTED_SHA']}`。\n- GitHub Actions run: `{os.environ['RUN_ID']}`。\n- `npm run typecheck`: pass。\n- `TenantSessionControl` + `TenantSessionRuntimeGate` + `TenantSessionBootstrapGate` focused unit chain: pass。\n- frontend full `npm run test`: pass。\n- planning tests / active issue validator / docs_check / `git diff --check`: pass。\n\n### 判定境界\n\n本バッチはtenant-session controlの実イベント配線という1欠陥クラスを追加固定するものであり、DOM component coverage率の最大化を目的にしない。`happy-dom`を他UIへ一律展開せず、次候補も実バグ影響と既存検知能力の差から選ぶ。`QA-UNIT-01`自体は引き続き `In Progress` とする。\n'''
          path.write_text(text.rstrip() + section, encoding='utf-8')
          PY

      - name: Retire one-shot workflow before repository guards
        run: rm .github/workflows/lane-c-qa-unit-tenant-control-r4-once.yml

      - name: Verify planning and docs guards
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q 01_Plans/tests
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check
          test ! -e .github/workflows/lane-c-qa-unit-tenant-control-r4-once.yml
          grep -F -- '- Status: In Progress' 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md
          grep -F '## 2026-09-07 第4バッチ — TenantSessionControlの実change境界' 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md

      - name: Commit verified fourth batch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'test(qa): TenantSessionControlの実change境界をunitで固定する'
          git push origin HEAD:${GITHUB_REF_NAME}
