name: Temporary lane C SaaS E2E ledger sync verification

on:
  push:
    branches:
      - docs/lane-c-sync-saas-e2e-ledgers-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/lane-c-sync-saas-e2e-ledgers-20260904
          fetch-depth: 0

      - name: Apply ledger synchronization
        run: python .github/lane_c_sync_saas_e2e_ledgers.py

      - name: Verify planning contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json
          python -c 'import json; from pathlib import Path; report=json.loads(Path("/tmp/triage.json").read_text(encoding="utf-8")); assert not report.get("errors"), report.get("errors")'
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit verified final changes and remove temporary tooling
        run: |
          set -euo pipefail
          rm .github/lane_c_sync_saas_e2e_ledgers.py
          rm .github/workflows/lane-c-saas-e2e-ledger-sync-verify.yml
          git config user.name "hat47x"
          git config user.email "hat47x@gmail.com"
          git add -A
          git commit -m "docs: SaaS E2E台帳を現在の実証境界へ同期する"
          git push origin HEAD:docs/lane-c-sync-saas-e2e-ledgers-20260904
