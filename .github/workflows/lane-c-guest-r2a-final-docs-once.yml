name: Lane C guest R2a final docs once

on:
  push:
    branches:
      - lane-c/guest-admission-auth-edge-r2-20260906

permissions:
  contents: write

jobs:
  verify-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify issue traceability and diff hygiene
        run: |
          python 01_Plans/docs_check.py
          git diff --check origin/main...HEAD
      - name: Retire verifier
        run: |
          rm .github/workflows/lane-c-guest-r2a-final-docs-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/lane-c-guest-r2a-final-docs-once.yml
          git commit -m 'chore(ci): retire guest R2a final docs verifier'
          git push
