name: lane-b-r46-deepseek-alias-inventory-once

on:
  push:
    branches:
      - lane-b/deepseek-v4-migration-closeout

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/deepseek-v4-migration-closeout
      - name: Inventory legacy DeepSeek aliases
        shell: bash
        run: |
          set -euo pipefail
          echo '=== deepseek-chat ==='
          grep -RIn --exclude-dir=.git --exclude='lane-b-r46-deepseek-alias-inventory-once.yml' 'deepseek-chat' . || true
          echo '=== deepseek-reasoner ==='
          grep -RIn --exclude-dir=.git --exclude='lane-b-r46-deepseek-alias-inventory-once.yml' 'deepseek-reasoner' . || true
          echo '=== active default/config references ==='
          grep -RIn --exclude-dir=.git --exclude='lane-b-r46-deepseek-alias-inventory-once.yml' -E 'KJ_ATLAS_DEEPSEEK_MODEL=.*deepseek-(chat|reasoner)|default=.deepseek-(chat|reasoner)' 02_Architecture 03_Implement 04_Documentation || true
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-b-r46-deepseek-alias-inventory-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(lane-b): remove DeepSeek alias inventory workflow'
          git push origin HEAD:lane-b/deepseek-v4-migration-closeout
