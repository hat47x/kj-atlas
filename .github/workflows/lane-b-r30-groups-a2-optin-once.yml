name: lane-b-r30-groups-a2-optin-once

on:
  push:
    branches:
      - lane-b/provider-token-groups-a2-optin

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-token-groups-a2-optin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply R30 patch
        run: python .github/lane-b-r30-patch.py

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Verify default and explicit dry-run request counts
        working-directory: 03_Implement/backend
        run: |
          set -o pipefail
          python scripts/measure_ai_route_provider_tokens.py --provider named-test-provider --model named-model > /tmp/default.json
          python scripts/measure_ai_route_provider_tokens.py --provider named-test-provider --model named-model --include-groups-a2 > /tmp/a2.json
          python scripts/measure_ai_route_provider_tokens.py --provider named-test-provider --model named-model --include-groups-a2 --include-layout-c > /tmp/a2c.json
          python - <<'PY'
          import json
          a=json.load(open('/tmp/default.json'))
          b=json.load(open('/tmp/a2.json'))
          c=json.load(open('/tmp/a2c.json'))
          assert len(a['routes']) == 6
          assert len(b['routes']) == 7
          assert len(c['routes']) == 38
          assert b['routes']['suggest-card-groups-a2-lower-bound']['prompt']['utf8_bytes'] == 56047
          assert 'suggest-layout-a2-lower-bound' not in b['routes']
          assert c['layout_c_summary']['requests'] == 31
          PY

      - name: Run focused regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_a2_candidate.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_layout_hierarchical_composition.py

      - name: Lint and hygiene
        run: |
          cd 03_Implement/backend
          python -m ruff check \
            scripts/measure_ai_route_provider_tokens.py \
            tests/test_ai_route_provider_token_measurement.py
          cd ../..
          git diff --check

      - name: Commit tested slice and remove temporary files
        run: |
          rm .github/lane-b-r30-patch.py
          rm .github/workflows/lane-b-r30-groups-a2-optin-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ai): add explicit groups A2 provider measurement opt-in'
          git push origin HEAD:lane-b/provider-token-groups-a2-optin
