name: lane-b-r50-provider-measurement-roundtrip-once

on:
  push:
    branches:
      - lane-b/provider-measurement-full-roundtrip

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-measurement-full-roundtrip
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        shell: bash
        working-directory: 03_Implement/backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Run R50 measurement roundtrip regression
        shell: bash
        working-directory: 03_Implement/backend
        run: |
          set -euo pipefail
          pytest -q \
            tests/test_ai_route_provider_measurement_roundtrip.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_provider_measurement_analysis.py \
            tests/test_ai_route_provider_transport_input_provenance.py \
            tests/test_ai_route_production_output_budget_contract.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_a2_candidate.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_layout_hierarchical_composition.py
          ruff check tests/test_ai_route_provider_measurement_roundtrip.py
          git diff --check
      - name: Record R50 and commit
        shell: bash
        env:
          R50_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          path = Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md')
          text = path.read_text()

          old = '''  - `tests/test_ai_route_provider_transport_input_provenance.py`\n  - `tests/test_ai_ir_budget_pressure.py`'''
          new = '''  - `tests/test_ai_route_provider_transport_input_provenance.py`\n  - `tests/test_ai_route_provider_measurement_roundtrip.py`\n  - `tests/test_ai_ir_budget_pressure.py`'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          heading = '## R50 — full opt-in provider measurement reportのproducer→analyzer往復を固定'
          assert heading not in text
          run_id = os.environ['R50_RUN_ID']
          text = text.rstrip() + f'''\n\n\n{heading}\n\nR48までにcore 6 routeのDeepSeek measurement reportはproducerからanalyzerへ往復できていた一方、A2とlayout Cを同時に有効化した最大構成（6 core + groups A2 1 + layout C 31 = 38 request）は、producer側・analyzer側を別々に検証しており、同一reportのend-to-end互換性を直接固定していなかった。外部実測後に初めてschema driftへ気付くことを避けるため、R50ではfake DeepSeek providerのprovider-reported usageを使うnetwork-free integration regressionを追加した。\n\n- `include_groups_a2=True` + `include_layout_c=True` で38 requestのmeasurement reportを実際の `measure()` から生成する。\n- provider-input fingerprint、primary call provenance、DeepSeek V4 `thinking.type=disabled` provenanceを含む生成reportを加工せず `analyze()` へ渡す。\n- core / groups A2 / layout Cがすべてreadyになり、R44の保守的context参照 `1,000,000` tokenをoperator inputとして与えたhard-fit計算も同じreport上で成立することを確認する。layout Cはaggregateではなくmax-single requestを使う。\n- fake usage値はbytes/charsから導出せず任意値とし、exact token観測の正本がprovider-reported usageだけである境界を維持する。\n\nGitHub Actions run `{run_id}` でR50新規roundtripとR23〜R48近接回帰、ruff（新規test）、`git diff --check`、active issue validator、issue tests、full docs checkを検証した。one-shot workflowは同run内で自己削除する。\n\n**非主張**: R50は外部DeepSeek APIを呼ばず、実provider-reported token値・cost・latency・品質を取得していない。A2/B/C採択、production cap/route、十分な余裕policy、SafeMode・防PII・structured-text-only・proposal-only境界も変更しない。これで外部実測前のproducer→consumer schema互換性を最大opt-in構成まで固定したが、本Issueの次の本質的ゲートは引き続きnamed provider/model実測である。\n'''
          path.write_text(text.rstrip() + '\n')
          PY
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
          git diff --check
          rm .github/workflows/lane-b-r50-provider-measurement-roundtrip-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ai): roundtrip full provider measurement report'
          git push origin HEAD:lane-b/provider-measurement-full-roundtrip
