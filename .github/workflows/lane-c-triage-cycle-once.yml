name: Temporary lane C triage cycle diagnostics

on:
  push:
    branches:
      - fix/lane-c-triage-cycle-diagnostics-20260904

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-triage-cycle-diagnostics-20260904
          fetch-depth: 0

      - name: Apply fix
        run: python .github/lane_c_triage_cycle_patch.py

      - name: Test triage
        shell: bash
        run: |
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          set +e
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json
          rc=$?
          set -e
          cat /tmp/triage.json
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi

      - name: Commit tested changes and remove temporary files
        shell: bash
        run: |
          rm .github/lane_c_triage_cycle_patch.py
          rm .github/workflows/lane-c-triage-cycle-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: Active循環を診断しDone依存を終端化する"
            git push origin HEAD:fix/lane-c-triage-cycle-diagnostics-20260904
          fi
