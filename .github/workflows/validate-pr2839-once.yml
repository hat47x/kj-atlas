name: PR2839監査差分の一回限り検証

on:
  push:
    branches:
      - fix/island-summary-post-merge-audit-20260903

permissions:
  contents: write

jobs:
  validate:
    name: 表札IR監査差分を検証する
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: fix/island-summary-post-merge-audit-20260903
          fetch-depth: 0

      - name: 表札IRの実入力経路を局所修正する
        run: python scripts/_tmp_apply_pr2839_code_fix.py

      - name: Pythonテスト環境を準備する
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: 表札IRの対象回帰を確認する
        working-directory: 03_Implement/backend
        run: |
          pytest tests/test_ai_island_summary_ir.py -q
          pytest tests/test_ai_prompt.py -q
          pytest tests/test_ai_llm_input_ir_coverage.py -q
          pytest tests/ -k 'island_summary or safe_mode or llm_input_ir' -q

      - name: mainでも既知4件が再現することを確認する
        run: |
          git worktree add /tmp/kj-atlas-main origin/main
          python -m venv /tmp/kj-main-venv
          /tmp/kj-main-venv/bin/python -m pip install -q -e '/tmp/kj-atlas-main/03_Implement/backend[test]'
          cd /tmp/kj-atlas-main/03_Implement/backend
          set +e
          /tmp/kj-main-venv/bin/pytest \
            tests/test_ai_route_required_meaning_scale.py::test_layout_tail_cards_remain_but_their_relative_structure_is_pruned \
            tests/test_database_support_declarations.py::test_driver_extras_markers_tests_and_ci_stay_synchronized \
            tests/test_database_support_declarations.py::test_every_external_verified_backend_ci_image_matches_registry \
            tests/test_settings_env_prefix_migration.py::test_backend_ci_uses_canonical_database_test_keys \
            -q | tee /tmp/main-known-failures.txt
          test_code=${PIPESTATUS[0]}
          set -e
          if [ "$test_code" -eq 0 ]; then
            echo 'Expected the four known main failures, but they all passed.'
            exit 1
          fi
          grep -F '4 failed' /tmp/main-known-failures.txt

      - name: 既知4件を除くbackend全体回帰を確認する
        working-directory: 03_Implement/backend
        run: |
          pytest tests/ -q \
            --deselect=tests/test_ai_route_required_meaning_scale.py::test_layout_tail_cards_remain_but_their_relative_structure_is_pruned \
            --deselect=tests/test_database_support_declarations.py::test_driver_extras_markers_tests_and_ci_stay_synchronized \
            --deselect=tests/test_database_support_declarations.py::test_every_external_verified_backend_ci_image_matches_registry \
            --deselect=tests/test_settings_env_prefix_migration.py::test_backend_ci_uses_canonical_database_test_keys

      - name: 変更箇所を静的検査する
        working-directory: 03_Implement/backend
        run: ruff check src tests/test_ai_island_summary_ir.py

      - name: 回帰成功後に正本文書を同期する
        run: python scripts/_tmp_finalize_pr2839.py

      - name: 計画文書と差分を検査する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage-pr2839.txt
          test -s /tmp/triage-pr2839.txt
          python 01_Plans/docs_check.py
          git diff --check
          grep -F 'required_text_truncated' 02_Architecture/api.md
          grep -F 'required_card_context_mismatch' 02_Architecture/api.md
          grep -F '最終promptの直接メンバー本文もIR正規化後本文から描画' 02_Architecture/api.md
          grep -F 'backend全体はmainでも再現する既知4件を基準差分として切り分け' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md
          grep -F -- '- Status: Done' 01_Plans/issues/done/issue-AI-IR-STAGE5-SUMMARY-PROMPT-01-render-direct-members-from-ir.md

      - name: 検証用ファイルを除去して監査差分だけをコミットする
        run: |
          rm .github/workflows/validate-pr2839-once.yml
          rm scripts/_tmp_apply_pr2839_code_fix.py
          rm scripts/_tmp_finalize_pr2839.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'fix: 表札候補本文をIR実入力経路へ揃える'
          git push origin HEAD:fix/island-summary-post-merge-audit-20260903
