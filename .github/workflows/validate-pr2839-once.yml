name: PR2839監査差分の確定（一回限り）

on:
  push:
    branches:
      - fix/island-summary-post-merge-audit-20260903

permissions:
  contents: write

jobs:
  finalize:
    name: 検証済み監査差分を正本へ確定する
    runs-on: ubuntu-latest
    steps:
      - name: 最新ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: fix/island-summary-post-merge-audit-20260903
          fetch-depth: 0

      - name: 検証済み結果を正本文書へ同期する
        run: python scripts/_tmp_finalize_pr2839.py

      - name: 計画文書と差分を確認する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage-pr2839.txt
          test -s /tmp/triage-pr2839.txt
          git diff --check
          grep -F 'required_text_truncated' 02_Architecture/api.md
          grep -F 'required_card_context_mismatch' 02_Architecture/api.md
          grep -F 'AI-IR-STAGE5-SUMMARY-PROMPT-01' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md

      - name: 一時ファイルを除去してpushする
        run: |
          rm .github/workflows/validate-pr2839-once.yml
          rm scripts/_tmp_finalize_pr2839.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 1
          fi
          git commit -m 'docs: 表札IRのmerge後監査を正本へ反映する'
          git fetch origin fix/island-summary-post-merge-audit-20260903
          git rebase origin/fix/island-summary-post-merge-audit-20260903
          git push origin HEAD:fix/island-summary-post-merge-audit-20260903
