name: R37 dogfood sync and verify once

on:
  push:
    branches:
      - dogfood/r37-effective-control-scope-policy-20260907

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: R37を継続dogfood索引へ同期する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          anchor = '- `ai-ir-required-semantic-coverage-map-2026-09-03.md`'
          block = '''- `cognitive-dogfood-continuous-2026-09-07-r37.md`
            - R37。PR #3048〜#3050で、acceptedだがconsumerのないdead toggle、実効consumerの作用範囲過大表現、allowed valueとEnterprise recommendationの混同という実陽性を分析し、acceptanceの先にeffect binding / scope / profile policyを分離した記録。
          - `doc_kj_atlas_dogfood_r37.json`
            - R37のKJキャンバス。未定義behaviorを発明せずfail-fastへ縮める境界、consumer存在と作用範囲、設定可能性と推奨値を分け、公開keyが約束する制御可能性とruntime正本を一致させる構造を保持する。
          '''
          if '- `cognitive-dogfood-continuous-2026-09-07-r37.md`' not in text:
              if anchor not in text:
                  raise SystemExit('R37 index insertion anchor not found')
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Docs check
        run: python 01_Plans/docs_check.py

      - name: Working-tree hygiene
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          allowed = {'01_Plans/dogfood/cognitive-dogfood-index.md'}
          unexpected = []
          for line in lines:
              path = line[3:]
              if path not in allowed:
                  unexpected.append(line)
          if unexpected:
              raise SystemExit('unexpected working-tree changes:\n' + '\n'.join(unexpected))
          PY

      - name: 検証済みR37をbranchへ記録しone-shotを退役する
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/r37-dogfood-sync-verify-once.yml
          git add 01_Plans/dogfood/cognitive-dogfood-index.md .github/workflows/r37-dogfood-sync-verify-once.yml
          git commit -m 'dogfood: sync R37 index and retire verifier'
          git push origin HEAD:dogfood/r37-effective-control-scope-policy-20260907
