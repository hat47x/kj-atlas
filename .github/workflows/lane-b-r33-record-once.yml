name: lane-b-r33-record-once

on:
  push:
    branches:
      - lane-b/provider-prompt-fingerprint

permissions:
  contents: write

jobs:
  record-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-prompt-fingerprint
      - name: Record R33
        run: |
          python .github/lane-b-r33-record.py
          grep -F '## R33 — provider usage と canonical prompt のfingerprint binding' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '**62 test**' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          git diff --check
      - name: Commit record and remove temporary files
        run: |
          rm .github/lane-b-r33-record.py
          rm .github/workflows/lane-b-r33-record-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): record R33 prompt fingerprint provenance'
          git push origin HEAD:lane-b/provider-prompt-fingerprint
