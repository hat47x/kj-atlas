name: R20 one-shot merge-ref verification

on:
  push:
    branches:
      - dogfood/r20-merge-method-traceability-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR merge ref
        uses: actions/checkout@v4
        with:
          ref: refs/pull/2869/merge
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e './03_Implement/backend[test]'

      - name: Backend merge regressions
        working-directory: 03_Implement/backend
        run: python -m pytest tests/test_ai_merge_ir.py tests/test_ai_merge_semantics.py -q

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Frontend merge regressions
        working-directory: 03_Implement/frontend
        run: >-
          npx vitest run
          src/api/client.test.ts
          src/domain/merge_candidates.test.ts
          src/domain/merge_suggestion_decisions.test.ts
          src/ui/MergeSuggestionsPanel.merge_method.test.ts
          src/ui/merge_method_label.test.ts

      - name: Frontend typecheck
        working-directory: 03_Implement/frontend
        run: npm run typecheck

      - name: Dogfood document validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Planning lifecycle validation
        run: python 01_Plans/issues/validate_active_issue_memos.py

      - name: Diff whitespace check
        run: git diff --check HEAD^1 HEAD

      - name: Remove one-shot workflow from head branch
        if: always()
        run: |
          git fetch origin dogfood/r20-merge-method-traceability-20260904
          git checkout -B dogfood/r20-merge-method-traceability-20260904 origin/dogfood/r20-merge-method-traceability-20260904
          rm -f .github/workflows/r20-one-shot-verify.yml
          if git diff --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/r20-one-shot-verify.yml
          git commit -m 'chore: R20一時検証workflowを削除する'
          git push origin HEAD:dogfood/r20-merge-method-traceability-20260904
