name: Lane C auth template verification once

on:
  push:
    branches:
      - fix/lane-c-auth-bff-session-proxy-e2e-r2-20260905

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 03_Implement/backend/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e ".[test]"

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: 03_Implement/frontend
        run: npx playwright install --with-deps chromium

      - name: AUTH Level 1 frontend
        working-directory: 03_Implement/frontend
        run: npx playwright test -g "auth" --reporter=line

      - name: AUTH Level 1 backend
        working-directory: 03_Implement/backend
        run: pytest tests/test_auth_jit_provisioning.py -m auth_level1

      - name: AUTH Level 2
        working-directory: 03_Implement/backend
        run: AUTH_PROVIDER_PROFILE_DIR=tests/federation/profiles tests/scripts/run_auth_level2.sh
