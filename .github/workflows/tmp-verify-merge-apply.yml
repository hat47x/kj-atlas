name: Temporary merge apply transaction verification

on:
  push:
    branches:
      - feat/merge-decision-apply-transaction-20260903
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Merge apply transaction regression
        working-directory: 03_Implement/frontend
        run: npx vitest run src/domain/merge_suggestion_apply.test.ts src/domain/representative_merge.test.ts src/domain/merge_traceability.test.ts src/domain/merge_suggestion_decisions.test.ts
      - name: Frontend typecheck
        working-directory: 03_Implement/frontend
        run: npm run typecheck
      - name: Planning document checks
        run: python 01_Plans/docs_check.py
