name: lane-b-r42-context-source-sync-once

on:
  push:
    branches:
      - lane-b/ai-ir-scale-r42-context-source-sync

permissions:
  contents: write

jobs:
  sync-and-self-delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/ai-ir-scale-r42-context-source-sync
      - name: Apply and verify R42
        run: |
          python .github/lane-b-r42-sync.py
          grep -F 'R41 run `33955296602`' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '`--context-window-tokens` と `--context-window-source` を対で渡し' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '## R42 — R41のcontext-window source手順をIssue前半へ同期' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '4. `generate-narrative`' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '5. `suggest-layout`' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '6. coverage-loss metadata' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          git diff --check
      - name: Commit sync and remove temporary files
        run: |
          rm .github/lane-b-r42-sync.py
          rm .github/workflows/lane-b-r42-context-source-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): sync context-window source readiness after R41'
          git push origin HEAD:lane-b/ai-ir-scale-r42-context-source-sync
