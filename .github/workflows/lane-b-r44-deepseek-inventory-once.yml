name: lane-b-r44-deepseek-inventory-once

on:
  push:
    branches:
      - lane-b/deepseek-v4-default-readiness

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/deepseek-v4-default-readiness
      - name: Find deepseek-chat references
        run: |
          echo '=== deepseek-chat references ==='
          grep -RIn --exclude-dir=.git --exclude='lane-b-r44-deepseek-inventory-once.yml' 'deepseek-chat' . || true
          echo '=== DEEPSEEK_MODEL references ==='
          grep -RIn --exclude-dir=.git 'DEEPSEEK_MODEL' . || true
