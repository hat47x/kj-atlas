name: Temporary merge method traceability

on:
  push:
    branches:
      - feat/merge-method-traceability-20260904
    paths:
      - .github/workflows/merge-method-traceability-once.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/merge-method-traceability-20260904
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Implement merge method traceability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ROOT = Path('.')

          def read_text(path: str) -> str:
              with open(ROOT / path, 'r', encoding='utf-8', newline='') as handle:
                  return handle.read()

          def write_text(path: str, text: str) -> None:
              with open(ROOT / path, 'w', encoding='utf-8', newline='') as handle:
                  handle.write(text)

          def adapt(text: str, newline: str) -> str:
              return text.replace('\n', newline)

          def replace_once(path: str, old: str, new: str) -> None:
              text = read_text(path)
              newline = '\r\n' if '\r\n' in text else '\n'
              old_native = adapt(old, newline)
              new_native = adapt(new, newline)
              count = text.count(old_native)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              write_text(path, text.replace(old_native, new_native, 1))

          def replace_in_block(path: str, start_marker: str, end_marker: str, old: str, new: str) -> None:
              text = read_text(path)
              newline = '\r\n' if '\r\n' in text else '\n'
              start = text.index(adapt(start_marker, newline))
              end = text.index(adapt(end_marker, newline), start)
              block = text[start:end]
              old_native = adapt(old, newline)
              new_native = adapt(new, newline)
              count = block.count(old_native)
              if count != 1:
                  raise SystemExit(f'{path}: expected one block anchor, found {count}: {old!r}')
              block = block.replace(old_native, new_native, 1)
              write_text(path, text[:start] + block + text[end:])

          def append_json_entries(path: str, entries: list[tuple[str, str]]) -> None:
              text = read_text(path)
              newline = '\r\n' if '\r\n' in text else '\n'
              for key, _ in entries:
                  if f'"{key}"' in text:
                      raise SystemExit(f'{path}: translation key already exists: {key}')
              closing = newline + '}'
              index = text.rfind(closing)
              if index < 0:
                  raise SystemExit(f'{path}: JSON closing brace not found')
              before = text[:index]
              after = text[index:]
              stripped = before.rstrip()
              whitespace = before[len(stripped):]
              if stripped.endswith(','):
                  separator = ''
              else:
                  separator = ','
              lines = []
              for idx, (key, value) in enumerate(entries):
                  comma = ',' if idx < len(entries) - 1 else ''
                  import json
                  lines.append(f'  {json.dumps(key, ensure_ascii=False)}: {json.dumps(value, ensure_ascii=False)}{comma}')
              insertion = separator + newline + newline.join(lines)
              write_text(path, stripped + insertion + whitespace + after)

          # Backend public/persisted contracts remain backward compatible: the
          # method is optional on stored/returned objects, while new provider
          # responses are required at the production parser boundary below.
          replace_in_block(
              '03_Implement/backend/src/kj_atlas_api/models.py',
              'class MergeSuggestionDecision(BaseModel):\n',
              '\n\nclass MergeDecisionRecord(BaseModel):\n',
              '    rationale: str | None = Field(default=None, exclude_if=lambda value: value is None)\n',
              '    rationale: str | None = Field(default=None, exclude_if=lambda value: value is None)\n'
              '    mergeMethod: Literal["near_duplicate", "kernel_fusion"] | None = Field(\n'
              '        default=None, exclude_if=lambda value: value is None\n'
              '    )\n',
          )
          replace_in_block(
              '03_Implement/backend/src/kj_atlas_api/models.py',
              'class MergeSuggestion(BaseModel):\n',
              '\n\nclass SuggestMergesRequest(BaseModel):\n',
              '    rationale: str | None = None\n',
              '    rationale: str | None = None\n'
              '    mergeMethod: Literal["near_duplicate", "kernel_fusion"] | None = None\n',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/routes/ai.py',
              '            "Use this exact schema:",\n'
              '            \'{"suggestions":[{"groupId":string,"cardIds":[string,...],"mergedTextDraft":string,"rationale":string?}]}\',\n'
              '            "Each suggestion must include at least 2 cardIds.",\n',
              '            "Use this exact schema:",\n'
              '            \'{"suggestions":[{"groupId":string,"cardIds":[string,...],"mergedTextDraft":string,"mergeMethod":"near_duplicate"|"kernel_fusion","rationale":string?}]}\',\n'
              '            "mergeMethod is required: use near_duplicate for 04-step-like consolidation and kernel_fusion for kernel-fusion-style integration.",\n'
              '            "Each suggestion must include at least 2 cardIds.",\n',
          )
          replace_once(
              '03_Implement/backend/src/kj_atlas_api/routes/ai.py',
              '        if not isinstance(item, dict):\n'
              '            raise HTTPException(status_code=422, detail="Each merge suggestion must be an object")\n\n'
              '        try:\n'
              '            suggestion = MergeSuggestion.model_validate(item)\n',
              '        if not isinstance(item, dict):\n'
              '            raise HTTPException(status_code=422, detail="Each merge suggestion must be an object")\n\n'
              '        # Production provider responses must identify which meaning-preserving\n'
              '        # integration method produced the proposal. Stored historical objects keep\n'
              '        # the field optional for backward compatibility.\n'
              '        if allowed_card_ids is not None and "mergeMethod" not in item:\n'
              '            raise HTTPException(\n'
              '                status_code=422,\n'
              '                detail={\n'
              '                    "code": "merge_method_required",\n'
              '                    "message": "A provider merge suggestion must identify its merge method",\n'
              '                },\n'
              '            )\n\n'
              '        try:\n'
              '            suggestion = MergeSuggestion.model_validate(item)\n',
          )

          # Backend regression coverage: provider boundary requires method,
          # while the model retains it when present.
          merge_ir_test = '03_Implement/backend/tests/test_ai_merge_ir.py'
          replace_once(
              merge_ir_test,
              '    assert "person@example.com" not in prompt\n',
              '    assert "person@example.com" not in prompt\n'
              '    assert "mergeMethod" in prompt\n'
              '    assert "near_duplicate" in prompt\n'
              '    assert "kernel_fusion" in prompt\n',
          )
          replace_once(
              merge_ir_test,
              '            \'{"suggestions":[{"groupId":"m1","cardIds":["c1","c4"],"mergedTextDraft":"draft"}]}\',\n',
              '            \'{"suggestions":[{"groupId":"m1","cardIds":["c1","c4"],"mergedTextDraft":"draft","mergeMethod":"near_duplicate"}]}\',\n',
          )
          text = read_text(merge_ir_test)
          newline = '\r\n' if '\r\n' in text else '\n'
          addition = adapt('''\n\ndef test_merge_parser_requires_method_at_production_provider_boundary() -> None:\n    payload = _payload([_card("c1", "alpha"), _card("c2", "alpha again")])\n\n    with pytest.raises(Exception) as exc_info:\n        ai._parse_merge_suggestions(\n            '{"suggestions":[{"groupId":"m1","cardIds":["c1","c2"],"mergedTextDraft":"draft"}]}',\n            payload,\n            allowed_card_ids=frozenset({"c1", "c2"}),\n        )\n\n    assert getattr(exc_info.value, "status_code", None) == 422\n    assert getattr(exc_info.value, "detail", {}).get("code") == "merge_method_required"\n\n\ndef test_merge_parser_preserves_method_at_production_provider_boundary() -> None:\n    payload = _payload([_card("c1", "alpha"), _card("c2", "alpha again")])\n\n    suggestions = ai._parse_merge_suggestions(\n        '{"suggestions":[{"groupId":"m1","cardIds":["c1","c2"],"mergedTextDraft":"draft","mergeMethod":"kernel_fusion"}]}',\n        payload,\n        allowed_card_ids=frozenset({"c1", "c2"}),\n    )\n\n    assert suggestions[0].mergeMethod == "kernel_fusion"\n''', newline)
          if 'test_merge_parser_requires_method_at_production_provider_boundary' in text:
              raise SystemExit('backend merge method tests already exist unexpectedly')
          write_text(merge_ir_test, text.rstrip('\r\n') + addition + newline)

          # Frontend common contract: optional for historical compatibility,
          # validated when present.
          replace_once(
              '03_Implement/frontend/src/api/client.ts',
              'export type MergeSuggestion = {\n'
              '  groupId: string;\n'
              '  cardIds: string[];\n'
              '  mergedTextDraft: string;\n'
              '  rationale?: string;\n'
              '};\n',
              'export type MergeMethod = "near_duplicate" | "kernel_fusion";\n\n'
              'export type MergeSuggestion = {\n'
              '  groupId: string;\n'
              '  cardIds: string[];\n'
              '  mergedTextDraft: string;\n'
              '  rationale?: string;\n'
              '  mergeMethod?: MergeMethod;\n'
              '};\n',
          )
          replace_once(
              '03_Implement/frontend/src/api/client.ts',
              '    && isNonEmptyString(suggestion.mergedTextDraft)\n'
              '    && (suggestion.rationale === undefined || isNonEmptyString(suggestion.rationale))\n',
              '    && isNonEmptyString(suggestion.mergedTextDraft)\n'
              '    && (suggestion.rationale === undefined || isNonEmptyString(suggestion.rationale))\n'
              '    && (\n'
              '      suggestion.mergeMethod === undefined\n'
              '      || suggestion.mergeMethod === "near_duplicate"\n'
              '      || suggestion.mergeMethod === "kernel_fusion"\n'
              '    )\n',
          )

          replace_once(
              '03_Implement/frontend/src/domain/merge_candidates.ts',
              '        cardIds,\n'
              '        mergedTextDraft,\n'
              '        rationale: `heuristic:${group.reason}`,\n',
              '        cardIds,\n'
              '        mergedTextDraft,\n'
              '        mergeMethod: "near_duplicate",\n'
              '        rationale: `heuristic:${group.reason}`,\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge_candidates.test.ts',
              '    expect(result[0]?.mergedTextDraft).toBe("Needs   follow-up");\n',
              '    expect(result[0]?.mergedTextDraft).toBe("Needs   follow-up");\n'
              '    expect(result[0]?.mergeMethod).toBe("near_duplicate");\n',
          )

          # Persist method in both duplicated DocumentV1 frontend type surfaces.
          replace_in_block(
              '03_Implement/frontend/src/domain/types.ts',
              'export type MergeSuggestionDecisionEntry = {\n',
              '\n};\n\nexport type PatchApplyStats',
              '  rationale?: string;\n',
              '  rationale?: string;\n'
              '  mergeMethod?: "near_duplicate" | "kernel_fusion";\n',
          )
          replace_in_block(
              '03_Implement/frontend/src/domain/merge_suggestion_decisions.ts',
              'export type MergeSuggestionDecisionEntry = {\n',
              '\n};\n\ntype AppendMergeSuggestionDecisionInput',
              '  rationale?: string;\n',
              '  rationale?: string;\n'
              '  mergeMethod?: "near_duplicate" | "kernel_fusion";\n',
          )
          replace_in_block(
              '03_Implement/frontend/src/domain/merge_suggestion_decisions.ts',
              'type AppendMergeSuggestionDecisionInput = {\n',
              '\n};\n\nfunction sortCardIds',
              '  rationale?: string;\n',
              '  rationale?: string;\n'
              '  mergeMethod?: "near_duplicate" | "kernel_fusion";\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge_suggestion_decisions.ts',
              '    rationale: input.rationale,\n'
              '    representativeCardId: originTrace.representativeCardId,\n',
              '    rationale: input.rationale,\n'
              '    mergeMethod: input.mergeMethod,\n'
              '    representativeCardId: originTrace.representativeCardId,\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge_suggestion_decisions.test.ts',
              '        decisionReason: "Human-reviewed: normalize duplicates",\n',
              '        decisionReason: "Human-reviewed: normalize duplicates",\n'
              '        mergeMethod: "kernel_fusion",\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge_suggestion_decisions.test.ts',
              '        rationale: undefined,\n'
              '        representativeCardId: "c1",\n',
              '        rationale: undefined,\n'
              '        mergeMethod: "kernel_fusion",\n'
              '        representativeCardId: "c1",\n',
          )

          # Append-only audit record carries the same method when known.
          replace_once(
              '03_Implement/frontend/src/domain/merge/decision_audit_events.ts',
              '  snapshotVersion: string;\n'
              '  decisionReason?: string;\n',
              '  snapshotVersion: string;\n'
              '  decisionReason?: string;\n'
              '  mergeMethod?: "near_duplicate" | "kernel_fusion";\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge/decision_audit_events.ts',
              '  snapshotVersion: string;\n'
              '  decisionReason?: string;\n'
              '}): MergeDecisionAuditEvent {\n',
              '  snapshotVersion: string;\n'
              '  decisionReason?: string;\n'
              '  mergeMethod?: "near_duplicate" | "kernel_fusion";\n'
              '}): MergeDecisionAuditEvent {\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge/decision_audit_events.ts',
              '    snapshotVersion: input.snapshotVersion,\n'
              '    decisionReason: input.decisionReason,\n',
              '    snapshotVersion: input.snapshotVersion,\n'
              '    decisionReason: input.decisionReason,\n'
              '    mergeMethod: input.mergeMethod,\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge/decision_audit_events.test.ts',
              '      decisionReason: "Reviewed by operator",\n',
              '      decisionReason: "Reviewed by operator",\n'
              '      mergeMethod: "kernel_fusion",\n',
          )
          replace_once(
              '03_Implement/frontend/src/domain/merge/decision_audit_events.test.ts',
              '      decisionReason: "Reviewed by operator",\n'
              '    });\n',
              '      decisionReason: "Reviewed by operator",\n'
              '      mergeMethod: "kernel_fusion",\n'
              '    });\n',
          )

          # App decision + audit wiring. Restrict replacements to the local call
          # blocks so similarly named fields elsewhere are untouched.
          app_path = '03_Implement/frontend/src/App.tsx'
          app = read_text(app_path)
          newline = '\r\n' if '\r\n' in app else '\n'
          decision_start = app.index('const nextDocument = appendMergeSuggestionDecision(document, {')
          decision_end = app.index(adapt('      });\n', newline), decision_start) + len(adapt('      });\n', newline))
          decision_block = app[decision_start:decision_end]
          anchor = adapt('        rationale: suggestion.rationale,\n', newline)
          if decision_block.count(anchor) != 1:
              raise SystemExit('App.tsx: merge decision rationale anchor mismatch')
          decision_block = decision_block.replace(
              anchor,
              anchor + adapt('        mergeMethod: suggestion.mergeMethod,\n', newline),
              1,
          )
          app = app[:decision_start] + decision_block + app[decision_end:]
          audit_start = app.index('const auditEvent = createMergeDecisionAuditEvent({', decision_start)
          audit_end = app.index(adapt('      });\n', newline), audit_start) + len(adapt('      });\n', newline))
          audit_block = app[audit_start:audit_end]
          anchor = adapt('        cardIds: suggestion.cardIds,\n', newline)
          if audit_block.count(anchor) != 1:
              raise SystemExit('App.tsx: merge audit cardIds anchor mismatch')
          audit_block = audit_block.replace(
              anchor,
              anchor + adapt('        mergeMethod: suggestion.mergeMethod,\n', newline),
              1,
          )
          app = app[:audit_start] + audit_block + app[audit_end:]
          write_text(app_path, app)

          # Human judgement UI displays the method as part of the proposal context.
          panel = '03_Implement/frontend/src/ui/MergeSuggestionsPanel.tsx'
          replace_once(
              panel,
              'function representativeResolvedLabel(\n',
              'function mergeMethodLabel(method: MergeSuggestion["mergeMethod"]): string | null {\n'
              '  switch (method) {\n'
              '    case "near_duplicate":\n'
              '      return t("merge_suggestions.method.near_duplicate");\n'
              '    case "kernel_fusion":\n'
              '      return t("merge_suggestions.method.kernel_fusion");\n'
              '    default:\n'
              '      return null;\n'
              '  }\n'
              '}\n\n'
              'function representativeResolvedLabel(\n',
          )
          replace_once(
              panel,
              '        const isAccepted = suggestion.latestDecision === "accept";\n'
              '        const isApplied = isAccepted && (suggestion.representativeResolvedBy === "repOf" || suggestion.representativeResolvedBy === "mergedIntoCardId");\n',
              '        const isAccepted = suggestion.latestDecision === "accept";\n'
              '        const isApplied = isAccepted && (suggestion.representativeResolvedBy === "repOf" || suggestion.representativeResolvedBy === "mergedIntoCardId");\n'
              '        const methodLabel = mergeMethodLabel(suggestion.mergeMethod);\n',
          )
          replace_once(
              panel,
              '          {suggestion.rationale ? (\n'
              '            <div style={{ fontSize: 12, color: "#475569", marginBottom: 6 }}>{t("merge_suggestions.rationale")}: {suggestion.rationale}</div>\n'
              '          ) : null}\n',
              '          {methodLabel ? (\n'
              '            <div style={{ fontSize: 12, color: "#475569", marginBottom: 6 }}>\n'
              '              {t("merge_suggestions.method_label", { method: methodLabel })}\n'
              '            </div>\n'
              '          ) : null}\n'
              '          {suggestion.rationale ? (\n'
              '            <div style={{ fontSize: 12, color: "#475569", marginBottom: 6 }}>{t("merge_suggestions.rationale")}: {suggestion.rationale}</div>\n'
              '          ) : null}\n',
          )
          append_json_entries(
              '03_Implement/frontend/src/i18n/locales/ja.json',
              [
                  ('merge_suggestions.method_label', '統合方法: {method}'),
                  ('merge_suggestions.method.near_duplicate', '近接カードの整理（04ステップ型）'),
                  ('merge_suggestions.method.kernel_fusion', '意味核の統合（核融合法型）'),
              ],
          )
          append_json_entries(
              '03_Implement/frontend/src/i18n/locales/en.json',
              [
                  ('merge_suggestions.method_label', 'Integration method: {method}'),
                  ('merge_suggestions.method.near_duplicate', 'Near-duplicate consolidation (04-step-like)'),
                  ('merge_suggestions.method.kernel_fusion', 'Meaning-kernel integration (kernel-fusion-style)'),
              ],
          )

          # Remote decoder keeps old responses compatible but preserves and
          # validates the method when present.
          client_test = '03_Implement/frontend/src/api/client.test.ts'
          text = read_text(client_test)
          newline = '\r\n' if '\r\n' in text else '\n'
          addition = adapt('''\n\ndescribe("merge method traceability", () => {\n  afterEach(() => {\n    vi.restoreAllMocks();\n  });\n\n  it("preserves a valid remote merge method", async () => {\n    vi.spyOn(globalThis, "fetch").mockResolvedValue(\n      new Response(JSON.stringify({\n        suggestions: [{\n          groupId: "g1",\n          cardIds: ["c1", "c2"],\n          mergedTextDraft: "Risk mitigation",\n          mergeMethod: "kernel_fusion",\n        }],\n      }), { status: 200 }),\n    );\n\n    const result = await suggestMerges(createDocument());\n    expect(result.suggestions[0]?.mergeMethod).toBe("kernel_fusion");\n  });\n\n  it("rejects an unknown remote merge method", async () => {\n    vi.spyOn(globalThis, "fetch").mockResolvedValue(\n      new Response(JSON.stringify({\n        suggestions: [{\n          groupId: "g1",\n          cardIds: ["c1", "c2"],\n          mergedTextDraft: "Risk mitigation",\n          mergeMethod: "summarize",\n        }],\n      }), { status: 200 }),\n    );\n\n    await expect(suggestMerges(createDocument())).rejects.toThrow(\n      "Invalid merge suggestions contract payload",\n    );\n  });\n});\n''', newline)
          if 'describe("merge method traceability"' in text:
              raise SystemExit('frontend merge method client tests already exist unexpectedly')
          write_text(client_test, text.rstrip('\r\n') + addition + newline)

          # Existing decision/apply/save/reload E2E now also verifies method
          # persistence across the document API boundary.
          replace_once(
              '03_Implement/frontend/e2e/merge_suggestion_apply_persistence.spec.ts',
              '  expect(decision).toBeTruthy();\n'
              '  expect(decision.representativeCardId).toBe(representative.id);\n',
              '  expect(decision).toBeTruthy();\n'
              '  expect(decision.mergeMethod).toBe("near_duplicate");\n'
              '  expect(decision.representativeCardId).toBe(representative.id);\n',
          )

          # API contract documents the method as new-provider required but
          # historical-response optional, matching the compatibility boundary.
          api_path = '02_Architecture/api.md'
          replace_once(
              api_path,
              'LLM応答は信頼境界の外側として扱う。未知ID・重複ID・2件未満・件数上限に加え、hold、既merge、明示的な `negate`、`type=contradicts` のevidence、異なる既知 `claimType`、同じカードを複数候補へ含める競合提案を決定論的に拒否する。\n',
              'LLM応答は信頼境界の外側として扱う。未知ID・重複ID・2件未満・件数上限に加え、hold、既merge、明示的な `negate`、`type=contradicts` のevidence、異なる既知 `claimType`、同じカードを複数候補へ含める競合提案を決定論的に拒否する。\n\n'
              '新しくproviderから生成する各提案は、`mergeMethod: "near_duplicate" | "kernel_fusion"` を必須とする。`near_duplicate` は04ステップ型の近接整理、`kernel_fusion` は複数カードから意味核を立てる核融合法型の統合を表す。この値は提案の正しさを保証する評価ラベルではなく、人間が採否理由を後からたどるための判断文脈である。過去の保存文書と旧応答を読めるよう、Document/APIの型では `mergeMethod` を任意フィールドとして扱う。決定論的ローカルfallbackは近接重複の検出だけを行うため `near_duplicate` を記録する。人間が判断した場合は、同じ値を `mergeSuggestionDecisions` とmerge decision auditへ引き継ぐ。\n',
          )

          # Resolve the remaining parent P1 using the already-complete child
          # apply/save/reload E2E plus this method traceability implementation.
          issue_old = '01_Plans/issues/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md'
          issue_new = '01_Plans/issues/done/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md'
          issue = read_text(issue_old)
          newline = '\r\n' if '\r\n' in issue else '\n'
          unchecked = issue.count('- [ ]')
          if unchecked != 2:
              raise SystemExit(f'AI-MERGE-SEMANTICS-01: expected exactly 2 remaining checkboxes, found {unchecked}')
          issue = issue.replace('- Status: In Progress', '- Status: Done', 1)
          issue = issue.replace(
              '- [ ] 元カード・sources・残差・merge/canonical系譜が採用後も追跡可能であることを、AI提案の採用から実適用・保存／再読込まで含むintegration regressionで確認する。',
              '- [x] 元カード・sources・残差・merge/canonical系譜が採用後も追跡可能であることを、AI提案の採用から実適用・保存／再読込まで含むintegration regressionで確認する。',
              1,
          )
          issue = issue.replace(
              '- [ ] 最終成果物を自然な日本語として全文ドラフトし直す。',
              '- [x] 最終成果物を自然な日本語として全文ドラフトし直す。',
              1,
          )
          acceptance_marker = adapt('## 完了境界\n', newline)
          completion = adapt('''## 完了結果（2026-09-04）\n\nR18で残った「統合方式が提案から判断記録へ残らない」という差を解消した。新しいprovider提案では `mergeMethod` を必須とし、04ステップ型の近接整理を `near_duplicate`、核融合法型の意味核統合を `kernel_fusion` として区別する。過去の文書・応答との互換性を保つため、保存型とクライアント共通型では任意フィールドとする。決定論的ローカルfallbackは近接重複だけを扱うため `near_duplicate` を明示する。\n\nこの方式はUIで採否前に確認でき、人間のdecision snapshotとappend-only audit eventへ引き継がれる。既存のdecision→明示apply→保存→再読込E2Eにも方式保持の確認を追加した。これにより、「どの統合方法を前提に提案され、人間が何を採用したか」を元カードと系譜へ戻りながら追跡できる。\n\n`AI-MERGE-APPLY-01` で、acceptは記録だけではDocumentを変更せず、明示apply後もsourceカード・`repOf` / `sources`・canonical/merge系譜を保持し、保存／再読込まで回帰で固定済みである。`partial` は採用する部分集合の契約が無い現状では自動適用しない。この非適用は未完成ではなく、意味を推測して適用しないための意図した境界とする。\n\n残差については、AIが独立した `residuals` 文を生成する契約を追加しない。統合後も元カード自体とsource lineageを残し、そこへ戻って差分を読めることを一次記録とする。将来、実利用で「元カードへ戻るだけでは不足する」ことが具体的に観測された場合に限り、残差専用フィールドを別Issueで検討する。\n\n内容・構造を確定した後、旧来の「まだacceptを実適用へ接続していない」「保存／再読込が未確認」という記述を現行実装へ合わせて整理し、意味を変えず自然な日本語として全文を読み直した。\n\n''', newline)
          if issue.count(acceptance_marker) != 1:
              raise SystemExit('AI-MERGE-SEMANTICS-01: completion marker mismatch')
          issue = issue.replace(acceptance_marker, completion + acceptance_marker, 1)

          stale_start = 'これにより、**実mergeのデータ変換自体**については元カード・source・主要なmerge/canonical系譜・元relationへ戻れる土台を作る。ただし、Issueはまだ完了させない。残る作業は次のとおり。'
          stale_end = '## 受入条件'
          if stale_start in issue:
              start = issue.index(stale_start)
              end = issue.index(stale_end, start)
              replacement = adapt('''これにより、実mergeのデータ変換、採用判断、明示apply、保存／再読込は一つの追跡可能な経路になった。`AI-MERGE-APPLY-01` の完了後も残っていたのは、04ステップ型／核融合法型のどちらとして提案されたかを判断記録へ残す方式の追跡性だった。この最後の差は、下記の完了結果で閉じた。\n\n''', newline)
              issue = issue[:start] + replacement + issue[end:]
          write_text(issue_old, issue)

          # Move completed memo out of the active root and repair exact path
          # references without changing ID-only references.
          old_ref = issue_old
          new_ref = issue_new
          for path in ROOT.rglob('*'):
              if not path.is_file() or path == ROOT / issue_old:
                  continue
              if '.git' in path.parts:
                  continue
              try:
                  with open(path, 'r', encoding='utf-8', newline='') as handle:
                      contents = handle.read()
              except (UnicodeDecodeError, OSError):
                  continue
              if old_ref in contents:
                  with open(path, 'w', encoding='utf-8', newline='') as handle:
                      handle.write(contents.replace(old_ref, new_ref))
          Path(issue_new).parent.mkdir(parents=True, exist_ok=True)
          Path(issue_old).rename(issue_new)

          print('merge method traceability edits applied')
          PY

