name: Lane C QA PUB Open gate once

on:
  push:
    branches:
      - docs/lane-c-qa-pub-open-gate-20260907

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'ci: verify QA-PUB Open gate once'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Open gate synchronization
        run: python .github/scripts/lane_c_qa_pub_open_gate.py
      - name: Retire one-shot inputs before repository guards
        run: rm .github/scripts/lane_c_qa_pub_open_gate.py .github/workflows/lane-c-qa-pub-open-gate-once.yml
      - name: Verify current lifecycle state and historical boundary
        run: |
          ISSUE='01_Plans/issues/issue-QA-PUB-01-I18N-03-e2e-boundary.md'
          grep -F -- '- Status: Open' "$ISSUE"
          grep -F -- '- Open Readiness: Prepared' "$ISSUE"
          grep -F -- '- Execution: Ready' "$ISSUE"
          grep -F 'Draft理由（当時。2026-07-18までに解消済み）' "$ISSUE"
          grep -F 'Execution Hold理由（当時。2026-07-18までに解消済み）' "$ISSUE"
          grep -F '## 2026-09-07 Open化同期 — 承認済みゲートを現在状態へ反映' "$ISSUE"
          grep -F 'Pending-1（PUB-01公開境界）とPending-2（I18N-03外部公開判定）は、2026-07-16にMaintainer承認済み。' "$ISSUE"
          grep -F 'B-ENV-01（ADR-0019準拠の実行経路）は、2026-07-18にDocker Compose標準経路として固定済み。' "$ISSUE"
      - name: Planning and docs guards
        run: |
          python -m pip install pytest
          python -m pytest -q 01_Plans/tests
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check
      - name: Show narrow diff
        run: |
          git status --short
          git diff --stat HEAD
          git diff --name-status HEAD
      - name: Commit verified Open synchronization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(qa): QA-PUB境界を承認済みゲートに合わせOpen化する'
          git push origin HEAD:docs/lane-c-qa-pub-open-gate-20260907
