name: Lane B2 enterprise auth hard gates fix once

on:
  push:
    branches:
      - fix/lane-b2-enterprise-auth-hard-gates-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align enterprise profile selection with auth startup gates
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('02_Architecture/runtime_parameter_registry.md')
          registry = registry_path.read_text(encoding='utf-8')
          old = '3. `enterprise-production` を選ぶ条件\n   - 認証・認可・監査の責務分離が必要で、障害時の fail-safe を `read_only` か `deny` で固定する。\n   - JIT provisioning を無効化し、運用承認済みの接続先・秘密管理がある。'
          new = '3. `enterprise-production` を選ぶ条件\n   - `KJ_ATLAS_ADMIN_API_KEY` と `KJ_ATLAS_API_KEY` を別値で設定できる。両方とも Settings の起動hard gateであり、欠損時はfail-fastする。\n   - 認証・認可・監査の責務分離が必要で、障害時の fail-safe を `read_only` か `deny` で固定する。\n   - JIT provisioning を無効化し、運用承認済みの接続先・秘密管理がある。'
          if registry.count(old) != 1:
              raise SystemExit(f'expected one enterprise profile target, got {registry.count(old)}')
          registry_path.write_text(registry.replace(old, new), encoding='utf-8')

          test_path = Path('01_Plans/tests/test_saas_profile_hard_gate_contract.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    def test_saas_profile_requires_admin_api_key_across_public_profile_docs(self) -> None:\n'
          if test.count(anchor) != 1:
              raise SystemExit(f'expected one test insertion anchor, got {test.count(anchor)}')
          addition = '''    def test_enterprise_profile_requires_both_auth_keys_across_public_profile_docs(self) -> None:\n        settings = (ROOT / "03_Implement/backend/src/kj_atlas_api/settings.py").read_text(encoding="utf-8")\n        self.assertIn('if profile == "enterprise-production" and self.api_key is None:', settings)\n        self.assertIn('missing.append("KJ_ATLAS_API_KEY")', settings)\n        self.assertIn('missing.append("KJ_ATLAS_ADMIN_API_KEY")', settings)\n\n        registry_profile = REGISTRY_PATH.read_text(encoding="utf-8").split(\n            "## Profile selection criteria", 1\n        )[1].split("### SaaS profile implementation gate", 1)[0]\n        config_profile = CONFIG_PATH.read_text(encoding="utf-8").split(\n            "## Runtime profiles（推奨プロファイル）", 1\n        )[1].split("## 最小設定", 1)[0]\n        for surface in (registry_profile, config_profile):\n            self.assertIn("`KJ_ATLAS_ADMIN_API_KEY`", surface)\n            self.assertIn("`KJ_ATLAS_API_KEY`", surface)\n\n'''
          test_path.write_text(test.replace(anchor, addition + anchor), encoding='utf-8')
          PY
      - name: Verify focused profile hard-gate contract
        run: python -m unittest 01_Plans.tests.test_saas_profile_hard_gate_contract
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "01_Plans/tests/test_saas_profile_hard_gate_contract.py 02_Architecture/runtime_parameter_registry.md "
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_saas_profile_hard_gate_contract.py 02_Architecture/runtime_parameter_registry.md
          git commit -m "docs(config): enterprise auth hard gateをprofileへ反映する"
          git rm .github/workflows/lane-b2-enterprise-auth-hard-gates-fix-once.yml
          git commit -m "ci: retire Lane B2 enterprise auth hard-gates workflow"
          git push
