name: Lane C guest IdP verifier R2c once

on:
  push:
    branches:
      - lane-c/guest-idp-verifier-r2c-20260907

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: "github.event.head_commit.message == 'chore: guest IdP verifier R2c検証workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-c/guest-idp-verifier-r2c-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R2c transformation
        run: python .github/scripts/lane_c_guest_idp_r2c.py
      - name: Retire one-shot implementation inputs before guards
        run: rm .github/scripts/lane_c_guest_idp_r2c.py .github/workflows/lane-c-guest-idp-r2c-once.yml
      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'
      - name: Ruff R2c and shared auth surface
        working-directory: 03_Implement/backend
        run: >-
          python -m ruff check
          src/kj_atlas_api/guest_identity_verifier.py
          src/kj_atlas_api/guest_redeem.py
          src/kj_atlas_api/routes/guest_session.py
          src/kj_atlas_api/trusted_auth_edge.py
          src/kj_atlas_api/main.py
          tests/test_guest_identity_verifier.py
          tests/test_guest_redeem_http.py
          tests/test_guest_docs_http_authorization.py
          tests/test_trusted_auth_edge.py
      - name: Guest R2c signed-token integration and regressions
        working-directory: 03_Implement/backend
        run: >-
          python -m pytest -q
          tests/test_guest_identity_verifier.py
          tests/test_guest_redeem_http.py
          tests/test_guest_auth_session_store.py
          tests/test_guest_docs_http_authorization.py
          tests/test_guest_admission_repository.py
          tests/test_trusted_auth_edge.py
          tests/test_jwks_store.py
          tests/test_database_support.py
      - name: Repository-wide planning and diff guards
        run: |
          python 01_Plans/docs_check.py
          git diff --check
      - name: Commit verified R2c tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(saas): guest identityをconfigured OIDC verifierへ接続する'
          git push origin HEAD:lane-c/guest-idp-verifier-r2c-20260907
