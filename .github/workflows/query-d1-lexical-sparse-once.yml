name: query-d1-lexical-sparse-once

on:
  push:
    branches:
      - research/query-d1-lexical-sparse-20260912

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run D0 and D1 tests
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m unittest -v
      - name: Compile research Python
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m py_compile *.py
      - name: Ensure affinity benchmark is not consumed
        run: |
          ! grep -R "doc_cognitive_dogfood_meta_r1\|doc_kj_atlas_dogfood_r3" 01_Plans/research/qualitative_query_d0/lexical_sparse.py 01_Plans/research/qualitative_query_d0/test_lexical_sparse.py
      - name: Documentation checks
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
