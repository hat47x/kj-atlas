name: Temporary lane C generate R18 Done-at-root manifest

on:
  push:
    branches:
      - chore/lane-c-done-root-path-guard-20260904

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-done-root-path-guard-20260904
          fetch-depth: 0
      - name: Generate immutable R18 identity manifest
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          baseline_commit = '88aebae242d5d1a24278b3247d3544aeaa1ad386'
          result = subprocess.run(
              [
                  'git', 'grep', '-l', '-e', r'^- Status: Done$', baseline_commit,
                  '--', '01_Plans/issues/issue-*.md',
              ],
              check=False,
              text=True,
              encoding='utf-8',
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
          )
          if result.returncode not in (0, 1):
              raise SystemExit(result.stderr or f'git grep failed: {result.returncode}')

          prefix = f'{baseline_commit}:01_Plans/issues/'
          paths = []
          for line in result.stdout.splitlines():
              if not line.startswith(prefix):
                  raise SystemExit(f'unexpected git grep result: {line}')
              paths.append(line[len(prefix):])
          paths = sorted(set(paths))
          if len(paths) != 58:
              raise SystemExit(f'expected 58 R18 Done-at-root paths, got {len(paths)}')

          manifest = {
              'schemaVersion': 1,
              'capturedFromCommit': baseline_commit,
              'purpose': 'Immutable identity boundary for the R18 Done-at-root legacy set; current paths must remain a subset while the separate count baseline ratchets toward zero.',
              'count': len(paths),
              'paths': paths,
          }
          target = Path('01_Plans/issues/legacy_done_at_root_r18.json')
          target.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(f'wrote {target} with {len(paths)} paths')
          PY
      - name: Commit manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-generate-r18-done-root-manifest-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'plan: R18 Done-at-root identity baselineを機械生成する'
          git push origin HEAD:chore/lane-c-done-root-path-guard-20260904
