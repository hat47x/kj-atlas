name: Temporary lane C dependency semantics audit

on:
  push:
    branches:
      - audit/lane-c-dependency-semantics-20260904

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/lane-c-dependency-semantics-20260904
      - name: Audit Done-to-active dependency edges
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('01_Plans')
          sys.path.insert(0, str(root.resolve()))
          import triage_actionable_plans as module

          files = sorted((root / 'issues').rglob('issue-*.md'))
          issues = [module.parse_issue(path, root) for path in files]
          name_to_path = {Path(issue.path).name: issue.path for issue in issues}
          normalized = []
          for issue in issues:
              deps = tuple(name_to_path.get(Path(dep).name, dep) for dep in issue.dependency_paths)
              normalized.append((issue, deps))
          by_path = {issue.path: issue for issue, _ in normalized}

          rows = []
          for issue, deps in normalized:
              if issue.status != 'Done':
                  continue
              for dep in deps:
                  target = by_path.get(dep)
                  if target is not None and target.status != 'Done':
                      rows.append({
                          'done_issue': issue.path,
                          'active_dependency': dep,
                          'active_status': target.status,
                          'active_priority': target.priority,
                      })

          triage = module.collect(root)
          unlocks_done = []
          for item in triage['actionable_issues']:
              done_targets = [p for p in item['unlocks'] if p.startswith('issues/done/')]
              if done_targets:
                  unlocks_done.append({
                      'active_issue': item['path'],
                      'status': item['status'],
                      'priority': item['priority'],
                      'done_unlocks': done_targets,
                  })

          print('=== Done memo -> active dependency edges ===')
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print(f'count={len(rows)}')
          print('=== active memo -> Done unlocks ===')
          print(json.dumps(unlocks_done, ensure_ascii=False, indent=2))
          print(f'count={len(unlocks_done)}')
          print('=== triage summary ===')
          print(json.dumps(triage['summary'], ensure_ascii=False))
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-dependency-semantics-audit-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove lane C dependency semantics audit workflow'
          git push origin HEAD:audit/lane-c-dependency-semantics-20260904
