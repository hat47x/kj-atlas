name: lane-b-route-b-characterization-retry

on:
  push:
    branches:
      - lane-b/route-b-projection-characterization

permissions:
  contents: write

jobs:
  characterize-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/route-b-projection-characterization

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize characterization sources from first workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/lane-b-route-b-characterization-once.yml').read_text(encoding='utf-8')
          targets = [
              '03_Implement/backend/scripts/measure_ai_route_projection_candidates.py',
              '03_Implement/backend/tests/test_ai_route_projection_candidates.py',
          ]
          for target in targets:
              marker = f"          cat > {target} <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PY", start)
              block = workflow[start:end]
              lines = []
              for line in block.splitlines():
                  if line.startswith('          '):
                      line = line[10:]
                  lines.append(line)
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run characterization and regression
        working-directory: 03_Implement/backend
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.measure_ai_route_projection_candidates | tee /tmp/route-b-measurement.json
          python -m pytest -q \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_required_meaning_scale.py \
            tests/test_ai_route_prompt_coverage.py \
            tests/test_ai_ir_budget_pressure.py

      - name: Record R23 measured values
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/route-b-measurement.json').read_text(encoding='utf-8'))
          g = data['groups']
          l = data['layout']
          gc, gb = g['current_shared_ir'], g['route_b_candidate']
          lc, lb = l['current_shared_ir'], l['route_b_candidate']

          issue = Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md')
          text = issue.read_text(encoding='utf-8')
          marker = '## R23 — route別B候補の300カードcharacterization'
          if marker not in text:
              section = f'''

{marker}

R20のnamed provider/model実測を待つ間に、production配線・shared IR上限を変えず、R19で定義したroute-required meaningだけを残す**測定専用の方式B候補**を300カード代表入力へ当てた。`scripts/measure_ai_route_projection_candidates.py` は既存prompt rendererを使い、source → current shared IR → route-B candidate のcoverageと最終prompt bytesを決定論的に比較する。candidate contextは方式比較用のIR-shaped fixtureであり、新しいproduction IR schemaではない。

### `suggest-card-groups`

| 指標 | current shared IR | route-B candidate |
| --- | ---: | ---: |
| providerへ提示可能なgrouping candidate | {gc['groupable_candidates']} | {gb['groupable_candidates']} |
| holdとして除外されるcard | {gc['withheld_held_cards']} | {gb['withheld_held_cards']} |
| requested 300枚のうちaccounted-for | {gc['requested_cards_accounted_for']} | {gb['requested_cards_accounted_for']} |
| 完全な島membership | {gc['complete_island_memberships']}/30 | {gb['complete_island_memberships']}/30 |
| 末尾島 `i29` のmember | {gc['tail_island_members']}/10 | {gb['tail_island_members']}/10 |
| final prompt UTF-8 bytes | {gc['prompt']['utf8_bytes']:,} | {gb['prompt']['utf8_bytes']:,} |

方式B候補では、候補card本文・hold state・確定島階層/membershipを保持し、R19でcompletion criterionではないrelation/derived clusterを外した。その結果、held `c298` を候補へ戻さず、299枚のgroupable cardと30島の完全membershipを同時に表現できた。これはshared `MAX_CARDS=200` を上げずにgrouping-required meaningを全量表現できる構造が存在するというcharacterizationであり、production採用やモデル品質の主張ではない。

### `suggest-layout`

| 指標 | current shared IR | route-B candidate |
| --- | ---: | ---: |
| relative coordinate | {lc['relative_coordinates']}/300 | {lb['relative_coordinates']}/300 |
| typed card relation | {lc['typed_card_relations']}/300 | {lb['typed_card_relations']}/300 |
| 完全な島membership | {lc['complete_island_memberships']}/30 | {lb['complete_island_memberships']}/30 |
| 末尾 `c298/c299` relative coordinate | {len(lc['tail_coordinates_present'])}/2 | {len(lb['tail_coordinates_present'])}/2 |
| 末尾 `causal/negate` | {len(lc['tail_required_relations_present'])}/2 | {len(lb['tail_required_relations_present'])}/2 |
| final prompt UTF-8 bytes | {lc['prompt']['utf8_bytes']:,} | {lb['prompt']['utf8_bytes']:,} |

layoutはlegacy `Cards:` 節が全300枚のid/text/raw座標を既に保持するため、方式B候補では重複するcard本文を増やさず、欠落していた全300枚の正規化相対座標・全card relation・確定島構造を補った。末尾のrelative coordinateと `causal` / `negate` も最終promptまで復元できた。layoutのBはtoken節約策というより、coverageをshared global selectionから分離する手段として評価すべきである。

### 判断への影響

- `suggest-card-groups`: Bは300カードのrequired meaningをglobal capから独立して保持できる具体候補になった。named provider/model実測後はA2とcompact Bを同一modelのprovider-reported usageで比較する価値がある。
- `suggest-layout`: Bでcoverageは回復するが、全体配置に必要な構造は文書規模へ比例する。A2/B/Cのtoken余裕比較は依然必要で、B採用済みとはしない。
- Unicode文字数・UTF-8 bytesをtoken数へ換算しない。正確なtoken数はR20どおりprovider-reported usageだけを採用する。
- production route、`MAX_CARDS/MAX_RELATIONS/MAX_TEXT_CHARS`、SafeMode/PII/structured-text/proposal-only境界は本characterizationでは変更していない。
'''
              issue.write_text(text + section, encoding='utf-8')
          PY

      - name: Lint and hygiene
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            scripts/measure_ai_route_projection_candidates.py \
            tests/test_ai_route_projection_candidates.py
          cd ../..
          git diff --check

      - name: Commit tested characterization and remove temporary workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/lane-b-route-b-characterization-once.yml \
            .github/workflows/lane-b-route-b-characterization-retry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md \
            03_Implement/backend/scripts/measure_ai_route_projection_candidates.py \
            03_Implement/backend/tests/test_ai_route_projection_candidates.py \
            .github/workflows/lane-b-route-b-characterization-once.yml \
            .github/workflows/lane-b-route-b-characterization-retry.yml
          git commit -m "test(ai): characterize route-specific scale projections"
          git push origin HEAD:lane-b/route-b-projection-characterization
