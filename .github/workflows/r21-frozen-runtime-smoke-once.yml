name: R21 frozen runtime smoke one-shot

on:
  push:
    branches:
      - dogfood/r21-frozen-runtime-smoke-20260904

permissions:
  contents: write

jobs:
  frozen-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dogfood/r21-frozen-runtime-smoke-20260904

      - name: Checkout formal frozen KJ Atlas runtime
        uses: actions/checkout@v5
        with:
          ref: 2232b3bb26647e5c4a083f55bdbf83c161698649
          path: _frozen
          fetch-depth: 1

      - name: Setup frozen frontend toolchain
        id: setup
        uses: ./_frozen/.github/actions/setup-frontend
        with:
          working-directory: _frozen/03_Implement/frontend
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck frozen frontend
        working-directory: _frozen/03_Implement/frontend
        run: ${{ steps.setup.outputs.run }} typecheck

      - name: Build frozen frontend
        working-directory: _frozen/03_Implement/frontend
        run: ${{ steps.setup.outputs.run }} build

      - name: Install Chromium for frozen Playwright
        working-directory: _frozen/03_Implement/frontend
        run: npx playwright install --with-deps chromium

      - name: Run formal C/D representative UI paths on frozen runtime
        working-directory: _frozen/03_Implement/frontend
        run: |
          npx playwright test \
            e2e/first_run_document_entry.spec.ts \
            e2e/inquiry_handoff_review.spec.ts \
            e2e/inquiry_round_comparison.spec.ts

      - name: Record successful frozen-runtime smoke and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/dogfood/cognitive-dogfood-continuous-2026-09-04-r21.md')
          text = path.read_text(encoding='utf-8')
          if '## 10. 固定runtimeの実行可能性をsmoke確認' not in text:
              text += '''

          ## 10. 固定runtimeの実行可能性をsmoke確認

          R21のruntime解釈をoperator手順へ戻した後、formal product commit `2232b3bb26647e5c4a083f55bdbf83c161698649` 自体を別checkoutとして起動可能かを、分析内容を与えない技術smokeで確認した。

          branch-only one-shot workflowでは、固定commitのfrontend依存をそのcommit自身のtoolchain契約で導入し、次を実行した。

          - TypeScript typecheck。
          - Vite production build。
          - Chromium installation。
          - `first_run_document_entry.spec.ts`。
          - `inquiry_handoff_review.spec.ts`。
          - `inquiry_round_comparison.spec.ts`。

          これらが成功したため、少なくともCase 001 Arm C/Dで必要なDocument読込、InquiryJourney開始、handoff、保存・再開、lineage、round比較、branch操作を含む代表UI contractは、固定runtime上で現在のGitHub Actions環境から再実行可能である。

          このsmokeはformal Armの分析ではなくoperator/runtime setup検証であり、M1〜M9、T9、製品価値、第三者価値の証拠には数えない。また、成功を理由にformal sourceやtreatmentを変更しない。

          したがってR21で想定した「固定runtimeが実行不能なら別revision」という分岐は、現時点では発火しない。次工程は予定どおりCase 001 Arm Cのfresh-context実走である。
          '''.replace('          ', '')
              path.write_text(text, encoding='utf-8')
          PY

          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/docs_check.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r21-frozen-runtime-smoke-once.yml
          git add 01_Plans/dogfood/cognitive-dogfood-continuous-2026-09-04-r21.md
          git commit -m "dogfood: 固定runtimeの実行可能性を確認する"
          git push origin HEAD:dogfood/r21-frozen-runtime-smoke-20260904
