name: OPS admin console close once

on:
  push:
    branches:
      - feat/ops-admin-concurrency-console-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ops-admin-concurrency-console-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Validate completed issue move
        run: |
          test ! -e 01_Plans/issues/issue-OPS-ADMIN-CONCURRENCY-01-allowlist-lost-update.md
          test -e 01_Plans/issues/done/issue-OPS-ADMIN-CONCURRENCY-01-allowlist-lost-update.md
          grep -q -- '- Status: Done' 01_Plans/issues/done/issue-OPS-ADMIN-CONCURRENCY-01-allowlist-lost-update.md
          if grep -q -- '- \[ \]' 01_Plans/issues/done/issue-OPS-ADMIN-CONCURRENCY-01-allowlist-lost-update.md; then
            echo 'unchecked acceptance condition remains in Done issue' >&2
            exit 1
          fi
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 01_Plans/tests/test_retired_one_shot_assets.py
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
      - name: Remove one-shot workflow after success
        run: |
          rm -f .github/workflows/ops-admin-console-close-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'ci: OPS admin console完了検証workflowを削除する'
          git push origin HEAD:feat/ops-admin-concurrency-console-20260904
