name: 反対視点IRのroute配線（一回限り）

on:
  push:
    branches:
      - feat/opposing-viewpoint-ir-context-20260903

permissions:
  contents: write

jobs:
  apply:
    name: route配線と回帰を確認する
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: feat/opposing-viewpoint-ir-context-20260903
          fetch-depth: 0

      - name: Pythonテスト環境を準備する
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: routeと経路被覆へ最小差分を適用する
        run: python .github/scripts/apply_opposing_viewpoint_ir_once.py

      - name: 対象回帰とIR経路契約を確認する
        working-directory: 03_Implement/backend
        run: |
          python -m pytest \
            tests/test_ai_opposing_viewpoint_ir.py \
            tests/test_ai_oppose.py \
            tests/test_ai_llm_input_ir_coverage.py \
            -q
          python -m ruff check \
            src/kj_atlas_api/opposing_viewpoint_ir.py \
            src/kj_atlas_api/routes/ai.py \
            tests/test_ai_opposing_viewpoint_ir.py \
            tests/test_ai_oppose.py \
            tests/test_ai_llm_input_ir_coverage.py

      - name: 変更をコミットし一時ファイルを削除する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-opposing-viewpoint-ir-once.yml
          git rm .github/scripts/apply_opposing_viewpoint_ir_once.py
          git add \
            03_Implement/backend/src/kj_atlas_api/routes/ai.py \
            03_Implement/backend/tests/test_ai_oppose.py \
            03_Implement/backend/tests/test_ai_llm_input_ir_coverage.py
          git commit -m "feat: 反対視点提案を入力IRへ接続する"
          git push origin HEAD:feat/opposing-viewpoint-ir-context-20260903
