name: 反対視点IRのroute配線（一回限り）

on:
  push:
    branches:
      - feat/opposing-viewpoint-ir-context-20260903

permissions:
  contents: write

jobs:
  apply:
    name: route配線と回帰を確認する
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: feat/opposing-viewpoint-ir-context-20260903
          fetch-depth: 0

      - name: Pythonテスト環境を準備する
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: routeと経路被覆へ既知の最小差分だけを適用する
        run: |
          python - <<'PY'
          from pathlib import Path

          ai_path = Path("03_Implement/backend/src/kj_atlas_api/routes/ai.py")
          text = ai_path.read_text(encoding="utf-8")
          replacements = [
              (
                  "from kj_atlas_api.island_summary_ir import (\n"
                  "    build_island_summary_ir_context,\n"
                  "    island_summary_ir_prompt_lines,\n"
                  ")\n",
                  "from kj_atlas_api.island_summary_ir import (\n"
                  "    build_island_summary_ir_context,\n"
                  "    island_summary_ir_prompt_lines,\n"
                  ")\n"
                  "from kj_atlas_api.opposing_viewpoint_ir import (\n"
                  "    OpposingViewpointIRContext,\n"
                  "    build_opposing_viewpoint_ir_context,\n"
                  "    opposing_viewpoint_ir_prompt_lines,\n"
                  ")\n",
              ),
              (
                  "def _build_opposing_viewpoint_prompt(payload: ProposeOpposingViewpointRequest) -> str:\n"
                  "    \"\"\"AI-OPPOSE-01 (M4): prompt the model to propose an opposing viewpoint or\n"
                  "    evidence gap for a target card, using the doc's contradiction / evidence\n"
                  "    structure. proposal-only -- the model never decides; the human does.\"\"\"\n"
                  "    target = next((card for card in payload.doc.cards if card.id == payload.targetCardId), None)\n"
                  "    if target is None:\n"
                  "        raise HTTPException(status_code=422, detail=\"targetCardId does not exist\")\n"
                  "    card_lines = \"\\n\".join(f'  - id=\"{card.id}\", text={json.dumps(card.text)}' for card in payload.doc.cards)\n"
                  "    evidence_lines = \"\\n\".join(\n"
                  "        f'  - source \"{link.fromCardId}\" --{link.type}--> target \"{link.toCardId}\"'\n"
                  "        for link in payload.doc.evidenceLinks or []\n"
                  "    ) or \"- (none)\"\n"
                  "    return \"\\n\".join(\n"
                  "        [\n"
                  "            \"You propose an OPPOSING viewpoint or an evidence-gap note for the target card.\",\n"
                  "            \"Use only the provided cards and evidence links. Do not add outside facts.\",\n"
                  "            \"The proposal is a candidate for human review -- it is never applied automatically.\",\n"
                  "            \"Ground every claim in the card text. If the target's evidence is missing or weak, set evidenceGap=true.\",\n"
                  "            '{\"opposingText\": string, \"evidenceGap\": boolean, \"rationale\": string, \"warnings\": [string,...]}'.join(['Return strict JSON only: ', '']),\n"
                  "            f\"Target card: {json.dumps({'id': target.id, 'text': target.text})}\",\n"
                  "            \"Cards:\",\n"
                  "            card_lines,\n"
                  "            \"Evidence links:\",\n"
                  "            evidence_lines,\n"
                  "        ]\n"
                  "    )\n",
                  "def _build_opposing_viewpoint_prompt(\n"
                  "    payload: ProposeOpposingViewpointRequest,\n"
                  "    ir_context: OpposingViewpointIRContext | None = None,\n"
                  ") -> str:\n"
                  "    \"\"\"対象カードに接地したproposal-onlyの反対視点promptを組み立てる。\n\n"
                  "    ``ir_context=None`` は既存の単体テスト・補助呼出しとの互換経路であり、\n"
                  "    production routeは常にroute固有IRを渡す。``Target card:`` の行形式は\n"
                  "    DOGFOOD-17のmock/E2E接地契約なので変更しない。\n"
                  "    \"\"\"\n"
                  "    target = next((card for card in payload.doc.cards if card.id == payload.targetCardId), None)\n"
                  "    if target is None:\n"
                  "        raise HTTPException(status_code=422, detail=\"targetCardId does not exist\")\n"
                  "\n"
                  "    lines = [\n"
                  "        \"You propose an OPPOSING viewpoint or an evidence-gap note for the target card.\",\n"
                  "        \"Use only the provided cards, relations, and evidence. Do not add outside facts.\",\n"
                  "        \"The proposal is a candidate for human review -- it is never applied automatically.\",\n"
                  "        \"Ground every claim in the target and the recorded context. Distinguish an existing human judgement from a new AI proposal.\",\n"
                  "        \"If the target's evidence is missing or weak, set evidenceGap=true; recorded contradictory evidence does not by itself decide the target's truth.\",\n"
                  "        'Return strict JSON only: {\"opposingText\": string, \"evidenceGap\": boolean, \"rationale\": string, \"warnings\": [string,...]}',\n"
                  "        f\"Target card: {json.dumps({'id': target.id, 'text': target.text})}\",\n"
                  "    ]\n"
                  "    if ir_context is not None:\n"
                  "        lines.extend(opposing_viewpoint_ir_prompt_lines(ir_context))\n"
                  "        return \"\\n\".join(lines)\n"
                  "\n"
                  "    # 互換経路: IR文脈を明示しない補助呼出しでは従来の全文書入力を維持する。\n"
                  "    card_lines = \"\\n\".join(\n"
                  "        f'  - id=\"{card.id}\", text={json.dumps(card.text)}'\n"
                  "        for card in payload.doc.cards\n"
                  "    )\n"
                  "    evidence_lines = \"\\n\".join(\n"
                  "        f'  - source \"{link.fromCardId}\" --{link.type}--> target \"{link.toCardId}\"'\n"
                  "        for link in payload.doc.evidenceLinks or []\n"
                  "    ) or \"- (none)\"\n"
                  "    lines.extend([\"Cards:\", card_lines, \"Evidence links:\", evidence_lines])\n"
                  "    return \"\\n\".join(lines)\n",
              ),
              (
                  "    _reject_unreviewed_text(payload.doc, payload.allowUnreviewedText)\n"
                  "    model_id = payload.model or resolve_model_for_task(\"propose_opposing_viewpoint\")\n",
                  "    # SEC-AI-SAFEMODE-01/02: 既存route guardを一次防御として維持する。\n"
                  "    _reject_unreviewed_text(payload.doc, payload.allowUnreviewedText)\n"
                  "    allow_unreviewed = bool(\n"
                  "        payload.allowUnreviewedText is True and settings.allow_unreviewed_ai_text\n"
                  "    )\n"
                  "    try:\n"
                  "        ir_context = build_opposing_viewpoint_ir_context(\n"
                  "            payload, allow_unreviewed_text=allow_unreviewed\n"
                  "        )\n"
                  "    except IRGenerationError as exc:\n"
                  "        raise HTTPException(status_code=422, detail=exc.to_contract()) from exc\n"
                  "    prompt = _build_opposing_viewpoint_prompt(payload, ir_context)\n"
                  "    model_id = payload.model or resolve_model_for_task(\"propose_opposing_viewpoint\")\n",
              ),
              (
                  "                task=\"propose_opposing_viewpoint\",\n"
                  "                prompt=_build_opposing_viewpoint_prompt(payload),\n"
                  "                model=model_id,\n",
                  "                task=\"propose_opposing_viewpoint\",\n"
                  "                prompt=prompt,\n"
                  "                inputs=ir_context.ir,\n"
                  "                model=model_id,\n",
              ),
          ]

          # The large prompt function replacement contains a deliberately awkward source
          # fragment above only to make accidental broad replacement impossible. Replace it
          # with the exact current source separately if that guard does not match.
          first_before, first_after = replacements[0]
          if text.count(first_before) != 1:
              raise SystemExit("opposing IR import insertion point was not unique")
          text = text.replace(first_before, first_after, 1)

          # Replace the prompt function by its exact span to avoid rewriting unrelated ai.py.
          start = text.index("def _build_opposing_viewpoint_prompt(")
          end = text.index("\n\n@router.post(\n    \"/proposals/opposing-viewpoint\"", start)
          new_function = replacements[1][1].rstrip("\n")
          text = text[:start] + new_function + text[end:]

          for before, after in replacements[2:]:
              count = text.count(before)
              if count != 1:
                  raise SystemExit(
                      f"安全のためroute置換を中止しました。想定一致数=1、実際={count}: {before[:120]!r}"
                  )
              text = text.replace(before, after, 1)

          ai_path.write_text(text, encoding="utf-8")

          coverage_path = Path("03_Implement/backend/tests/test_ai_llm_input_ir_coverage.py")
          coverage = coverage_path.read_text(encoding="utf-8")
          before = '''        "re_layout",\n        "suggest_card_groups",\n        "suggest_island_summary",\n'''
          after = '''        "propose_opposing_viewpoint",\n        "re_layout",\n        "suggest_card_groups",\n        "suggest_island_summary",\n'''
          if coverage.count(before) != 1:
              raise SystemExit("IR_MIGRATED_TASKSの挿入点を一意に特定できませんでした")
          coverage = coverage.replace(before, after, 1)
          debt = '''        "check_narrative",\n        "propose_opposing_viewpoint",\n        "refine_card_text",\n'''
          debt_after = '''        "check_narrative",\n        "refine_card_text",\n'''
          if coverage.count(debt) != 1:
              raise SystemExit("Stage 5 debtからopposing viewpointを一意に除外できませんでした")
          coverage_path.write_text(coverage.replace(debt, debt_after, 1), encoding="utf-8")

          oppose_test = Path("03_Implement/backend/tests/test_ai_oppose.py")
          oppose_text = oppose_test.read_text(encoding="utf-8")
          marker = "\ndef test_propose_opposing_viewpoint_rejects_unreviewed"
          if oppose_text.count(marker) != 1:
              raise SystemExit("test_ai_oppose.pyのintegration test挿入点を一意に特定できませんでした")
          integration = r'''


def test_route_sends_target_ir_and_human_contradiction_state(tmp_path, monkeypatch) -> None:
    """production routeが対象周辺IRをpromptとLLMRequest.inputsの両方へ渡す。"""
    monkeypatch.setattr(settings, "api_key", None)
    doc = _doc()
    doc["evidenceLinks"][0]["contradictionState"] = "held"
    captured = {}

    from kj_atlas_api.llm.provider import _new_metadata

    def _fake_generate(req):
        captured["request"] = req
        return LLMResponse(
            raw_text='{"opposingText":"対象主張への別視点です。","evidenceGap":false,"rationale":"記録済み構造を参照。","warnings":[]}',
            metadata=_new_metadata(
                provider_kind="local",
                provider_name="local",
                model_id="default",
                transport="none",
            ),
        )

    monkeypatch.setattr(ai, "generate_with_fallback", _fake_generate)
    with _client(tmp_path) as client:
        _put_doc(client, doc)
        resp = client.post(
            "/ai/proposals/opposing-viewpoint",
            json={"doc": doc, "targetCardId": "c-claim"},
        )

    assert resp.status_code == 200, resp.text
    request = captured["request"]
    assert request.inputs is not None
    assert {card["id"] for card in request.inputs["cards"]} >= {"c-claim", "c-counter"}
    assert "contradictionState=held" in request.prompt
    assert "existing HUMAN judgement" in request.prompt
    assert 'Target card: {"id": "c-claim"' in request.prompt
'''
          oppose_test.write_text(oppose_text.replace(marker, integration + marker, 1), encoding="utf-8")
          PY

      - name: 対象回帰とIR経路契約を確認する
        working-directory: 03_Implement/backend
        run: |
          python -m pytest \
            tests/test_ai_opposing_viewpoint_ir.py \
            tests/test_ai_oppose.py \
            tests/test_ai_llm_input_ir_coverage.py \
            -q
          python -m ruff check \
            src/kj_atlas_api/opposing_viewpoint_ir.py \
            src/kj_atlas_api/routes/ai.py \
            tests/test_ai_opposing_viewpoint_ir.py \
            tests/test_ai_oppose.py \
            tests/test_ai_llm_input_ir_coverage.py

      - name: 変更をコミットし補助ワークフローを削除する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-opposing-viewpoint-ir-once.yml
          git add \
            03_Implement/backend/src/kj_atlas_api/routes/ai.py \
            03_Implement/backend/tests/test_ai_oppose.py \
            03_Implement/backend/tests/test_ai_llm_input_ir_coverage.py
          git commit -m "feat: 反対視点提案を入力IRへ接続する"
          git push origin HEAD:feat/opposing-viewpoint-ir-context-20260903
