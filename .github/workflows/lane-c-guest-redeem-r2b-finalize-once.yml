name: Lane C guest redeem R2b final verification once

on:
  push:
    branches:
      - lane-c/guest-admission-redeem-r2b-20260906

permissions:
  contents: write

jobs:
  finalize-and-verify:
    if: "github.event.head_commit.message == 'chore: guest redeem R2b PostgreSQL最終検証を起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KJ_ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      KJ_ATLAS_TEST_POSTGRES_RUNTIME_DATABASE_URL: postgresql+psycopg://kj_runtime:runtime@localhost:5432/postgres
      KJ_ATLAS_RUN_PG_RLS_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-c/guest-admission-redeem-r2b-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main before final verification
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Apply R2b final evidence patch
        run: python .github/scripts/lane_c_guest_redeem_r2b_finalize.py
      - name: Retire one-shot finalization inputs before repository-wide guards
        run: rm .github/scripts/lane_c_guest_redeem_r2b_finalize.py .github/workflows/lane-c-guest-redeem-r2b-finalize-once.yml
      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test,postgres]'
      - name: Create restricted runtime role before migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kj_runtime LOGIN PASSWORD 'runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE postgres TO kj_runtime;
          GRANT USAGE ON SCHEMA public TO kj_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kj_runtime;
          SQL
      - name: Ruff R2b and governance surface
        working-directory: 03_Implement/backend
        run: >-
          python -m ruff check
          alembic/env.py
          alembic/versions/20260907_0035_add_guest_redeem_states.py
          src/kj_atlas_api/guest_redeem.py
          src/kj_atlas_api/guest_redeem_state_models.py
          src/kj_atlas_api/guest_auth_state.py
          src/kj_atlas_api/main.py
          src/kj_atlas_api/persistence_shapes.py
          src/kj_atlas_api/routes/guest_session.py
          tests/test_guest_redeem_http.py
          tests/test_guest_redeem_postgres.py
          tests/test_guest_auth_session_postgres.py
          tests/test_alembic_lineage.py
          tests/test_persistence_shapes.py
      - name: R2b HTTP PostgreSQL and guest regressions
        working-directory: 03_Implement/backend
        run: >-
          python -m pytest -q
          tests/test_guest_redeem_http.py
          tests/test_guest_redeem_postgres.py
          tests/test_guest_auth_session_store.py
          tests/test_guest_auth_session_postgres.py
          tests/test_guest_docs_http_authorization.py
          tests/test_guest_admission_repository.py
          tests/test_guest_admission_postgres_rls.py
          tests/test_tenant_db_guard.py
          tests/test_alembic_lineage.py
          tests/test_persistence_shapes.py
          tests/test_database_support.py
      - name: Repository-wide planning and diff guards
        run: |
          python 01_Plans/docs_check.py
          git diff --check
      - name: Commit integrated verified R2b surface
        run: |
          git add -A
          git commit -m 'test(saas): guest redeemのPostgreSQL境界とR2b証跡を固定する'
          git push origin HEAD:lane-c/guest-admission-redeem-r2b-20260906
