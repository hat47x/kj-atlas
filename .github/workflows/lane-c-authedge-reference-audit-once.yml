name: Temporary lane C AUTHEDGE reference audit

on:
  push:
    branches:
      - chore/lane-c-close-stale-authedge-20260904

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-close-stale-authedge-20260904
      - name: Audit AUTHEDGE references and triage state
        shell: bash
        run: |
          set -euo pipefail
          target='01_Plans/issues/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md'
          echo '=== explicit active-path references ==='
          git grep -n -F "$target" -- ':!'"$target" || true
          echo '=== basename references ==='
          git grep -n -F 'issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md' -- ':!'"$target" || true
          echo '=== current triage target ==='
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          target = next(
              item for item in report['actionable_issues']
              if item['backlog_id'] == 'SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation'
          )
          print(json.dumps(target, ensure_ascii=False, indent=2))
          print(json.dumps(report['summary'], ensure_ascii=False))
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-authedge-reference-audit-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove lane C AUTHEDGE reference audit workflow'
          git push origin HEAD:chore/lane-c-close-stale-authedge-20260904
