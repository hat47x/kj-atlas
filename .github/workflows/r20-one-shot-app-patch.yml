name: R20 one-shot App patch

on:
  push:
    branches:
      - dogfood/r20-merge-method-traceability-20260904

permissions:
  contents: write

jobs:
  patch-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch mergeMethod wiring without normalizing App.tsx
        shell: python
        run: |
          from pathlib import Path

          path = Path("03_Implement/frontend/src/App.tsx")
          data = path.read_bytes()
          needle = b"        mergedTextDraft: suggestion.mergedTextDraft,\r\n        editedText: suggestion.editedText,\r\n        rationale: suggestion.rationale,"
          replacement = b"        mergedTextDraft: suggestion.mergedTextDraft,\r\n        editedText: suggestion.editedText,\r\n        mergeMethod: suggestion.mergeMethod,\r\n        rationale: suggestion.rationale,"

          count = data.count(needle)
          if count != 1:
              raise SystemExit(f"expected exactly one target snippet, found {count}")

          path.write_bytes(data.replace(needle, replacement, 1))

      - name: Remove this one-shot workflow from the resulting branch
        run: rm .github/workflows/r20-one-shot-app-patch.yml

      - name: Commit the patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_Implement/frontend/src/App.tsx .github/workflows/r20-one-shot-app-patch.yml
          git diff --cached --check
          git commit -m "fix: merge方式を採否decisionへ引き継ぐ"
          git push origin HEAD:dogfood/r20-merge-method-traceability-20260904
