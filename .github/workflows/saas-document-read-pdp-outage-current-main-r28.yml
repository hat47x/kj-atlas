name: SaaS Document read PDP outage current main R28

on:
  push:
    branches:
      - test/saas-document-read-pdp-outage-20260905

permissions:
  contents: write

jobs:
  validate-current-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge current main in validation workspace
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'

      - name: SaaS Document read PDP outage regression
        run: pytest -q 03_Implement/backend/tests/test_saas_document_read_pdp_outage.py

      - name: Full backend suite
        run: pytest -q
        working-directory: 03_Implement/backend

      - name: Documentation checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/issues/validate_active_issue_memos.py

      - name: Ruff changed regression
        run: python -m ruff check 03_Implement/backend/tests/test_saas_document_read_pdp_outage.py

      - name: Diff check
        run: git diff --check origin/main...HEAD -- 03_Implement/backend/tests/test_saas_document_read_pdp_outage.py

      - name: Retire one-shot workflow
        if: success()
        run: |
          git merge --abort || true
          rm .github/workflows/saas-document-read-pdp-outage-current-main-r28.yml
          git add .github/workflows/saas-document-read-pdp-outage-current-main-r28.yml
          git commit -m 'chore: retire R28 SaaS PDP outage validator'
          git push origin HEAD:${GITHUB_REF_NAME}
