          assert old in text, "document_repository target block drifted"
          path.write_text(text.replace(old, new), encoding="utf-8")

          # 3) Routes expose the already-established 100/500 keyset contract.
          path = Path("03_Implement/backend/src/sui_sensemaking_api/routes/docs.py")
