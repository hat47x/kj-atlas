name: Lane B2 frontend API base path safety once

on:
  push:
    branches:
      - fix/lane-b2-frontend-api-base-path-safety-20260906

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Route both frontend clients through the shared safe path resolver
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              old_bytes = old.encode('utf-8')
              new_bytes = new.encode('utf-8')
              count = data.count(old_bytes)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_bytes(data.replace(old_bytes, new_bytes, 1))

          replace_once(
              '03_Implement/frontend/src/api/client.ts',
              '''import { csrfHeader } from "../session/csrf";\n\nfunction resolveApiBase(): string {\n  const rawValue = (import.meta.env.KJ_ATLAS_FRONTEND_API_BASE ?? "/api").trim();\n\n  if (rawValue.length === 0) {\n    return "/api";\n  }\n\n  const normalized = rawValue.endsWith("/") ? rawValue.slice(0, -1) : rawValue;\n  return normalized.startsWith("/") ? normalized : "/api";\n}\n\nconst API_BASE = resolveApiBase();''',
              '''import { csrfHeader } from "../session/csrf";\nimport { resolveFrontendApiBase } from "./base_path";\n\nconst API_BASE = resolveFrontendApiBase(\n  import.meta.env.KJ_ATLAS_FRONTEND_API_BASE,\n);''',
          )

          replace_once(
              '03_Implement/frontend/src/admin/model_allowlist_api.ts',
              '''import { csrfHeader } from "../session/csrf";\n\nfunction resolveApiBase(): string {\n  const rawValue = (import.meta.env.KJ_ATLAS_FRONTEND_API_BASE ?? "/api").trim();\n  if (rawValue.length === 0) {\n    return "/api";\n  }\n  const normalized = rawValue.endsWith("/") ? rawValue.slice(0, -1) : rawValue;\n  return normalized.startsWith("/") ? normalized : "/api";\n}\n\nconst API_BASE = resolveApiBase();''',
              '''import { csrfHeader } from "../session/csrf";\nimport { resolveFrontendApiBase } from "../api/base_path";\n\nconst API_BASE = resolveFrontendApiBase(\n  import.meta.env.KJ_ATLAS_FRONTEND_API_BASE,\n);''',
          )

          replace_once(
              '02_Architecture/runtime_parameter_registry.md',
              '| `KJ_ATLAS_FRONTEND_API_BASE` | `/api` | frontend build 時に埋め込む API base path。`/` で始まる path のみ受理し、それ以外は frontend 側で `/api` にフォールバック |',
              '| `KJ_ATLAS_FRONTEND_API_BASE` | `/api` | frontend build 時に埋め込む same-origin API base path。`/` 自体または単一の `/` で始まる path を受理する。`//host` のような network-path reference、backslash、query、fragment、相対 path は受理せず `/api` にフォールバック |',
          )

          replace_once(
              '04_Documentation/configuration.md',
              'frontend の API 接続先は `KJ_ATLAS_FRONTEND_API_BASE` で指定します。未設定なら `/api` を使います。値は `/` で始まる path のみ受理し、それ以外を指定した場合は frontend 側で `/api` にフォールバックします。',
              'frontend の API 接続先は `KJ_ATLAS_FRONTEND_API_BASE` で指定します。未設定なら `/api` を使います。値は same-origin の絶対 path として扱い、`/` 自体または単一の `/` で始まる path だけを受理します。`//host` のような network-path reference、backslash、query (`?`)、fragment (`#`) を含む値や相対 path は受理せず、frontend 側で `/api` にフォールバックします。`/` は root API base として扱います。',
          )
          PY

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Verify focused frontend API-base contract
        working-directory: 03_Implement/frontend
        run: npm test -- src/api/base_path.test.ts src/api/client.test.ts src/admin/model_allowlist_admin.test.ts

      - name: Verify frontend typecheck and build
        working-directory: 03_Implement/frontend
        run: |
          npm run typecheck
          npm run build

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify docs contracts
        run: python 01_Plans/docs_check.py

      - name: Verify diff hygiene
        run: git diff --check

      - name: Commit patch and retire one-shot workflow
        env:
          BRANCH: fix/lane-b2-frontend-api-base-path-safety-20260906
        run: |
          rm .github/workflows/lane-b2-frontend-api-base-path-safety-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            03_Implement/frontend/src/api/client.ts \
            03_Implement/frontend/src/admin/model_allowlist_api.ts \
            02_Architecture/runtime_parameter_registry.md \
            04_Documentation/configuration.md \
            .github/workflows/lane-b2-frontend-api-base-path-safety-once.yml
          git commit -m 'fix(frontend): API baseをsame-origin pathに固定する'
          git push origin HEAD:"$BRANCH"
