name: lane-b-r52-deepseek-usage-shape-once

on:
  push:
    branches:
      - lane-b/deepseek-usage-shape-r52

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/deepseek-usage-shape-r52
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: 03_Implement/backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest ruff
      - name: Apply R52 patch
        env:
          R52_RUN_ID: ${{ github.run_id }}
        run: python .github/lane-b-r52-patch.py
      - name: Run R52 regressions
        working-directory: 03_Implement/backend
        run: |
          pytest -q tests/test_llm_provider.py tests/test_ai_route_provider_token_measurement.py tests/test_ai_route_provider_transport_input_provenance.py tests/test_ai_route_provider_measurement_roundtrip.py
          ruff check tests/test_llm_provider.py
      - name: Validate issue and diff
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
          git diff --check
      - name: Commit and clean one-shot files
        run: |
          rm .github/lane-b-r52-patch.py
          rm .github/workflows/lane-b-r52-deepseek-usage-shape-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ai): pin DeepSeek V4 usage response mapping'
          git push origin HEAD:lane-b/deepseek-usage-shape-r52
