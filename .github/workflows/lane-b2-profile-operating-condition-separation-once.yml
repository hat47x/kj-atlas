name: Lane B2 profile operating condition separation once

on:
  push:
    branches:
      - docs/lane-b2-profile-operating-condition-separation-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Separate profile startup and operating policy
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('02_Architecture/runtime_parameter_registry.md')
          registry = registry_path.read_text(encoding='utf-8')
          old = '''この表は、代表的な実行環境ごとの推奨値を示します。`KJ_ATLAS_RUNTIME_PROFILE`でprofile名を明示し、未指定時は`local-dev`を使います。各profileのRequired settingsは別キーで明示し、profile名だけで秘密値や接続先を補完しません。実装既定値を変更する場合や、公開設定キーを追加・改名する場合はADRで扱います。

| Profile | Purpose | Required settings | Notes |
|---|---|---|---|
| `local-dev` | 開発者の手元で最小起動する | `KJ_ATLAS_DATABASE_URL=sqlite:///./kj_atlas.db`, `KJ_ATLAS_LLM_PROVIDER=none` | 外部サービスを使わずに動作確認する。ヘッダー由来の未登録ユーザーを JIT 自動作成する場合だけ `KJ_ATLAS_ALLOW_JIT_PROVISIONING=true` を明示する。共有・export の安全境界は緩めない。 |
| `evaluation` | Docker Compose で利用者評価や検証を行う | `KJ_ATLAS_DATABASE_URL=postgresql+asyncpg://...`, `KJ_ATLAS_LLM_PROVIDER=none`, `KJ_ATLAS_AUDIT_TRANSPORT=noop`, `KJ_ATLAS_ACCESS_CONTROL_ADAPTER=noop` | 組織内評価では PostgreSQL を推奨する。LLM、監査HTTP連携、外部PDP連携は明示的に必要な場合だけ有効化する。 |
| `enterprise-production` | 企業・行政の本番相当で運用する | `KJ_ATLAS_ADMIN_API_KEY=<secret>`, `KJ_ATLAS_API_KEY=<secret>`, `KJ_ATLAS_ALLOW_JIT_PROVISIONING=false`, `KJ_ATLAS_LLM_PROVIDER=none`, `KJ_ATLAS_ACCESS_CONTROL_FAIL_SAFE_MODE=read_only` または `deny` | `KJ_ATLAS_ADMIN_API_KEY` と `KJ_ATLAS_API_KEY` は別値で必須。未設定なら `Settings()` 構築時に起動拒否する。認証、認可、監査の接続先は組織基盤で管理する。HTTP連携を使う場合は接続先、timeout、fail-safe、秘密情報管理を同時に確認する。 |
| `saas-multitenant` | 相互に信頼しない複数tenantを同じサービスへ収容する | `KJ_ATLAS_ADMIN_API_KEY=<secret>`, `KJ_ATLAS_DATABASE_URL=<PostgreSQL URL>`, `KJ_ATLAS_ALLOW_JIT_PROVISIONING=false`, `KJ_ATLAS_ACCESS_CONTROL_ADAPTER=external_http`, `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_ACCESS_CONTROL_FAIL_SAFE_MODE=deny`, `KJ_ATLAS_DOCUMENT_POLICY_BINDING_RESOLVER=external_http`, `KJ_ATLAS_DOCUMENT_POLICY_BINDING_HTTP_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_TENANT_CAPABILITY_RESOLVER=external_http`, `KJ_ATLAS_TENANT_CAPABILITY_HTTP_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_JWT_ALGORITHMS=RS256,ES256`, `KJ_ATLAS_TENANT_CLAIM_NAME=tenant_ref`, `KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY=<64 lowercase hex>` | `ADR-0063` D9 / `ADR-0072` / `ADR-0074` の起動hard gate。`TrustedSaasRuntimePolicy.validate()` と lifespan preflight が完備を検証し、active IdP の存在もDB初期化後に検査する。SQLite、noop、mock、read_only、endpoint欠損時fallbackを許可しない。OAuth callback を利用するには token endpoint / redirect URI / client ID / client secret も必要で、欠損時はcallbackを503でfail-closedする。 |'''
          new = '''この表は、代表的な実行環境ごとの operating condition を示します。`KJ_ATLAS_RUNTIME_PROFILE`でprofile名を明示し、未指定時は`local-dev`を使います。`Startup-required conditions` はそのprofileを起動するために満たす hard gate、`Recommended / conditional settings` は安全・標準として推奨する値または特定機能を使う場合だけ必要な値です。profile名だけで秘密値や接続先を補完しません。実装既定値を変更する場合や、公開設定キーを追加・改名する場合はADRで扱います。

| Profile | Purpose | Startup-required conditions | Recommended / conditional settings | Notes |
|---|---|---|---|---|
| `local-dev` | 開発者の手元で最小起動する | なし（追加のprofile固有hard gateなし） | 推奨: `KJ_ATLAS_DATABASE_URL=sqlite:///./kj_atlas.db`, `KJ_ATLAS_LLM_PROVIDER=none`。条件付き: ヘッダー由来の未登録ユーザーを JIT 自動作成する場合だけ `KJ_ATLAS_ALLOW_JIT_PROVISIONING=true` | 実装既定値だけでも起動可能。外部サービスを使わずに動作確認し、共有・export の安全境界は緩めない。 |
| `evaluation` | Docker Compose で利用者評価や検証を行う | なし（追加のprofile固有hard gateなし） | 推奨: `KJ_ATLAS_DATABASE_URL=postgresql+asyncpg://...`, `KJ_ATLAS_LLM_PROVIDER=none`, `KJ_ATLAS_AUDIT_TRANSPORT=noop`, `KJ_ATLAS_ACCESS_CONTROL_ADAPTER=noop` | 標準 Compose での評価構成。外部監査/外部PDPは必要な場合だけ明示有効化する。 |
| `enterprise-production` | 企業・行政の本番相当で運用する | `KJ_ATLAS_ADMIN_API_KEY=<secret>`, `KJ_ATLAS_API_KEY=<secret>` | 推奨: `KJ_ATLAS_ALLOW_JIT_PROVISIONING=false`, `KJ_ATLAS_LLM_PROVIDER=none`, `KJ_ATLAS_ACCESS_CONTROL_FAIL_SAFE_MODE=read_only` または `deny` | 2つのAPI keyは別値で必須。未設定なら `Settings()` 構築時に起動拒否する。HTTP連携を使う場合は接続先、timeout、fail-safe、秘密情報管理を同時に確認する。 |
| `saas-multitenant` | 相互に信頼しない複数tenantを同じサービスへ収容する | `KJ_ATLAS_ADMIN_API_KEY=<secret>`, `KJ_ATLAS_DATABASE_URL=<PostgreSQL URL>`, `KJ_ATLAS_ALLOW_JIT_PROVISIONING=false`, `KJ_ATLAS_ACCESS_CONTROL_ADAPTER=external_http`, `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_ACCESS_CONTROL_FAIL_SAFE_MODE=deny`, `KJ_ATLAS_DOCUMENT_POLICY_BINDING_RESOLVER=external_http`, `KJ_ATLAS_DOCUMENT_POLICY_BINDING_HTTP_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_TENANT_CAPABILITY_RESOLVER=external_http`, `KJ_ATLAS_TENANT_CAPABILITY_HTTP_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_JWT_ALGORITHMS=RS256,ES256`, `KJ_ATLAS_TENANT_CLAIM_NAME=tenant_ref`, `KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT=<HTTPS URL>`, `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY=<64 lowercase hex>` | OAuth callback利用時必須: `KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT`, `KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI`, `KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_ID`, `KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_SECRET` | `TrustedSaasRuntimePolicy.validate()` と lifespan preflight がstartup hard gateを検証し、active IdP の存在もDB初期化後に検査する。callback用4項目の欠損は起動拒否ではなくcallbackを503でfail-closedする。 |'''
          if registry.count(old) != 1:
              raise SystemExit(f'expected one runtime-profile block, got {registry.count(old)}')
          registry_path.write_text(registry.replace(old, new, 1), encoding='utf-8')

          config_path = Path('04_Documentation/configuration.md')
          raw = config_path.read_bytes()
          old_bullets = '''- `local-dev`: SQLite + `KJ_ATLAS_LLM_PROVIDER=none` で最小起動。
- `evaluation`: Compose + PostgreSQL で検証。監査HTTPと外部PDPは原則 `noop`。
- `enterprise-production`: `KJ_ATLAS_ADMIN_API_KEY` と `KJ_ATLAS_API_KEY` を別値で必須とし、`KJ_ATLAS_ALLOW_JIT_PROVISIONING=false` を基本に、fail-safe を `read_only` または `deny` で固定。
- `saas-multitenant`: `KJ_ATLAS_ADMIN_API_KEY`、PostgreSQL、外部PDP＋endpoint、外部document binding＋endpoint、外部tenant capability＋endpoint、JIT無効、deny fail-safe、OAuth authorize endpoint、auth-session hash keyをすべて満たす場合だけ起動します。'''.replace('\n', '\r\n').encode('utf-8')
          new_bullets = '''- `local-dev`: **起動hard gateは追加なし**。SQLite + `KJ_ATLAS_LLM_PROVIDER=none` を推奨し、未登録header userを自動作成する場合だけJITを明示 `true`。
- `evaluation`: **profile単体の起動hard gateは追加なし**。標準ComposeではPostgreSQL + LLM `none` + audit/access-control `noop` を推奨。
- `enterprise-production`: **起動hard gate**は別値の `KJ_ATLAS_ADMIN_API_KEY` と `KJ_ATLAS_API_KEY`。JIT `false`、LLM `none`、fail-safe `read_only` または `deny` は運用推奨。
- `saas-multitenant`: **起動hard gate**は `KJ_ATLAS_ADMIN_API_KEY`、PostgreSQL、外部PDP/document binding/tenant capabilityと各endpoint、JIT無効、deny fail-safe、OAuth authorize endpoint、auth-session hash key。OAuth callbackを使う場合はtoken endpoint / redirect URI / client ID / client secretも必要で、欠損時はcallbackを503で拒否。'''.replace('\n', '\r\n').encode('utf-8')
          if raw.count(old_bullets) != 1:
              raise SystemExit(f'expected one configuration profile bullet block, got {raw.count(old_bullets)}')
          config_path.write_bytes(raw.replace(old_bullets, new_bullets, 1))

          test_path = Path('01_Plans/tests/test_production_profile_required_settings_contract.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '    def test_enterprise_profile_exposes_settings_fail_fast_credentials(self) -> None:\n'
          addition = '''    def test_nonproduction_profiles_keep_recommendations_out_of_startup_required(self) -> None:\n        self.assertIn("Startup-required conditions", self.registry)\n        self.assertIn("Recommended / conditional settings", self.registry)\n        local = _profile_row(self.registry, "local-dev")\n        evaluation = _profile_row(self.registry, "evaluation")\n        self.assertEqual(local[2], "なし（追加のprofile固有hard gateなし）")\n        self.assertEqual(evaluation[2], "なし（追加のprofile固有hard gateなし）")\n        for token in ("KJ_ATLAS_DATABASE_URL", "KJ_ATLAS_LLM_PROVIDER", "KJ_ATLAS_ALLOW_JIT_PROVISIONING"):\n            self.assertIn(token, local[3])\n        for token in ("KJ_ATLAS_DATABASE_URL", "KJ_ATLAS_LLM_PROVIDER", "KJ_ATLAS_AUDIT_TRANSPORT", "KJ_ATLAS_ACCESS_CONTROL_ADAPTER"):\n            self.assertIn(token, evaluation[3])\n\n'''
          if marker not in test or 'test_nonproduction_profiles_keep_recommendations_out_of_startup_required' in test:
              raise SystemExit('production profile test insertion point unavailable')
          test = test.replace(marker, addition + marker, 1)
          test = test.replace(
              '        required = _profile_row(self.registry, "enterprise-production")[2]\n',
              '        row = _profile_row(self.registry, "enterprise-production")\n        required, operating = row[2], row[3]\n',
              1,
          )
          needle = '        self.assertIn("`KJ_ATLAS_API_KEY=<secret>`", required)\n'
          repl = needle + '''        for token in (\n            "KJ_ATLAS_ALLOW_JIT_PROVISIONING",\n            "KJ_ATLAS_LLM_PROVIDER",\n            "KJ_ATLAS_ACCESS_CONTROL_FAIL_SAFE_MODE",\n        ):\n            self.assertNotIn(token, required)\n            self.assertIn(token, operating)\n'''
          if needle not in test:
              raise SystemExit('enterprise assertion marker unavailable')
          test = test.replace(needle, repl, 1)
          test = test.replace(
              '        required, notes = row[2], row[3]\n',
              '        required, conditional, notes = row[2], row[3], row[4]\n',
              1,
          )
          old_callback = '        self.assertIn("token endpoint / redirect URI / client ID / client secret", notes)\n        self.assertIn("503", notes)\n'
          new_callback = '''        callback_only = (\n            "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT",\n            "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI",\n            "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_ID",\n            "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_SECRET",\n        )\n        for key in callback_only:\n            self.assertNotIn(key, required)\n            self.assertIn(key, conditional)\n        self.assertIn("503", notes)\n'''
          if old_callback not in test:
              raise SystemExit('callback assertion marker unavailable')
          test_path.write_text(test.replace(old_callback, new_callback, 1), encoding='utf-8')
          PY
      - name: Verify focused profile contracts
        run: |
          python 01_Plans/tests/test_jit_profile_recommendation_contract.py
          python 01_Plans/tests/test_production_profile_required_settings_contract.py
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '01_Plans/tests/test_production_profile_required_settings_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected changed files: {sorted(changed)}')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-profile-operating-condition-separation-once.yml
          git add 01_Plans/tests/test_production_profile_required_settings_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): profileのrequiredとrecommendedを分離する"
          git push
