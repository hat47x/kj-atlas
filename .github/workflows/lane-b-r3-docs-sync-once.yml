name: lane-b-r3-docs-sync-once

on:
  push:
    branches:
      - lane-b/final-judgement-model-governance-r3

permissions:
  contents: write

jobs:
  sync-verify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-model-governance-r3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R3 evidence sync
        run: python .github/scripts/lane_b_r3_docs_sync.py
      - name: Verify documentation contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              print('docs contract failures:')
              for error in result.errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print(f'docs contracts passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check
      - name: Commit synced evidence and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/lane_b_r3_docs_sync.py
          git rm .github/workflows/lane-b-r3-docs-sync-once.yml
          git add 01_Plans/issues/issue-AI-ROUTE-HELD-LINKAGE-01-link-final-judgement-failure-to-proposal-state.md \
                  01_Plans/issues/issue-AI-ROUTE-01-multi-model-routing-and-final-judgment-boundary.md
          git commit -m "docs(ai): sync R3 governance evidence"
          git push origin HEAD:lane-b/final-judgement-model-governance-r3
