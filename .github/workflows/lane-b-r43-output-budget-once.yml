name: lane-b-r43-output-budget-once

on:
  push:
    branches:
      - lane-b/production-output-budget-contract

permissions:
  contents: write

jobs:
  verify-and-self-delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/production-output-budget-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'
      - name: Run R43 and related regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_route_production_output_budget_contract.py \
            tests/test_ai_route_provider_measurement_analysis.py \
            tests/test_ai_route_provider_transport_input_provenance.py \
            tests/test_ai_route_provider_call_provenance.py \
            tests/test_ai_route_provider_prompt_fingerprint.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_a2_candidate.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_layout_hierarchical_composition.py
      - name: Lint and hygiene
        run: |
          cd 03_Implement/backend
          python -m ruff check \
            tests/test_ai_route_production_output_budget_contract.py \
            scripts/analyze_ai_route_provider_measurement.py
          cd ../..
          git diff --check
      - name: Remove temporary workflow
        run: |
          rm .github/workflows/lane-b-r43-output-budget-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(lane-b): remove R43 one-shot workflow'
          git push origin HEAD:lane-b/production-output-budget-contract
