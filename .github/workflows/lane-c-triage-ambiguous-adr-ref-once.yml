name: Temporary lane C ambiguous ADR ref triage

on:
  push:
    branches:
      - fix/lane-c-triage-ambiguous-adr-ref-20260904

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-triage-ambiguous-adr-ref-20260904
          fetch-depth: 0

      - name: Apply fix
        run: python .github/lane_c_triage_ambiguous_adr_ref_patch.py

      - name: Verify regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"

      - name: Record repository baseline diagnostics
        shell: bash
        run: |
          set +e
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          echo "validator_rc=$?"
          python 01_Plans/docs_check.py
          echo "docs_check_rc=$?"
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json
          echo "triage_rc=$?"
          exit 0

      - name: Commit tested changes and remove temporary files
        shell: bash
        run: |
          set -euo pipefail
          rm .github/lane_c_triage_ambiguous_adr_ref_patch.py
          rm .github/workflows/lane-c-triage-ambiguous-adr-ref-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "fix: ADRの曖昧なissue参照をtriageで推測しない"
            git push origin HEAD:fix/lane-c-triage-ambiguous-adr-ref-20260904
          fi
