name: Third-party value protocol

on:
  pull_request:
    paths:
      - "01_Plans/dogfood/third-party-value-*.md"
      - "01_Plans/dogfood/validate_third_party_value_protocol.py"
      - ".github/workflows/third-party-value-protocol.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-check:
    name: Protocol boundary check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate third-party value protocol
        run: python 01_Plans/dogfood/validate_third_party_value_protocol.py
