name: lane-b max document cards sync once

on:
  push:
    branches:
      - lane-b/max-document-cards-registry-sync

permissions:
  contents: write

jobs:
  apply-verify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/max-document-cards-registry-sync
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply registry sync
        run: python .github/scripts/lane_b_max_document_cards_sync_once.py
      - name: Install backend test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest
      - name: Verify document bounds contract
        working-directory: 03_Implement/backend
        run: python -m pytest -q tests/test_docs_bounds.py
      - name: Verify repository contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              print('docs contract failures:')
              for error in result.errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print(f'docs contracts passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check
      - name: Commit verified sync and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/lane_b_max_document_cards_sync_once.py
          git rm .github/workflows/lane-b-max-document-cards-sync-once.yml
          git add 02_Architecture/runtime_parameter_registry.md \
                  04_Documentation/configuration.md \
                  03_Implement/backend/tests/test_docs_bounds.py
          git commit -m "docs(config): sync document card limit default"
          git push origin HEAD:lane-b/max-document-cards-registry-sync
