name: Temporary merge apply save reload E2E

on:
  push:
    branches:
      - test/merge-apply-save-reload-e2e-20260903
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/merge-apply-save-reload-e2e-20260903
          fetch-depth: 0
      - name: Apply merge decision preview fix
        run: python .github/scripts/patch_merge_decision_preview_once.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Install dependencies
        working-directory: 03_Implement/frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run merge save/reload E2E
        working-directory: 03_Implement/frontend
        run: npx playwright test e2e/merge_accept_apply_save_reload.spec.ts
      - name: Typecheck and focused regressions
        working-directory: 03_Implement/frontend
        run: |
          npm run typecheck
          npx vitest run src/domain/merge_suggestion_apply.test.ts src/domain/merge_suggestion_decisions.test.ts src/ui/MergeSuggestionsPanel.test.ts
      - name: Diff and plan checks
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage.txt
          test -s /tmp/triage.txt
          git -c core.whitespace=cr-at-eol diff --check
      - name: Commit validated changes
        run: |
          rm .github/workflows/tmp-verify-merge-save-reload-e2e.yml
          rm .github/scripts/patch_merge_decision_preview_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: merge判断後も明示適用候補を保持する'
          git push origin HEAD:test/merge-apply-save-reload-e2e-20260903
