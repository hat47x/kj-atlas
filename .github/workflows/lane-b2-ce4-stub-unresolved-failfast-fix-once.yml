name: Lane B2 CE4 stub unresolved fail-fast fix once

on:
  push:
    branches:
      - fix/lane-b2-ce4-stub-unresolved-failfast-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Patch dead CE4 public toggle into fail-fast fixed contract
        run: |
          python - <<'PY'
          from pathlib import Path

          settings_path = Path('03_Implement/backend/src/kj_atlas_api/settings.py')
          settings = settings_path.read_text(encoding='utf-8')
          old = '''        if not self.ce4_audit_require_all_events:\n            raise ValueError(\n                "KJ_ATLAS_CE4_AUDIT_REQUIRE_ALL_EVENTS must remain true in CE4"\n            )\n\n        # ADR-0063 D4: validate JWT algorithm allowlist.\n'''
          new = '''        if not self.ce4_audit_require_all_events:\n            raise ValueError(\n                "KJ_ATLAS_CE4_AUDIT_REQUIRE_ALL_EVENTS must remain true in CE4"\n            )\n        if not self.ce4_stub_unresolved_contracts:\n            raise ValueError(\n                "KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS must remain true until "\n                "the CE4 unresolved-stub trigger contract is implemented"\n            )\n\n        # ADR-0063 D4: validate JWT algorithm allowlist.\n'''
          if settings.count(old) != 1:
              raise SystemExit('settings CE4 guard insertion point drifted')
          settings_path.write_text(settings.replace(old, new, 1), encoding='utf-8', newline='\n')

          test_path = Path('03_Implement/backend/tests/test_settings_env_prefix_migration.py')
          test = test_path.read_text(encoding='utf-8')
          old_test = '''def test_settings_exposes_ce4_stub_unresolved_contracts(monkeypatch) -> None:  # type: ignore[no-untyped-def]\n    _unset_related_envs()\n    monkeypatch.setenv("KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS", "false")\n\n    loaded = Settings()\n\n    assert loaded.ce4_stub_unresolved_contracts is False\n'''
          new_test = '''def test_settings_rejects_disabling_ce4_stub_unresolved_contracts(monkeypatch) -> None:  # type: ignore[no-untyped-def]\n    _unset_related_envs()\n    monkeypatch.setenv("KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS", "false")\n\n    try:\n        Settings()\n        assert False, "Expected unresolved CE4 stub isolation to remain fail-closed"\n    except ValueError as exc:\n        assert "KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS" in str(exc)\n'''
          if test.count(old_test) != 1:
              raise SystemExit('settings env test target drifted')
          test_path.write_text(test.replace(old_test, new_test, 1), encoding='utf-8', newline='\n')

          replacements = {
              Path('02_Architecture/runtime_parameter_registry.md'): (
                  '| `KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS` | `true` | 未確定 CE4 契約を stub 応答で隔離し、成功扱いにしない | direct（validator 未強制） | 通常値 | `false` 設定時に未確定 CE4 契約が stub 応答ではなくエラーになることを確認する |',
                  '| `KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS` | `true` | 未確定 CE4 契約を stub 応答で隔離し、成功扱いにしない安全契約。未確定 stub trigger の runtime 契約が実装されるまで `true` 固定 | fixed | 通常値 | `false` 設定時に起動が拒否されることを確認する |',
              ),
              Path('04_Documentation/configuration.md'): (
                  '| `KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS` | `true` | 未確定 CE4 契約を stub 応答で隔離 |',
                  '| `KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS` | `true` | 未確定 CE4 契約を stub 応答で隔離する fail-closed 契約。現在は `true` 固定で、`false` は起動時に拒否 |',
              ),
          }
          for path, (old_bytes_text, new_bytes_text) in replacements.items():
              data = path.read_bytes()
              old_b = old_bytes_text.encode('utf-8')
              new_b = new_bytes_text.encode('utf-8')
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected one public-row match, got {count}')
              path.write_bytes(data.replace(old_b, new_b, 1))
          PY

      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test]'

      - name: Verify focused settings contract
        working-directory: 03_Implement/backend
        run: |
          pytest -q tests/test_settings_env_prefix_migration.py -k 'ce4_stub_unresolved or ce4_audit_require_all_events or non_ce4_equivalence'
          ruff check src/kj_atlas_api/settings.py tests/test_settings_env_prefix_migration.py

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify narrow diff
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '03_Implement/backend/src/kj_atlas_api/settings.py',
              '03_Implement/backend/tests/test_settings_env_prefix_migration.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected patch scope: {sorted(changed)}')
          for path in expected:
              data = open(path, 'rb').read().splitlines()
              bad = [i for i, line in enumerate(data, 1) if line.rstrip(b' \t\r') != line.rstrip(b'\r')]
              if bad:
                  raise SystemExit(f'{path}: trailing space/tab on lines {bad[:10]}')
          PY
          git diff --check -- 03_Implement/backend/src/kj_atlas_api/settings.py 03_Implement/backend/tests/test_settings_env_prefix_migration.py 02_Architecture/runtime_parameter_registry.md

      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 03_Implement/backend/src/kj_atlas_api/settings.py 03_Implement/backend/tests/test_settings_env_prefix_migration.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "fix(config): CE4 unresolved stub toggleをfail-fastに固定する"
          git rm .github/workflows/lane-b2-ce4-stub-unresolved-failfast-fix-once.yml
          git commit -m "ci: retire Lane B2 CE4 stub fail-fast workflow"
          git push
