name: Temporary lane C final ADR status triage verification

on:
  push:
    branches:
      - chore/lane-c-plan-triage-20260904

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-plan-triage-20260904
      - name: Run final triage and planning checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans/tests/test_triage_actionable_plans.py
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          target = next(
              item for item in report['actionable_issues']
              if item['backlog_id'] == 'AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path'
          )
          accepted_blockers = [
              (item['backlog_id'], blocker)
              for item in report['actionable_issues']
              for blocker in item['blockers']
              if ':Accepted' in blocker
          ]
          summary = report['summary']
          print(f"AI-IR-PROJECTION ready={target['ready']} blockers={target['blockers']}")
          print(f"accepted_status_blockers={len(accepted_blockers)}")
          print(f"summary={summary}")
          if target['ready'] is not True or target['blockers']:
              raise SystemExit('AI-IR-PROJECTION-01 is not Ready after normalization')
          if accepted_blockers:
              raise SystemExit(f'Accepted ADR still appears as blocker: {accepted_blockers}')
          if summary['active_issue_count'] != 51 or summary['ready_issue_count'] != 14:
              raise SystemExit(f'unexpected final triage summary: {summary}')
          PY
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          git diff --check
      - name: Remove one-shot workflow after successful verification
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-adr-status-final-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove verified final lane C ADR status workflow'
          git push origin HEAD:chore/lane-c-plan-triage-20260904
