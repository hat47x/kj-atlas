name: R20 lane B mergeMethod finalize

on:
  push:
    branches:
      - dogfood/r20-merge-method-traceability-20260904
    paths:
      - .github/workflows/r20-lane-b-finalize.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/r20-merge-method-traceability-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Correct one-shot persistence test harness
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/r20_lane_b_finalize.py')
          text = script.read_text(encoding='utf-8')
          old_import = 'import { validateDocument } from "./validate";'
          if old_import not in text:
              raise SystemExit('expected validateDocument test import not found')
          text = text.replace(old_import, 'import { validateImportedDocument } from "./validate";')
          call_count = text.count('validateDocument(raw)')
          if call_count != 3:
              raise SystemExit(f'expected 3 validateDocument(raw) calls, found {call_count}')
          text = text.replace('validateDocument(raw)', 'validateImportedDocument(raw)')
          script.write_text(text, encoding='utf-8')

          # Remove the superseded parallel one-shot verifier from the final product diff.
          Path('.github/workflows/r20-final-contract-closure-once.yml').unlink(missing_ok=True)
          PY
      - run: python .github/scripts/r20_lane_b_finalize.py
