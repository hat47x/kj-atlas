name: R20 lane B mergeMethod finalize

on:
  push:
    branches:
      - dogfood/r20-merge-method-traceability-20260904
    paths:
      - .github/workflows/r20-lane-b-finalize.yml

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/r20-merge-method-traceability-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configure merge identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - name: Correct one-shot contract seams
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('.github/scripts/r20_lane_b_finalize.py')
          text = script.read_text(encoding='utf-8')
          old_import = 'import { validateDocument } from "./validate";'
          if old_import not in text:
              raise SystemExit('expected validateDocument test import not found')
          text = text.replace(old_import, 'import { validateImportedDocument } from "./validate";')
          call_count = text.count('validateDocument(raw)')
          if call_count != 3:
              raise SystemExit(f'expected 3 validateDocument(raw) calls, found {call_count}')
          text = text.replace('validateDocument(raw)', 'validateImportedDocument(raw)')
          if 'tests/test_models_backward_compat.py' not in text:
              raise SystemExit('expected stale backend compatibility test path not found')
          text = text.replace(
              'tests/test_models_backward_compat.py',
              'tests/test_merge_method_backward_compat.py',
          )
          script.write_text(text, encoding='utf-8')

          safe_mode = Path('03_Implement/frontend/src/domain/inquiry_bundle_safe_mode.ts')
          safe_text = safe_mode.read_text(encoding='utf-8')
          anchor = '  rationale: "redact",\n  // R3-tier-1: decision-time provenance snapshot.'
          if '  mergeMethod: "preserve",' not in safe_text:
              if safe_text.count(anchor) != 1:
                  raise SystemExit('SafeMode merge decision field anchor mismatch')
              safe_text = safe_text.replace(
                  anchor,
                  '  rationale: "redact",\n  mergeMethod: "preserve",\n  // R3-tier-1: decision-time provenance snapshot.',
                  1,
              )
              safe_mode.write_text(safe_text, encoding='utf-8')

          backend_test = Path('03_Implement/backend/tests/test_merge_method_backward_compat.py')
          backend_test.write_text('''from pydantic import ValidationError\n\nfrom kj_atlas_api.models import MergeSuggestionDecision\n\n\ndef _decision_payload() -> dict[str, object]:\n    return {\n        "id": "d1",\n        "groupId": "g1",\n        "decision": "accept",\n        "decidedAt": "2026-09-04T00:00:00Z",\n        "cardIds": ["c1", "c2"],\n        "mergedTextDraft": "共通する意味を保った統合案",\n        "editedText": "共通する意味を保った統合案",\n    }\n\n\ndef test_legacy_merge_decision_without_method_still_round_trips_without_inference() -> None:\n    decision = MergeSuggestionDecision.model_validate(_decision_payload())\n    dumped = decision.model_dump(mode="json")\n\n    assert decision.mergeMethod is None\n    assert "mergeMethod" not in dumped\n\n\ndef test_new_merge_decision_preserves_kernel_fusion_method() -> None:\n    payload = _decision_payload()\n    payload["mergeMethod"] = "kernel_fusion"\n\n    decision = MergeSuggestionDecision.model_validate(payload)\n    dumped = decision.model_dump(mode="json")\n\n    assert decision.mergeMethod == "kernel_fusion"\n    assert dumped["mergeMethod"] == "kernel_fusion"\n\n\ndef test_unknown_merge_method_is_rejected() -> None:\n    payload = _decision_payload()\n    payload["mergeMethod"] = "semantic_similarity"\n\n    try:\n        MergeSuggestionDecision.model_validate(payload)\n    except ValidationError:\n        pass\n    else:\n        raise AssertionError("unknown mergeMethod must be rejected")\n''', encoding='utf-8')

          # Remove the superseded parallel one-shot verifier from the final product diff.
          Path('.github/workflows/r20-final-contract-closure-once.yml').unlink(missing_ok=True)
          PY
      - run: python .github/scripts/r20_lane_b_finalize.py

# one-shot run 7: treat CRLF as end-of-line in the final staged diff check, then self-remove.
