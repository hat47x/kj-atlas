name: Temporary lane C active plan triage

on:
  push:
    branches:
      - chore/lane-c-plan-triage-20260904

permissions:
  contents: write

jobs:
  triage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-plan-triage-20260904
      - name: Print active plan triage
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-active-plan-triage-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove lane C triage workflow'
          git push origin HEAD:chore/lane-c-plan-triage-20260904
