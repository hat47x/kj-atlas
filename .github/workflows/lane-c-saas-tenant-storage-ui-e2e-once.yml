name: Lane C SaaS tenant storage UI E2E once

on:
  push:
    branches:
      - test/lane-c-saas-tenant-storage-ui-e2e-20260905

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: "github.event.head_commit.message == 'chore: run SaaS tenant storage UI E2E validation'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply scoped UI E2E patch
        run: python .github/scripts/lane_c_add_saas_tenant_storage_ui_e2e_once.py
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: 03_Implement/frontend
        run: npx playwright install --with-deps chromium
      - name: Frontend typecheck
        working-directory: 03_Implement/frontend
        run: npm run typecheck
      - name: Tenant-scoped storage unit tests
        working-directory: 03_Implement/frontend
        run: npx vitest run src/storage/app_browser_storage.test.ts src/storage/query_presets.test.ts src/storage/recent.test.ts src/storage/tenant_scope.test.ts
      - name: SaaS browser E2E
        working-directory: 03_Implement/frontend
        env:
          KJ_ATLAS_E2E_SAAS: '1'
        run: npx playwright test --config=playwright.saas.config.ts
      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
      - name: Planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py
      - name: Documentation contract check
        run: python 01_Plans/docs_check.py
      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json
      - name: Stale merge reintroduction check
        run: python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong
      - name: Diff check
        run: git diff --check
      - name: Commit verified changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add -A
          git commit -m 'test: tenant切替後のscoped UI残留を実ブラウザで固定する'
          git push origin HEAD
