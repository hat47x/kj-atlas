name: Lane B2 SEC-AUDIT-DUP-01 context audit once

on:
  push:
    branches:
      - audit/lane-b2-audit-dedup-scope-20260907

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate SEC-AUDIT-DUP-01 contract context
        run: |
          python - <<'PY'
          from pathlib import Path
          needle = 'SEC-AUDIT-DUP-01'
          matches = []
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError):
                  continue
              for i, line in enumerate(lines, 1):
                  if needle in line:
                      start = max(1, i - 3)
                      end = min(len(lines), i + 5)
                      matches.append((path, i, lines[start-1:end]))
          print(f'matches={len(matches)}')
          for path, line_no, excerpt in matches:
              print(f'--- {path}:{line_no} ---')
              for line in excerpt:
                  print(line)
          if not matches:
              raise SystemExit('SEC-AUDIT-DUP-01 context not found')
          PY
      - name: Retire one-shot workflow
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-sec-audit-dup-context-audit-once.yml
          git commit -m 'ci(b2): retire SEC-AUDIT-DUP-01 context audit'
          git push
