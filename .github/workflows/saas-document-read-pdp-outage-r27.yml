name: SaaS Document read PDP outage R27

on:
  push:
    branches:
      - test/saas-document-read-pdp-outage-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'

      - name: SaaS Document read PDP outage regression
        run: pytest -q 03_Implement/backend/tests/test_saas_document_read_pdp_outage.py

      - name: Ruff regression
        run: python -m ruff check 03_Implement/backend/tests/test_saas_document_read_pdp_outage.py

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Retire one-shot workflow
        if: success()
        run: |
          rm .github/workflows/saas-document-read-pdp-outage-r27.yml
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add .github/workflows/saas-document-read-pdp-outage-r27.yml
          git commit -m 'chore: retire R27 SaaS PDP outage validator'
          git push origin HEAD:${GITHUB_REF_NAME}
