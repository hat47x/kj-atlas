name: lane-b-r3-model-governance-once

on:
  push:
    branches:
      - lane-b/final-judgement-model-governance-r3

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-model-governance-r3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R3 implementation and tests
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          ai_path = Path('03_Implement/backend/src/kj_atlas_api/routes/ai.py')
          text = ai_path.read_text(encoding='utf-8')

          start = text.index('_FINAL_JUDGEMENT_SYSTEM_HOLD_FAILURES = frozenset({')
          end = text.index('\ndef _assert_model_allowed(', start)
          replacement = r'''_FINAL_JUDGEMENT_SYSTEM_HOLD_FAILURES = frozenset({
              "provider_unavailable",
              "provider_timeout",
          })
          _FINAL_JUDGEMENT_GOVERNANCE_HOLD_FAILURES = frozenset({
              "model_not_allowed",
              "model_not_registered",
              "model_provider_unavailable",
          })


          def _final_judgement_system_hold_failure_code(
              exc: ProviderDisabledError | ProviderRequestError,
          ) -> str | None:
              if isinstance(exc, ProviderDisabledError):
                  return "provider_unavailable"
              if exc.code in _FINAL_JUDGEMENT_SYSTEM_HOLD_FAILURES:
                  return exc.code
              return None


          def _hold_linked_external_proposal_after_final_judgement_unavailable(
              ref: ExternalProposalReference | None,
              *,
              doc_id: str,
              request: Request,
              db: Session,
              failure_code: str,
              audit_metadata: dict[str, object] | None = None,
          ) -> None:
              """Persist a linked proposed->held transition for final-judgement unavailability.

              The explicit proposal linkage has already been validated by the route.
              This common path is shared by provider-runtime failures (R2) and
              model-governance/routing failures detected before dispatch (R3).
              """
              if ref is None:
                  return

              tenant = _resolve_audit_tenant(request, db)

              def _persist():
                  return hold_external_proposal_for_final_judgement_failure(
                      db,
                      tenant=tenant,
                      doc_id=doc_id,
                      proposal_id=ref.proposalId,
                      source_bundle_hash=ref.sourceBundleHash,
                  )

              try:
                  receipt = _persist()
                  db.commit()
              except IntegrityError:
                  db.rollback()
                  try:
                      receipt = _persist()
                      db.commit()
                  except ProposalNotRegistered as retry_exc:
                      db.rollback()
                      raise HTTPException(status_code=404, detail=str(retry_exc)) from retry_exc
                  except (IntegrityError, ProposalDecisionConflict) as retry_exc:
                      db.rollback()
                      raise HTTPException(
                          status_code=409,
                          detail={
                              "code": "proposal_system_hold_conflicted",
                              "message": "Proposal state changed while recording final-judgement hold.",
                          },
                      ) from retry_exc
              except ProposalNotRegistered as hold_exc:
                  db.rollback()
                  raise HTTPException(status_code=404, detail=str(hold_exc)) from hold_exc
              except ProposalDecisionConflict as hold_exc:
                  db.rollback()
                  raise HTTPException(status_code=409, detail=str(hold_exc)) from hold_exc

              if not receipt.transitioned:
                  return

              metadata = dict(audit_metadata or {})
              metadata.update(
                  {
                      "proposalId": ref.proposalId,
                      "sourceBundleHash": ref.sourceBundleHash,
                      "previousStatus": "proposed",
                      "newStatus": "held",
                      "transitionSource": "final_judgement_unavailable",
                      "routingStage": "final_judgement",
                      "failureCode": failure_code,
                  }
              )
              logger.warning(
                  "proposal_system_held",
                  extra={
                      "proposalId": ref.proposalId,
                      "failureCode": failure_code,
                      "traceId": metadata.get("trace_id"),
                  },
              )
              dispatcher = getattr(request.app.state, "audit_dispatcher", None)
              if dispatcher is not None:
                  dispatcher.emit(
                      build_event(
                          event_type="proposal",
                          tenant_id=tenant.tenant_id,
                          doc_id=doc_id,
                          safe_mode=False,
                          metadata=metadata,
                      )
                  )


          def _hold_linked_external_proposal_after_final_judgement_failure(
              ref: ExternalProposalReference | None,
              *,
              doc_id: str,
              request: Request,
              db: Session,
              exc: ProviderDisabledError | ProviderRequestError,
          ) -> None:
              """R2: hold a linked proposal only for enumerated provider availability failures."""
              failure_code = _final_judgement_system_hold_failure_code(exc)
              if failure_code is None:
                  return
              _hold_linked_external_proposal_after_final_judgement_unavailable(
                  ref,
                  doc_id=doc_id,
                  request=request,
                  db=db,
                  failure_code=failure_code,
                  audit_metadata=build_audit_fields(exc),
              )


          def _final_judgement_governance_failure_code(exc: HTTPException) -> str | None:
              detail = exc.detail
              if not isinstance(detail, dict):
                  return None
              code = detail.get("code")
              if isinstance(code, str) and code in _FINAL_JUDGEMENT_GOVERNANCE_HOLD_FAILURES:
                  return code
              return None


          def _hold_linked_external_proposal_after_final_judgement_governance_failure(
              ref: ExternalProposalReference | None,
              *,
              doc_id: str,
              request: Request,
              db: Session,
              exc: HTTPException,
              model_id: str,
          ) -> None:
              """R3: map pre-dispatch governance/routing unavailability to system held."""
              failure_code = _final_judgement_governance_failure_code(exc)
              if ref is None or failure_code is None:
                  return
              _hold_linked_external_proposal_after_final_judgement_unavailable(
                  ref,
                  doc_id=doc_id,
                  request=request,
                  db=db,
                  failure_code=failure_code,
                  audit_metadata={
                      "model_id": model_id,
                      "execution_path": "governance",
                  },
              )
          '''
          replacement = re.sub(r'^          ', '', replacement, flags=re.MULTILINE)
          text = text[:start] + replacement.rstrip() + '\n' + text[end:]

          old_check = '''    _validate_final_judgement_external_proposal(
              payload.externalProposalRef,
              doc_id=payload.doc.id,
              request=request,
              db=db,
          )

              try:
                  llm_response = generate_with_fallback(
                      LLMRequest(
                          task="check_narrative",
                          prompt=_build_narrative_check_prompt(payload),
                      )
                  )'''.replace('          ', '')
          new_check = '''    _validate_final_judgement_external_proposal(
              payload.externalProposalRef,
              doc_id=payload.doc.id,
              request=request,
              db=db,
          )

              model_id = None
              provider_config = None
              if payload.externalProposalRef is not None:
                  model_id = resolve_model_for_task("check_narrative")
                  try:
                      provider_config = _assert_model_allowed(request, db, model_id)
                  except HTTPException as exc:
                      _hold_linked_external_proposal_after_final_judgement_governance_failure(
                          payload.externalProposalRef,
                          doc_id=payload.doc.id,
                          request=request,
                          db=db,
                          exc=exc,
                          model_id=model_id,
                      )
                      raise

              try:
                  llm_response = generate_with_fallback(
                      LLMRequest(
                          task="check_narrative",
                          prompt=_build_narrative_check_prompt(payload),
                          model=model_id,
                          registered_provider=provider_config,
                      )
                  )'''.replace('          ', '')
          if old_check not in text:
              raise SystemExit('check_narrative patch anchor not found')
          text = text.replace(old_check, new_check, 1)

          old_detect = '''    if adjudicated is not None:
              state = adjudicated["contradiction_state"]
              return DetectContradictionResponse(
                  hasContradiction=False,
                  explanation=(
                      "A contradiction between these cards is already recorded and "
                      f"adjudicated by a human (contradictionState={state}); "
                      "it is not re-proposed."
                  ),
                  alreadyRecorded=True,
                  existingContradictionState=state,
              )

              try:
                  llm_response = generate_with_fallback(
                      LLMRequest(
                          task="detect_contradiction",
                          prompt=_build_detect_contradiction_prompt(payload, ir),
                          inputs=ir,
                      )
                  )'''.replace('          ', '')
          new_detect = '''    if adjudicated is not None:
              state = adjudicated["contradiction_state"]
              return DetectContradictionResponse(
                  hasContradiction=False,
                  explanation=(
                      "A contradiction between these cards is already recorded and "
                      f"adjudicated by a human (contradictionState={state}); "
                      "it is not re-proposed."
                  ),
                  alreadyRecorded=True,
                  existingContradictionState=state,
              )

              model_id = None
              provider_config = None
              if payload.externalProposalRef is not None:
                  model_id = resolve_model_for_task("detect_contradiction")
                  try:
                      provider_config = _assert_model_allowed(request, db, model_id)
                  except HTTPException as exc:
                      _hold_linked_external_proposal_after_final_judgement_governance_failure(
                          payload.externalProposalRef,
                          doc_id=payload.doc.id,
                          request=request,
                          db=db,
                          exc=exc,
                          model_id=model_id,
                      )
                      raise

              try:
                  llm_response = generate_with_fallback(
                      LLMRequest(
                          task="detect_contradiction",
                          prompt=_build_detect_contradiction_prompt(payload, ir),
                          inputs=ir,
                          model=model_id,
                          registered_provider=provider_config,
                      )
                  )'''.replace('          ', '')
          if old_detect not in text:
              raise SystemExit('detect_contradiction patch anchor not found')
          text = text.replace(old_detect, new_detect, 1)
          ai_path.write_text(text, encoding='utf-8')

          test_path = Path('03_Implement/backend/tests/test_final_judgement_model_governance.py')
          test_path.write_text(r'''from __future__ import annotations

          import json
          from pathlib import Path
          from types import SimpleNamespace

          import pytest
          from fastapi import HTTPException
          from sqlalchemy import create_engine
          from sqlalchemy.orm import Session

          from kj_atlas_api.llm.provider import (
              LLMCallMetadata,
              ProviderDisabledError,
              ProviderRequestError,
              RegisteredProviderConfig,
          )
          from kj_atlas_api.models import AIProposalDecisionStateRow, Base, DocumentV1
          from kj_atlas_api.models_ai import CheckNarrativeRequest, DetectContradictionRequest
          from kj_atlas_api.proposal_decision_repository import (
              register_external_agent_proposal,
              register_external_agent_task,
          )
          from kj_atlas_api.routes import ai
          from kj_atlas_api.tenant_context import TenantContext


          FIXTURE_PATH = Path(__file__).parent / "fixtures" / "ai_eval_kj_document.json"
          HASH_A = "a" * 64
          HASH_B = "b" * 64
          TENANT = TenantContext(
              tenant_id="local-default",
              membership_id=None,
              resolved_by="single_tenant_adapter",
          )


          def _doc() -> DocumentV1:
              return DocumentV1.model_validate(json.loads(FIXTURE_PATH.read_text(encoding="utf-8")))


          def _metadata(trace_id: str = "r3-provider") -> LLMCallMetadata:
              return LLMCallMetadata(
                  provider_kind="large-scale",
                  provider_name="provider-final",
                  model_id="final-model",
                  transport="http",
                  requested_at="2026-09-06T00:00:00Z",
                  trace_id=trace_id,
              )


          class _CaptureDispatcher:
              def __init__(self) -> None:
                  self.events = []

              def emit(self, event) -> None:
                  self.events.append(event)


          def _request(dispatcher=None):
              return SimpleNamespace(app=SimpleNamespace(state=SimpleNamespace(audit_dispatcher=dispatcher)))


          def _register_external(db: Session) -> DocumentV1:
              doc = _doc()
              register_external_agent_task(
                  db,
                  tenant=TENANT,
                  task_id="task-ext-r3",
                  doc_id=doc.id,
                  base_doc_signature=f"{doc.id}:base",
                  source_bundle_hash=HASH_A,
                  query_canonical_hash=HASH_B,
                  task_kind="narrative_draft",
              )
              register_external_agent_proposal(
                  db,
                  tenant=TENANT,
                  doc_id=doc.id,
                  proposal_id="proposal-ext-r3",
                  proposal_kind="narrative_draft",
                  source_bundle_hash=HASH_A,
                  task_id="task-ext-r3",
                  base_doc_signature=f"{doc.id}:base",
                  query_canonical_hash=HASH_B,
                  proposal_fingerprint="c" * 64,
              )
              db.commit()
              return doc


          def _state(db: Session, doc_id: str):
              return db.get(AIProposalDecisionStateRow, (TENANT.tenant_id, doc_id, "proposal-ext-r3"))


          def _linked_check(doc: DocumentV1) -> CheckNarrativeRequest:
              return CheckNarrativeRequest(
                  doc=doc,
                  narrativeText="draft",
                  externalProposalRef={
                      "proposalId": "proposal-ext-r3",
                      "sourceBundleHash": HASH_A,
                  },
              )


          @pytest.mark.parametrize(
              ("status_code", "failure_code"),
              [
                  (403, "model_not_allowed"),
                  (403, "model_not_registered"),
                  (503, "model_provider_unavailable"),
              ],
          )
          def test_linked_governance_failure_holds_before_provider(
              monkeypatch: pytest.MonkeyPatch,
              status_code: int,
              failure_code: str,
          ) -> None:
              engine = create_engine("sqlite:///:memory:")
              Base.metadata.create_all(bind=engine)
              with Session(engine) as db:
                  doc = _register_external(db)
                  dispatcher = _CaptureDispatcher()
                  monkeypatch.setattr(ai, "_resolve_audit_tenant", lambda *_a, **_k: TENANT)
                  monkeypatch.setattr(ai, "_validate_check_narrative_input", lambda _p: None)
                  monkeypatch.setattr(ai, "_reject_unreviewed_text", lambda *_a, **_k: None)
                  monkeypatch.setattr(ai, "resolve_model_for_task", lambda _task: "final-model")
                  monkeypatch.setattr(
                      ai,
                      "_assert_model_allowed",
                      lambda *_a, **_k: (_ for _ in ()).throw(
                          HTTPException(status_code=status_code, detail={"code": failure_code})
                      ),
                  )
                  monkeypatch.setattr(
                      ai,
                      "generate_with_fallback",
                      lambda _req: pytest.fail("governance failure must stop before provider dispatch"),
                  )

                  with pytest.raises(HTTPException) as exc:
                      ai.check_narrative(_linked_check(doc), _request(dispatcher), db)
                  assert exc.value.status_code == status_code
                  assert _state(db, doc.id).status == "held"
                  assert len(dispatcher.events) == 1
                  metadata = dispatcher.events[0].metadata
                  assert metadata["failureCode"] == failure_code
                  assert metadata["model_id"] == "final-model"
                  assert metadata["sourceBundleHash"] == HASH_A
                  assert metadata["execution_path"] == "governance"
                  assert metadata["transitionSource"] == "final_judgement_unavailable"


          def test_linked_governance_success_pins_registered_provider(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              engine = create_engine("sqlite:///:memory:")
              Base.metadata.create_all(bind=engine)
              with Session(engine) as db:
                  doc = _register_external(db)
                  config = RegisteredProviderConfig(
                      provider_id="provider-final",
                      provider_kind="deepseek",
                      base_url="https://api.deepseek.com",
                      api_key_ref="env:DEEPSEEK_API_KEY",
                      model_id="final-model",
                  )
                  captured = []
                  monkeypatch.setattr(ai, "_resolve_audit_tenant", lambda *_a, **_k: TENANT)
                  monkeypatch.setattr(ai, "_validate_check_narrative_input", lambda _p: None)
                  monkeypatch.setattr(ai, "_reject_unreviewed_text", lambda *_a, **_k: None)
                  monkeypatch.setattr(ai, "resolve_model_for_task", lambda _task: "final-model")
                  monkeypatch.setattr(ai, "_assert_model_allowed", lambda *_a, **_k: config)

                  def _generate(req):
                      captured.append(req)
                      raise ProviderRequestError.validation("bad fixture response", _metadata())

                  monkeypatch.setattr(ai, "generate_with_fallback", _generate)
                  with pytest.raises(HTTPException) as exc:
                      ai.check_narrative(_linked_check(doc), _request(_CaptureDispatcher()), db)
                  assert exc.value.status_code == 422
                  assert len(captured) == 1
                  assert captured[0].model == "final-model"
                  assert captured[0].registered_provider == config
                  assert _state(db, doc.id) is None


          def test_standalone_final_judgement_keeps_legacy_provider_path(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              payload = CheckNarrativeRequest(doc=_doc(), narrativeText="draft")
              captured = []
              monkeypatch.setattr(ai, "_validate_check_narrative_input", lambda _p: None)
              monkeypatch.setattr(ai, "_reject_unreviewed_text", lambda *_a, **_k: None)
              monkeypatch.setattr(
                  ai,
                  "_assert_model_allowed",
                  lambda *_a, **_k: pytest.fail("standalone final judgement must not require tenant registry"),
              )

              def _generate(req):
                  captured.append(req)
                  raise ProviderDisabledError("disabled", _metadata("standalone"))

              monkeypatch.setattr(ai, "generate_with_fallback", _generate)
              with pytest.raises(HTTPException) as exc:
                  ai.check_narrative(payload, _request(), object())  # type: ignore[arg-type]
              assert exc.value.status_code == 503
              assert len(captured) == 1
              assert captured[0].model is None
              assert captured[0].registered_provider is None


          def test_detect_linked_governance_failure_holds_after_adjudication_gate(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              engine = create_engine("sqlite:///:memory:")
              Base.metadata.create_all(bind=engine)
              with Session(engine) as db:
                  doc = _register_external(db)
                  cards = doc.cards[:2]
                  payload = DetectContradictionRequest(
                      cardA={"id": cards[0].id, "text": cards[0].text, "textReviewed": True},
                      cardB={"id": cards[1].id, "text": cards[1].text, "textReviewed": True},
                      doc=doc,
                      externalProposalRef={
                          "proposalId": "proposal-ext-r3",
                          "sourceBundleHash": HASH_A,
                      },
                  )
                  monkeypatch.setattr(ai, "_resolve_audit_tenant", lambda *_a, **_k: TENANT)
                  monkeypatch.setattr(ai, "_reject_unreviewed_cards", lambda *_a, **_k: None)
                  monkeypatch.setattr(ai, "_detect_contradiction_ir", lambda _p: {})
                  monkeypatch.setattr(ai, "adjudicated_contradiction", lambda *_a, **_k: None)
                  monkeypatch.setattr(ai, "resolve_model_for_task", lambda _task: "final-model")
                  monkeypatch.setattr(
                      ai,
                      "_assert_model_allowed",
                      lambda *_a, **_k: (_ for _ in ()).throw(
                          HTTPException(status_code=403, detail={"code": "model_not_registered"})
                      ),
                  )
                  monkeypatch.setattr(
                      ai,
                      "generate_with_fallback",
                      lambda _req: pytest.fail("governance failure must stop before provider dispatch"),
                  )
                  with pytest.raises(HTTPException) as exc:
                      ai.detect_contradiction(payload, _request(_CaptureDispatcher()), db)
                  assert exc.value.status_code == 403
                  assert _state(db, doc.id).status == "held"


          def test_non_governance_http_error_does_not_hold(
              monkeypatch: pytest.MonkeyPatch,
          ) -> None:
              engine = create_engine("sqlite:///:memory:")
              Base.metadata.create_all(bind=engine)
              with Session(engine) as db:
                  doc = _register_external(db)
                  monkeypatch.setattr(ai, "_resolve_audit_tenant", lambda *_a, **_k: TENANT)
                  monkeypatch.setattr(ai, "_validate_check_narrative_input", lambda _p: None)
                  monkeypatch.setattr(ai, "_reject_unreviewed_text", lambda *_a, **_k: None)
                  monkeypatch.setattr(ai, "resolve_model_for_task", lambda _task: "final-model")
                  monkeypatch.setattr(
                      ai,
                      "_assert_model_allowed",
                      lambda *_a, **_k: (_ for _ in ()).throw(
                          HTTPException(status_code=422, detail={"code": "policy_rejected"})
                      ),
                  )
                  with pytest.raises(HTTPException) as exc:
                      ai.check_narrative(_linked_check(doc), _request(_CaptureDispatcher()), db)
                  assert exc.value.status_code == 422
                  assert _state(db, doc.id) is None
          '''.replace('          ', ''), encoding='utf-8')

          child = Path('01_Plans/issues/issue-AI-ROUTE-HELD-LINKAGE-01-link-final-judgement-failure-to-proposal-state.md')
          c = child.read_text(encoding='utf-8')
          c = c.replace('- Status: In Progress', '- Status: Done', 1)
          c = c.replace('- [ ] model-governance / routing上、eligible final-judgement modelを解決できないfailureを、同じ明示link / system-held契約へ接続する。— R3。現行final-judgement routeは `_assert_model_allowed` を通らないため未実装。', '- [x] model-governance / routing上、eligible final-judgement modelを解決できないfailureを、同じ明示link / system-held契約へ接続する。— R3: linked flowのみtenant registry gateを通し、`model_not_allowed` / `model_not_registered` / `model_provider_unavailable` をprovider dispatch前にsystem heldへ接続。')
          c = c.replace('- [ ] R3のmodel-governance / routing failure integration evidenceを追加する。', '- [x] R3のmodel-governance / routing failure integration evidenceを追加する。— `test_final_judgement_model_governance.py` で3 governance failure、registered provider pinning、standalone互換、detect route、非対象HTTP errorを固定。')
          c = c.replace('- [ ] `AI-ROUTE-01` MMR-06はR2 + R3のintegration evidenceとcloseout同期が揃うまで未完了のままとする。', '- [x] `AI-ROUTE-01` MMR-06をR2 + R3 integration evidenceと同期してcloseoutする。')
          c += '''\n\n## R3 実装履歴（2026-09-06）\n\n- explicit `externalProposalRef` を持つfinal-judgement flowだけtenant model registry / allowlist gateへ接続し、standalone `check_narrative` / `detect_contradiction` の既存provider pathは維持。\n- high-reasoning modelを `resolve_model_for_task()` で解決し、governance成功時は返された `RegisteredProviderConfig` を `LLMRequest.registered_provider` に固定してglobal provider/fallbackによるallowlist迂回を防止。\n- `model_not_allowed` / `model_not_registered` / `model_provider_unavailable` を「eligible final-judgement modelを利用できない」failure classとして列挙し、provider dispatch前にlinked `proposed` proposalをsystem `held` へ遷移。\n- system-hold共通経路をR2/R3で共有し、auditへ `sourceBundleHash` を追加。governance pre-dispatchでは存在しないprovider/traceを捏造せず、`model_id` + `execution_path=governance` + failure codeを記録。\n- `detect_contradiction` は既存human adjudicationの早期return後にgovernance gateを置き、LLM不要時の誤holdを防止。\n- R2/R3のintegration evidenceが揃ったため、本child issueと親 `AI-ROUTE-01` MMR-06をcloseout対象とする。\n'''
          child.write_text(c, encoding='utf-8')

          parent = Path('01_Plans/issues/issue-AI-ROUTE-01-multi-model-routing-and-final-judgment-boundary.md')
          p = parent.read_text(encoding='utf-8')
          p = re.sub(
              r'- \[ \] final_judgement 利用不能時に held へ遷移し、auto-publish しない（MMR-06）。.*',
              '- [x] final_judgement 利用不能時に held へ遷移し、auto-publish しない（MMR-06）。— `AI-ROUTE-HELD-LINKAGE-01` R1/R2/R3でexplicit proposal linkage、provider unavailable/timeout、tenant model-governance/registry不成立をsystem heldへ接続。standalone callはstate-neutralを維持。',
              p,
          )
          p = re.sub(
              r'- \[~\] integration test でルーティング・監査・安全停止が検証される。.*',
              '- [x] integration test でルーティング・監査・安全停止が検証される。— routing/audit既存統合に加え、`test_final_judgement_system_hold.py` と `test_final_judgement_model_governance.py` でMMR-06のruntime/providerおよびgovernance pre-dispatch安全停止を固定。',
              p,
          )
          parent.write_text(p, encoding='utf-8')
          PY
      - name: Install backend and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest
      - name: Run R3 focused regression
        working-directory: 03_Implement/backend
        run: |
