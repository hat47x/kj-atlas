name: Temporary lane C DOMAIN-W follow-up audit

on:
  push:
    branches:
      - audit/lane-c-stale-active-memos-20260904

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: audit/lane-c-stale-active-memos-20260904
      - name: Locate existing T9 and T10 follow-ups
        shell: bash
        run: |
          set -euo pipefail
          current='01_Plans/issues/issue-DOMAIN-W-ITERATION-01-w-type-cumulative-inquiry-support.md'
          echo '=== T9: Phase 3 / proposal-only / inquiry AI ==='
          git grep -n -E 'Phase 3|proposal-only|AI支援|実使用フィードバック' -- '01_Plans/issues/*.md' '01_Plans/issues/done/*.md' | grep -v -F "$current" || true
          echo '=== T10: persistent tab / menu placement / Claude Design ==='
          git grep -n -E '常設タブ|メニュー配置|Claude Design|P29確定6分類' -- '01_Plans/issues/*.md' '01_Plans/issues/done/*.md' | grep -v -F "$current" || true
          echo '=== inquiry-related issue filenames ==='
          find 01_Plans/issues -maxdepth 2 -type f -name 'issue-*.md' | grep -Ei 'INQUIRY|DOMAIN-W|AI.*INQUIRY|UX.*INQUIRY' | sort || true
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-domain-w-followup-audit-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove lane C DOMAIN-W follow-up audit workflow'
          git push origin HEAD:audit/lane-c-stale-active-memos-20260904
