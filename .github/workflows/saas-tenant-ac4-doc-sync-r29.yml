name: SAAS-TENANT AC4 evidence sync R29

on:
  push:
    branches:
      - docs/saas-tenant-ac4-evidence-sync-20260905
    paths:
      - .github/workflows/saas-tenant-ac4-doc-sync-r29.yml

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge current main in validation workspace
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Patch only AC-4 evidence line
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md')
          data = path.read_bytes()
          lines = data.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.startswith(b'- [~] AC-4:')]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one pending AC-4 line, found {len(matches)}')

          i = matches[0]
          old_line = lines[i]
          if old_line.endswith(b'\r\n'):
              ending = b'\r\n'
          elif old_line.endswith(b'\n'):
              ending = b'\n'
          else:
              ending = b''

          new_text = (
              '- [x] AC-4: SaaS profileでtenant不明・不一致、membership停止、adapter欠損、PDP不達をreadも含めてdenyする。'
              '— **2026-09-05完了確認**: `test_saas_e2e_tenant_isolation.py`で未知tenant・claim欠落・越境same-docIdをHTTP境界で拒否し、'
              '`test_session_context_routes.py`でmembership停止・membership差替え・capability resolver欠損をfail-closedにしている。'
              '加えてPR #2909の`test_saas_document_read_pdp_outage.py`が、server-resolved SaaS tenant sessionから実際のDocument GETを通し、'
              '`ExternalPolicyAccessControlAdapter`のtransport `URLError`を403 `policy_ref_unreachable`としてfail-closedにし、'
              'deny応答にDocument title/card bodyが含まれないことを固定した。これにより、tenant不明・不一致、membership停止、adapter欠損、PDP不達をreadを含めてdenyする現行BFF境界の証拠が揃った。'
          )
          lines[i] = new_text.encode('utf-8') + ending
          path.write_bytes(b''.join(lines))
          PY

      - name: Verify narrow document diff
        run: |
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md"
          git diff --unified=0 -- 01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md
          python - <<'PY'
          from pathlib import Path
          text = Path('01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md').read_text(encoding='utf-8')
          assert text.count('- [x] AC-4:') == 1
          assert '- [~] AC-4:' not in text
          assert 'PR #2909' in text
          assert '- [ ] AC-10:' in text
          assert '- [ ] AC-12:' in text
          assert '- Status: In Progress' in text
          PY

      - name: Documentation checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/issues/validate_active_issue_memos.py

      - name: Diff checks
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          git -c core.whitespace=cr-at-eol diff --cached --check

      - name: Persist AC-4 sync and retire one-shot workflow
        if: success()
        run: |
          git merge --abort || true
          git add 01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md
          git rm .github/workflows/saas-tenant-ac4-doc-sync-r29.yml
          git commit -m 'docs: SAAS-TENANT-01 AC-4の完了証拠を同期する'
          git push origin HEAD:${GITHUB_REF_NAME}
