name: Lane C sync SaaS AC13 once

on:
  push:
    branches:
      - docs/lane-c-close-saas-tenant-e2e-instrumentation-20260905

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: "github.event.head_commit.message == 'chore: SaaS AC-13台帳同期workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: AC-13の旧計装待ち文言を同期する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md')
          body = path.read_text(encoding='utf-8')
          pattern = re.compile(r'^- \[~\] AC-13:.*$', re.M)
          matches = pattern.findall(body)
          if len(matches) != 1:
              raise SystemExit(f'AC-13 expected one match, got {len(matches)}')
          replacement = "- [~] AC-13: 同じ認証セッションの複数タブ、同時tenant切替、bfcache復帰、遅延responseで古い`tenantSessionVersion`を持つGET/PUT/export/import/Admin更新がresource lookup前に拒否され、client通知が欠落しても新tenantへ自動再送・commitされない。— **2026-09-05再監査**: `require_current_tenant_session_version` / request preconditionに加え、frontendはcross-tab、bfcache、online、長時間hiddenからのresumeで旧scopeをinvalidateする。`tenant_session_multitab.spec.ts`はcross-tab切替後の旧DOM破棄、BroadcastChannelなしのstale PUT 409・非再送、遅延旧tenant response破棄、bundle export cancel、遅延review-pack破棄、390px日本語bfcache復帰blockを固定済み。さらにPR #2917でAI stale-resultのshared generation guard発火も実ブラウザ＋mutation proofで機構固有に確認済みである。残る実backendを含む縦断matrixは`issue-QA-E2E-SAAS-01-tenant-session-coverage-gap.md`へ委譲し、generation guard計装の完了記録は`01_Plans/issues/done/issue-SAAS-TENANT-E2E-01-ai-mutation-guard-instrumentation-gap.md`を正本とするため、本ACは部分のまま維持する。"
          path.write_text(pattern.sub(replacement, body, count=1), encoding='utf-8')
          PY
      - name: Planning validation
        shell: bash
        run: |
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format json
      - name: Stale merge reintroduction check
        run: python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong
      - name: Diff check
        run: git diff --check
      - name: 検証済み同期をbranchへ記録する
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add 01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md
          git commit -m 'docs: SaaS AC-13の残課題境界を現行証拠へ同期する'
          git push origin HEAD
