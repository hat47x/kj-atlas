name: Lane B2 audit SafeMode event scope audit once

on:
  push:
    branches:
      - audit/lane-b2-audit-safemode-event-scope-20260907

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enumerate production AuditEvent safe_mode expressions
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('03_Implement/backend/src/kj_atlas_api')
          for path in sorted(root.rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call):
                      continue
                  fn = node.func
                  if not (isinstance(fn, ast.Name) and fn.id == 'build_event'):
                      continue
                  safe = next((kw.value for kw in node.keywords if kw.arg == 'safe_mode'), None)
                  event = next((kw.value for kw in node.keywords if kw.arg == 'event_type'), None)
                  if safe is None:
                      continue
                  safe_src = ast.get_source_segment(text, safe)
                  event_src = ast.get_source_segment(text, event) if event is not None else '<none>'
                  print(f'{path}:{node.lineno}: event_type={event_src} safe_mode={safe_src}')
          PY
      - name: Retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-audit-safemode-event-scope-audit-once.yml
          git commit -m "ci(b2): retire audit SafeMode event scope audit"
          git push
