name: Lane B2 Compose API base boundary once

on:
  push:
    branches:
      - fix/lane-b2-compose-api-base-fixed-20260906

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pin standard Compose to the Nginx API path
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              old_bytes = old.encode('utf-8')
              new_bytes = new.encode('utf-8')
              count = data.count(old_bytes)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_bytes(data.replace(old_bytes, new_bytes, 1))

          replace_once(
              '03_Implement/deploy/docker-compose.yml',
              '        KJ_ATLAS_FRONTEND_API_BASE: ${KJ_ATLAS_FRONTEND_API_BASE:-/api}',
              '        KJ_ATLAS_FRONTEND_API_BASE: /api',
          )

          replace_once(
              '02_Architecture/runtime_parameter_registry.md',
              '| `KJ_ATLAS_FRONTEND_API_BASE` | `/api` | frontend build 時に埋め込む same-origin API base path。`/` 自体または単一の `/` で始まる path を受理する。`//host` のような network-path reference、backslash、query、fragment、相対 path は受理せず `/api` にフォールバック |',
              '| `KJ_ATLAS_FRONTEND_API_BASE` | `/api` | frontend build 時に埋め込む same-origin API base path。標準 Compose は同梱 Nginx の固定 `location /api/` と一致させるため `/api` を固定注入し、host 側のこの値では変更しない。直接 frontend build / 独自 reverse proxy では `/` 自体または単一の `/` で始まる path を受理する。`//host`、backslash、query、fragment、相対 path は `/api` にフォールバック |',
          )

          replace_once(
              '04_Documentation/configuration.md',
              'ローカル開発サーバーと Docker Compose の標準構成では `/api` が backend へ proxy されるため、通常は変更不要です。',
              'ローカル開発サーバーと Docker Compose の標準構成では `/api` が backend へ proxy されます。標準 Compose は同梱 Nginx の `location /api/` と一致させるため frontend build に `/api` を固定注入し、host 側で `KJ_ATLAS_FRONTEND_API_BASE` を変更しても標準 Compose の API base は変更しません。別 path を使う場合は frontend を直接 build し、その path を backend へ配送する reverse proxy も同時に構成してください。',
          )
          PY

      - name: Verify focused Compose API-base contract
        run: python 01_Plans/tests/test_compose_frontend_api_base_contract.py

      - name: Verify host override cannot drift standard Compose from Nginx
        run: |
          KJ_ATLAS_FRONTEND_API_BASE=/custom \
            docker compose -f 03_Implement/deploy/docker-compose.yml config \
            | grep -F 'KJ_ATLAS_FRONTEND_API_BASE: /api'

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify docs contracts
        run: python 01_Plans/docs_check.py

      - name: Verify diff hygiene
        run: git -c core.whitespace=cr-at-eol diff --check

      - name: Commit patch and retire one-shot workflow
        env:
          BRANCH: fix/lane-b2-compose-api-base-fixed-20260906
        run: |
          rm .github/workflows/lane-b2-compose-api-base-fixed-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            03_Implement/deploy/docker-compose.yml \
            02_Architecture/runtime_parameter_registry.md \
            04_Documentation/configuration.md \
            .github/workflows/lane-b2-compose-api-base-fixed-once.yml
          git commit -m 'fix(deploy): 標準ComposeのAPI baseを/apiに固定する'
          git push origin HEAD:"$BRANCH"
