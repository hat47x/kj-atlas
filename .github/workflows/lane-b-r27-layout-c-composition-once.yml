name: lane-b-r27-layout-c-composition-once

on:
  push:
    branches:
      - lane-b/layout-c-composition-characterization

permissions:
  contents: write

jobs:
  test-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/layout-c-composition-characterization

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run composition characterization
        working-directory: 03_Implement/backend
        run: python scripts/measure_ai_layout_hierarchical_composition.py

      - name: Run focused regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_layout_hierarchical_composition.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_projection_candidates.py

      - name: Lint and hygiene
        run: |
          cd 03_Implement/backend
          python -m ruff check \
            scripts/measure_ai_layout_hierarchical_composition.py \
            tests/test_ai_layout_hierarchical_composition.py
          cd ../..
          git diff --check

      - name: Remove workflow after successful verification
        run: |
          rm .github/workflows/lane-b-r27-layout-c-composition-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci(lane-b): remove R27 one-shot workflow'
          git push origin HEAD:lane-b/layout-c-composition-characterization
