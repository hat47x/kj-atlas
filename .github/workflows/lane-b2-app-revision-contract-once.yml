name: Lane B2 app revision canonical contract once

on:
  push:
    branches:
      - fix/lane-b2-app-revision-canonical-contract-20260906

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Align backend and frontend revision semantics
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              eol = '\r\n' if b'\r\n' in data else '\n'
              old_bytes = old.replace('\n', eol).encode('utf-8')
              new_bytes = new.replace('\n', eol).encode('utf-8')
              count = data.count(old_bytes)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_bytes(data.replace(old_bytes, new_bytes, 1))

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/settings.py',
              '''_LLM_HOST_LABEL = re.compile(r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$")''',
              '''_LLM_HOST_LABEL = re.compile(r"^[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?$")\n_APP_REVISION_PATTERN = re.compile(r"^[A-Za-z0-9._-]{1,64}$")''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/settings.py',
              '''        self.runtime_profile = normalized_runtime_profile\n\n        _validate_canonical_bearer(''',
              '''        self.runtime_profile = normalized_runtime_profile\n\n        # OPS-OBSERV-01: frontend diagnostic bundles already treat app revision\n        # as a canonical, non-secret identifier. Normalize at the public setting\n        # boundary so /version and every downstream observability surface see\n        # exactly the same value instead of disagreeing on malformed input.\n        if not _APP_REVISION_PATTERN.fullmatch(self.app_revision):\n            self.app_revision = "unknown"\n\n        _validate_canonical_bearer(''',
          )

          replace_once(
              '03_Implement/frontend/src/export/diagnostics_bundle.ts',
              '''const APP_REVISION_PATTERN = /^[A-Za-z0-9._-]{1,64}$/;\n\nfunction normalizeAppRevision(value: string | undefined): string {\n  if (value && APP_REVISION_PATTERN.test(value)) {''',
              '''const APP_REVISION_PATTERN = /^[A-Za-z0-9._-]{1,64}$/;\nconst APP_REVISION_LINE_TERMINATOR_PATTERN = /[\\r\\n\\u2028\\u2029]/;\n\nfunction normalizeAppRevision(value: string | undefined): string {\n  // JavaScript `$` may match immediately before a final line terminator.\n  // Reject those explicitly so this has the same whole-string semantics as\n  // Python re.fullmatch() at the backend settings boundary.\n  if (\n    value\n    && !APP_REVISION_LINE_TERMINATOR_PATTERN.test(value)\n    && APP_REVISION_PATTERN.test(value)\n  ) {''',
          )

          replace_once(
              '02_Architecture/runtime_parameter_registry.md',
              '| `KJ_ATLAS_APP_REVISION` | `unknown` | OPS-OBSERV-01: 稼働中のビルド識別子。backend は `GET /version` で返し、frontend は診断バンドルの `app.revision` に載せる。frontend へは build ARG として渡す（`vite.config.ts` の `envPrefix` 経由）ため、ビルド時に確定する | direct / base Compose | 通常値 | `GET /version` の `revision` が設定値を返すこと、診断バンドルが `unknown` でないことを確認する |',
              '| `KJ_ATLAS_APP_REVISION` | `unknown` | OPS-OBSERV-01: 稼働中のcanonicalビルド識別子。1〜64文字のASCII `A-Za-z0-9._-` のみ受理し、それ以外（空文字、前後空白、slash、記号、改行、65文字以上）は `unknown` に丸める。backend は `GET /version` で返し、frontend は同じ規則で診断バンドルの `app.revision` に載せる。frontend へは build ARG として渡す（`vite.config.ts` の `envPrefix` 経由）ため、ビルド時に確定する | direct / base Compose | 通常値 | canonical値では `GET /version.revision` と診断バンドル `app.revision` が同値になること、不正値では双方が `unknown` になることを確認する |',
          )

          replace_once(
              '04_Documentation/configuration.md',
              '| `KJ_ATLAS_APP_REVISION` | `unknown` | ビルドリビジョン（OPS-OBSERV-01）。`/version` と構造化ログ、frontend 診断バンドルの `app.revision` に反映。Compose では build-arg + `api.environment` から配線 |',
              '| `KJ_ATLAS_APP_REVISION` | `unknown` | ビルドリビジョン（OPS-OBSERV-01）。1〜64文字のASCII英数字・`.`・`_`・`-`だけをcanonical値として受理し、それ以外は`unknown`へ丸める。`/version` と構造化ログ、frontend 診断バンドルの `app.revision` に反映。Compose では build-arg + `api.environment` から配線 |',
          )
          PY

      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test]'

      - name: Verify backend revision contract
        working-directory: 03_Implement/backend
        run: pytest -q tests/test_app_revision_contract.py tests/test_observability.py -k 'app_revision or version_reports'

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Verify frontend revision contract
        working-directory: 03_Implement/frontend
        run: npm test -- src/export/app_revision_contract.test.ts src/export/diagnostics_bundle.test.ts

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify docs contracts
        run: python 01_Plans/docs_check.py

      - name: Verify diff hygiene
        run: git -c core.whitespace=cr-at-eol diff --check

      - name: Commit patch and retire one-shot workflow
        env:
          BRANCH: fix/lane-b2-app-revision-canonical-contract-20260906
        run: |
          rm .github/workflows/lane-b2-app-revision-contract-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            02_Architecture/runtime_parameter_registry.md \
            03_Implement/backend/src/kj_atlas_api/settings.py \
            03_Implement/frontend/src/export/diagnostics_bundle.ts \
            04_Documentation/configuration.md \
            .github/workflows/lane-b2-app-revision-contract-once.yml
          git commit -m 'fix(observability): app revisionのcanonical意味を揃える'
          git push origin HEAD:"$BRANCH"
