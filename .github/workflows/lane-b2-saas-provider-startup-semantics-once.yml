name: Lane B2 SaaS provider startup semantics once

on:
  push:
    branches:
      - fix/lane-b2-saas-provider-startup-semantics-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch registry and add focused contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('02_Architecture/runtime_parameter_registry.md')
          raw = path.read_bytes()
          replacements = {
              '`TrustedSaasRuntimePolicy.validate()` と lifespan preflight がstartup hard gateを検証し、active IdP の存在もDB初期化後に検査する。これらはprocess startup hard gateではない。login開始用2項目の欠損は`/session/login`を503、callback用4項目の欠損は`/session/callback`を503でfail-closedする。':
              '`TrustedSaasRuntimePolicy.validate()` と lifespan preflight がstartup hard gateを検証する。active IdP の存在はDB初期化後に診断するが、0件でもprocess startupは拒否せずwarningを出す。control-plane credentialで最初のproviderを登録でき、登録までは認証requestが失敗する。login開始用2項目の欠損は`/session/login`を503、callback用4項目の欠損は`/session/callback`を503でfail-closedする。',
              '   - 起動前preflightとprovider存在検査を通過できる。1つでも欠ける場合はfail-fastし、single-tenant profileへfallbackしない。':
              '   - 起動前preflightのhard gateを通過できる。hard gateが1つでも欠ける場合はfail-fastし、single-tenant profileへfallbackしない。active IdP存在検査はpost-DB-initのwarning診断であり、provider 0件自体はstartup拒否条件ではない。',
          }
          for old, new in replacements.items():
              old_b = old.encode('utf-8')
              if raw.count(old_b) != 1:
                  raise SystemExit(f'expected one registry target, got {raw.count(old_b)}')
              raw = raw.replace(old_b, new.encode('utf-8'))
          path.write_bytes(raw)
          PY

          cat > 01_Plans/tests/test_saas_provider_startup_semantics_contract.py <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[2]
          MAIN = ROOT / '03_Implement/backend/src/kj_atlas_api/main.py'
          RUNTIME = ROOT / '03_Implement/backend/src/kj_atlas_api/trusted_saas_runtime.py'
          REGISTRY = ROOT / '02_Architecture/runtime_parameter_registry.md'

          class SaasProviderStartupSemanticsContractTest(unittest.TestCase):
              def test_provider_check_is_post_db_and_non_throwing_diagnostic(self) -> None:
                  main = MAIN.read_text(encoding='utf-8')
                  self.assertLess(main.index('init_db()'), main.index('validate_saas_providers_exist()'))
                  runtime_source = RUNTIME.read_text(encoding='utf-8')
                  tree = ast.parse(runtime_source)
                  fn = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == 'validate_saas_providers_exist')
                  self.assertNotIn(ast.Raise, {type(node) for node in ast.walk(fn)})
                  doc = ' '.join((ast.get_docstring(fn) or '').split())
                  self.assertIn('warning rather than blocking startup', doc)
                  source = ast.get_source_segment(runtime_source, fn) or ''
                  self.assertIn('logger.warning(', source)
                  self.assertIn('POST /admin/provision/identity-providers', source)

              def test_registry_distinguishes_hard_gate_from_provider_diagnostic(self) -> None:
                  registry = REGISTRY.read_text(encoding='utf-8')
                  self.assertNotIn('起動前preflightとprovider存在検査を通過できる。1つでも欠ける場合はfail-fast', registry)
                  self.assertIn('active IdP存在検査はpost-DB-initのwarning診断', registry)
                  self.assertIn('provider 0件自体はstartup拒否条件ではない', registry)
                  self.assertIn('0件でもprocess startupは拒否せずwarningを出す', registry)
                  self.assertIn('最初のproviderを登録でき', registry)

          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans.tests.test_saas_provider_startup_semantics_contract -v
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          changed="$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u )"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 2
          printf '%s\n' "$changed" | grep -Fx '01_Plans/tests/test_saas_provider_startup_semantics_contract.py'
          printf '%s\n' "$changed" | grep -Fx '02_Architecture/runtime_parameter_registry.md'
      - name: Commit verified payload and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_Plans/tests/test_saas_provider_startup_semantics_contract.py 02_Architecture/runtime_parameter_registry.md
          git rm .github/workflows/lane-b2-saas-provider-startup-semantics-once.yml
          git commit -m 'docs(saas): provider存在確認をwarning診断へ同期する'
          git push origin HEAD:fix/lane-b2-saas-provider-startup-semantics-20260907
