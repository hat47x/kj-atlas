name: OPS SaaS operations diff normalize once

on:
  push:
    branches:
      - test/ops-saas-two-app-postgres-20260904

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ops-saas-two-app-postgres-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 最新mainを取得する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git show origin/main:04_Documentation/operations.md > /tmp/operations-main.md
      - name: mainの改行を保ったままSaaS節だけ差し替える
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("04_Documentation/operations.md")
          branch = path.read_bytes().decode("utf-8")
          start_marker = "### SaaSの複数API instance構成"
          end_marker = "\n## 起動"
          start = branch.index(start_marker)
          end = branch.index(end_marker, start)
          desired = branch[start:end]

          raw_main = Path("/tmp/operations-main.md").read_bytes()
          newline = "\r\n" if b"\r\n" in raw_main else "\n"
          main = raw_main.decode("utf-8")
          old_start = main.index("### SaaSの複数プロセス構成")
          old_end_marker = newline + "## 起動"
          old_end = main.index(old_end_marker, old_start)
          desired = newline.join(desired.splitlines())
          path.write_bytes((main[:old_start] + desired + main[old_end:]).encode("utf-8"))
          PY
      - name: 差分と文書契約を再検証する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          git -c core.whitespace=cr-at-eol diff --check
          git diff --numstat origin/main -- 04_Documentation/operations.md
      - name: 一時workflowを削除して保存する
        run: |
          rm -f .github/workflows/ops-saas-normalize-operations-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'docs: operationsの既存改行を保持する'
          git push origin HEAD:test/ops-saas-two-app-postgres-20260904
