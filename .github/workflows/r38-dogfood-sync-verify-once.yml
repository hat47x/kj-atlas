name: R38 dogfood sync and verify once

on:
  push:
    branches:
      - dogfood/r38-acceptance-invariant-fixture-harness-20260907

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: R38を継続dogfood索引へ同期する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          anchor = '- `ai-ir-required-semantic-coverage-map-2026-09-03.md`'
          block = '''- `cognitive-dogfood-continuous-2026-09-07-r38.md`
            - R38。PR #3054で、clean DBの固定seed依存による受入false negativeと、frontend subtreeだけをtemporary copyしてrepository-relative fixtureを失ったharness偽失敗を分析し、acceptance invariantとfixture / setup / harness前提を分離した記録。
          - `doc_kj_atlas_dogfood_r38.json`
            - R38のKJキャンバス。testが必要な最小状態を自ら構成してcontract上の不変条件を観測し、harnessは意味上必要なdependency closure / repository topologyを保持する一方、shared fixtureやtemporary directory自体は一律禁止しない構造を保持する。
          '''
          if '- `cognitive-dogfood-continuous-2026-09-07-r38.md`' not in text:
              if anchor not in text:
                  raise SystemExit('R38 index insertion anchor not found')
              text = text.replace(anchor, block + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Docs check
        run: python 01_Plans/docs_check.py

      - name: Working-tree hygiene
        shell: bash
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          lines = subprocess.check_output(['git', 'status', '--short'], text=True).splitlines()
          allowed = {'01_Plans/dogfood/cognitive-dogfood-index.md'}
          unexpected = [line for line in lines if line[3:] not in allowed]
          if unexpected:
              raise SystemExit('unexpected working-tree changes:\n' + '\n'.join(unexpected))
          PY

      - name: 検証済みR38をbranchへ記録しone-shotを退役する
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/r38-dogfood-sync-verify-once.yml
          git add 01_Plans/dogfood/cognitive-dogfood-index.md .github/workflows/r38-dogfood-sync-verify-once.yml
          git commit -m 'dogfood: sync R38 index and retire verifier'
          git push origin HEAD:dogfood/r38-acceptance-invariant-fixture-harness-20260907
