name: lane-b-provider-token-b-once

on:
  push:
    branches:
      - lane-b/provider-token-b-comparison

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-token-b-comparison

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extend provider token measurement comparisons
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          candidate_path = "03_Implement/backend/scripts/measure_ai_route_projection_candidates.py"
          replace_once(
              candidate_path,
              "from scripts.measure_ai_route_prompt_coverage import representative_document\n",
              '''try:\n    from scripts.measure_ai_route_prompt_coverage import representative_document\nexcept ModuleNotFoundError as exc:\n    if exc.name != "scripts":\n        raise\n    from measure_ai_route_prompt_coverage import representative_document\n''',
          )

          token_path = "03_Implement/backend/scripts/measure_ai_route_provider_tokens.py"
          replace_once(
              token_path,
              "from kj_atlas_api.models_ai import CheckNarrativeRequest, GenerateNarrativeRequest\n",
              "from kj_atlas_api.models_ai import (\n    CheckNarrativeRequest,\n    GenerateNarrativeRequest,\n    SuggestCardGroupsRequest,\n)\n",
          )
          replace_once(
              token_path,
              '''from kj_atlas_api.routes.ai import (\n    _build_generate_narrative_prompt,\n    _build_narrative_check_prompt,\n    _build_prompt,\n    _generate_narrative_ir,\n    _suggest_layout_ir,\n)\n''',
              '''from kj_atlas_api.routes.ai import (\n    _build_generate_narrative_prompt,\n    _build_narrative_check_prompt,\n    _build_prompt,\n    _build_suggest_card_groups_prompt,\n    _card_group_candidates,\n    _generate_narrative_ir,\n    _suggest_card_groups_ir,\n    _suggest_layout_ir,\n)\n''',
          )
          replace_once(
              token_path,
              '''try:\n    from scripts.measure_ai_route_prompt_coverage import representative_document\nexcept ModuleNotFoundError as exc:\n    if exc.name != "scripts":\n        raise\n    from measure_ai_route_prompt_coverage import representative_document\n\nOPT_IN_ENV = "KJ_ATLAS_TOKEN_MEASUREMENT_OPT_IN"\n''',
              '''try:\n    from scripts.measure_ai_route_prompt_coverage import representative_document\n    from scripts.measure_ai_route_projection_candidates import (\n        _groups_candidate_context,\n        _late_layout_document,\n        _layout_candidate_context,\n    )\nexcept ModuleNotFoundError as exc:\n    if exc.name != "scripts":\n        raise\n    from measure_ai_route_prompt_coverage import representative_document\n    from measure_ai_route_projection_candidates import (\n        _groups_candidate_context,\n        _late_layout_document,\n        _layout_candidate_context,\n    )\n\nOPT_IN_ENV = "KJ_ATLAS_TOKEN_MEASUREMENT_OPT_IN"\n''',
          )

          token_file = Path(token_path)
          text = token_file.read_text(encoding="utf-8")
          start = text.index("def build_representative_requests(model: str) -> dict[str, LLMRequest]:")
          end = text.index("\n\ndef _route_row", start)
          new_function = '''def build_representative_requests(model: str) -> dict[str, LLMRequest]:\n    """同じ代表規模でcurrent投影・route-B候補・全量routeを比較する。\n\n    R23のmeasurement-only B候補をここでも同じbuilderから生成し、認証情報が\n    利用可能になった時点でcurrent/Bを同じnamed provider/modelへ送れるようにする。\n    production routeやshared IR上限は変更しない。\n    """\n    base_doc = representative_document(include_evidence=False)\n\n    groups_doc = representative_document(include_evidence=False)\n    next(card for card in groups_doc["cards"] if card["id"] == "c298")["holdState"] = "held"\n    groups_payload = SuggestCardGroupsRequest.model_validate(\n        {\n            "doc": groups_doc,\n            "cards": [\n                {\n                    "id": card["id"],\n                    "text": card["text"],\n                    "textReviewed": True,\n                }\n                for card in groups_doc["cards"]\n            ],\n        }\n    )\n    groups_ir = _suggest_card_groups_ir(groups_payload)\n    groups_candidate_ids, _ = _card_group_candidates(groups_payload, groups_ir)\n    groups_prompt = _build_suggest_card_groups_prompt(\n        groups_payload, groups_ir, groups_candidate_ids\n    )\n    groups_b_context = _groups_candidate_context(groups_payload)\n    groups_b_candidate_ids, _ = _card_group_candidates(groups_payload, groups_b_context)\n    groups_b_prompt = _build_suggest_card_groups_prompt(\n        groups_payload, groups_b_context, groups_b_candidate_ids\n    )\n\n    layout_doc = _late_layout_document()\n    layout_payload = SuggestLayoutRequest.model_validate({"doc": layout_doc})\n    layout_ir = _suggest_layout_ir(layout_payload)\n    layout_prompt = _build_prompt(layout_payload, layout_ir)\n    layout_b_context = _layout_candidate_context(layout_payload)\n    layout_b_prompt = _build_prompt(layout_payload, layout_b_context)\n\n    narrative_payload = GenerateNarrativeRequest.model_validate({"doc": base_doc})\n    narrative_ir = _generate_narrative_ir(narrative_payload)\n    narrative_prompt = _build_generate_narrative_prompt(narrative_payload, narrative_ir)\n\n    check_payload = CheckNarrativeRequest.model_validate(\n        {\n            "doc": base_doc,\n            "narrativeText": _representative_check_narrative_text(base_doc),\n        }\n    )\n    check_prompt = _build_narrative_check_prompt(check_payload)\n\n    return {\n        "suggest-card-groups": LLMRequest(\n            task="suggest_card_groups",\n            prompt=groups_prompt,\n            inputs=groups_ir,\n            temperature=0.0,\n            max_tokens=1,\n            model=model,\n        ),\n        "suggest-card-groups-route-b": LLMRequest(\n            task="suggest_card_groups",\n            prompt=groups_b_prompt,\n            # Measurement-only R23 candidate context. Provider transports ignore\n            # inputs and send prompt only; carrying it here keeps diagnostics paired.\n            inputs=groups_b_context,\n            temperature=0.0,\n            max_tokens=1,\n            model=model,\n        ),\n        "suggest-layout": LLMRequest(\n            task="re_layout",\n            prompt=layout_prompt,\n            inputs=layout_ir,\n            temperature=0.0,\n            max_tokens=1,\n            model=model,\n        ),\n        "suggest-layout-route-b": LLMRequest(\n            task="re_layout",\n            prompt=layout_b_prompt,\n            # Measurement-only R23 candidate context; not a production IR contract.\n            inputs=layout_b_context,\n            temperature=0.0,\n            max_tokens=1,\n            model=model,\n        ),\n        "generate-narrative": LLMRequest(\n            task="generate_narrative",\n            prompt=narrative_prompt,\n            inputs=narrative_ir,\n            temperature=0.0,\n            max_tokens=1,\n            model=model,\n        ),\n        "check-narrative": LLMRequest(\n            task="check_narrative",\n            prompt=check_prompt,\n            inputs=None,\n            temperature=0.0,\n            max_tokens=1,\n            model=model,\n        ),\n    }\n'''
          token_file.write_text(text[:start] + new_function + text[end:], encoding="utf-8")

          replace_once(
              token_path,
              'help="3つの代表ルートで共通して使用する正確なモデルID。",\n',
              'help="すべての比較対象で共通して使用する正確なモデルID。",\n',
          )

          test_path = Path("03_Implement/backend/tests/test_ai_route_provider_token_measurement.py")
          test_path.write_text('''from __future__ import annotations\n\nimport json\nimport subprocess\nimport sys\nfrom pathlib import Path\n\nimport pytest\n\nfrom kj_atlas_api.llm.provider import LLMCallMetadata, LLMRequest, LLMResponse\nfrom scripts import measure_ai_route_provider_tokens as token_measure\n\n\nEXPECTED_ROUTES = {\n    "suggest-card-groups",\n    "suggest-card-groups-route-b",\n    "suggest-layout",\n    "suggest-layout-route-b",\n    "generate-narrative",\n    "check-narrative",\n}\n\n\nclass _UsageProvider:\n    provider_name = "named-test-provider"\n    provider_kind = "deepseek"\n\n    def __init__(self, *, report_usage: bool = True) -> None:\n        self.report_usage = report_usage\n        self.calls: list[LLMRequest] = []\n\n    def generate(self, req: LLMRequest) -> LLMResponse:\n        self.calls.append(req)\n        input_tokens = None\n        output_tokens = None\n        if self.report_usage:\n            # Fake provider-reported usage. The values are intentionally arbitrary\n            # and are not derived from bytes/chars; the test only proves that the\n            # measurement harness records each provider response under the right row.\n            input_tokens = (4000, 5000, 7000, 8000, 6000, 11000)[len(self.calls) - 1]\n            output_tokens = 1\n        return LLMResponse(\n            raw_text="{}",\n            metadata=LLMCallMetadata(\n                provider_kind=self.provider_kind,\n                provider_name=self.provider_name,\n                model_id=req.model or "unknown",\n                transport="http",\n                requested_at="2026-09-05T00:00:00+00:00",\n                trace_id=f"trace-{len(self.calls)}",\n            ),\n            input_tokens=input_tokens,\n            output_tokens=output_tokens,\n        )\n\n\ndef test_representative_requests_compare_current_b_and_full_routes() -> None:\n    requests = token_measure.build_representative_requests("named-model")\n\n    assert set(requests) == EXPECTED_ROUTES\n    groups = requests["suggest-card-groups"]\n    groups_b = requests["suggest-card-groups-route-b"]\n    layout = requests["suggest-layout"]\n    layout_b = requests["suggest-layout-route-b"]\n    narrative = requests["generate-narrative"]\n    check = requests["check-narrative"]\n\n    assert groups.task == groups_b.task == "suggest_card_groups"\n    assert layout.task == layout_b.task == "re_layout"\n    assert narrative.task == "generate_narrative"\n    assert check.task == "check_narrative"\n    assert {req.model for req in requests.values()} == {"named-model"}\n    assert {req.max_tokens for req in requests.values()} == {1}\n\n    # R23 current/B pairs use the same 300-card scenarios. The B candidate\n    # restores route-required coverage without changing production caps.\n    assert len((groups.inputs or {}).get("cards", [])) == 200\n    assert len((groups_b.inputs or {}).get("cards", [])) == 300\n    assert (groups.inputs or {})["truncation"]["reason_codes"] == ["MAX_CARDS"]\n    assert (groups_b.inputs or {})["truncation"] == {\n        "truncated": False,\n        "reason_codes": [],\n    }\n    assert len((layout.inputs or {}).get("coordinates", [])) == 200\n    assert len((layout_b.inputs or {}).get("coordinates", [])) == 300\n    assert len((layout.inputs or {}).get("relations", [])) == 199\n    assert len((layout_b.inputs or {}).get("relations", [])) == 300\n\n    # Pin R23 dry-run diagnostics so the later provider run compares exactly the\n    # candidate prompts that were structurally characterized. These are NOT tokens.\n    assert len(groups.prompt.encode("utf-8")) == 38044\n    assert len(groups_b.prompt.encode("utf-8")) == 48791\n    assert len(layout.prompt.encode("utf-8")) == 117389\n    assert len(layout_b.prompt.encode("utf-8")) == 128562\n\n    # Existing whole-document comparison routes remain present.\n    assert "coordinates" not in (narrative.inputs or {})\n    assert check.inputs is None\n    assert 'id="c299"' in check.prompt\n    assert 'id="i29"' in check.prompt\n\n\ndef test_dry_run_never_needs_a_provider_or_claims_exact_tokens() -> None:\n    report = token_measure.measure(\n        model="named-model",\n        expected_provider="named-test-provider",\n        execute=False,\n    )\n\n    assert report["executed"] is False\n    assert report["measurement_complete"] is False\n    assert set(report["routes"]) == EXPECTED_ROUTES\n    for row in report["routes"].values():\n        assert row["status"] == "dry-run"\n        assert row["provider_reported"]["input_tokens"] is None\n        assert row["prompt"]["utf8_bytes"] > 0\n    assert report["routes"]["check-narrative"]["ir"] == {\n        "cards": 0,\n        "relations": 0,\n        "islands": 0,\n        "coordinates": 0,\n        "truncation": None,\n    }\n\n\ndef test_documented_direct_cli_runs_as_a_dry_run_without_network_access() -> None:\n    backend_dir = Path(__file__).resolve().parents[1]\n    completed = subprocess.run(\n        [\n            sys.executable,\n            "scripts/measure_ai_route_provider_tokens.py",\n            "--provider",\n            "named-test-provider",\n            "--model",\n            "named-model",\n        ],\n        cwd=backend_dir,\n        check=True,\n        capture_output=True,\n        text=True,\n    )\n    report = json.loads(completed.stdout)\n\n    assert report["executed"] is False\n    assert report["measurement_complete"] is False\n    assert set(report["routes"]) == EXPECTED_ROUTES\n    assert report["routes"]["suggest-card-groups-route-b"]["status"] == "dry-run"\n    assert report["routes"]["suggest-layout-route-b"]["status"] == "dry-run"\n\n\ndef test_provider_reported_usage_is_recorded_per_comparison_without_estimation() -> None:\n    provider = _UsageProvider()\n    report = token_measure.measure(\n        model="named-model",\n        expected_provider=provider.provider_name,\n        execute=True,\n        provider=provider,\n    )\n\n    assert report["measurement_complete"] is True\n    assert len(provider.calls) == 6\n    expected_tokens = {\n        "suggest-card-groups": 4000,\n        "suggest-card-groups-route-b": 5000,\n        "suggest-layout": 7000,\n        "suggest-layout-route-b": 8000,\n        "generate-narrative": 6000,\n        "check-narrative": 11000,\n    }\n    for route, expected in expected_tokens.items():\n        assert report["routes"][route]["status"] == "measured"\n        assert report["routes"][route]["provider_reported"] == {\n            "input_tokens": expected,\n            "output_tokens": 1,\n        }\n\n\ndef test_missing_provider_usage_is_recorded_as_measurement_incomplete() -> None:\n    provider = _UsageProvider(report_usage=False)\n    report = token_measure.measure(\n        model="named-model",\n        expected_provider=provider.provider_name,\n        execute=True,\n        provider=provider,\n    )\n\n    assert report["measurement_complete"] is False\n    assert len(provider.calls) == 6\n    assert {row["status"] for row in report["routes"].values()} == {\n        "provider-did-not-report-usage"\n    }\n\n\ndef test_provider_name_mismatch_fails_before_any_request_is_sent() -> None:\n    provider = _UsageProvider()\n    with pytest.raises(ValueError, match="プロバイダー名と一致しません"):\n        token_measure.measure(\n            model="named-model",\n            expected_provider="different-provider",\n            execute=True,\n            provider=provider,\n        )\n    assert provider.calls == []\n\n\ndef test_external_execution_requires_explicit_environment_opt_in(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    monkeypatch.delenv(token_measure.OPT_IN_ENV, raising=False)\n    assert token_measure._opted_in() is False\n\n    monkeypatch.setenv(token_measure.OPT_IN_ENV, "true")\n    assert token_measure._opted_in() is True\n\n    monkeypatch.setenv(token_measure.OPT_IN_ENV, "0")\n    assert token_measure._opted_in() is False\n''', encoding="utf-8")
          PY

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Dry-run all current/B comparison prompts
        working-directory: 03_Implement/backend
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.measure_ai_route_provider_tokens \
            --provider named-test-provider \
            --model named-model | tee /tmp/provider-b-dry.json

      - name: Run token harness and R23 regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_required_meaning_scale.py

      - name: Record R24 dry-run comparison contract
        shell: bash
        run: |
          python - <<'PY'
          import json
          import textwrap
          from pathlib import Path

          report = json.loads(Path("/tmp/provider-b-dry.json").read_text(encoding="utf-8"))
          routes = report["routes"]
          issue = Path("01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md")
          text = issue.read_text(encoding="utf-8")
          marker = "## R24 — named provider実測をcurrent/B同一run比較へ拡張"
          if marker not in text:
              section = textwrap.dedent(f'''\n\n{marker}\n\nR23で方式B候補のcoverageを構造的に比較できたため、R20のprovider token計測ハーネスへ同じ候補promptを接続した。production routeやshared IR上限は変えず、認証情報が利用可能になった時点で**同じnamed provider/modelへの1回の計測run**からcurrent/B差をprovider-reported usageで直接比較できるようにする。\n\n| 比較対象 | UTF-8 bytes (dry-run) | provider-reported input tokens |\n| --- | ---: | ---: |\n| `suggest-card-groups` current | {routes['suggest-card-groups']['prompt']['utf8_bytes']:,} | 実測待ち |\n| `suggest-card-groups` route-B | {routes['suggest-card-groups-route-b']['prompt']['utf8_bytes']:,} | 実測待ち |\n| `suggest-layout` current | {routes['suggest-layout']['prompt']['utf8_bytes']:,} | 実測待ち |\n| `suggest-layout` route-B | {routes['suggest-layout-route-b']['prompt']['utf8_bytes']:,} | 実測待ち |\n| `generate-narrative` | {routes['generate-narrative']['prompt']['utf8_bytes']:,} | 実測待ち |\n| `check-narrative` | {routes['check-narrative']['prompt']['utf8_bytes']:,} | 実測待ち |\n\nこのbyte数は診断情報でありtoken推定には使わない。正確な入力token数として採用するのは従来どおりprovider自身が返したusageだけである。`--execute` と `KJ_ATLAS_TOKEN_MEASUREMENT_OPT_IN=1` の二重opt-in、provider/model一致確認、fallback禁止、usage非返却時の`measurement_complete=false`も変更しない。\n\nR24により、認証情報が設定された後の作業は「currentだけを測ってからB用ハーネスを追加する」のではなく、groups/layoutのcurrent/Bとnarrative/checkを同一model上で一度に観測するところから開始できる。A2/B/Cの採択自体は引き続き実測後に行う。\n''')
              issue.write_text(text + section, encoding="utf-8")
          PY

      - name: Lint and hygiene
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            scripts/measure_ai_route_provider_tokens.py \
            scripts/measure_ai_route_projection_candidates.py \
            tests/test_ai_route_provider_token_measurement.py
          cd ../..
          git diff --check

      - name: Commit tested slice and self-delete workflow
        shell: bash
        run: |
          rm .github/workflows/lane-b-provider-token-b-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md \
            03_Implement/backend/scripts/measure_ai_route_provider_tokens.py \
            03_Implement/backend/scripts/measure_ai_route_projection_candidates.py \
            03_Implement/backend/tests/test_ai_route_provider_token_measurement.py \
            .github/workflows/lane-b-provider-token-b-once.yml
          git commit -m "test(ai): compare route B prompts in provider token harness"
          git push origin HEAD:lane-b/provider-token-b-comparison
