name: lane-b-route-b-characterization-once

on:
  push:
    branches:
      - lane-b/route-b-projection-characterization

permissions:
  contents: write

jobs:
  characterize-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/route-b-projection-characterization

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add deterministic route-B characterization
        shell: bash
        run: |
          cat > 03_Implement/backend/scripts/measure_ai_route_projection_candidates.py <<'PY'
          #!/usr/bin/env python3
          """Compare current shared-IR prompts with route-specific B candidates.

          This is an AI-IR-SCALE-01 characterization only.  It does not change
          production routing, shared IR caps, or provider selection, and it never
          calls an LLM.  The candidate contexts deliberately retain only the
          route-required meaning identified in R19 so we can see whether a
          task-specific projection can restore 300-card coverage before choosing
          A2/B/C from provider-reported token measurements.
          """

          from __future__ import annotations

          import json
          from copy import deepcopy
          from typing import Any

          from kj_atlas_api.llm_input_ir import (
              _normalize_cards,
              _normalize_coordinates,
              _normalize_islands,
              _normalize_relations,
              source_from_document,
          )
          from kj_atlas_api.models import SuggestLayoutRequest
          from kj_atlas_api.models_ai import SuggestCardGroupsRequest
          from kj_atlas_api.routes.ai import (
              _build_prompt,
              _build_suggest_card_groups_prompt,
              _card_group_candidates,
              _suggest_card_groups_ir,
              _suggest_layout_ir,
          )
          from scripts.measure_ai_route_prompt_coverage import representative_document

          TAIL_A = "c298"
          TAIL_B = "c299"
          TAIL_ISLAND = "i29"


          def _prompt_size(prompt: str) -> dict[str, int]:
              return {
                  "unicode_chars": len(prompt),
                  "utf8_bytes": len(prompt.encode("utf-8")),
              }


          def _complete_island_memberships(doc: dict[str, Any], context: dict[str, Any]) -> int:
              source = {item["id"]: sorted(item["cardIds"]) for item in doc["islands"]}
              projected = {
                  item["id"]: sorted(item["card_ids"])
                  for item in context.get("islands", [])
              }
              return sum(projected.get(island_id) == members for island_id, members in source.items())


          def _groups_candidate_context(payload: SuggestCardGroupsRequest) -> dict[str, Any]:
              """Measurement-only compact context for R19's grouping-required meaning.

              Candidate text/hold state and confirmed island hierarchy are kept.
              Relations and derived clusters are intentionally omitted because R19
              classifies them as useful supplemental context, not completion criteria.
              The shape is only accepted by the existing deterministic renderer for
              measurement; it is not a new serialized IR contract.
              """
              assert payload.doc is not None
              source = source_from_document(payload.doc)
              requested_ids = {card.id for card in payload.cards}
              normalized_cards = _normalize_cards(source.cards)
              rows: list[dict[str, Any]] = []
              for card in normalized_cards:
                  if card.id not in requested_ids:
                      continue
                  row: dict[str, Any] = {"id": card.id, "text": card.text}
                  if card.hold_state is not None:
                      row["hold_state"] = card.hold_state
                  rows.append(row)
              islands = _normalize_islands(source.islands, requested_ids)
              return {
                  "cards": rows,
                  "islands": islands,
                  "relations": [],
                  "truncation": {"truncated": False, "reason_codes": []},
              }


          def _layout_candidate_context(payload: SuggestLayoutRequest) -> dict[str, Any]:
              """Measurement-only full structural context for layout.

              The existing layout prompt already carries every card id/text/raw x/y
              from DocumentV1.  The candidate therefore adds only the route-required
              structural dimensions that the shared 200-card IR currently truncates:
              normalized relative coordinates, typed card relations and confirmed
              island hierarchy.  No production contract is changed here.
              """
              source = source_from_document(payload.doc)
              normalized_cards = _normalize_cards(source.cards)
              card_ids = {card.id for card in normalized_cards}
              return {
                  "coordinates": _normalize_coordinates(normalized_cards),
                  "relations": _normalize_relations(source.relations, card_ids),
                  "islands": _normalize_islands(source.islands, card_ids),
                  "truncation": {"truncated": False, "reason_codes": []},
              }


          def _grouping_measurement() -> dict[str, Any]:
              doc = representative_document(include_evidence=False)
              next(item for item in doc["cards"] if item["id"] == TAIL_A)["holdState"] = "held"
              payload = SuggestCardGroupsRequest.model_validate(
                  {
                      "doc": doc,
                      "cards": [
                          {
                              "id": card["id"],
                              "text": card["text"],
                              "textReviewed": True,
                          }
                          for card in doc["cards"]
                      ],
                  }
              )

              current_ir = _suggest_card_groups_ir(payload)
              current_candidates, current_withheld = _card_group_candidates(payload, current_ir)
              current_prompt = _build_suggest_card_groups_prompt(
                  payload, current_ir, current_candidates
              )

              candidate_context = _groups_candidate_context(payload)
              candidate_ids, candidate_withheld = _card_group_candidates(
                  payload, candidate_context
              )
              candidate_prompt = _build_suggest_card_groups_prompt(
                  payload, candidate_context, candidate_ids
              )

              requested_count = len(payload.cards)
              return {
                  "source": {
                      "requested_cards": requested_count,
                      "held_requested_cards": 1,
                      "islands": len(doc["islands"]),
                  },
                  "current_shared_ir": {
                      "projected_requested_cards": sum(
                          item["id"] in {card.id for card in payload.cards}
                          for item in current_ir["cards"]
                      ),
                      "groupable_candidates": len(current_candidates),
                      "withheld_held_cards": len(current_withheld),
                      "requested_cards_accounted_for": len(current_candidates)
                      + len(current_withheld),
                      "complete_island_memberships": _complete_island_memberships(doc, current_ir),
                      "tail_island_members": len(
                          next(
                              item
                              for item in current_ir["islands"]
                              if item["id"] == TAIL_ISLAND
                          )["card_ids"]
                      ),
                      "prompt": _prompt_size(current_prompt),
                  },
                  "route_b_candidate": {
                      "projected_requested_cards": len(candidate_context["cards"]),
                      "groupable_candidates": len(candidate_ids),
                      "withheld_held_cards": len(candidate_withheld),
                      "requested_cards_accounted_for": len(candidate_ids)
                      + len(candidate_withheld),
                      "complete_island_memberships": _complete_island_memberships(
                          doc, candidate_context
                      ),
                      "tail_island_members": len(
                          next(
                              item
                              for item in candidate_context["islands"]
                              if item["id"] == TAIL_ISLAND
                          )["card_ids"]
                      ),
                      "prompt": _prompt_size(candidate_prompt),
                  },
              }


          def _late_layout_document() -> dict[str, Any]:
              doc = deepcopy(representative_document(include_evidence=False))
              for edge in doc["edges"]:
                  if edge["id"] == "e298":
                      edge["type"] = "causal"
                  elif edge["id"] == "e299":
                      edge["type"] = "negate"
              return doc


          def _layout_measurement() -> dict[str, Any]:
              doc = _late_layout_document()
              payload = SuggestLayoutRequest.model_validate({"doc": doc})
              current_ir = _suggest_layout_ir(payload)
              current_prompt = _build_prompt(payload, current_ir)
              candidate_context = _layout_candidate_context(payload)
              candidate_prompt = _build_prompt(payload, candidate_context)

              expected = {
                  (TAIL_A, TAIL_B, "causal"),
                  (TAIL_B, "c000", "negate"),
              }

              def metrics(context: dict[str, Any], prompt: str) -> dict[str, Any]:
                  coordinate_ids = {
                      item["card_id"] for item in context.get("coordinates", [])
                  }
                  relations = {
                      (item["from"], item["to"], item["type"])
                      for item in context.get("relations", [])
                  }
                  return {
                      "relative_coordinates": len(coordinate_ids),
                      "typed_card_relations": len(relations),
                      "complete_island_memberships": _complete_island_memberships(
                          doc, context
                      ),
                      "tail_coordinates_present": [
                          card_id
                          for card_id in (TAIL_A, TAIL_B)
                          if card_id in coordinate_ids
                      ],
                      "tail_required_relations_present": sorted(expected & relations),
                      "tail_causal_visible_in_prompt": (
                          f'card "{TAIL_A}" --causal--> card "{TAIL_B}"' in prompt
                      ),
                      "tail_negate_visible_in_prompt": (
                          'card "c299" --negate--> card "c000"' in prompt
                      ),
                      "prompt": _prompt_size(prompt),
                  }

              return {
                  "source": {
                      "cards": len(doc["cards"]),
                      "typed_card_relations": len(doc["edges"]),
                      "islands": len(doc["islands"]),
                  },
                  "current_shared_ir": metrics(current_ir, current_prompt),
                  "route_b_candidate": metrics(candidate_context, candidate_prompt),
              }


          def measure() -> dict[str, Any]:
              return {
                  "measurement": "ai-route-specific-projection-candidates-at-scale",
                  "groups": _grouping_measurement(),
                  "layout": _layout_measurement(),
                  "interpretation_boundary": (
                      "Measurement-only route-B candidates. No provider is called; prompt bytes are "
                      "not token counts; no production projection contract or cap is changed."
                  ),
              }


          def main() -> int:
              print(json.dumps(measure(), ensure_ascii=False, indent=2))
              return 0


          if __name__ == "__main__":
              raise SystemExit(main())
          PY

          cat > 03_Implement/backend/tests/test_ai_route_projection_candidates.py <<'PY'
          """Deterministic characterization of route-specific projection candidates."""

          from scripts.measure_ai_route_projection_candidates import measure


          def test_measurement_is_deterministic() -> None:
              assert measure() == measure()


          def test_grouping_candidate_restores_all_requested_and_island_memberships() -> None:
              result = measure()["groups"]
              source = result["source"]
              current = result["current_shared_ir"]
              candidate = result["route_b_candidate"]

              assert source["requested_cards"] == 300
              assert current["requested_cards_accounted_for"] < 300
              assert current["complete_island_memberships"] < 30
              assert current["tail_island_members"] < 10

              assert candidate["projected_requested_cards"] == 300
              assert candidate["groupable_candidates"] == 299
              assert candidate["withheld_held_cards"] == 1
              assert candidate["requested_cards_accounted_for"] == 300
              assert candidate["complete_island_memberships"] == 30
              assert candidate["tail_island_members"] == 10
              assert candidate["prompt"]["utf8_bytes"] > 0


          def test_layout_candidate_restores_full_relative_structure() -> None:
              result = measure()["layout"]
              source = result["source"]
              current = result["current_shared_ir"]
              candidate = result["route_b_candidate"]

              assert source == {
                  "cards": 300,
                  "typed_card_relations": 300,
                  "islands": 30,
              }
              assert current["relative_coordinates"] == 200
              assert current["typed_card_relations"] < 300
              assert current["tail_coordinates_present"] == []
              assert current["tail_required_relations_present"] == []

              assert candidate["relative_coordinates"] == 300
              assert candidate["typed_card_relations"] == 300
              assert candidate["complete_island_memberships"] == 30
              assert candidate["tail_coordinates_present"] == ["c298", "c299"]
              assert candidate["tail_required_relations_present"] == [
                  ("c298", "c299", "causal"),
                  ("c299", "c000", "negate"),
              ]
              assert candidate["tail_causal_visible_in_prompt"] is True
              assert candidate["tail_negate_visible_in_prompt"] is True
              assert candidate["prompt"]["utf8_bytes"] > 0


          def test_measurement_does_not_claim_tokens_or_production_contract() -> None:
              result = measure()
              boundary = result["interpretation_boundary"]
              assert "No provider is called" in boundary
              assert "not token counts" in boundary
              assert "no production projection contract" in boundary
          PY

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run characterization and regression
        working-directory: 03_Implement/backend
        run: |
          python scripts/measure_ai_route_projection_candidates.py | tee /tmp/route-b-measurement.json
          python -m pytest -q \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_required_meaning_scale.py \
            tests/test_ai_route_prompt_coverage.py \
            tests/test_ai_ir_budget_pressure.py

      - name: Record R23 measured values in the issue
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('/tmp/route-b-measurement.json').read_text(encoding='utf-8'))
          groups = data['groups']
          layout = data['layout']
          gc = groups['current_shared_ir']
          gb = groups['route_b_candidate']
          lc = layout['current_shared_ir']
          lb = layout['route_b_candidate']

          issue = Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md')
          text = issue.read_text(encoding='utf-8')
          marker = '## R23 — route別B候補の300カードcharacterization'
          if marker not in text:
              section = f'''\n\n{marker}\n\nR20のnamed provider/model実測を待つ間に、production配線・shared IR上限を変えず、R19で定義したroute-required meaningだけを残す**測定専用の方式B候補**を300カード代表入力へ当てた。`scripts/measure_ai_route_projection_candidates.py` が既存prompt rendererを使って source → current shared IR → route-B candidate のcoverageと最終prompt bytesを比較する。ここでのcandidate contextは新しいIR schemaではなく、方式比較のためのIR-shaped fixtureである。\n\n### `suggest-card-groups`\n\n| 指標 | current shared IR | route-B candidate |\n| --- | ---: | ---: |\n| providerへ提示可能なgrouping candidate | {gc['groupable_candidates']} | {gb['groupable_candidates']} |\n| holdとして除外されるcard | {gc['withheld_held_cards']} | {gb['withheld_held_cards']} |\n| requested 300枚のうちaccounted-for | {gc['requested_cards_accounted_for']} | {gb['requested_cards_accounted_for']} |\n| 完全な島membership | {gc['complete_island_memberships']}/30 | {gb['complete_island_memberships']}/30 |\n| 末尾島 `i29` のmember | {gc['tail_island_members']}/10 | {gb['tail_island_members']}/10 |\n| final prompt UTF-8 bytes | {gc['prompt']['utf8_bytes']:,} | {gb['prompt']['utf8_bytes']:,} |\n\n方式B候補では、候補cardの本文・hold state・確定島階層/membershipだけを保持し、R19でcompletion criterionではないrelation/derived clusterを外した。その結果、held `c298` を候補へ戻さずに299枚のgroupable cardと30島の完全membershipを同時に表現できた。これは**shared `MAX_CARDS=200` を上げずにgrouping-required meaningを全量表現できる構造が存在する**ことのcharacterizationであり、まだproduction採用やモデル品質を意味しない。\n\n### `suggest-layout`\n\n| 指標 | current shared IR | route-B candidate |\n| --- | ---: | ---: |\n| relative coordinate | {lc['relative_coordinates']}/300 | {lb['relative_coordinates']}/300 |\n| typed card relation | {lc['typed_card_relations']}/300 | {lb['typed_card_relations']}/300 |\n| 完全な島membership | {lc['complete_island_memberships']}/30 | {lb['complete_island_memberships']}/30 |\n| 末尾 `c298/c299` relative coordinate | {len(lc['tail_coordinates_present'])}/2 | {len(lb['tail_coordinates_present'])}/2 |\n| 末尾 `causal/negate` | {len(lc['tail_required_relations_present'])}/2 | {len(lb['tail_required_relations_present'])}/2 |\n| final prompt UTF-8 bytes | {lc['prompt']['utf8_bytes']:,} | {lb['prompt']['utf8_bytes']:,} |\n\nlayoutは既にlegacy `Cards:` 節が全300枚のid/text/raw座標を保持しているため、方式B候補では重複するcard本文を新たに増やさず、欠落していた全300枚の正規化相対座標・全card relation・確定島構造だけを補う。これにより末尾のrelative coordinateと `causal` / `negate` も最終promptまで復元できる。ここでのprompt増分は、現在黙って欠けている構造を全量へ戻した分であり、**layoutのBはtoken節約策というよりcoverageをshared global selectionから分離する手段**として評価すべきことが分かる。\n\n### 判断への影響\n\n- `suggest-card-groups`: Bは少なくとも構造上、300カードのrequired meaningをglobal capから独立して保持できる候補として具体化できた。named provider/model実測後はA2だけでなく、このcompact B promptのprovider-reported usageも同一modelで比較する価値がある。\n- `suggest-layout`: Bでcoverage自体は回復できるが、全体配置という仕事上、必要構造は文書規模に比例する。A2/B/Cのtoken余裕比較は依然必要で、Bを採用済みとはしない。\n- いずれもprompt文字数・UTF-8 bytesをtoken数へ換算しない。正確なtoken数はR20どおりprovider-reported usageだけを採用する。\n- production route、`MAX_CARDS/MAX_RELATIONS/MAX_TEXT_CHARS`、SafeMode/PII/proposal-only境界は本characterizationでは変更していない。\n'''
              issue.write_text(text + section, encoding='utf-8')
          PY

      - name: Lint and hygiene
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            scripts/measure_ai_route_projection_candidates.py \
            tests/test_ai_route_projection_candidates.py
          cd ../..
          git diff --check

      - name: Commit tested characterization and self-delete workflow
        shell: bash
        run: |
          rm .github/workflows/lane-b-route-b-characterization-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md \
            03_Implement/backend/scripts/measure_ai_route_projection_candidates.py \
            03_Implement/backend/tests/test_ai_route_projection_candidates.py \
            .github/workflows/lane-b-route-b-characterization-once.yml
          git commit -m "test(ai): characterize route-specific scale projections"
          git push origin HEAD:lane-b/route-b-projection-characterization
