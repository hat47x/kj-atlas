name: lane-b-r35-provider-call-provenance-once

on:
  push:
    branches:
      - lane-b/provider-call-provenance

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-call-provenance
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R35 patch
        run: python .github/lane-b-r35-patch.py
      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'
      - name: Run R35 and related regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_route_provider_call_provenance.py \
            tests/test_ai_route_provider_prompt_fingerprint.py \
            tests/test_ai_route_provider_measurement_analysis.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_a2_candidate.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_layout_hierarchical_composition.py
      - name: Lint and hygiene
        run: |
          cd 03_Implement/backend
          python -m ruff check \
            scripts/measure_ai_route_provider_tokens.py \
            scripts/analyze_ai_route_provider_measurement.py \
            tests/test_ai_route_provider_call_provenance.py \
            tests/test_ai_route_provider_measurement_analysis.py
          cd ../..
          git diff --check
      - name: Commit tested slice and remove temporary files
        run: |
          rm .github/lane-b-r35-patch.py
          rm .github/workflows/lane-b-r35-provider-call-provenance-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ai): preserve provider call provenance in token measurements'
          git push origin HEAD:lane-b/provider-call-provenance
