name: lane-b-r29-a2-characterization-once

on:
  push:
    branches:
      - lane-b/a2-representative-characterization

permissions:
  contents: write

jobs:
  test-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/a2-representative-characterization

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply fixture fix and pin observed A2/B diagnostics
        run: python .github/lane-b-r29-fix.py

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run A2 characterization
        working-directory: 03_Implement/backend
        run: python scripts/measure_ai_route_a2_candidate.py | tee /tmp/a2.json

      - name: Run focused regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_route_a2_candidate.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_layout_hierarchical_composition.py

      - name: Lint and hygiene
        run: |
          cd 03_Implement/backend
          python -m ruff check \
            scripts/measure_ai_route_a2_candidate.py \
            tests/test_ai_route_a2_candidate.py
          cd ../..
          git diff --check

      - name: Commit tested slice and remove temporary files
        run: |
          rm .github/lane-b-r29-fix.py
          rm .github/workflows/lane-b-r29-a2-characterization-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ai): characterize representative-fit A2 candidate'
          git push origin HEAD:lane-b/a2-representative-characterization
