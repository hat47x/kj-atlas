name: Lane C QA PUB restore CRLF once

on:
  push:
    branches:
      - qa/lane-c-qa-pub-compose-rerun-20260907

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore main bytes and apply only the two locator fixes
        run: |
          set -euo pipefail
          FILE='03_Implement/frontend/e2e/public_pack_visibility_compat.spec.ts'
          git checkout origin/main -- "$FILE"
          python - <<'PY'
          from pathlib import Path
          p = Path('03_Implement/frontend/e2e/public_pack_visibility_compat.spec.ts')
          data = p.read_bytes()
          old = b'page.getByRole("status")'
          new = b'page.getByTestId("status-message")'
          if b'\r\n' not in data:
              raise SystemExit('expected CRLF source from main')
          if data.count(old) != 2:
              raise SystemExit(f'expected 2 role=status locators, found {data.count(old)}')
          data = data.replace(old, new)
          p.write_bytes(data)
          if p.read_bytes().count(new) != 2:
              raise SystemExit('locator replacement count mismatch')
          PY
          rm .github/workflows/lane-c-qa-pub-restore-crlf-once.yml
          git diff --check
          echo '--- net diff against current main ---'
          git diff --numstat origin/main -- "$FILE" 01_Plans/issues/issue-QA-PUB-01-I18N-03-e2e-boundary.md
          git diff -- "$FILE"

      - name: Commit narrow diff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(qa): preserve public-pack spec line endings'
          git push origin HEAD:${GITHUB_REF_NAME}
