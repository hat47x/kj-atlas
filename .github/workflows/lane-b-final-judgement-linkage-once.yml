name: lane-b-final-judgement-linkage-once

on:
  push:
    branches:
      - lane-b/final-judgement-proposal-linkage

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-proposal-linkage
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply linkage implementation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          models = root / '03_Implement/backend/src/kj_atlas_api/models_ai.py'
          repo = root / '03_Implement/backend/src/kj_atlas_api/proposal_decision_repository.py'
          route = root / '03_Implement/backend/src/kj_atlas_api/routes/ai.py'
          test = root / '03_Implement/backend/tests/test_final_judgement_proposal_linkage.py'
          api_doc = root / '02_Architecture/api.md'
          schemas_doc = root / '02_Architecture/schemas.md'
          issue = root / '01_Plans/issues/issue-AI-ROUTE-HELD-LINKAGE-01-link-final-judgement-failure-to-proposal-state.md'

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'marker not found in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'marker not unique in {path}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) API typed reference: optional and backward-compatible.
          replace_once(
              models,
              'class CheckNarrativeRequest(BaseModel):\n',
              '''class ExternalProposalReference(BaseModel):\n    """Explicit identity for a registered external-agent proposal.\n\n    The document identity is deliberately NOT carried here: final-judgement\n    routes bind this reference to the request document and validate the tuple\n    server-side. This prevents proposalId from becoming an implicit document\n    lookup key.\n    """\n\n    model_config = ConfigDict(extra="forbid")\n\n    proposalId: str = Field(min_length=1, max_length=128)\n    sourceBundleHash: str = Field(pattern=SOURCE_BUNDLE_HASH_PATTERN)\n\n\nclass CheckNarrativeRequest(BaseModel):\n''',
          )
          replace_once(
              models,
              '    basedOnReadingOrder: list[str] | None = None\n    # SEC-AI-SAFEMODE-01',
              '    basedOnReadingOrder: list[str] | None = None\n    # AI-ROUTE-HELD-LINKAGE-01 R1: optional explicit external proposal identity.\n    externalProposalRef: ExternalProposalReference | None = None\n    # SEC-AI-SAFEMODE-01',
          )
          replace_once(
              models,
              '    doc: DocumentV1 | None = None\n    # SEC-AI-SAFEMODE-01 (ADR-0068 D1=C/D3=A): optional, fail-closed relaxation.\n    allowUnreviewedText: bool | None = None\n\n\nclass DetectContradictionResponse',
              '    doc: DocumentV1 | None = None\n    # AI-ROUTE-HELD-LINKAGE-01 R1: linkage requires doc so the server never\n    # infers document identity from proposalId.\n    externalProposalRef: ExternalProposalReference | None = None\n    # SEC-AI-SAFEMODE-01 (ADR-0068 D1=C/D3=A): optional, fail-closed relaxation.\n    allowUnreviewedText: bool | None = None\n\n\nclass DetectContradictionResponse',
          )

          # 2) Repository read-only validation primitive.
          replace_once(
              repo,
              '\n\ndef record_proposal_decision(\n',
              '''\n\ndef validate_external_proposal_reference(\n    db: Session,\n    *,\n    tenant: TenantContext,\n    doc_id: str,\n    proposal_id: str,\n    source_bundle_hash: str,\n) -> AIProposalRow:\n    """Resolve an external proposal only by its explicit document-local identity.\n\n    This is intentionally read-only. MMR-06 state transitions are a later\n    contract: R1 only proves which proposal a final-judgement call refers to.\n    """\n    apply_database_tenant_context(db=db, tenant=tenant)\n    proposal = db.get(AIProposalRow, (tenant.tenant_id, doc_id, proposal_id))\n    if proposal is None:\n        raise ProposalNotRegistered("external proposal is not registered for this document")\n    if proposal.origin != "external_agent":\n        raise ProposalDecisionConflict("proposal is not an external-agent proposal")\n    if proposal.source_bundle_hash != source_bundle_hash:\n        raise ProposalDecisionConflict("external proposal source bundle does not match")\n    return proposal\n\n\ndef record_proposal_decision(\n''',
          )

          # 3) Route gate. Keep standalone calls byte-compatible except for the optional field.
          replace_once(
              route,
              '    ExternalAgentProposalDecisionRequest,\n',
              '    ExternalAgentProposalDecisionRequest,\n    ExternalProposalReference,\n',
          )
          replace_once(
              route,
              '    record_proposal_decision as persist_proposal_decision,\n',
              '    record_proposal_decision as persist_proposal_decision,\n    validate_external_proposal_reference,\n',
          )
          replace_once(
              route,
              '\n\ndef _assert_model_allowed(\n',
              '''\n\ndef _validate_final_judgement_external_proposal(\n    ref: ExternalProposalReference | None,\n    *,\n    doc_id: str,\n    request: Request,\n    db: Session,\n) -> None:\n    """Fail before provider execution unless an explicit external proposal link is valid."""\n    if ref is None:\n        return\n    tenant = _resolve_audit_tenant(request, db)\n    try:\n        validate_external_proposal_reference(\n            db,\n            tenant=tenant,\n            doc_id=doc_id,\n            proposal_id=ref.proposalId,\n            source_bundle_hash=ref.sourceBundleHash,\n        )\n    except ProposalNotRegistered as exc:\n        raise HTTPException(status_code=404, detail=str(exc)) from exc\n    except ProposalDecisionConflict as exc:\n        raise HTTPException(status_code=409, detail=str(exc)) from exc\n\n\ndef _assert_model_allowed(\n''',
          )
          replace_once(
              route,
              '    _validate_check_narrative_input(payload)\n    _reject_unreviewed_text(payload.doc, payload.allowUnreviewedText)\n\n    try:\n',
              '''    _validate_check_narrative_input(payload)\n    _reject_unreviewed_text(payload.doc, payload.allowUnreviewedText)\n    _validate_final_judgement_external_proposal(\n        payload.externalProposalRef,\n        doc_id=payload.doc.id,\n        request=request,\n        db=db,\n    )\n\n    try:\n''',
          )
          replace_once(
              route,
              '    _reject_unreviewed_cards([payload.cardA, payload.cardB], payload.allowUnreviewedText)\n\n    # AI-IR-PROJECTION-01 (stage 1',
              '''    _reject_unreviewed_cards([payload.cardA, payload.cardB], payload.allowUnreviewedText)\n\n    if payload.externalProposalRef is not None:\n        if payload.doc is None:\n            raise HTTPException(\n                status_code=422,\n                detail={\n                    "code": "external_proposal_document_required",\n                    "message": "doc is required when externalProposalRef is supplied.",\n                },\n            )\n        _validate_final_judgement_external_proposal(\n            payload.externalProposalRef,\n            doc_id=payload.doc.id,\n            request=request,\n            db=db,\n        )\n\n    # AI-IR-PROJECTION-01 (stage 1''',
          )

          # 4) Focused tests: typed contract, repository identity, and route pre-provider gate.
          test.write_text(r'''from __future__ import annotations

import json
from pathlib import Path

import pytest
from fastapi import HTTPException
from sqlalchemy import create_engine
from sqlalchemy.orm import Session

from kj_atlas_api.llm.provider import LLMCallMetadata, LLMResponse
from kj_atlas_api.models import Base, DocumentV1
from kj_atlas_api.models_ai import (
    CheckNarrativeRequest,
    DetectContradictionRequest,
    ExternalProposalReference,
)
from kj_atlas_api.proposal_decision_repository import (
    ProposalDecisionConflict,
    ProposalNotRegistered,
    register_ai_proposal,
    register_external_agent_proposal,
    register_external_agent_task,
    validate_external_proposal_reference,
)
from kj_atlas_api.routes import ai
from kj_atlas_api.tenant_context import TenantContext


FIXTURE_PATH = Path(__file__).parent / "fixtures" / "ai_eval_kj_document.json"
HASH_A = "a" * 64
HASH_B = "b" * 64
TENANT = TenantContext(
    tenant_id="local-default",
    membership_id=None,
    resolved_by="single_tenant_adapter",
)


def _doc() -> DocumentV1:
    return DocumentV1.model_validate(json.loads(FIXTURE_PATH.read_text(encoding="utf-8")))


def _ref() -> ExternalProposalReference:
    return ExternalProposalReference(proposalId="proposal-ext-1", sourceBundleHash=HASH_A)


def _metadata() -> LLMCallMetadata:
    return LLMCallMetadata(
        provider_kind="local",
        provider_name="local",
        model_id="default",
        transport="http",
        requested_at="2026-09-06T00:00:00Z",
        trace_id="linkage-test",
    )


def test_final_judgement_request_linkage_is_optional_and_typed() -> None:
    doc = _doc()
    standalone = CheckNarrativeRequest(doc=doc, narrativeText="draft")
    assert standalone.externalProposalRef is None

    linked = CheckNarrativeRequest(
        doc=doc,
        narrativeText="draft",
        externalProposalRef={"proposalId": "proposal-ext-1", "sourceBundleHash": HASH_A},
    )
    assert linked.externalProposalRef == _ref()

    with pytest.raises(Exception):
        ExternalProposalReference(proposalId="proposal-ext-1", sourceBundleHash="not-a-sha256")


def test_repository_validates_external_proposal_by_doc_and_source() -> None:
    engine = create_engine("sqlite:///:memory:")
    Base.metadata.create_all(bind=engine)
    with Session(engine) as db:
        register_external_agent_task(
            db,
            tenant=TENANT,
            task_id="task-ext-1",
            doc_id="doc-1",
            base_doc_signature="doc-1:2026-09-06T00:00:00Z",
            source_bundle_hash=HASH_A,
            query_canonical_hash=HASH_B,
            task_kind="narrative_draft",
        )
        register_external_agent_proposal(
            db,
            tenant=TENANT,
            doc_id="doc-1",
            proposal_id="proposal-ext-1",
            proposal_kind="narrative_draft",
            source_bundle_hash=HASH_A,
            task_id="task-ext-1",
            base_doc_signature="doc-1:2026-09-06T00:00:00Z",
            query_canonical_hash=HASH_B,
            proposal_fingerprint="c" * 64,
        )
        db.commit()

        row = validate_external_proposal_reference(
            db,
            tenant=TENANT,
            doc_id="doc-1",
            proposal_id="proposal-ext-1",
            source_bundle_hash=HASH_A,
        )
        assert row.origin == "external_agent"

        with pytest.raises(ProposalNotRegistered):
            validate_external_proposal_reference(
                db,
                tenant=TENANT,
                doc_id="doc-other",
                proposal_id="proposal-ext-1",
                source_bundle_hash=HASH_A,
            )
        with pytest.raises(ProposalDecisionConflict):
            validate_external_proposal_reference(
                db,
                tenant=TENANT,
                doc_id="doc-1",
                proposal_id="proposal-ext-1",
                source_bundle_hash="d" * 64,
            )


def test_repository_rejects_internal_proposal_as_external_reference() -> None:
    engine = create_engine("sqlite:///:memory:")
    Base.metadata.create_all(bind=engine)
    with Session(engine) as db:
        register_ai_proposal(
            db,
            tenant=TENANT,
            doc_id="doc-1",
            proposal_id="proposal-internal-1",
            proposal_kind="island_summary",
            source_bundle_hash=HASH_A,
        )
        db.commit()
        with pytest.raises(ProposalDecisionConflict):
            validate_external_proposal_reference(
                db,
                tenant=TENANT,
                doc_id="doc-1",
                proposal_id="proposal-internal-1",
                source_bundle_hash=HASH_A,
            )


def test_check_narrative_invalid_linkage_stops_before_provider(monkeypatch: pytest.MonkeyPatch) -> None:
    payload = CheckNarrativeRequest(doc=_doc(), narrativeText="draft", externalProposalRef=_ref())
    monkeypatch.setattr(ai, "_validate_check_narrative_input", lambda _payload: None)
    monkeypatch.setattr(ai, "_reject_unreviewed_text", lambda *_args, **_kwargs: None)

    def reject_link(*_args, **_kwargs):
        raise HTTPException(status_code=409, detail="linkage mismatch")

    monkeypatch.setattr(ai, "_validate_final_judgement_external_proposal", reject_link)
    monkeypatch.setattr(
        ai,
        "generate_with_fallback",
        lambda _request: pytest.fail("provider must not be called after linkage rejection"),
    )

    with pytest.raises(HTTPException) as exc:
        ai.check_narrative(payload, None, None)  # type: ignore[arg-type]
    assert exc.value.status_code == 409


def test_check_narrative_standalone_does_not_require_proposal_linkage(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    payload = CheckNarrativeRequest(doc=_doc(), narrativeText="draft")
    monkeypatch.setattr(ai, "_validate_check_narrative_input", lambda _payload: None)
    monkeypatch.setattr(ai, "_reject_unreviewed_text", lambda *_args, **_kwargs: None)
    monkeypatch.setattr(
        ai,
        "_validate_final_judgement_external_proposal",
        lambda *_args, **_kwargs: pytest.fail("standalone call must not validate proposal linkage"),
    )
    monkeypatch.setattr(
        ai,
        "generate_with_fallback",
        lambda _request: LLMResponse(raw_text='{"issues": []}', metadata=_metadata()),
    )
    monkeypatch.setattr(ai, "_audit_llm_trace", lambda *_args, **_kwargs: None)

    response = ai.check_narrative(payload, None, None)  # type: ignore[arg-type]
    assert response.issues == []


def test_detect_contradiction_linkage_requires_document_before_provider(
    monkeypatch: pytest.MonkeyPatch,
) -> None:
    payload = DetectContradictionRequest(
        cardA={"id": "a", "text": "A", "textReviewed": True},
        cardB={"id": "b", "text": "B", "textReviewed": True},
        externalProposalRef=_ref(),
    )
    monkeypatch.setattr(ai, "_reject_unreviewed_cards", lambda *_args, **_kwargs: None)
    monkeypatch.setattr(
        ai,
        "generate_with_fallback",
        lambda _request: pytest.fail("provider must not be called without linkage document"),
    )

    with pytest.raises(HTTPException) as exc:
        ai.detect_contradiction(payload, None, None)  # type: ignore[arg-type]
    assert exc.value.status_code == 422
    assert exc.value.detail["code"] == "external_proposal_document_required"
''', encoding='utf-8')

          # Architecture contract. Append a compact normative section rather than
          # duplicating route documentation scattered elsewhere in these long files.
          api_marker = '## Final-judgement external proposal linkage (AI-ROUTE-HELD-LINKAGE-01 R1)'
          api_text = api_doc.read_text(encoding='utf-8')
          if api_marker not in api_text:
              api_doc.write_text(
                  api_text.rstrip() + '\n\n' + api_marker + '''\n\n`POST /ai/check-narrative` and `POST /ai/detect-contradiction` MAY carry `externalProposalRef`:\n\n```json\n{"proposalId":"<registered external proposal id>","sourceBundleHash":"<64-char sha256>"}\n```\n\nThe field is optional so standalone final-judgement calls remain backward-compatible. When supplied, the server MUST bind it to the request document ID and validate `(tenantId, docId, proposalId)`, `origin=external_agent`, and `sourceBundleHash` before any provider request. The server MUST NOT infer a proposal or document from latest-created order, document similarity, or proposal content. `detect-contradiction` therefore requires `doc` whenever `externalProposalRef` is present. Missing registration returns 404; identity/source conflict returns 409; linkage without a document returns 422. R1 is read-only and does not itself transition proposal state.\n''',
                  encoding='utf-8',
              )

          schema_marker = '## ExternalProposalReference（AI-ROUTE-HELD-LINKAGE-01 R1）'
          schema_text = schemas_doc.read_text(encoding='utf-8')
          if schema_marker not in schema_text:
              schemas_doc.write_text(
                  schema_text.rstrip() + '\n\n' + schema_marker + '''\n\n```text\nExternalProposalReference {\n  proposalId: string(1..128)\n  sourceBundleHash: sha256-hex(64)\n}\n```\n\n`CheckNarrativeRequest.externalProposalRef` と `DetectContradictionRequest.externalProposalRef` は optional。参照自体に `docId` を持たせず、route payload の `doc.id` と server-side proposal row を照合する。これにより proposal ID を document lookup key として扱わない。\n''',
                  encoding='utf-8',
              )

          # Mark only the identity-linkage AC complete; MMR-06/system hold stays open.
          issue_text = issue.read_text(encoding='utf-8')
          old_ac = '- [ ] external proposal flowとfinal judgementの対象proposalを、推測なしで一意に結ぶtyped linkageをAPI/schemaへ固定する。'
          new_ac = '- [x] external proposal flowとfinal judgementの対象proposalを、推測なしで一意に結ぶtyped linkageをAPI/schemaへ固定する。— R1: optional `externalProposalRef` + server-side `(tenant, doc, proposal, sourceBundleHash, origin)` validationを追加。'
          if old_ac not in issue_text:
              raise SystemExit('linkage AC marker not found')
          issue_text = issue_text.replace(old_ac, new_ac, 1)
          issue_text = issue_text.rstrip() + '''\n\n## R1 実装履歴（2026-09-06）\n\n- `ExternalProposalReference` (`proposalId` + `sourceBundleHash`) を追加し、`check-narrative` / `detect-contradiction` に optional linkage として接続。\n- serverはrequestの `doc.id` と登録済みproposal rowを照合し、external-agent origin / source hashまで一致した場合だけprovider処理へ進む。\n- `detect-contradiction` でlinkageだけを渡してdocumentを省略することは禁止（422）。proposal IDからdocumentを逆引きしない。\n- standalone呼出しのrequest shape/処理は維持。\n- 本R1はread-only identity gateのみ。system `held` 遷移、failure class、system audit、recoveryは未実装であり、MMR-06は未完了のまま。\n'''
          issue.write_text(issue_text, encoding='utf-8')
          PY
      - name: Install backend and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest
      - name: Run focused backend tests
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q tests/test_final_judgement_proposal_linkage.py tests/test_ai_eval_pipeline.py
          python -m compileall -q src/kj_atlas_api
      - name: Run documentation checks
        run: |
          python 01_Plans/docs_check.py
          git diff --check
      - name: Commit implementation and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane-b-final-judgement-linkage-once.yml
          git add 01_Plans/issues/issue-AI-ROUTE-HELD-LINKAGE-01-link-final-judgement-failure-to-proposal-state.md \
                  02_Architecture/api.md \
                  02_Architecture/schemas.md \
                  03_Implement/backend/src/kj_atlas_api/models_ai.py \
                  03_Implement/backend/src/kj_atlas_api/proposal_decision_repository.py \
                  03_Implement/backend/src/kj_atlas_api/routes/ai.py \
                  03_Implement/backend/tests/test_final_judgement_proposal_linkage.py
          git commit -m "feat(ai): bind final judgement to explicit external proposal"
          git push origin HEAD:lane-b/final-judgement-proposal-linkage
