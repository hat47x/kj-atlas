name: Lane B2 island relation SafeMode audit once

on:
  push:
    branches:
      - audit/lane-b2-unreviewed-ai-effect-scope-20260907

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect summarize island relation route
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('03_Implement/backend/src/kj_atlas_api/routes/ai.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)
          lines = text.splitlines()
          for node in ast.walk(tree):
              if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name == 'summarize_island_relation':
                  print('\n'.join(lines[node.lineno-1:node.end_lineno]))
                  break
          else:
              raise SystemExit('summarize_island_relation not found')
          PY
      - name: Retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-island-relation-safemode-audit-once.yml
          git commit -m "ci(b2): retire island relation SafeMode audit"
          git push
