name: Retire stale merge context clean R28

on:
  push:
    branches:
      - fix/retire-stale-merge-suggestion-context-clean-20260905
    paths:
      - .github/workflows/retire-merge-context-clean-r28.yml

permissions:
  contents: write

jobs:
  validate-current-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge current main in validation workspace
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main

      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'

      - name: Verify retired context is unreferenced
        run: |
          if git grep -n 'merge_suggestion_context' -- ':!.github/workflows/retire-merge-context-clean-r28.yml'; then
            echo 'stale merge_suggestion_context reference remains' >&2
            exit 1
          fi

      - name: Canonical merge regressions
        working-directory: 03_Implement/backend
        run: |
          pytest -q \
            tests/test_ai_merge_ir.py \
            tests/test_ai_merge_semantics.py \
            tests/test_merge_method_backward_compat.py
          pytest -q -k merge

      - name: Full backend test suite
        working-directory: 03_Implement/backend
        run: pytest -q

      - name: Documentation checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/issues/validate_active_issue_memos.py

      - name: Ruff canonical merge regressions
        working-directory: 03_Implement/backend
        run: |
          ruff check \
            tests/test_ai_merge_ir.py \
            tests/test_ai_merge_semantics.py \
            tests/test_merge_method_backward_compat.py

      - name: Diff checks
        run: |
          git -c core.whitespace=cr-at-eol diff --cached --check
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD -- . ':!.github/workflows/retire-merge-context-clean-r28.yml'

      - name: Retire one-shot workflow
        if: success()
        run: |
          git merge --abort || true
          git rm .github/workflows/retire-merge-context-clean-r28.yml
          git commit -m 'chore: retire R28 merge-context validator'
          git push origin HEAD:${GITHUB_REF_NAME}
