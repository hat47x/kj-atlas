name: Lane B2 IdP issuer dependency contract fix once

on:
  push:
    branches:
      - fix/lane-b2-idp-issuer-dependency-contract-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align IdP issuer dependency wording and focused contract
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('02_Architecture/runtime_parameter_registry.md')
          config_path = Path('04_Documentation/configuration.md')
          test_path = Path('01_Plans/tests/test_http_integration_disable_cleanup_contract.py')

          def replace_bytes(path: Path, old: str, new: str) -> None:
              raw = path.read_bytes()
              old_b = old.encode('utf-8')
              new_b = new.encode('utf-8')
              count = raw.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, got {count}')
              path.write_bytes(raw.replace(old_b, new_b, 1))

          replace_bytes(
              registry_path,
              '| `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_IDP_ISSUER` | 未設定 | `external_http` adapter がPDPへ渡すIdP issuer metadata。canonical header valueとして検査し、設定時は `x-idp-issuer` headerへ写す。この設定自体はJWT/SAML issuerのローカル検証を行わない | direct | 通常値 | PDP test doubleで `x-idp-issuer` が設定値と一致することを確認する。issuer検証の結果を示すProbeとしては扱わない |',
              '| `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_IDP_ISSUER` | 未設定 | `external_http` adapter がPDPへ渡すIdP issuer metadata。設定する場合は `KJ_ATLAS_ACCESS_CONTROL_ADAPTER=external_http` と endpoint が必須。canonical header valueとして検査し、設定時は `x-idp-issuer` headerへ写す。この設定自体はJWT/SAML issuerのローカル検証を行わない | direct | 通常値 | PDP test doubleで `x-idp-issuer` が設定値と一致することを確認する。issuer検証の結果を示すProbeとしては扱わない |',
          )
          replace_bytes(
              config_path,
              '| `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_IDP_ISSUER` | 未設定 | PDPへ `x-idp-issuer` として渡すIdP issuer metadata。canonical header valueとして検査するが、この設定自体はJWT/SAML issuerをローカル検証しない |',
              '| `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_IDP_ISSUER` | 未設定 | PDPへ `x-idp-issuer` として渡すIdP issuer metadata。設定する場合は `KJ_ATLAS_ACCESS_CONTROL_ADAPTER=external_http` と endpoint が必須。canonical header valueとして検査するが、この設定自体はJWT/SAML issuerをローカル検証しない |',
          )
          replace_bytes(
              config_path,
              'IdP issuerだけが残る不完全設定、0以下または30秒超のtimeoutも起動時に拒否されます。',
              'IdP issuerを設定する場合も`external_http` adapterとendpointが必要で、どちらかを欠く構成は起動時に拒否されます。0以下または30秒超のtimeoutも起動時に拒否されます。',
          )

          test_text = test_path.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          if test_text.count(anchor) != 1:
              raise SystemExit('focused contract insertion anchor drifted')
          method = '''\n\n    def test_idp_issuer_requires_external_http_adapter_and_endpoint(self) -> None:\n        validator = _function_source("validate_llm_provider_guards")\n        self.assertIn("self.access_control_external_http_idp_issuer is not None", validator)\n        self.assertIn('normalized_access_control_adapter != "external_http"', validator)\n        self.assertIn("self.access_control_external_http_endpoint is None", validator)\n        self.assertIn("KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_IDP_ISSUER requires", validator)\n        self.assertIn("KJ_ATLAS_ACCESS_CONTROL_ADAPTER=external_http and its endpoint", validator)\n\n        for path in (REGISTRY_PATH, CONFIG_PATH):\n            prefix = "| `KJ_ATLAS_ACCESS_CONTROL_EXTERNAL_HTTP_IDP_ISSUER` |"\n            rows = [\n                line\n                for line in path.read_text(encoding="utf-8").splitlines()\n                if line.startswith(prefix)\n            ]\n            self.assertEqual(len(rows), 1)\n            self.assertIn("KJ_ATLAS_ACCESS_CONTROL_ADAPTER=external_http", rows[0])\n            self.assertIn("endpoint", rows[0])\n\n        section = CONFIG_PATH.read_text(encoding="utf-8").split(\n            "## アクセス制御を使う", 1\n        )[1].split("### 文書policy binding resolver", 1)[0]\n        self.assertIn("IdP issuerを設定する場合も`external_http` adapterとendpointが必要", section)\n        self.assertIn("どちらかを欠く構成は起動時に拒否", section)\n'''
          test_path.write_text(test_text.replace(anchor, method + anchor, 1), encoding='utf-8')
          PY
      - name: Verify focused relation contract
        run: python -m unittest 01_Plans.tests.test_http_integration_disable_cleanup_contract
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git diff --check --ignore-space-at-eol
          python - <<'PY'
          import subprocess
          allowed = {
              '01_Plans/tests/test_http_integration_disable_cleanup_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-idp-issuer-dependency-fix-once.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          extra = changed - allowed
          if extra:
              raise SystemExit(f'unexpected changed files: {sorted(extra)}')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_http_integration_disable_cleanup_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): IdP issuerのcross-key依存を明示する"
          git rm .github/workflows/lane-b2-idp-issuer-dependency-fix-once.yml
          git commit -m "ci: retire Lane B2 IdP issuer dependency workflow"
          git push
