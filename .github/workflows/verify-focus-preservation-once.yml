name: Temporary focus preservation verification

on:
  push:
    branches:
      - verify/ai-ir-focus-preservation-20260903

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v5
        with:
          ref: verify/ai-ir-focus-preservation-20260903
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Repair JSON-escaped layout visibility probe
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("03_Implement/backend/scripts/measure_ai_route_required_meaning.py")
          text = path.read_text(encoding="utf-8")
          old_a = '            "tail_card_a_visible_in_legacy_cards": payload.doc.cards[298].text in prompt,\n'
          old_b = '            "tail_card_b_visible_in_legacy_cards": payload.doc.cards[299].text in prompt,\n'
          new_a = '''            # The layout prompt JSON-serializes reviewed text. With the default
              # ensure_ascii=True, Japanese appears as \\u escapes, so semantic
              # visibility must accept either equivalent representation.
              "tail_card_a_visible_in_legacy_cards": (
                  payload.doc.cards[298].text in prompt
                  or json.dumps(payload.doc.cards[298].text) in prompt
              ),
          '''.replace("              ", "            ")
          new_b = '''            "tail_card_b_visible_in_legacy_cards": (
                  payload.doc.cards[299].text in prompt
                  or json.dumps(payload.doc.cards[299].text) in prompt
              ),
          '''.replace("              ", "            ")
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit("layout visibility probe line anchor not found exactly once")
          text = text.replace(old_a, new_a, 1).replace(old_b, new_b, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Run focus-preservation regressions
        working-directory: 03_Implement/backend
        run: >-
          python -m pytest
          tests/test_llm_input_ir_required_cards.py
          tests/test_ai_detect_contradiction_ir_scale.py
          tests/test_ai_route_required_meaning_scale.py
          -q

      - name: Lint repaired scale probe
        working-directory: 03_Implement/backend
        run: ruff check scripts/measure_ai_route_required_meaning.py

      - name: Close verified focus-preservation memo
        run: python .github/scripts/verify_focus_preservation_once.py

      - name: Run docs contract checks
        run: python 01_Plans/docs_check.py

      - name: Validate dogfood documents
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Parse actionable planning memos
        run: python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json

      - name: Check whitespace
        run: git diff --check

      - name: Remove one-shot verification files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/verify_focus_preservation_once.py
          rm .github/workflows/verify-focus-preservation-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: verify AI IR focus preservation at 300-card scale'
          git push origin HEAD:verify/ai-ir-focus-preservation-20260903
