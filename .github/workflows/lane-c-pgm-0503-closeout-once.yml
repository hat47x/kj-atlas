name: Lane C PGM-ITER-05-03 closeout once

on:
  push:
    branches:
      - docs/lane-c-pgm-iter-05-03-closeout-20260907

permissions:
  contents: write

jobs:
  closeout-and-verify:
    if: "github.event.head_commit.message == 'chore: PGM-ITER-05-03 closeout検証workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/lane-c-pgm-iter-05-03-closeout-20260907
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply parent issue closeout
        run: python .github/scripts/lane_c_pgm_0503_closeout.py
      - name: Retire one-shot closeout inputs before guards
        run: rm .github/scripts/lane_c_pgm_0503_closeout.py .github/workflows/lane-c-pgm-0503-closeout-once.yml
      - name: Install planning test dependency
        run: python -m pip install pytest
      - name: Planning lifecycle suite
        run: python -m pytest -q 01_Plans/tests
      - name: Documentation and path guards
        run: |
          python 01_Plans/docs_check.py
          test ! -e 01_Plans/issues/issue-PGM-ITER-05-03-cross-tenant-guest-admission-primitive-requirements.md
          test -e 01_Plans/issues/done/issue-PGM-ITER-05-03-cross-tenant-guest-admission-primitive-requirements.md
          ! git grep -F '01_Plans/issues/issue-PGM-ITER-05-03-cross-tenant-guest-admission-primitive-requirements.md'
          git diff --check
      - name: Commit verified closeout tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(saas): PGM-ITER-05-03をguest journey完了後にcloseoutする'
          git push origin HEAD:docs/lane-c-pgm-iter-05-03-closeout-20260907
