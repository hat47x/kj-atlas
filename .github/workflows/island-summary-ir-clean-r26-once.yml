name: Island summary IR clean R26 one-shot

on:
  push:
    branches:
      - fix/island-summary-ir-clean-r26-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'

      - name: Island summary IR regression
        run: pytest -q 03_Implement/backend/tests/test_ai_suggest_island_summary_ir_projection.py

      - name: Ruff
        run: python -m ruff check 03_Implement/backend/tests/test_ai_suggest_island_summary_ir_projection.py

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Retire one-shot workflow
        if: success()
        run: |
          rm .github/workflows/island-summary-ir-clean-r26-once.yml
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add .github/workflows/island-summary-ir-clean-r26-once.yml
          git commit -m 'chore: retire island summary IR clean validator'
          git push origin HEAD:${GITHUB_REF_NAME}
