name: Lane B2 CE4 runtime consumers audit once

on:
  push:
    branches:
      - audit/lane-b2-ce4-runtime-consumers-20260907

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit CE4 runtime consumers
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('03_Implement/backend')
          keys = {
              'ce4_source_bundle_hash_allow_mock': 'KJ_ATLAS_CE4_SOURCE_BUNDLE_HASH_ALLOW_MOCK',
              'ce4_stub_unresolved_contracts': 'KJ_ATLAS_CE4_STUB_UNRESOLVED_CONTRACTS',
              'ce4_equivalence_mode': 'KJ_ATLAS_CE4_EQUIVALENCE_MODE',
              'ce4_dry_run_enforce_no_side_effect': 'KJ_ATLAS_CE4_DRY_RUN_ENFORCE_NO_SIDE_EFFECT',
              'ce4_audit_require_all_events': 'KJ_ATLAS_CE4_AUDIT_REQUIRE_ALL_EVENTS',
          }

          source_files = sorted((root / 'src').rglob('*.py'))
          test_files = sorted((root / 'tests').rglob('*.py'))

          def locations(files, needle):
              found = []
              for path in files:
                  for lineno, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                      if needle in line:
                          found.append(f'{path}:{lineno}:{line.strip()}')
              return found

          for attr, env_key in keys.items():
              src = locations(source_files, attr)
              tests = locations(test_files, attr)
              print(f'## {env_key}')
              print('source occurrences:')
              for item in src:
                  print(item)
              print('test occurrences:')
              for item in tests:
                  print(item)

          mock_src = [
              item for item in locations(source_files, 'ce4_source_bundle_hash_allow_mock')
              if not item.startswith('03_Implement/backend/src/kj_atlas_api/settings.py:')
          ]
          error_src = locations(source_files, 'mock_source_bundle_hash_disabled')
          if not mock_src or not error_src:
              print('POSITIVE: CE4 sourceBundleHash mock switch lacks the documented runtime consumer/error contract')
              raise SystemExit(42)

          print('CE4 public runtime consumer contract is realized')
          PY
      - name: Retire one-shot workflow when clean
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-ce4-runtime-consumers-audit-once.yml
          git commit -m "ci(b2): retire CE4 runtime consumer audit"
          git push
