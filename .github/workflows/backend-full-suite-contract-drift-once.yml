name: Backend full-suite contract drift once

on:
  push:
    branches:
      - fix/backend-full-suite-contract-drift-20260904
    paths:
      - .github/workflows/backend-full-suite-contract-drift-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/backend-full-suite-contract-drift-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply contract-drift patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/fix_backend_suite_contract_drift.py')
          lines = path.read_text(encoding='utf-8').splitlines()
          old_seen = new_seen = False
          for index, line in enumerate(lines):
              if line.startswith('old_payload = '):
                  lines[index] = '''old_payload = '{"suggestions":[{"groupId":"g1","cardIds":["c1","c2"],"mergedTextDraft":"merged"}]}' '''.rstrip()
                  old_seen = True
              elif line.startswith('new_payload = '):
                  lines[index] = '''new_payload = '{"suggestions":[{"groupId":"g1","cardIds":["c1","c2"],"mergedTextDraft":"merged","mergeMethod":"near_duplicate"}]}' '''.rstrip()
                  new_seen = True
          if not (old_seen and new_seen):
              raise SystemExit('provider payload assignment anchor missing')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python .github/scripts/fix_backend_suite_contract_drift.py
      - name: Install backend
        run: python -m pip install -e '03_Implement/backend[test]'
      - name: Run backend default full suite
        working-directory: 03_Implement/backend
        run: pytest -q
      - name: Revalidate repository contracts
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          git -c core.whitespace=cr-at-eol diff --check
      - name: Commit verified fix and self-clean
        run: |
          rm .github/workflows/backend-full-suite-contract-drift-once.yml
          rm .github/scripts/fix_backend_suite_contract_drift.py
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'test: backend全体回帰を現行契約へ同期する'
          git push origin HEAD:fix/backend-full-suite-contract-drift-20260904
