name: Lane C post-zero lifecycle README once

on:
  push:
    branches:
      - docs/lane-c-postzero-lifecycle-readme-20260905

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'chore: post-zero lifecycle README検証workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
      - name: Planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py
      - name: Documentation contract check
        run: python 01_Plans/docs_check.py
      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json
      - name: Stale merge reintroduction check
        run: python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: 検証結果を完了メモへ記録する
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/issues/done/issue-DOC-ISSUE-LIFECYCLE-POSTZERO-01-readme-stale-after-legacy-debt-zero.md')
          text = path.read_text(encoding='utf-8')
          old = "- [ ] planning unit tests、active memo validator、docs-check、triage、stale merge reintroduction、`git diff --check` が通る。"
          new = "- [x] planning unit tests、active memo validator、docs-check、triage、stale merge reintroduction、`git diff --check` が通る。"
          if text.count(old) != 1:
              raise SystemExit('未完了ACを一意に特定できません')
          text = text.replace(old, new)
          text += """

## 検証結果（2026-09-05）

- GitHub Actionsのbranch限定検証で、Issue lifecycle / planning tests / active memo validator / docs-check / triage / stale merge reintroduction / diff checkを通過した。
- 検証workflowはPR前に削除し、恒久CIやpush blockerとして残さない。
"""
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add 01_Plans/issues/done/issue-DOC-ISSUE-LIFECYCLE-POSTZERO-01-readme-stale-after-legacy-debt-zero.md
          git commit -m 'docs: post-zero lifecycle README検証結果を記録する'
          git push origin HEAD
