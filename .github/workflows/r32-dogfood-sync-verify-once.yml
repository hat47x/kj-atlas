name: R32 frozen identity sync and verify once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/r32-git-filtered-frozen-identity-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R32を継続dogfood索引へ同期する
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          block = """- `cognitive-dogfood-continuous-2026-09-06-r32.md`
            - R32。PR #3022でWindows CRLF working treeがfrozen manifest破損に見えたfalse positiveを分析し、immutabilityの観測点をraw bytesからGit clean filter後のcanonical blob identityへ戻した記録。
          - `doc_kj_atlas_dogfood_r32.json`
            - R32のKJキャンバス。LF/CRLFというplatform表現差は同一Git objectへ正規化しつつ、historical pathのsemantic rewriteは別identityとして拒否し、R25のfrozen-input責務を維持する構造を保持する。
          """
          if 'cognitive-dogfood-continuous-2026-09-06-r32.md' not in text:
              anchor = """- `doc_kj_atlas_dogfood_r31.json`
            - R31のKJキャンバス。component-level semantic validityとdeployment-profile realizabilityを二段に分け、packaged profileの制約をcomponent一般能力へ逆輸入しない構造を保持する。
          """
              if anchor not in text:
                  raise SystemExit('R31 index anchor not found')
              text = text.replace(anchor, anchor + block, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Focused frozen manifest identity tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_frozen_dogfood_manifest_identity.py' -v
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py' -v
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Working-tree hygiene
        run: git diff --check
      - name: 検証済みR32をbranchへ記録しone-shotを退役する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_Plans/dogfood/cognitive-dogfood-index.md
          git rm .github/workflows/r32-dogfood-sync-verify-once.yml
          git commit -m 'dogfood: sync R32 index and retire verification workflow'
          git diff --check origin/main...HEAD
          git push origin HEAD:dogfood/r32-git-filtered-frozen-identity-20260906
