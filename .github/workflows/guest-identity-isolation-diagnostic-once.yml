name: Guest identity isolation diagnostic once

on:
  push:
    branches:
      - fix/guest-identity-verifier-isolation-20260909

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Confirm guest identity file passes alone
        working-directory: 03_Implement/backend
        run: python -m pytest tests/test_guest_identity_verifier.py -q

      - name: Reproduce backend full-suite failures without masking logs
        working-directory: 03_Implement/backend
        run: |
          set +e
          python -m pytest tests/ -q
          status=$?
          echo "FULL_SUITE_EXIT=$status"
          exit 0

      - name: Retire diagnostic workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/guest-identity-isolation-diagnostic-once.yml
          git commit -m 'ci: retire guest identity isolation diagnostic'
          git push origin HEAD:${GITHUB_REF_NAME}
