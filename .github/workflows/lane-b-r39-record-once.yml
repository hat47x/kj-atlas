name: lane-b-r39-record-once

on:
  push:
    branches:
      - lane-b/context-budget-readiness

permissions:
  contents: write

jobs:
  record-and-self-delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/context-budget-readiness
      - name: Record R39
        run: |
          python .github/lane-b-r39-record.py
          grep -F '## R39 — provider input usage と production output reserve を分離してcontext hard-fitを判定する' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '**77 test**' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F 'sufficient_headroom_policy=null' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          git diff --check
      - name: Commit record and remove temporary files
        run: |
          rm .github/lane-b-r39-record.py
          rm .github/workflows/lane-b-r39-record-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): record R39 context budget boundary'
          git push origin HEAD:lane-b/context-budget-readiness
