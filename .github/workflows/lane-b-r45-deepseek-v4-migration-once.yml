name: lane-b-r45-deepseek-v4-migration-once

on:
  push:
    branches:
      - lane-b/deepseek-v4-migration

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/deepseek-v4-migration
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply migration patch
        run: python .github/lane-b-r45-patch.py
      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'
      - name: Run V4 migration and Lane B regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_llm_provider.py \
            tests/test_ai_eval_pipeline.py \
            tests/test_model_governance.py \
            tests/test_llm_integration.py \
            tests/test_ai_route_provider_measurement_analysis.py \
            tests/test_ai_route_provider_transport_input_provenance.py \
            tests/test_ai_route_provider_call_provenance.py \
            tests/test_ai_route_provider_prompt_fingerprint.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_production_output_budget_contract.py
      - name: Lint and contract hygiene
        run: |
          cd 03_Implement/backend
          python -m ruff check \
            src/kj_atlas_api/settings.py \
            src/kj_atlas_api/llm/provider.py \
            tests/test_llm_provider.py \
            tests/test_ai_eval_pipeline.py \
            tests/test_model_governance.py
          cd ../..
          git diff --check
          grep -n 'default="deepseek-v4-flash"' 03_Implement/backend/src/kj_atlas_api/settings.py
          grep -n 'default="disabled"' 03_Implement/backend/src/kj_atlas_api/settings.py
          grep -n '"thinking": {"type": thinking_mode}' 03_Implement/backend/src/kj_atlas_api/llm/provider.py
      - name: Commit tested slice and remove temporary files
        run: |
          rm .github/lane-b-r45-patch.py
          rm .github/workflows/lane-b-r45-deepseek-v4-migration-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(ai): migrate DeepSeek default to V4 with explicit thinking mode'
          git push origin HEAD:lane-b/deepseek-v4-migration
