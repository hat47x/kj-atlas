name: Lane B2 API key profile requirement fix once

on:
  push:
    branches:
      - fix/lane-b2-api-key-profile-requirement-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align business API key profile requirement
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('02_Architecture/runtime_parameter_registry.md')
          config = Path('04_Documentation/configuration.md')
          test = Path('01_Plans/tests/test_api_key_effect_scope_contract.py')

          def replace_bytes(path: Path, old: str, new: str) -> None:
              raw = path.read_bytes()
              old_b = old.encode('utf-8')
              if raw.count(old_b) != 1:
                  raise SystemExit(f'{path}: replacement target count={raw.count(old_b)}')
              path.write_bytes(raw.replace(old_b, new.encode('utf-8'), 1))

          replace_bytes(
              registry,
              '| `KJ_ATLAS_API_KEY` | 未設定 | business-plane APIを `X-API-Key` で保護する。`/healthz` / `/readyz` / `/version` は運用probeとして常に対象外。`/admin/*` もbusiness keyの対象外で、`X-Admin-Api-Key` またはprovision capabilityによるcontrol-plane認可へ分離する | direct / base Compose | 秘密値 |',
              '| `KJ_ATLAS_API_KEY` | 未設定 | business-plane APIを `X-API-Key` で保護する。`enterprise-production` では起動必須。`saas-multitenant` はtrusted JWT/cookie identityを使うためbusiness key自体は起動必須ではない。`/healthz` / `/readyz` / `/version` は運用probeとして常に対象外。`/admin/*` もbusiness keyの対象外で、`X-Admin-Api-Key` またはprovision capabilityによるcontrol-plane認可へ分離する | direct / base Compose | 秘密値 |',
          )
          replace_bytes(
              config,
              '| `KJ_ATLAS_API_KEY` | 未設定 | business-plane APIを `X-API-Key` で保護。`/healthz` / `/readyz` / `/version` は運用probeとして対象外。`/admin/*` もbusiness key対象外で、別のcontrol-plane認可（`X-Admin-Api-Key` / provision capability）を使う |',
              '| `KJ_ATLAS_API_KEY` | 未設定 | business-plane APIを `X-API-Key` で保護。`enterprise-production` では起動必須。`saas-multitenant` はtrusted JWT/cookie identityを使うためbusiness key自体は起動必須ではない。`/healthz` / `/readyz` / `/version` は運用probeとして対象外。`/admin/*` もbusiness key対象外で、別のcontrol-plane認可（`X-Admin-Api-Key` / provision capability）を使う |',
          )
          replace_bytes(
              config,
              '> 注意: 標準 Docker Compose はこのキーをホスト環境から pass-through 配送します（ホスト側で未設定の場合はコンテナ内でも未設定のままで、既定の無効状態を維持します。[runtime_parameter_registry.md](https://github.com/hat47x/kj-atlas/blob/main/02_Architecture/runtime_parameter_registry.md#backend-settings) 参照）。',
              '> 注意: 標準 Docker Compose はこのキーをホスト環境から pass-through 配送します。`local-dev` / `evaluation` では未設定ならbusiness API keyは無効のままです。`enterprise-production` はこのキーを起動必須とするため未設定では起動しません。`saas-multitenant` はtrusted JWT/cookie identityを使うためbusiness key自体は起動必須ではありません（control plane用 `KJ_ATLAS_ADMIN_API_KEY` は別途必須です）。[runtime_parameter_registry.md](https://github.com/hat47x/kj-atlas/blob/main/02_Architecture/runtime_parameter_registry.md#backend-settings) 参照。',
          )

          text = test.read_text(encoding='utf-8')
          anchor = '\n\nif __name__ == "__main__":\n    unittest.main()\n'
          method = '''\n\n    def test_business_api_key_profile_requirement_matches_settings(self) -> None:\n        settings = (ROOT / "03_Implement/backend/src/kj_atlas_api/settings.py").read_text(encoding="utf-8")\n        self.assertIn('profile == "enterprise-production" and self.api_key is None', settings)\n        self.assertIn('missing.append("KJ_ATLAS_API_KEY")', settings)\n\n        for surface in (self.registry, self.configuration):\n            row = _row(surface, KEY)\n            self.assertIn("enterprise-production", row)\n            self.assertIn("起動必須", row)\n            self.assertIn("saas-multitenant", row)\n            self.assertIn("起動必須ではない", row)\n\n        section = self.configuration.split("## API キーを有効にする", 1)[1].split(\n            "## local LLM を使う", 1\n        )[0]\n        self.assertIn("`enterprise-production` はこのキーを起動必須", section)\n        self.assertIn("未設定では起動しません", section)\n        self.assertIn("`saas-multitenant`", section)\n        self.assertIn("business key自体は起動必須ではありません", section)\n'''
          if text.count(anchor) != 1:
              raise SystemExit('test insertion anchor drifted')
          test.write_text(text.replace(anchor, method + anchor, 1), encoding='utf-8')
          PY
      - name: Verify focused contract
        run: python -m unittest 01_Plans.tests.test_api_key_effect_scope_contract
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff and EOL preservation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          allowed = {
              '01_Plans/tests/test_api_key_effect_scope_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-api-key-profile-requirement-fix-once.yml',
          }
          changed = set(subprocess.check_output(['git','diff','--name-only']).decode().splitlines())
          if changed - allowed:
              raise SystemExit(f'unexpected files: {sorted(changed - allowed)}')
          p = '04_Documentation/configuration.md'
          before = subprocess.check_output(['git','show',f'HEAD:{p}'])
          after = Path(p).read_bytes()
          def shape(raw):
              c = raw.count(b'\r\n'); return c, raw.count(b'\n') - c
          if shape(before) != shape(after):
              raise SystemExit(f'EOL shape changed: {shape(before)} -> {shape(after)}')
          diff = subprocess.check_output(['git','diff','--unified=0','--',
              '01_Plans/tests/test_api_key_effect_scope_contract.py',
              '02_Architecture/runtime_parameter_registry.md', p], text=True)
          bad=[]
          for line in diff.splitlines():
              if line.startswith('+') and not line.startswith('+++'):
                  content=line[1:].rstrip('\r')
                  if content.endswith((' ','\t')): bad.append(line)
          if bad: raise SystemExit(f'new trailing whitespace: {bad}')
          PY
      - name: Commit patch and retire workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_api_key_effect_scope_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): business API keyのprofile必須性を明示する"
          git rm .github/workflows/lane-b2-api-key-profile-requirement-fix-once.yml
          git commit -m "ci: retire Lane B2 API key profile workflow"
          git push
