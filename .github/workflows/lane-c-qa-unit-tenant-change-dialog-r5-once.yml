name: Lane C QA UNIT tenant change dialog R5 once

on:
  push:
    branches:
      - test/lane-c-qa-unit-tenant-change-dialog-r5-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Verify focused tenant decision boundary
        working-directory: 03_Implement/frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npx vitest run \
            src/ui/TenantChangeConfirmationDialog.test.ts \
            src/ui/TenantSessionControl.test.ts \
            src/ui/TenantSessionRuntimeGate.test.ts \
            src/ui/TenantSessionBootstrapGate.test.ts

      - name: Verify full frontend unit suite
        working-directory: 03_Implement/frontend
        run: npm run test

      - name: Record QA-UNIT fifth-batch evidence
        env:
          RUN_ID: ${{ github.run_id }}
          TESTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md')
          text = path.read_text(encoding='utf-8')
          old_scope = '- Scope: `01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md`、初回実行バッチの`03_Implement/frontend/src/domain/view/hierarchy_level.ts`・同`.test.ts`・`App.tsx`、2026-09-07第2バッチの`03_Implement/frontend/src/ui/TenantSessionRuntimeGate.test.ts`・`03_Implement/frontend/package.json`・`package-lock.json`、第3バッチの`03_Implement/frontend/src/ui/TenantSessionBootstrapGate.test.ts`、および第4バッチの`03_Implement/frontend/src/ui/TenantSessionControl.test.ts`。'
          new_scope = old_scope[:-1] + '、および第5バッチの`03_Implement/frontend/src/ui/TenantChangeConfirmationDialog.test.ts`。'
          if text.count(old_scope) != 1:
              raise SystemExit(f'unexpected Scope count: {text.count(old_scope)}')
          text = text.replace(old_scope, new_scope, 1)

          old_oos = '- Out of Scope: CI設定変更、Vitest全体の`node`環境変更、テスト都合の製品挙動変更。第2〜4バッチは必要なtest fileだけをfile-local `happy-dom`で実行し、対象component本体の挙動は変更しない。'
          new_oos = '- Out of Scope: CI設定変更、Vitest全体の`node`環境変更、テスト都合の製品挙動変更。第2〜5バッチは必要なtest fileだけをfile-local `happy-dom`で実行し、対象component本体の挙動は変更しない。'
          if text.count(old_oos) != 1:
              raise SystemExit(f'unexpected Out of Scope count: {text.count(old_oos)}')
          text = text.replace(old_oos, new_oos, 1)

          marker = '## 2026-09-07 第5バッチ — TenantChangeConfirmationDialogの実keyboard/decision境界'
          if marker in text:
              raise SystemExit('fifth batch evidence already present')
          section = f'''\n\n{marker}\n\n第4バッチ後に次候補を再棚卸ししたところ、`TenantChangeConfirmationDialog.test.ts` は初期focus・Escape cancel・Tab focus trapという重要なdialog挙動を**component source文字列の存在確認だけ**で検証していた。実イベントを一度も発火しておらず、handlerの配線・ref対象・processing遷移が壊れてもsource上の文字列が残ればpassし得るため、第5バッチとして実DOM境界へ置き換えた。\n\n### 選定理由\n\nこのdialogはtenant切替前の未保存変更について `save / discard / cancel` を確定する境界である。誤ったkeyboard decisionやprocessing中の再decisionは、単なる見た目の回帰ではなく、保存・破棄の意味を取り違える可能性がある。したがってDOM component coverage率ではなく、**不可逆性を含むユーザー意思決定の欠陥検知能力**を理由に選定した。\n\n### 追加した実検証\n\n`TenantChangeConfirmationDialog.test.ts`だけをfile-local `happy-dom`へ移し、React `createRoot` + `act` で実componentをmountして次を固定した。製品componentは変更していない。\n\n- 初期focusは安全側の `cancel` buttonへ置かれる。\n- 非processing時の `Escape` はdefaultをpreventし、`onDecision("cancel")` を1回通知する。\n- 最終buttonからの `Tab` はcancelへ、cancelからの `Shift+Tab` は最終buttonへwrapし、dialog外へfocusを逃がさない。\n- `isProcessing=true` へ遷移すると3 decision buttonは全てdisabledになり、processing statusへfocusが移る。\n- processing中の `Escape` はcancel decisionを発火しない。\n- cancel / discard / save buttonの実clickは、それぞれ対応するdecisionを通知する。\n\n従来のSSRによる文言・ARIA契約テストは保持し、source文字列inspectionだけを実挙動テストへ置き換えた。\n\n### 検証結果\n\n- tested branch head: `{os.environ['TESTED_SHA']}`。\n- GitHub Actions run: `{os.environ['RUN_ID']}`。\n- `npm run typecheck`: pass。\n- tenant decision/session focused unit chain: pass。\n- frontend full `npm run test`: pass。\n- planning tests / active issue validator / docs_check / `git diff --check`: pass。\n\n### 判定境界\n\n本バッチはtenant切替dialogのkeyboard/focus/decisionという1欠陥クラスを固定する。`happy-dom`の一律展開やUI coverage率の最大化は引き続き行わず、`QA-UNIT-01` は `In Progress` を維持する。\n'''
          path.write_text(text.rstrip() + section, encoding='utf-8')
          PY

      - name: Retire one-shot workflow before repository guards
        run: rm .github/workflows/lane-c-qa-unit-tenant-change-dialog-r5-once.yml

      - name: Verify planning and docs guards
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m pytest -q 01_Plans/tests
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check
          test ! -e .github/workflows/lane-c-qa-unit-tenant-change-dialog-r5-once.yml
          grep -F -- '- Status: In Progress' 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md
          grep -F '## 2026-09-07 第5バッチ — TenantChangeConfirmationDialogの実keyboard/decision境界' 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md

      - name: Commit verified fifth batch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git status --short
          git diff --cached --stat
          git commit -m 'test(qa): TenantChangeConfirmationDialogの実keyboard境界をunitで固定する'
          git push origin HEAD:${GITHUB_REF_NAME}
