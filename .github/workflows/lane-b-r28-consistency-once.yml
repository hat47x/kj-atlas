name: lane-b-r28-consistency-once

on:
  push:
    branches:
      - lane-b/ai-ir-scale-r28-consistency

permissions:
  contents: write

jobs:
  sync-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/ai-ir-scale-r28-consistency

      - name: Apply R28 consistency sync
        run: |
          python .github/lane-b-r28-sync.py
          git diff --check

      - name: Verify synchronized statements
        run: |
          grep -F 'required relation >400は既にfail-closed' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F 'R25/R27でmeasurement-only候補' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '直近R27 run `33947383473`' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F 'scripts/measure_ai_layout_hierarchical_composition.py' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F 'Statusは引き続きIn Progress' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md

      - name: Commit sync and remove temporary files
        run: |
          rm .github/lane-b-r28-sync.py
          rm .github/workflows/lane-b-r28-consistency-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): sync AI IR scale issue after R22-R27'
          git push origin HEAD:lane-b/ai-ir-scale-r28-consistency
