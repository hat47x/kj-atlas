name: Temporary merge lineage docs verification

on:
  push:
    branches:
      - verify/ai-merge-apply-lineage-docs-20260903-r18

permissions:
  contents: read

jobs:
  verify-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Validate planning and dogfood documents
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
