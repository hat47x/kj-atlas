name: lane-b-r36-provenance-sync-once

on:
  push:
    branches:
      - lane-b/ai-ir-scale-r36-provenance-sync

permissions:
  contents: write

jobs:
  sync-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/ai-ir-scale-r36-provenance-sync
      - name: Apply and verify R36
        run: |
          python .github/lane-b-r36-sync.py
          grep -F 'R35 run `33952594490`' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F 'tests/test_ai_route_provider_call_provenance.py' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F 'R32/R33/R35 analyzer' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '## R36 — R35後のprovider実測readiness同期' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          git diff --check
      - name: Commit sync and remove temporary files
        run: |
          rm .github/lane-b-r36-sync.py
          rm .github/workflows/lane-b-r36-provenance-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): sync provider measurement readiness after R35'
          git push origin HEAD:lane-b/ai-ir-scale-r36-provenance-sync
