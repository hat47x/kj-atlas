name: lane-b-final-system-hold-r2-docs-recheck-once

on:
  push:
    branches:
      - lane-b/final-judgement-system-hold-r2

permissions:
  contents: write

jobs:
  verify-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-system-hold-r2
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run documentation contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              print('non-test docs contract failures:')
              for error in result.errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print(f'non-test docs contracts passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check
      - name: Remove one-shot workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane-b-final-system-hold-r2-docs-recheck-once.yml
          git commit -m "chore(lane-b): remove R2 docs recheck workflow"
          git push origin HEAD:lane-b/final-judgement-system-hold-r2
