name: Temporary lane C Done-at-root path guard verification

on:
  push:
    branches:
      - chore/lane-c-done-root-path-guard-20260904

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-done-root-path-guard-20260904
          fetch-depth: 0
      - name: Run lifecycle and planning checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest \
            01_Plans/issues/tests/test_issue_lifecycle_contract.py \
            01_Plans/issues/tests/test_validate_active_issue_memos.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python 03_Implement/backend/scripts/check_design_consistency.py
          python - <<'PY'
          import json
          from pathlib import Path
          import re

          root = Path('01_Plans/issues')
          manifest = json.loads((root / 'legacy_done_at_root_r18.json').read_text(encoding='utf-8'))
          legacy = set(manifest['paths'])
          status_re = re.compile(r'^- Status:\s*Done\s*$', re.M)
          current = {
              path.name
              for path in root.glob('issue-*.md')
              if status_re.search(path.read_text(encoding='utf-8'))
          }
          unexpected = sorted(current - legacy)
          print(f'identity_manifest_paths={len(legacy)}')
          print(f'current_done_at_root={len(current)}')
          print(f'unexpected_done_at_root={len(unexpected)}')
          if unexpected:
              raise SystemExit(f'unexpected Done-at-root paths: {unexpected}')
          PY
          git diff --check
      - name: Remove one-shot workflow after successful verification
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-done-root-path-verify-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove verified lane C Done-at-root path workflow'
          git push origin HEAD:chore/lane-c-done-root-path-guard-20260904
