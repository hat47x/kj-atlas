name: Lane B2 tenant claim name public contract once

on:
  push:
    branches:
      - fix/lane-b2-tenant-claim-name-contract-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch tenant claim name contract and add focused test
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              raw = path.read_bytes()
              old_b = old.encode('utf-8')
              if raw.count(old_b) != 1:
                  raise SystemExit(f'{path}: expected one target, got {raw.count(old_b)}')
              path.write_bytes(raw.replace(old_b, new.encode('utf-8')))

          registry = Path('02_Architecture/runtime_parameter_registry.md')
          replace_once(
              registry,
              '`KJ_ATLAS_TENANT_CLAIM_NAME=tenant_ref`',
              '`KJ_ATLAS_TENANT_CLAIM_NAME` の検証済み非空claim名（未指定は既定 `tenant_ref`）',
          )
          replace_once(
              registry,
              '| `KJ_ATLAS_TENANT_CLAIM_NAME` | `tenant_ref` | JWT 内の tenant 外部識別子を運ぶ claim 名。`tenant_identity_providers.external_tenant_ref` と照合する。 | direct | 通常値 | 指定 claim が存在しない JWT が 401 で拒否されることを確認する |',
              '| `KJ_ATLAS_TENANT_CLAIM_NAME` | `tenant_ref` | trusted JWT 内の tenant 外部識別子を運ぶclaim名。既定は `tenant_ref` だが固定名ではなく、Settings validationを通るカスタム名を指定できる。値は `tenant_identity_providers.external_tenant_ref` と照合する | direct | 通常値 | カスタムclaim名を設定するとauth edgeがそのclaimを参照し、指定claimが存在しないJWTは401で拒否されることを確認する |',
          )

          replace_once(
              Path('04_Documentation/configuration.md'),
              '| `KJ_ATLAS_TENANT_CLAIM_NAME` | `tenant_ref` | JWT 内の tenant 外部識別子を運ぶ claim 名。`tenant_identity_providers.external_tenant_ref` と照合。 |',
              '| `KJ_ATLAS_TENANT_CLAIM_NAME` | `tenant_ref` | trusted JWT 内の tenant 外部識別子を運ぶclaim名。`tenant_ref` は既定値で固定名ではない。非空・256文字以下・前後空白なし・空白文字なし・printableなカスタム名を指定でき、値は `tenant_identity_providers.external_tenant_ref` と照合する。 |',
          )
          PY

          cat > 01_Plans/tests/test_tenant_claim_name_public_contract.py <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[2]
          SETTINGS = ROOT / '03_Implement/backend/src/kj_atlas_api/settings.py'
          AUTH_EDGE = ROOT / '03_Implement/backend/src/kj_atlas_api/trusted_auth_edge.py'
          RUNTIME = ROOT / '03_Implement/backend/src/kj_atlas_api/trusted_saas_runtime.py'
          CONFIG = ROOT / '04_Documentation/configuration.md'
          REGISTRY = ROOT / '02_Architecture/runtime_parameter_registry.md'

          class TenantClaimNamePublicContractTest(unittest.TestCase):
              def test_settings_default_is_not_runtime_fixed_requirement(self) -> None:
                  settings = SETTINGS.read_text(encoding='utf-8')
                  self.assertIn('default="tenant_ref"', settings)
                  self.assertIn('KJ_ATLAS_TENANT_CLAIM_NAME must not be empty', settings)
                  self.assertIn('KJ_ATLAS_TENANT_CLAIM_NAME must be ≤ 256 characters', settings)
                  self.assertIn('KJ_ATLAS_TENANT_CLAIM_NAME must not have leading/trailing whitespace', settings)
                  self.assertIn('KJ_ATLAS_TENANT_CLAIM_NAME must not contain spaces', settings)

                  runtime_source = RUNTIME.read_text(encoding='utf-8')
                  tree = ast.parse(runtime_source)
                  validate = next(
                      node for node in ast.walk(tree)
                      if isinstance(node, ast.FunctionDef) and node.name == 'validate'
                      and isinstance(getattr(node, 'parent', None), type(None))
                  ) if False else None
                  self.assertIn('(bool(self.tenant_claim_name.strip()), "tenant claim name set")', runtime_source)
                  self.assertNotIn('self.tenant_claim_name == "tenant_ref"', runtime_source)

              def test_auth_edge_reads_configured_claim_name(self) -> None:
                  edge = AUTH_EDGE.read_text(encoding='utf-8')
                  self.assertIn('tenant_claim_name = settings.tenant_claim_name', edge)
                  self.assertIn('verified_claims.get(tenant_claim_name)', edge)

              def test_public_surfaces_distinguish_default_from_requirement(self) -> None:
                  registry = REGISTRY.read_text(encoding='utf-8')
                  config = CONFIG.read_text(encoding='utf-8')
                  self.assertNotIn('`KJ_ATLAS_TENANT_CLAIM_NAME=tenant_ref`', registry)
                  self.assertIn('未指定は既定 `tenant_ref`', registry)
                  self.assertIn('固定名ではなく', registry)
                  self.assertIn('`tenant_ref` は既定値で固定名ではない', config)
                  self.assertIn('カスタム名を指定でき', config)

          if __name__ == '__main__':
              unittest.main()
          PY
      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans.tests.test_tenant_claim_name_public_contract -v
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check
          changed="$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u )"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx '01_Plans/tests/test_tenant_claim_name_public_contract.py'
          printf '%s\n' "$changed" | grep -Fx '02_Architecture/runtime_parameter_registry.md'
          printf '%s\n' "$changed" | grep -Fx '04_Documentation/configuration.md'
          test "$(git diff --numstat -- 04_Documentation/configuration.md | awk '{print $1 ":" $2}')" = '1:1'
      - name: Commit verified payload and retire helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_Plans/tests/test_tenant_claim_name_public_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git rm .github/workflows/lane-b2-tenant-claim-name-contract-once.yml
          git commit -m 'docs(auth): tenant claim名の既定値と必須性を分離する'
          git push origin HEAD:fix/lane-b2-tenant-claim-name-contract-20260907
