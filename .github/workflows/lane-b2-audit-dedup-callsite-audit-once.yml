name: Lane B2 audit dedup callsite audit once

on:
  push:
    branches:
      - audit/lane-b2-audit-dedup-scope-20260907

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate production emit callsites
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          root = Path('03_Implement/backend/src/kj_atlas_api')
          calls = []
          for path in sorted(root.rglob('*.py')):
              text = path.read_text(encoding='utf-8')
              tree = ast.parse(text)
              for node in ast.walk(tree):
                  if not isinstance(node, ast.Call) or not isinstance(node.func, ast.Attribute):
                      continue
                  if node.func.attr != 'emit':
                      continue
                  receiver = ast.get_source_segment(text, node.func.value) or ''
                  first_arg = ast.get_source_segment(text, node.args[0]) if node.args else ''
                  kw_names = [kw.arg for kw in node.keywords]
                  call = ast.get_source_segment(text, node) or '<unavailable>'
                  calls.append((str(path), node.lineno, receiver, first_arg or '', kw_names, call))

          print(f'production .emit calls: {len(calls)}')
          for path, lineno, receiver, first_arg, kw_names, call in calls:
              print('CALL', path, lineno)
              print(' receiver:', receiver)
              print(' first_arg:', first_arg)
              print(' keywords:', kw_names)
              print(' source:', call)
          if not calls:
              raise SystemExit('no production .emit callsites found; audit cannot establish scope')
          PY
      - name: Retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-audit-dedup-callsite-audit-once.yml
          git commit -m 'ci(b2): retire audit dedup callsite audit'
          git push
