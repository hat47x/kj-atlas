name: Temporary R22 stale reintroduction verification

on:
  push:
    branches:
      - dogfood/r22-stale-branch-reintroduction-20260904

permissions:
  contents: write

jobs:
  verify-r22:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Refresh current main ref
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Register R22 in cognitive dogfood index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("01_Plans/dogfood/cognitive-dogfood-index.md")
          text = path.read_text(encoding="utf-8")
          marker = (
              "- `doc_kj_atlas_dogfood_r21.json`\n"
              "  - R21のKJキャンバス。commit距離と意味ドリフトを分け、元portfolioを書き換えず後段のcurrent-state replicationで現在性を確かめる構造を保持する。\n"
          )
          addition = marker + (
              "- `cognitive-dogfood-continuous-2026-09-04-r22.md`\n"
              "  - R22。古いbranch一般を禁止せず、merge-baseからcurrent mainとbranchの状態反転候補をmerge前に絞る診断へ変換した記録。既知path guard、path-level診断、typecheck/test・人間reviewの役割を分離する。\n"
              "- `doc_kj_atlas_dogfood_r22.json`\n"
              "  - R22のKJキャンバス。workflow・Issue lifecycle・frontend sourceで再現したstale state再流入を束ね、commit距離ではなく状態の向きが逆転する場所を見る構造を保持する。\n"
          )
          if "cognitive-dogfood-continuous-2026-09-04-r22.md" in text:
              raise SystemExit("R22 is already registered in cognitive-dogfood-index.md")
          if text.count(marker) != 1:
              raise SystemExit(f"expected exactly one R21 index marker, got {text.count(marker)}")
          path.write_text(text.replace(marker, addition), encoding="utf-8")
          PY

      - name: Run stale reintroduction synthetic tests
        working-directory: 01_Plans
        run: python -m unittest -v test_check_stale_merge_reintroduction.py

      - name: Validate dogfood and planning contracts
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          if data.get('errors'):
              raise SystemExit(f"triage errors: {data['errors']}")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          PY
          git diff --check

      - name: Diagnose this branch against current main
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/check_stale_merge_reintroduction.py \
            --base-ref origin/main \
            --head-ref HEAD \
            --json | tee /tmp/r22-diagnostic.json
          python 01_Plans/check_stale_merge_reintroduction.py \
            --base-ref origin/main \
            --head-ref HEAD \
            --fail-on-strong

      - name: Remove one-shot workflow after successful verification
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r22-stale-reintroduction-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: R22 one-shot検証足場を撤去"
          git push origin HEAD:dogfood/r22-stale-branch-reintroduction-20260904
