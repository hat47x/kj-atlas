name: Lane B2 SaaS profile relations audit once

on:
  push:
    branches:
      - audit/lane-b2-saas-profile-relations-20260908

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit SaaS startup and request-time relations
        run: |
          python - <<'PY'
          from pathlib import Path

          runtime = Path('03_Implement/backend/src/kj_atlas_api/trusted_saas_runtime.py').read_text(encoding='utf-8')
          config = Path('04_Documentation/configuration.md').read_text(encoding='utf-8')
          registry = Path('02_Architecture/runtime_parameter_registry.md').read_text(encoding='utf-8')

          policy = runtime.split('class TrustedSaasRuntimePolicy:', 1)[1].split('class TrustedSaasRuntimeComponents:', 1)[0]
          required_policy_terms = (
              'self.database_backend == "postgresql"',
              'not self.allow_jit_provisioning',
              'self.access_control_adapter == "external_http"',
              'self.access_control_fail_safe_mode == "deny"',
              'self.document_policy_binding_resolver == "external_http"',
              'self.tenant_capability_resolver == "external_http"',
              'self.saas_oauth_broker_http_authorize_endpoint is not None',
              'self.saas_auth_session_hash_key is not None',
          )
          for term in required_policy_terms:
              if term not in policy:
                  raise SystemExit(f'trusted SaaS startup policy shape drifted: {term}')

          config_profile = config.split('## Runtime profiles（推奨プロファイル）', 1)[1].split('## 最小設定', 1)[0]
          required_config_terms = (
              'PostgreSQL',
              '外部PDP/document binding/tenant capability',
              'JIT無効',
              'deny fail-safe',
              'OAuth authorize endpoint',
              'auth-session hash key',
          )
          for term in required_config_terms:
              if term not in config_profile:
                  raise SystemExit(f'configuration SaaS hard-gate description drifted: {term}')

          # Token endpoint / redirect URI / client credentials are request-time
          # OAuth completeness, not TrustedSaasRuntimePolicy startup hard gates.
          request_time_terms = (
              'redirect URI + client ID',
              'token endpoint + redirect URI + client ID + client secret',
              '起動hard gateではなく',
          )
          for term in request_time_terms:
              if term not in config_profile:
                  raise SystemExit(f'configuration OAuth request-time boundary drifted: {term}')

          registry_profile = registry.split('## Profile selection criteria', 1)[1].split('## Backend settings', 1)[0]
          for term in ('PostgreSQL', 'external_http', 'deny', 'OAuth', 'hash key'):
              if term not in registry_profile:
                  raise SystemExit(f'registry SaaS profile criteria drifted: {term}')

          print('SaaS startup hard gates and OAuth request-time boundary are aligned')
          PY
      - name: Retire one-shot workflow
        if: success()
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-saas-profile-relations-audit-once.yml
          git commit -m "ci: retire Lane B2 SaaS profile relations audit"
          git push
