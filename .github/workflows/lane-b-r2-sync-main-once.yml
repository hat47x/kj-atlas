name: lane-b-r2-sync-main-once

on:
  push:
    branches:
      - lane-b/final-judgement-system-hold-r2

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-system-hold-r2
          fetch-depth: 0
      - name: Merge current main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest
      - name: Run R2 regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q tests/test_final_judgement_system_hold.py tests/test_final_judgement_proposal_linkage.py tests/test_ai_eval_pipeline.py
          python -m compileall -q src/kj_atlas_api
      - name: Run repository contract checks
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              for error in result.errors:
                  print(error)
              raise SystemExit(1)
          print(f'docs contract checks passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check
      - name: Remove one-shot workflow and push sync
        run: |
          git rm .github/workflows/lane-b-r2-sync-main-once.yml
          git commit -m "chore(lane-b): sync R2 with current main"
          git push origin HEAD:lane-b/final-judgement-system-hold-r2
