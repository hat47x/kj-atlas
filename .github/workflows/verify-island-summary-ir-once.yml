name: 表札候補IR回帰検証（一回限り）

on:
  push:
    branches:
      - feat/island-summary-ir-context-20260903

permissions:
  contents: write

jobs:
  verify:
    name: 表札候補IRの配線と回帰を検証する
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 03_Implement/backend
    steps:
      - name: 作業ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: feat/island-summary-ir-context-20260903
          fetch-depth: 0

      - name: Pythonを準備する
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: テスト依存を導入する
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: 変更箇所をlintする
        run: |
          ruff check \
            src/kj_atlas_api/island_summary_ir.py \
            src/kj_atlas_api/routes/ai.py \
            tests/test_ai_island_summary_ir.py \
            tests/test_ai_llm_input_ir_coverage.py \
            tests/test_ai_prompt.py

      - name: 表札候補IRと既存promptの回帰を検証する
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: |
          pytest -q \
            tests/test_ai_island_summary_ir.py \
            tests/test_ai_llm_input_ir_coverage.py \
            tests/test_ai_prompt.py

      - name: 成功した一時workflowを除去する
        if: success()
        working-directory: .
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-island-summary-ir-once.yml
          git commit -m "chore: 一回限りの表札候補IR検証workflowを除去する"
          git push origin HEAD:feat/island-summary-ir-context-20260903
