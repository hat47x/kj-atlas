name: lane-b-route-b-characterization-retry2

on:
  push:
    branches:
      - lane-b/route-b-projection-characterization

permissions:
  contents: write

jobs:
  characterize-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/route-b-projection-characterization

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Materialize characterization sources
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/lane-b-route-b-characterization-once.yml').read_text(encoding='utf-8')
          targets = [
              '03_Implement/backend/scripts/measure_ai_route_projection_candidates.py',
              '03_Implement/backend/tests/test_ai_route_projection_candidates.py',
          ]
          for target in targets:
              marker = "          cat > " + target + " <<'PY'\n"
              start = workflow.index(marker) + len(marker)
              end = workflow.index("\n          PY", start)
              block = workflow[start:end]
              lines = []
              for line in block.splitlines():
                  lines.append(line[10:] if line.startswith('          ') else line)
              path = Path(target)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run characterization and regression
        working-directory: 03_Implement/backend
        shell: bash
        run: |
          set -o pipefail
          python -m scripts.measure_ai_route_projection_candidates
          python -m pytest -q \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_required_meaning_scale.py \
            tests/test_ai_route_prompt_coverage.py \
            tests/test_ai_ir_budget_pressure.py

      - name: Lint and hygiene
        working-directory: 03_Implement/backend
        shell: bash
        run: |
          python -m ruff check \
            scripts/measure_ai_route_projection_candidates.py \
            tests/test_ai_route_projection_candidates.py
          cd ../..
          git diff --check

      - name: Commit tested characterization and remove temporary workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/lane-b-route-b-characterization-once.yml \
            .github/workflows/lane-b-route-b-characterization-retry.yml \
            .github/workflows/lane-b-route-b-characterization-retry2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            03_Implement/backend/scripts/measure_ai_route_projection_candidates.py \
            03_Implement/backend/tests/test_ai_route_projection_candidates.py \
            .github/workflows/lane-b-route-b-characterization-once.yml \
            .github/workflows/lane-b-route-b-characterization-retry.yml \
            .github/workflows/lane-b-route-b-characterization-retry2.yml
          git commit -m "test(ai): characterize route-specific scale projections"
          git push origin HEAD:lane-b/route-b-projection-characterization
