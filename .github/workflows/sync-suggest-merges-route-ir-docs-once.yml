name: suggest-merges route IR docs sync (one-shot)

on:
  push:
    branches:
      - feat/suggest-merges-route-ir-20260903

permissions:
  contents: write

jobs:
  validate-and-sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/suggest-merges-route-ir-20260903
          fetch-depth: 0

      - name: Synchronize canonical documents
        run: python .github/scripts/sync_suggest_merges_route_ir_docs_once.py

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Verify merge IR and route inventory
        working-directory: 03_Implement/backend
        run: |
          pytest tests/test_ai_merge_ir.py -q
          pytest tests/test_ai_merge_semantics.py -q
          pytest tests/test_ai_llm_input_ir_coverage.py -q
          ruff check src tests/test_ai_merge_ir.py tests/test_ai_merge_semantics.py tests/test_ai_llm_input_ir_coverage.py

      - name: Verify planning documents
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage.txt
          test -s /tmp/triage.txt
          git diff --check

      - name: Remove one-shot files and commit synchronized documents
        run: |
          rm .github/workflows/sync-suggest-merges-route-ir-docs-once.yml
          rm .github/scripts/sync_suggest_merges_route_ir_docs_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: suggest-merges route IRの正本を同期する'
          git push origin HEAD:feat/suggest-merges-route-ir-20260903
