  frontend-lint:
    name: Frontend lint (staged rollout)
    runs-on: ubuntu-latest
    env:
      FRONTEND_LINT_PHASE: ${{ vars.FRONTEND_LINT_PHASE || 'B' }}
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=lts/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Validate lint phase value
        run: |
          case "${FRONTEND_LINT_PHASE}" in
            A|B|C) ;;
            *)
              echo "Invalid FRONTEND_LINT_PHASE=${FRONTEND_LINT_PHASE}. Use A, B, or C." >&2
              exit 1
              ;;
          esac

      - name: Lint (run and capture outcome)
        id: lint
        continue-on-error: true
        run: ${{ steps.pm.outputs.run }} lint

      - name: Enforce lint gate by phase
        if: always()
        run: |
          echo "frontend lint phase: ${FRONTEND_LINT_PHASE}" >> "$GITHUB_STEP_SUMMARY"
          echo "lint step outcome: ${{ steps.lint.outcome }}" >> "$GITHUB_STEP_SUMMARY"
          echo "lint fail-on-error policy: A=warn-only, B/C=fail" >> "$GITHUB_STEP_SUMMARY"

          if [ "${FRONTEND_LINT_PHASE}" = "A" ] && [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Phase A: warning-only mode. Lint failures are reported but do not fail CI." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ steps.lint.outcome }}" != "success" ]; then
            echo "Phase ${FRONTEND_LINT_PHASE}: fail-on-error mode. Fix lint violations before merge." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "Phase ${FRONTEND_LINT_PHASE}: lint gate passed." >> "$GITHUB_STEP_SUMMARY"

  frontend-typecheck:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=lts/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Typecheck
        run: ${{ steps.pm.outputs.run }} typecheck

      - name: Record typecheck responsibility
        if: always()
        run: |
          echo "frontend-typecheck: fail-on-error (always)" >> "$GITHUB_STEP_SUMMARY"

  frontend-test:
    name: Frontend test + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node version
        id: node
        run: |
          if [ -f .nvmrc ]; then
            echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=lts/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: ${{ steps.pm.outputs.install }}

      - name: Test
        run: ${{ steps.pm.outputs.run }} test

      - name: Build
        run: ${{ steps.pm.outputs.run }} build

      - name: Record test/build responsibility
        if: always()
        run: |
          echo "frontend-test: fail-on-error (always)" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend lint + test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kj_atlas
          POSTGRES_USER: kj_atlas
          POSTGRES_PASSWORD: kj_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kj_atlas -d kj_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: 03_Implement/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" ruff alembic psycopg[binary]

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Test (SQLite)
        env:
          DATABASE_URL: sqlite:///./kj_atlas.db
        run: pytest -m "not postgres"

      - name: Migrate PostgreSQL schema
        env:
          DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: alembic upgrade head

      - name: Test (PostgreSQL)
        env:
          RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: pytest -m postgres
