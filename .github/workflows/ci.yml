name: CI

on:
  push:
  pull_request:

jobs:
  change-scope:
    name: Detect application change scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
      mcp: ${{ steps.scope.outputs.mcp }}
      base_commit: ${{ steps.scope.outputs.base_commit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$' && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base_commit="$before"
            else
              base_commit="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          echo "base_commit=${base_commit}" >> "$GITHUB_OUTPUT"

          git diff --name-only "$base_commit" HEAD | python 01_Plans/ci_change_scope.py >> "$GITHUB_OUTPUT"

  docs-contract:
    name: Docs contract (fail-closed repository rules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs contract checks
        run: python 01_Plans/docs_check.py

      - name: Check changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail

          # NOTE: this resolution intentionally differs from change-scope.outputs.base_commit
          # and must not be replaced by it. On a push to a non-default branch this job diffs
          # against the merge-base with the default branch (the whole branch), whereas
          # change-scope uses github.event.before (only the newly pushed commits). This job is
          # also a fail-closed gate that deliberately runs without `needs:` on any other job.
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          elif [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$' && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base_commit="$before"
            else
              base_commit="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          git diff --check "$base_commit" HEAD

  frontend-typecheck:
    name: Frontend typecheck
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup frontend toolchain
        id: setup
        uses: ./.github/actions/setup-frontend
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck
        run: ${{ steps.setup.outputs.run }} typecheck

  frontend-test:
    name: Frontend test + build
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup frontend toolchain
        id: setup
        uses: ./.github/actions/setup-frontend
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        run: ${{ steps.setup.outputs.run }} test

      - name: Build
        run: ${{ steps.setup.outputs.run }} build

  mcp:
    name: MCP typecheck + test
    needs: change-scope
    if: needs.change-scope.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 03_Implement/mcp
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: 03_Implement/mcp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  backend:
    name: Backend lint + test
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kj_atlas
          POSTGRES_USER: kj_atlas
          POSTGRES_PASSWORD: kj_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kj_atlas -d kj_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: kj_atlas
          MYSQL_ROOT_PASSWORD: kj_atlas
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pkj_atlas --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: kj_atlas
          MARIADB_ROOT_PASSWORD: kj_atlas
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mariadb-admin ping -h 127.0.0.1 -uroot -pkj_atlas --silent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: KjAtlas_CI_2026!
          MSSQL_PID: Developer
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'KjAtlas_CI_2026!' -C -Q 'SELECT 1' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    defaults:
      run:
        working-directory: 03_Implement/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate documentation and AI entrypoint contracts
        working-directory: .
        run: python 01_Plans/docs_check.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,mysql,mssql,cockroachdb]" alembic uvicorn

      - name: Start CockroachDB
        run: |
          docker run --name kj-atlas-cockroach-ci --detach --publish 26257:26257 \
            cockroachdb/cockroach:v26.2.3 \
            start-single-node --insecure --advertise-addr=localhost
          for attempt in $(seq 1 30); do
            if docker exec kj-atlas-cockroach-ci cockroach sql --insecure \
              --host=localhost:26257 --execute='SELECT 1' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs kj-atlas-cockroach-ci
          exit 1

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Detect auth boundary changes (Level2判定)
        id: auth_changes
        working-directory: .
        run: |
          set -euo pipefail

          base_commit="${{ needs.change-scope.outputs.base_commit }}"

          changed_files="$(git diff --name-only "$base_commit" HEAD)"
          idp_boundary=false

          while IFS= read -r file; do
            case "$file" in
              03_Implement/backend/src/kj_atlas_api/auth_context.py|\
              03_Implement/backend/src/kj_atlas_api/settings.py|\
              03_Implement/backend/tests/test_auth_provider_profile_fixture.py|\
              03_Implement/backend/tests/fixtures/provider_profile_*.json|\
              03_Implement/backend/tests/federation/*|\
              03_Implement/backend/tests/federation/**|\
              03_Implement/backend/tests/scripts/run_auth_level2.sh)
                idp_boundary=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "idp_boundary=${idp_boundary}" >> "$GITHUB_OUTPUT"

      - name: Resolve Auth Level2 requirement flag
        id: auth_level2
        run: |
          required="${{ steps.auth_changes.outputs.idp_boundary }}"
          reason="paths-filter"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'auth-level2-required') }}" = "true" ]; then
              required="true"
              reason="pr-label"
            fi
          fi

          echo "required=${required}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Test (SQLite except auth level suites)
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: pytest -m "not postgres and not mysql and not mssql and not cockroachdb and not auth_level1 and not auth_level2"

      - name: Test (Auth Level1 required)
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: pytest -m auth_level1

      - name: Test (Auth Level2 conditional)
        if: steps.auth_level2.outputs.required == 'true'
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: tests/scripts/run_auth_level2.sh

      - name: Upload Auth Level2 diagnostics
        if: always() && steps.auth_level2.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auth-level2-diagnostics
          path: 03_Implement/backend/.artifacts/auth-level2/
          if-no-files-found: warn

      - name: Record Auth Level2 necessity
        if: always()
        run: |
          if [ "${{ steps.auth_level2.outputs.required }}" = "true" ]; then
            echo "Auth Level2: required (reason=${{ steps.auth_level2.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
            echo "Auth Level2 diagnostics: artifact auth-level2-diagnostics" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auth Level2: not required (IdP境界変更なし)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Migrate PostgreSQL schema
        env:
          KJ_ATLAS_DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: alembic upgrade head

      - name: Test (PostgreSQL)
        env:
          KJ_ATLAS_RUN_PG_TESTS: "1"
          KJ_ATLAS_DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: pytest -m postgres

      - name: Test (MySQL family)
        env:
          KJ_ATLAS_RUN_MYSQL_TESTS: "1"
          KJ_ATLAS_TEST_MYSQL_URL: mysql+pymysql://root:kj_atlas@127.0.0.1:3306/kj_atlas
          KJ_ATLAS_TEST_MARIADB_URL: mariadb+pymysql://root:kj_atlas@127.0.0.1:3307/kj_atlas
        run: pytest -m mysql

      - name: Test (SQL Server)
        env:
          KJ_ATLAS_RUN_MSSQL_TESTS: "1"
          KJ_ATLAS_TEST_MSSQL_URL: mssql+pymssql://sa:KjAtlas_CI_2026%21@127.0.0.1:1433/kj_atlas
        run: pytest -m mssql

      - name: Test (CockroachDB)
        env:
          KJ_ATLAS_RUN_COCKROACHDB_TESTS: "1"
          KJ_ATLAS_TEST_COCKROACHDB_URL: cockroachdb+psycopg://root@127.0.0.1:26257/kj_atlas?sslmode=disable
        run: pytest -m cockroachdb
