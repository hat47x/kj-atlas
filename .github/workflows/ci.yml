            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: |
          install_cmd="${{ steps.pm.outputs.install }}"
          for attempt in 1 2 3; do
            echo "Install attempt ${attempt}/3"
            $install_cmd && break
            if [ "$attempt" = "3" ]; then
              echo "All install attempts failed" >&2
              exit 1
            fi
            echo "Retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Validate lint phase value
        run: |
          case "${FRONTEND_LINT_PHASE}" in
            A|B|C) ;;
            *)
              echo "Invalid FRONTEND_LINT_PHASE=${FRONTEND_LINT_PHASE}. Use A, B, or C." >&2
              exit 1
              ;;
          esac

      - name: Lint (run and capture outcome)
        id: lint
        continue-on-error: true
        run: ${{ steps.pm.outputs.run }} lint

      - name: Enforce lint gate by phase
        if: always()
        run: |
          summary_file="${GITHUB_STEP_SUMMARY:-/tmp/kj-atlas-ci-summary.txt}"
          phase="${FRONTEND_LINT_PHASE:-unset}"
          lint_outcome="${{ steps.lint.outcome }}"

          echo "frontend lint phase: ${phase}" >> "$summary_file"
          echo "lint step outcome: ${lint_outcome}" >> "$summary_file"
          echo "lint fail-on-error policy: A=warn-only, B/C=fail" >> "$summary_file"

          if [ "${phase}" = "A" ] && [ "${lint_outcome}" != "success" ]; then
            echo "Phase A: warning-only mode. Lint failures are reported but do not fail CI." >> "$summary_file"
            exit 0
          fi

          if [ "${lint_outcome}" != "success" ]; then
            echo "Phase ${phase}: fail-on-error mode. Fix lint violations before merge." >> "$summary_file"
            exit 1
          fi

          echo "Phase ${phase}: lint gate passed." >> "$summary_file"

