name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kj_atlas
          POSTGRES_USER: kj_atlas
          POSTGRES_PASSWORD: kj_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kj_atlas -d kj_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: 03_Implement/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]" ruff alembic psycopg[binary]

      - name: Ruff
        run: ruff check src tests

      - name: Mypy (if configured)
        run: |
          if [ -f "mypy.ini" ]; then
            pip install mypy
            mypy src
          elif [ -f "setup.cfg" ] && rg -n "\[mypy\]" setup.cfg >/dev/null; then
            pip install mypy
            mypy src
          elif [ -f "pyproject.toml" ] && rg -n "\[tool\.mypy\]" pyproject.toml >/dev/null; then
            pip install mypy
            mypy src
          else
            echo "mypy is not configured; skipping"
          fi

      - name: Pytest (SQLite)
        run: pytest -m "not postgres"

      - name: Migrate PostgreSQL schema
        env:
          DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: alembic upgrade head

      - name: Pytest (PostgreSQL)
        env:
          RUN_PG_TESTS: "1"
          DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: pytest -m postgres

  frontend:
    name: Frontend typecheck build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
