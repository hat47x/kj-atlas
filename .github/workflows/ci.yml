name: CI

on:
  push:
  pull_request:

jobs:
  change-scope:
    name: Detect application change scope
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      frontend: ${{ steps.scope.outputs.frontend }}
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: scope
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$' && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base_commit="$before"
            else
              base_commit="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          git diff --name-only "$base_commit" HEAD | python 01_Plans/ci_change_scope.py >> "$GITHUB_OUTPUT"

  docs-contract:
    name: Docs contract (fail-closed repository rules)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run docs contract checks
        run: python 01_Plans/docs_check.py

      - name: Check changed-file whitespace
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          elif [ "${{ github.ref_type }}" = "branch" ] && [ "${{ github.ref_name }}" != "${{ github.event.repository.default_branch }}" ]; then
            git fetch --no-tags origin "${{ github.event.repository.default_branch }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$' && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base_commit="$before"
            else
              base_commit="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          git diff --check "$base_commit" HEAD

  frontend-typecheck:
    name: Frontend typecheck
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node version
        id: node
        run: |
          if [ -f "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "version=$(cat "$GITHUB_WORKSPACE/.nvmrc")" >> "$GITHUB_OUTPUT"
          else
            echo "version=lts/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: 03_Implement/frontend/${{ steps.pm.outputs.lockfile }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: |
          install_cmd="${{ steps.pm.outputs.install }}"
          for attempt in 1 2 3; do
            echo "Install attempt ${attempt}/3"
            $install_cmd && break
            if [ "$attempt" = "3" ]; then
              echo "All install attempts failed" >&2
              exit 1
            fi
            echo "Retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Typecheck
        run: ${{ steps.pm.outputs.run }} typecheck

      - name: Record typecheck responsibility
        if: always()
        run: |
          echo "frontend-typecheck: fail-on-error (always)" >> "$GITHUB_STEP_SUMMARY"

  frontend-test:
    name: Frontend test + build
    needs: change-scope
    if: needs.change-scope.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: 03_Implement/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Node version
        id: node
        run: |
          if [ -f "$GITHUB_WORKSPACE/.nvmrc" ]; then
            echo "version=$(cat "$GITHUB_WORKSPACE/.nvmrc")" >> "$GITHUB_OUTPUT"
          else
            echo "version=lts/*" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect package manager
        id: pm
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=pnpm" >> "$GITHUB_OUTPUT"
            echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
          elif [ -f yarn.lock ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
            echo "run=yarn" >> "$GITHUB_OUTPUT"
            echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
          elif [ -f package-lock.json ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "install=npm ci" >> "$GITHUB_OUTPUT"
            echo "run=npm run" >> "$GITHUB_OUTPUT"
            echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
          else
            echo "No supported lockfile found" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: ${{ steps.pm.outputs.manager }}
          cache-dependency-path: 03_Implement/frontend/${{ steps.pm.outputs.lockfile }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable corepack (pnpm/yarn)
        if: steps.pm.outputs.manager != 'npm'
        run: corepack enable

      - name: Install dependencies
        run: |
          install_cmd="${{ steps.pm.outputs.install }}"
          for attempt in 1 2 3; do
            echo "Install attempt ${attempt}/3"
            $install_cmd && break
            if [ "$attempt" = "3" ]; then
              echo "All install attempts failed" >&2
              exit 1
            fi
            echo "Retrying in $((attempt * 15))s..."
            sleep $((attempt * 15))
          done

      - name: Test
        run: ${{ steps.pm.outputs.run }} test

      - name: Build
        run: ${{ steps.pm.outputs.run }} build

      - name: Record test/build responsibility
        if: always()
        run: |
          echo "frontend-test: fail-on-error (always)" >> "$GITHUB_STEP_SUMMARY"

  backend:
    name: Backend lint + test
    needs: change-scope
    if: needs.change-scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kj_atlas
          POSTGRES_USER: kj_atlas
          POSTGRES_PASSWORD: kj_atlas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kj_atlas -d kj_atlas"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: 03_Implement/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate documentation and AI entrypoint contracts
        working-directory: .
        run: python 01_Plans/docs_check.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]" alembic psycopg[binary] uvicorn

      - name: Lint (ruff)
        run: ruff check src tests

      - name: Detect auth boundary changes (Level2判定)
        id: auth_changes
        working-directory: .
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags origin "${{ github.base_ref }}"
            base_commit="$(git merge-base FETCH_HEAD HEAD)"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] && ! printf '%s' "$before" | grep -Eq '^0+$' && git cat-file -e "${before}^{commit}" 2>/dev/null; then
              base_commit="$before"
            else
              base_commit="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          changed_files="$(git diff --name-only "$base_commit" HEAD)"
          idp_boundary=false

          while IFS= read -r file; do
            case "$file" in
              03_Implement/backend/src/kj_atlas_api/auth_context.py|\
              03_Implement/backend/src/kj_atlas_api/settings.py|\
              03_Implement/backend/tests/test_auth_provider_profile_fixture.py|\
              03_Implement/backend/tests/fixtures/provider_profile_*.json|\
              03_Implement/backend/tests/federation/*|\
              03_Implement/backend/tests/federation/**|\
              03_Implement/backend/tests/scripts/run_auth_level2.sh)
                idp_boundary=true
                break
                ;;
            esac
          done <<< "$changed_files"

          echo "idp_boundary=${idp_boundary}" >> "$GITHUB_OUTPUT"

      - name: Resolve Auth Level2 requirement flag
        id: auth_level2
        run: |
          required="${{ steps.auth_changes.outputs.idp_boundary }}"
          reason="paths-filter"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'auth-level2-required') }}" = "true" ]; then
              required="true"
              reason="pr-label"
            fi
          fi

          echo "required=${required}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"

      - name: Test (SQLite except auth level suites)
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: pytest -m "not postgres and not auth_level1 and not auth_level2"

      - name: Test (Auth Level1 required)
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: pytest -m auth_level1

      - name: Test (Auth Level2 conditional)
        if: steps.auth_level2.outputs.required == 'true'
        env:
          KJ_ATLAS_DATABASE_URL: sqlite:///./kj_atlas.db
        run: tests/scripts/run_auth_level2.sh

      - name: Upload Auth Level2 diagnostics
        if: always() && steps.auth_level2.outputs.required == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: auth-level2-diagnostics
          path: 03_Implement/backend/.artifacts/auth-level2/
          if-no-files-found: warn

      - name: Record Auth Level2 necessity
        if: always()
        run: |
          if [ "${{ steps.auth_level2.outputs.required }}" = "true" ]; then
            echo "Auth Level2: required (reason=${{ steps.auth_level2.outputs.reason }})" >> "$GITHUB_STEP_SUMMARY"
            echo "Auth Level2 diagnostics: artifact auth-level2-diagnostics" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auth Level2: not required (IdP境界変更なし)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Migrate PostgreSQL schema
        env:
          KJ_ATLAS_DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: alembic upgrade head

      - name: Test (PostgreSQL)
        env:
          KJ_ATLAS_RUN_PG_TESTS: "1"
          KJ_ATLAS_DATABASE_URL: postgresql+psycopg://kj_atlas:kj_atlas@localhost:5432/kj_atlas
        run: pytest -m postgres
