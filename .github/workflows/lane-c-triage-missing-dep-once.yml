name: Temporary lane C triage missing dependency fix

on:
  push:
    branches:
      - fix/lane-c-triage-missing-dependency-20260904

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-triage-missing-dependency-20260904
      - name: Apply fix
        run: python .github/lane_c_triage_missing_dep_patch.py
      - name: Test triage
        run: |
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json || test $? -eq 2
      - name: Commit tested changes and remove temporary files
        run: |
          rm .github/lane_c_triage_missing_dep_patch.py
          rm .github/workflows/lane-c-triage-missing-dep-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 欠落依存でもtriageを継続する'
          git push origin HEAD:fix/lane-c-triage-missing-dependency-20260904
