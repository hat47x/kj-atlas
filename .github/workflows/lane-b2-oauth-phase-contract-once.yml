name: Lane B2 OAuth phase contract once

on:
  push:
    branches:
      - docs/lane-b2-oauth-callback-complete-set-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply OAuth request-phase contract patch
        run: python .github/lane-b2-oauth-phase-contract-patch.py
      - name: Verify focused production profile contract
        run: python 01_Plans/tests/test_production_profile_required_settings_contract.py
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          test "$(git diff --name-only | sort)" = "$(printf '%s\n' '01_Plans/tests/test_production_profile_required_settings_contract.py' '02_Architecture/runtime_parameter_registry.md' '04_Documentation/configuration.md' | sort)"
      - name: Commit patch and retire one-shot helpers
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/lane-b2-oauth-phase-contract-once.yml .github/lane-b2-oauth-phase-contract-patch.py
          git add 01_Plans/tests/test_production_profile_required_settings_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): OAuth BFFのrequest phase条件を明示する"
          git push
