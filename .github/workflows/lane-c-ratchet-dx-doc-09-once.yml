name: Lane C legacy Done ratchet once

on:
  push:
    branches:
      - chore/lane-c-ratchet-done-root-dx-doc-09-20260905

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: github.event.head_commit.message == 'chore: legacy Done移行を一時実行する'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: DX-DOC-09をDone配置へ移しlegacy debtを1件減らす
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import subprocess

          old = Path('01_Plans/issues/issue-DX-DOC-09-backtick-path-citations-unchecked-by-link-checker.md')
          new = Path('01_Plans/issues/done/issue-DX-DOC-09-backtick-path-citations-unchecked-by-link-checker.md')
          validator = Path('01_Plans/issues/validate_active_issue_memos.py')

          if not old.exists():
              raise SystemExit(f'移動元がありません: {old}')
          if new.exists():
              raise SystemExit(f'移動先がすでに存在します: {new}')

          subprocess.run(['git', 'mv', str(old), str(new)], check=True)

          text = validator.read_text(encoding='utf-8')
          before = 'LEGACY_DONE_AT_ROOT_BASELINE = 58'
          after = 'LEGACY_DONE_AT_ROOT_BASELINE = 57'
          if text.count(before) != 1:
              raise SystemExit('legacy Done baseline 58 の定義を一意に特定できません')
          validator.write_text(text.replace(before, after), encoding='utf-8')

          old_ref = str(old)
          new_ref = str(new)
          tracked = subprocess.run(
              ['git', 'grep', '-Il', '-F', old_ref, '--', ':!'+str(new)],
              check=False,
              stdout=subprocess.PIPE,
              text=True,
              encoding='utf-8',
          )
          if tracked.returncode not in (0, 1):
              raise SystemExit(f'参照探索に失敗しました: exit={tracked.returncode}')
          for name in [line for line in tracked.stdout.splitlines() if line]:
              path = Path(name)
              body = path.read_text(encoding='utf-8')
              updated = body.replace(old_ref, new_ref)
              if updated == body:
                  raise SystemExit(f'参照置換が空振りしました: {name}')
              path.write_text(updated, encoding='utf-8')
              print(f'updated reference: {name}')

          moved = new.read_text(encoding='utf-8')
          heading = '## 配置の整理（2026-09-05）'
          if heading not in moved:
              moved += (
                  '\n\n' + heading + '\n\n'
                  '- 本Issueは内容上すべての受入条件を満たして `Done` となっていた一方、'
                  'R18以前からの経緯により active root に残る58件のlegacy集合へ含まれていた。\n'
                  '- 既存のライフサイクル契約は、この58件を恒久的にrootへ置くことを認めるものではなく、'
                  '移行のたびに `LEGACY_DONE_AT_ROOT_BASELINE` を同じ変更で下げる単調減少のラチェットとして設計されている。\n'
                  '- その契約に従い、本Issueを `01_Plans/issues/done/` へ移し、baselineを58から57へ縮小した。'
                  'R18時点のidentity manifestは「新しいDone-at-rootを紛れ込ませない」歴史境界なので変更しない。\n'
                  '- 旧rootパスを引用していた箇所は、現在の `done/` パスへ同時に更新した。\n'
              )
              new.write_text(moved, encoding='utf-8')
          PY

      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'

      - name: Planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py

      - name: Documentation contract check
        run: python 01_Plans/docs_check.py

      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json

      - name: Diff check
        run: git diff --check

      - name: 検証済み移行をbranchへ記録する
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add 01_Plans
          git commit -m 'docs: DX-DOC-09をDone配置へ移す'
          git push origin HEAD
