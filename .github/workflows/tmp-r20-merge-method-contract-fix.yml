name: tmp-r20-merge-method-contract-fix

on:
  push:
    branches:
      - dogfood/r20-merge-method-traceability-20260904
    paths:
      - .github/workflows/tmp-r20-merge-method-contract-fix.yml

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/r20-merge-method-traceability-20260904
          fetch-depth: 0

      - name: Patch remaining required mergeMethod paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: bytes, new: bytes, expected: int = 1) -> None:
              p = Path(path)
              data = p.read_bytes()
              actual = data.count(old)
              if actual != expected:
                  raise SystemExit(f"{path}: expected {expected} occurrences, found {actual}")
              p.write_bytes(data.replace(old, new))

          app = Path("03_Implement/frontend/src/App.tsx")
          data = app.read_bytes()
          marker = b'        snapshotVersion: `agent-response.v1:${review.proposalId}`,'
          if data.count(marker) != 1:
              raise SystemExit(f"App.tsx: expected one agent response marker, found {data.count(marker)}")
          pos = data.index(marker) + len(marker)
          if data[pos:pos+2] == b"\r\n":
              nl = b"\r\n"
          elif data[pos:pos+1] == b"\n":
              nl = b"\n"
          else:
              raise SystemExit("App.tsx: unexpected line ending")
          insertion = nl + b'        mergeMethod: "near_duplicate",'
          if data[pos:pos+len(insertion)] == insertion:
              raise SystemExit("App.tsx: mergeMethod already inserted")
          app.write_bytes(data[:pos] + insertion + data[pos:])

          replace_exact(
              "03_Implement/frontend/src/domain/merge_suggestion_apply.test.ts",
              b'      snapshotVersion: "v2",\n      cardIds:',
              b'      snapshotVersion: "v2",\n      mergeMethod: "near_duplicate",\n      cardIds:',
              expected=2,
          )

          handoff = Path("03_Implement/frontend/src/domain/stream_b_contract_handoff.ts")
          h = handoff.read_bytes()
          if b'import type { MergeMethod } from "./merge_method";' not in h:
              anchor = b'} from "./merge_suggestion_decisions";\n'
              if h.count(anchor) != 1:
                  raise SystemExit("stream_b_contract_handoff.ts: import anchor mismatch")
              h = h.replace(anchor, anchor + b'import type { MergeMethod } from "./merge_method";\n', 1)
          field_anchor = b'  suggestionId: string;\n  cardIds: string[];'
          if h.count(field_anchor) != 1:
              raise SystemExit("stream_b_contract_handoff.ts: interface anchor mismatch")
          h = h.replace(
              field_anchor,
              b'  suggestionId: string;\n  mergeMethod: MergeMethod;\n  cardIds: string[];',
              1,
          )
          handoff.write_bytes(h)

          replace_exact(
              "03_Implement/frontend/src/domain/stream_b_mock_validation.test.ts",
              b'        suggestionId: "s-stream-b",\n        cardIds:',
              b'        suggestionId: "s-stream-b",\n        mergeMethod: "near_duplicate",\n        cardIds:',
              expected=1,
          )

          replace_exact(
              "03_Implement/frontend/src/ui/MergeSuggestionsPanel.test.ts",
              b'      snapshotVersion: "v1",\n      cardIds:',
              b'      snapshotVersion: "v1",\n      mergeMethod: "near_duplicate",\n      cardIds:',
              expected=1,
          )
          PY

      - name: Install frontend dependencies
        run: cd 03_Implement/frontend && npm ci

      - name: Typecheck frontend
        run: cd 03_Implement/frontend && npm run typecheck

      - name: Run affected regression tests
        run: |
          cd 03_Implement/frontend
          npm test -- --run \
            src/domain/merge_suggestion_apply.test.ts \
            src/domain/stream_b_mock_validation.test.ts \
            src/ui/MergeSuggestionsPanel.test.ts \
            src/ui/MergeSuggestionsPanel.merge_method.test.ts

      - name: Commit verified fix and remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/tmp-r20-merge-method-contract-fix.yml
          git status --short
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = {
              "03_Implement/frontend/src/App.tsx",
              "03_Implement/frontend/src/domain/merge_suggestion_apply.test.ts",
              "03_Implement/frontend/src/domain/stream_b_contract_handoff.ts",
              "03_Implement/frontend/src/domain/stream_b_mock_validation.test.ts",
              "03_Implement/frontend/src/ui/MergeSuggestionsPanel.test.ts",
              ".github/workflows/tmp-r20-merge-method-contract-fix.yml",
          }
          changed = set(subprocess.check_output(["git", "status", "--short"], text=True).splitlines())
          paths = {line[3:] for line in changed}
          unexpected = paths - allowed
          if unexpected:
              raise SystemExit(f"unexpected changed files: {sorted(unexpected)}")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 03_Implement/frontend/src/App.tsx \
            03_Implement/frontend/src/domain/merge_suggestion_apply.test.ts \
            03_Implement/frontend/src/domain/stream_b_contract_handoff.ts \
            03_Implement/frontend/src/domain/stream_b_mock_validation.test.ts \
            03_Implement/frontend/src/ui/MergeSuggestionsPanel.test.ts \
            .github/workflows/tmp-r20-merge-method-contract-fix.yml
          git commit -m "fix: merge方式の必須契約を周辺経路へ反映する"
          git push origin HEAD:dogfood/r20-merge-method-traceability-20260904
