name: Domain KJ causal issue closeout verify once

on:
  push:
    branches:
      - fix/domain-kj-causal-direction-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair resolved causal issue references
        run: |
          python - <<'PY'
          from pathlib import Path

          old_path = "01_Plans/issues/" + "issue-DOMAIN-KJ-CAUSAL-DIRECTION-01-derived-island-edge-causal-pair-normalization.md"
          done_path = "01_Plans/issues/done/issue-DOMAIN-KJ-CAUSAL-DIRECTION-01-derived-island-edge-causal-pair-normalization.md"

          ai_issue = Path("01_Plans/issues/issue-AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path.md")
          text = ai_issue.read_text(encoding="utf-8")
          assert old_path in text
          text = text.replace(old_path, done_path)
          old_sentence = (
              "**TS 側は直していない。** 本ロールアウトが作り込んだ不具合ではなく"
              "（Stage 4 以前から存在）、修正は別単位の作業である。新規issueとして起票した:"
          )
          new_sentence = (
              "**TS 側の既知差異は、その後 DOMAIN-KJ-CAUSAL-DIRECTION-01 で解消済み。** "
              "Stage 4 時点では本ロールアウト以前から存在する別単位の不具合として切り出していた。完了記録:"
          )
          assert old_sentence in text
          ai_issue.write_text(text.replace(old_sentence, new_sentence), encoding="utf-8")

          llm_ir = Path("03_Implement/backend/src/kj_atlas_api/llm_input_ir.py")
          text = llm_ir.read_text(encoding="utf-8")
          assert old_path in text
          text = text.replace(old_path, done_path)
          start = "    A FIFTH difference is of a different kind -- it is not a condition on the\n"
          end = "    Still inherited from the TS shape, and NOT fixed here (same new issue,\n"
          assert start in text and end in text
          before, rest = text.split(start, 1)
          _, after = rest.split(end, 1)
          resolved = (
              "    The former fifth divergence is resolved by\n"
              "    `DOMAIN-KJ-CAUSAL-DIRECTION-01`: both this function and\n"
              "    `getDerivedIslandEdges()` now preserve `causal` direction (`from` = cause,\n"
              "    `to` = effect) in both the rendered island pair and the aggregation key,\n"
              "    while undirected types keep pair normalization. Completion record:\n"
              f"    `{done_path}`.\n\n"
          )
          text = before + resolved + end + after
          stale_comment = (
              "that is exactly what the TS function still does -- see the\n"
              "            # docstring's fifth difference"
          )
          current_comment = (
              "the TS function now uses the same exemption after\n"
              "            # DOMAIN-KJ-CAUSAL-DIRECTION-01"
          )
          assert stale_comment in text
          text = text.replace(stale_comment, current_comment)
          llm_ir.write_text(text, encoding="utf-8")
          PY
      - name: Validate active issue memos
        run: python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
      - name: Run issue validator tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Verify diff hygiene
        run: |
          git diff --check
          git diff --check 7d8df2748f5f35b53061341df2fe156634a2c990...HEAD
      - name: Commit resolved-reference updates
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 01_Plans/issues/issue-AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path.md 03_Implement/backend/src/kj_atlas_api/llm_input_ir.py
          git commit -m "docs: align resolved causal direction references"
      - name: Retire one-shot
        if: success()
        run: |
          git rm .github/workflows/domain-kj-causal-closeout-once.yml
          git commit -m "ci: retire causal issue closeout one-shot"
          git push origin HEAD:fix/domain-kj-causal-direction-20260910
