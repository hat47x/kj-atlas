name: OPS SaaS operations raw blob once

on:
  push:
    branches:
      - test/ops-saas-two-app-postgres-20260904

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ops-saas-two-app-postgres-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: mainの元blobから対象節だけ再構成する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git show origin/main:04_Documentation/operations.md > /tmp/operations-main.md
          python - <<'PY'
          from pathlib import Path

          path = Path("04_Documentation/operations.md")
          branch = path.read_bytes().decode("utf-8")
          start = branch.index("### SaaSの複数API instance構成")
          end = branch.index("\n## 起動", start)
          desired = branch[start:end]

          raw_main = Path("/tmp/operations-main.md").read_bytes()
          newline = "\r\n" if b"\r\n" in raw_main else "\n"
          main = raw_main.decode("utf-8")
          old_start = main.index("### SaaSの複数プロセス構成")
          old_end = main.index(newline + "## 起動", old_start)
          desired = newline.join(desired.splitlines())
          path.write_bytes((main[:old_start] + desired + main[old_end:]).encode("utf-8"))
          PY
      - name: 文書契約を確認する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
      - name: raw blobとしてstagingして一時workflowを削除する
        run: |
          git rm .github/workflows/ops-saas-operations-raw-blob-once.yml
          blob=$(git hash-object -w --no-filters 04_Documentation/operations.md)
          git update-index --cacheinfo 100644,$blob,04_Documentation/operations.md
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'docs: operationsのraw改行を維持する'
          git push origin HEAD:test/ops-saas-two-app-postgres-20260904
