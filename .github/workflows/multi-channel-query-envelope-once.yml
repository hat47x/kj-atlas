name: multi-channel-query-envelope-once

on:
  push:
    branches:
      - architecture/multi-channel-query-envelope-20260912

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run D0 D1 D2 envelope tests
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m unittest -v
      - name: Compile research Python
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m py_compile *.py
      - name: Reject ranking semantics in envelope implementation
        run: |
          ! grep -E '"(score|confidence|importance|rank|activation|similarity|novelty_signal)"[[:space:]]*:' 01_Plans/research/qualitative_query_d0/query_envelope.py
      - name: Ensure fixed affinity benchmark is not consumed
        run: |
          ! grep -R "doc_cognitive_dogfood_meta_r1\|doc_kj_atlas_dogfood_r3" 01_Plans/research/qualitative_query_d0/query_envelope.py 01_Plans/research/qualitative_query_d0/test_query_envelope.py
      - name: Documentation checks
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
