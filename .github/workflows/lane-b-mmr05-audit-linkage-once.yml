name: lane-b-mmr05-audit-linkage-once

on:
  push:
    branches:
      - lane-b/final-judgement-audit-linkage-mmr05

permissions:
  contents: write

jobs:
  apply-verify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-audit-linkage-mmr05
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply MMR-05 audit linkage patch
        run: python .github/scripts/lane_b_mmr05_apply.py
      - name: Install backend and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest
      - name: Run MMR-05 and adjacent regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_final_judgement_model_governance.py \
            tests/test_final_judgement_system_hold.py \
            tests/test_final_judgement_proposal_linkage.py \
            tests/test_ai_eval_pipeline.py
          python -m compileall -q src/kj_atlas_api
      - name: Run repository contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              print('docs contract failures:')
              for error in result.errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print(f'docs contracts passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check
      - name: Commit verified MMR-05 and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/lane_b_mmr05_apply.py
          git rm .github/workflows/lane-b-mmr05-audit-linkage-once.yml
          git add 03_Implement/backend/src/kj_atlas_api/routes/ai.py \
                  03_Implement/backend/tests/test_final_judgement_model_governance.py \
                  03_Implement/backend/tests/test_final_judgement_system_hold.py \
                  03_Implement/backend/tests/test_ai_eval_pipeline.py \
                  01_Plans/issues/issue-AI-ROUTE-01-multi-model-routing-and-final-judgment-boundary.md
          git commit -m "feat(ai): complete linked final-judgement audit telemetry"
          git push origin HEAD:lane-b/final-judgement-audit-linkage-mmr05
