name: Lane C all Done external root reference guard once

on:
  push:
    branches:
      - test/lane-c-all-done-external-root-reference-guard-20260905

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: "github.event.head_commit.message == 'ci: 全Done外部旧root参照guardを検証する'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 外部旧root参照6件を正規Doneパスへ追随させる
        run: python .github/scripts/lane_c_fix_external_done_root_references_once.py
      - name: Done root reference tests
        run: python -m unittest 01_Plans.tests.test_legacy_done_root_references
      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
      - name: Planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py
      - name: Documentation contract check
        run: python 01_Plans/docs_check.py
      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json
      - name: Stale merge reintroduction guard
        run: python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong
      - name: Diff check
        run: git diff --check
      - name: 検証済み参照修正をbranchへ記録する
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add 01_Plans
          git commit -m 'docs: 完了Issueの外部旧root参照を正規化する'
          git push origin HEAD
