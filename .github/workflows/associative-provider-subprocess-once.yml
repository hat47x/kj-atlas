name: associative-provider-subprocess-once

on:
  push:
    branches:
      - integration/associative-provider-subprocess-20260912

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run D0 D1 D2 process tests
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m unittest -v
      - name: Compile research Python
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m py_compile *.py fixtures/synthetic_associative_provider.py
      - name: Reject shell execution
        run: |
          ! grep -R "shell=True" 01_Plans/research/qualitative_query_d0/associative_process.py
      - name: Ensure fixed affinity benchmark is not consumed
        run: |
          ! grep -R "doc_cognitive_dogfood_meta_r1\|doc_kj_atlas_dogfood_r3" 01_Plans/research/qualitative_query_d0/associative_process.py 01_Plans/research/qualitative_query_d0/test_associative_process.py
      - name: Documentation checks
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
