name: Lane B2 CE4 mock policy scope fix once

on:
  push:
    branches:
      - docs/lane-b2-ce4-mock-policy-scope-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clarify CE4 mock policy public scope
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('02_Architecture/runtime_parameter_registry.md'): (
                  '| `KJ_ATLAS_CE4_SOURCE_BUNDLE_HASH_ALLOW_MOCK` | `true` | `sourceBundleHash=mock:<hash>` を許容する | direct（CE4系だが validator 未強制） | 通常値 | `false` 設定時に `mock:` prefix の sourceBundleHash が拒否されることを確認する |',
                  '| `KJ_ATLAS_CE4_SOURCE_BUNDLE_HASH_ALLOW_MOCK` | `true` | docs CE4 の `POST /docs/{doc_id}/context-audit` で `sourceBundleHash=mock:<hash>` を許容する。proposal / CE4 resolve の受理契約は各 API 正本に従い、この switch の対象外 | direct（docs CE4 policy） | 通常値 | `false` 設定時に `/docs/{doc_id}/context-audit` の `mock:` prefix が `422 mock_source_bundle_hash_disabled` で拒否されることを確認する |',
              ),
              Path('04_Documentation/configuration.md'): (
                  '| `KJ_ATLAS_CE4_SOURCE_BUNDLE_HASH_ALLOW_MOCK` | `true` | `sourceBundleHash=mock:<hash>` を許容 |',
                  '| `KJ_ATLAS_CE4_SOURCE_BUNDLE_HASH_ALLOW_MOCK` | `true` | docs CE4 の `POST /docs/{doc_id}/context-audit` で `sourceBundleHash=mock:<hash>` を許容する policy。proposal / CE4 resolve の受理契約は別で、この switch の対象外 |',
              ),
          }
          for path, (old, new) in replacements.items():
              data = path.read_bytes()
              old_b = old.encode('utf-8')
              new_b = new.encode('utf-8')
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected one row match, got {count}')
              path.write_bytes(data.replace(old_b, new_b, 1))

          test_path = Path('01_Plans/tests/test_ce4_mock_policy_scope_contract.py')
          test_path.write_text('''from __future__ import annotations\n\nimport unittest\nfrom pathlib import Path\n\n\nROOT = Path(__file__).resolve().parents[2]\nREGISTRY = ROOT / "02_Architecture/runtime_parameter_registry.md"\nCONFIG = ROOT / "04_Documentation/configuration.md"\nDOCS_ROUTE = ROOT / "03_Implement/backend/src/kj_atlas_api/routes/docs.py"\nCONTEXT_ROUTE = ROOT / "03_Implement/backend/src/kj_atlas_api/routes/context.py"\nKEY = "KJ_ATLAS_CE4_SOURCE_BUNDLE_HASH_ALLOW_MOCK"\nATTR = "ce4_source_bundle_hash_allow_mock"\n\n\ndef _row(path: Path) -> str:\n    prefix = f"| `{KEY}` |"\n    rows = [line for line in path.read_text(encoding="utf-8").splitlines() if line.startswith(prefix)]\n    if len(rows) != 1:\n        raise AssertionError(f"expected one row for {KEY} in {path}, got {len(rows)}")\n    return rows[0]\n\n\nclass Ce4MockPolicyScopeContractTests(unittest.TestCase):\n    def test_public_contract_names_docs_context_audit_scope(self) -> None:\n        for row in (_row(REGISTRY), _row(CONFIG)):\n            self.assertIn("/docs/{doc_id}/context-audit", row)\n            self.assertIn("proposal", row)\n            self.assertIn("CE4 resolve", row)\n            self.assertIn("対象外", row)\n\n    def test_runtime_policy_is_owned_by_docs_ce4_context_audit(self) -> None:\n        docs_route = DOCS_ROUTE.read_text(encoding="utf-8")\n        context_route = CONTEXT_ROUTE.read_text(encoding="utf-8")\n\n        self.assertIn(f"settings.{ATTR}", docs_route)\n        self.assertIn("mock_source_bundle_hash_disabled", docs_route)\n        self.assertNotIn(ATTR, context_route)\n\n\nif __name__ == "__main__":\n    unittest.main()\n''', encoding='utf-8', newline='\n')
          PY

      - name: Verify focused CE4 scope contract
        run: python -m unittest 01_Plans.tests.test_ce4_mock_policy_scope_contract -v

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify narrow diff
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '01_Plans/tests/test_ce4_mock_policy_scope_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          changed.update(
              subprocess.check_output(
                  ['git', 'ls-files', '--others', '--exclude-standard'], text=True
              ).splitlines()
          )
          if changed != expected:
              raise SystemExit(f'unexpected patch scope: {sorted(changed)}')
          for path in expected:
              data = open(path, 'rb').read().splitlines()
              bad = [i for i, line in enumerate(data, 1) if line.rstrip(b' \t\r') != line.rstrip(b'\r')]
              if bad:
                  raise SystemExit(f'{path}: trailing space/tab on lines {bad[:10]}')
          PY
          git diff --check -- 01_Plans/tests/test_ce4_mock_policy_scope_contract.py 02_Architecture/runtime_parameter_registry.md

      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_ce4_mock_policy_scope_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): CE4 mock policyの作用範囲を明示する"
          git rm .github/workflows/lane-b2-ce4-mock-policy-scope-fix-once.yml
          git commit -m "ci: retire Lane B2 CE4 mock scope workflow"
          git push
