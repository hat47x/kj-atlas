name: SaaS capability audience docs R25

on:
  push:
    branches:
      - fix/saas-capability-audience-separation-20260904
    paths:
      - .github/workflows/saas-capability-audience-docs-r25.yml

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize architecture and issue state
        run: |
          python - <<'PY'
          from pathlib import Path

          issue_path = Path('01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md')
          issue = issue_path.read_text(encoding='utf-8')
          lines = issue.splitlines()

          replacements = {
              '- [ ] AC-4:': '- [~] AC-4: SaaS profileでtenant不明・不一致、membership停止、adapter欠損、PDP不達をreadも含めてdenyする。— **現行実装の再監査（2026-09-04）**: 旧記述の「SaaS起動ゲート解除待ち」は失効している。`test_saas_e2e_tenant_isolation.py`で未知tenant・claim欠落・越境same-docIdをHTTP境界で拒否し、`test_session_context_routes.py`でmembership停止・membership差替え・capability resolver欠損をfail-closedにしている。外部PDP transport不達をDocument readまで縦断する現行BFF経路の証拠は本ACへまだ集約できていないため、完了主張は保留する。',
              '- [~] AC-6:': '- [x] AC-6: `GET /session/context`とactive tenant変更がmembership allowlistだけを返し、自由入力tenantの発見・切替を許可しない。— **2026-09-04再監査**: 2026-08-22の「現行SPAはBearer token経路」という停止理由は、Accepted済み`ADR-0074`とその後のBFF cutoverにより失効した。`saas-multitenant` frontend entryは`TenantSessionRuntimeGate`を必須とし、server-owned cookie sessionの`/session/context`成功後だけtenant-scoped Appをmountする。active tenantは認証session keyに束縛され、切替はmembership allowlist再照合＋`tenantSessionVersion`比較を経て保存される。`test_session_context_routes.py`は未知/非membership tenant、停止membership、stale version、次requestのsession bindingを固定している。',
              '- [ ] AC-7:': '- [x] AC-7: Workspace、Tenant Admin、Platform Control Planeのcapability/audienceが分離され、Platform operatorに文書readが暗黙付与されない。— **三要素牽制設計（2026-09-04）**: データ面ではtrusted `TenantSessionContext`に全11 capabilityを保持してserver-side再認可へ使い、browser向けWorkspace session responseはWorkspace 4種＋Tenant Admin 5種だけへ射影する。機能面では`/admin/provision/**` Stage Bが引き続きserver-owned sessionの`tenant.provision`を直接要求し、`/session/context`とactive-tenant responseは`tenant.provision/suspend`を露出しない。業務ルール面では3 capability集合を互いに素・全既知集合の完全分割として固定し、Platform集合に`document.read`/`document.policy.manage`を含めない。`test_capability_audience_separation.py`とsession/control-plane/Tenant Admin近接testをRun 33876867421で検証し、88件pass・Ruff pass。JWT `aud`やBFF session schemaは変更していない。',
              '- [~] AC-13:': '- [~] AC-13: 同じ認証セッションの複数タブ、同時tenant切替、bfcache復帰、遅延responseで古い`tenantSessionVersion`を持つGET/PUT/export/import/Admin更新がresource lookup前に拒否され、client通知が欠落しても新tenantへ自動再送・commitされない。— **2026-09-04再監査**: `require_current_tenant_session_version` / request preconditionに加え、frontendはcross-tab、bfcache、online、長時間hiddenからのresumeで旧scopeをinvalidateする。`tenant_session_multitab.spec.ts`はcross-tab切替後の旧DOM破棄、BroadcastChannelなしのstale PUT 409・非再送、遅延旧tenant response破棄、bundle export cancel、遅延review-pack破棄、390px日本語bfcache復帰blockを固定済み。残る実backendを含む縦断matrixとAI mutation計装は`issue-QA-E2E-SAAS-01-tenant-session-coverage-gap.md`および`issue-SAAS-TENANT-E2E-01-ai-mutation-guard-instrumentation-gap.md`の正本へ委譲しているため、本ACは部分のまま維持する。',
          }
          seen = set()
          for index, line in enumerate(lines):
              for prefix, replacement in replacements.items():
                  if line.startswith(prefix):
                      if prefix in seen:
                          raise SystemExit(f'duplicate issue prefix: {prefix}')
                      lines[index] = replacement
                      seen.add(prefix)
          missing = set(replacements) - seen
          if missing:
              raise SystemExit(f'missing issue prefixes: {sorted(missing)}')

          checkpoint = '''### Implementation checkpoint 2026-09-04: capability authorization surface separation

- `ADR-0067`の三要素牽制設計を適用し、capabilityをWorkspace 4種、Tenant Admin 5種、Platform Control Plane 2種へ明示分類した。3集合は互いに素で、和集合は既存11 capabilityと一致する。
- trusted server-side `TenantSessionContext`はPlatform capabilityを失わず、`/admin/provision/**` Stage Bの`tenant.provision`認可へ利用できる。一方、Workspace bootstrap/switch responseの`effectiveCapabilities`はWorkspace＋Tenant Admin 9種だけへ射影し、`tenant.provision/suspend`をbrowserへ露出しない。
- Platform capabilityから`document.read`または`document.policy.manage`を暗黙導出する経路は追加しない。同じ主体が複数面のcapabilityを独立に持つことは許容するが、面をまたぐ継承は行わない。
- JWT `aud`、OIDC provider契約、`ADR-0074`のserver-owned BFF session schemaは変更していない。`api.md`の「認可audience」はapplication route/capability surfaceとして実装する。
- 検証: GitHub Actions Run `33876867421`。`test_capability_audience_separation.py`、session context routes、control-plane authorization、Tenant Admin document-accessの計88件pass、Ruff pass、diff check pass。一時workflowは成功後に自己削除した。
'''
          issue = '\n'.join(lines) + ('\n' if issue.endswith('\n') else '')
          marker = '## 検証計画\n'
          if checkpoint.strip() not in issue:
              if marker not in issue:
                  raise SystemExit('verification-plan marker missing')
              issue = issue.replace(marker, checkpoint + '\n' + marker, 1)
          issue_path.write_text(issue, encoding='utf-8')

          api_path = Path('02_Architecture/api.md')
          api = api_path.read_text(encoding='utf-8')
          api_lines = api.splitlines()

          api_replacements = {
              '`effectiveCapabilities`は表示補助であり、': '`effectiveCapabilities`は表示補助であり、APIの再認可を代替しない。trusted server-side sessionのcapability正本はWorkspace（`document.read/write/export/share`）、Tenant Admin（`document.policy.manage`、`membership.provision`、`agent.register/revoke`、`audit.read`）、Platform Control Plane（`tenant.provision/suspend`）の3つの認可surfaceへ明示分離する。`GET /session/context`とactive tenant変更responseはWorkspace＋Tenant Adminの9種だけを返し、Platform Control Plane capabilityをbrowser向けWorkspace contextへ露出しない。server内部のtrusted sessionからPlatform capabilityを削除してはならず、`/admin/provision/**`等の専用routeで独立に再認可する。cacheする場合は`deployment + tenantId + principalId + capabilityVersion`で分離し、auth sessionの有効期限を越えて保持しない。',
              'frontend entryはbuild時の`KJ_ATLAS_RUNTIME_PROFILE`をclosed-worldに解決する。': 'frontend entryはbuild時の`KJ_ATLAS_RUNTIME_PROFILE`をclosed-worldに解決する。未指定・`local-dev`・`evaluation`・`enterprise-production`はpolicy通信を行わず従来のlocal-first Appをmountする。`saas-multitenant`だけはserver bootstrap policyが`tenant-session-required`と一致した後、server-owned BFF cookie sessionによるsession GETとresponse再検証を完了し、成功時だけ`deployment + tenantId + principalId` scope付きAppをmountする。未知・空・非canonical build値、policy取得失敗・不一致、401、403、session解決不能、不正response、不正deploymentは旧本文をmountしないretry可能なblocked stateへ分離し、upstream message、profile、principal、tenant値を表示しない。lifecycle abortは失敗表示へ変換せず破棄する。active tenantは認証session keyへ束縛してserver側で正本化し、frontendはBearer tokenのtenant claimをactive tenant正本として使わない。',
              'capability resolverは`principalId`、': 'capability resolverは`principalId`、`tenantId`、DB再照合済み`membershipId`だけをtrusted endpointへPOSTし、各値を256文字以下のcanonicalなserver-owned ID、request全体を64KiB以下に限定する。不正・欠損・過大contextはtransport前に停止する。応答は`effectiveCapabilities`と`capabilityVersion`だけを受理し、capabilityは§10.5を含む既知11値に限定して重複・未知値・roles/groups等の余分なfieldを拒否する。§10.2のtenant-scoped AccessRequest actionはWorkspace＋Tenant Adminの9値に限定し、Platform Control Planeの2値を混入させない。responseは64KiB以下、versionは128文字以下のopaque canonical IDとし、4xx、timeout、transport障害、非JSON、不正shapeは内部詳細を反射せず`capability_resolution_unavailable`へ正規化する。API keyと応答bodyはDB・監査・diagnosticsへ保存しない。',
              'Tenant Adminは`document.policy.manage`、': 'Tenant Adminは`document.policy.manage`、`membership.provision`と`agent.register/revoke`、`audit.read`、Platform Control Planeは`tenant.provision/suspend`を使用する。Workspaceは`document.read/write/export/share`を使用する。3者はapplicationのroute/capability認可surfaceとして分離し、ここでいう認可audienceを新しいJWT `aud` claimの追加と同義には扱わない。Platform capabilityから`document.read`や`document.policy.manage`を暗黙導出せず、Workspace session responseにもPlatform capabilityを反射しない。Platform routeはserver-side trusted sessionに保持されたPlatform capabilityを独立に再認可する。汎用role editor、tenant横断文書検索、support impersonationは追加しない。',
          }
          seen_api = set()
          for index, line in enumerate(api_lines):
              for prefix, replacement in api_replacements.items():
                  if line.startswith(prefix):
                      if prefix in seen_api:
                          raise SystemExit(f'duplicate api prefix: {prefix}')
                      api_lines[index] = replacement
                      seen_api.add(prefix)
          missing_api = set(api_replacements) - seen_api
          if missing_api:
              raise SystemExit(f'missing api prefixes: {sorted(missing_api)}')
          api_path.write_text('\n'.join(api_lines) + ('\n' if api.endswith('\n') else ''), encoding='utf-8')
          PY
      - name: Documentation checks
        run: python 01_Plans/docs_check.py
      - name: Diff check
        run: git diff --check
      - name: Commit synchronized docs and retire workflow
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add 01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md 02_Architecture/api.md
          git rm .github/workflows/saas-capability-audience-docs-r25.yml
          git commit -m 'docs: SaaS capability認可面の正本を同期する'
          git push
