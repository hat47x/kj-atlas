name: R39 dogfood sync and verify once

on:
  push:
    branches:
      - dogfood/r39-semantic-oracle-surface-20260907

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R39を継続dogfood索引へ同期する
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          anchor = '''- `cognitive-dogfood-continuous-2026-09-07-r38.md`
            - R38。PR #3054で、clean DBの固定seed依存による受入false negativeと、frontend subtreeだけをtemporary copyしてrepository-relative fixtureを失ったharness偽失敗を分析し、acceptance invariantとfixture / setup / harness前提を分離した記録。
          - `doc_kj_atlas_dogfood_r38.json`
            - R38のKJキャンバス。testが必要な最小状態を自ら構成してcontract上の不変条件を観測し、harnessは意味上必要なdependency closure / repository topologyを保持する一方、shared fixtureやtemporary directory自体は一律禁止しない構造を保持する。
          '''
          insert = anchor + '''- `cognitive-dogfood-continuous-2026-09-07-r39.md`
            - R39。PR #3063で、期待内容が正しく存在するのに非限定status locatorが別の正当なstatus surfaceまで拾って失敗したtest defectを分析し、DOM上の偶発的一意性とassertionが所有するsemantic surfaceを分離した記録。
          - `doc_kj_atlas_dogfood_r39.json`
            - R39のKJキャンバス。role/testidの一般優先を決めず、locator scopeをassertionの意味境界へ合わせ、.first()やproduct surface削除でambiguityを隠さない構造を保持する。
          '''
          if 'cognitive-dogfood-continuous-2026-09-07-r39.md' not in text:
              if anchor not in text:
                  raise SystemExit('R38 index anchor not found')
              text = text.replace(anchor, insert, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Working-tree hygiene
        run: git diff --check
      - name: 検証済みR39をbranchへ記録しone-shotを退役する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_Plans/dogfood/cognitive-dogfood-index.md
          git rm .github/workflows/r39-dogfood-sync-verify-once.yml
          git commit -m 'dogfood: index R39 and retire one-shot'
          git push
