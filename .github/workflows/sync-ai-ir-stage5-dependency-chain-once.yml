name: AI IR Stage 5 dependency chain sync (one-shot)

on:
  push:
    branches:
      - docs/ai-ir-stage5-dependency-chain-20260904

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/ai-ir-stage5-dependency-chain-20260904
          fetch-depth: 0

      - name: Apply dependency and current-state sync
        run: python .github/scripts/sync_ai_ir_stage5_dependency_chain_once.py

      - name: Validate issue graph and documentation
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format json | tee /tmp/triage.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/triage.json', encoding='utf-8'))
          if data.get('errors'):
              raise SystemExit(data['errors'])
          by_id = {item['backlog_id']: item for item in data['actionable_issues']}
          scale = by_id['AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget']
          stage5 = by_id['AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths']
          projection = by_id['AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path']
          assert stage5['ready'] is False and stage5['classification'] == 'Blocked', stage5
          assert any('AI-IR-SCALE-01' in value for value in stage5['depends_on']), stage5
          assert any('AI-IR-SCALE-01' in value for value in stage5['blockers']), stage5
          assert projection['ready'] is False and projection['classification'] == 'Blocked', projection
          assert any('AI-IR-STAGE5-SCOPE-01' in value for value in projection['depends_on']), projection
          assert any('AI-IR-STAGE5-SCOPE-01' in value for value in projection['blockers']), projection
          print('SCALE=', json.dumps(scale, ensure_ascii=False))
          print('STAGE5=', json.dumps(stage5, ensure_ascii=False))
          print('PROJECTION=', json.dumps(projection, ensure_ascii=False))
          PY
          grep -F '残る実装判断は `check-narrative` だけ' 01_Plans/issues/issue-AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path.md
          git -c core.whitespace=cr-at-eol diff --check

      - name: Remove one-shot assets and push validated docs
        run: |
          rm .github/workflows/sync-ai-ir-stage5-dependency-chain-once.yml
          rm .github/scripts/sync_ai_ir_stage5_dependency_chain_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: AI IR Stage5の依存連鎖を現在地へ同期する'
          git push origin HEAD:docs/ai-ir-stage5-dependency-chain-20260904
