name: Temporary docs contract repair

on:
  push:
    branches:
      - fix/docs-contract-actions-free-release-20260903

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5
        with:
          ref: fix/docs-contract-actions-free-release-20260903
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Apply deterministic repair
        shell: bash
        run: |
          set -euo pipefail
          python .github/scripts/repair_docs_contract_actions_free_release_once.py
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/issues/done/issue-DOC-CI-DRIFT-01-docs-check-optional-workflow-paths.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'python 01_Plans/triage_actionable_plans.py --check',
              'python 01_Plans/triage_actionable_plans.py --format json',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run docs contract unit tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_docs_contract_checks.py'

      - name: Run release contract tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_release_artifact_contract.py'

      - name: Run full docs check
        run: python 01_Plans/docs_check.py

      - name: Validate dogfood documents
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Parse actionable planning memos
        run: python 01_Plans/triage_actionable_plans.py --format json > /tmp/kj-atlas-triage.json

      - name: Check whitespace
        run: git diff --check

      - name: Remove one-shot repair files and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/repair_docs_contract_actions_free_release_once.py
          rm .github/workflows/repair-docs-contract-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: sync docs contracts after Actions disablement'
          git push origin HEAD:fix/docs-contract-actions-free-release-20260903
