name: ADR-0069 AI入力境界の同期（一回限り)

on:
  push:
    branches:
      - docs/adr0069-ai-input-boundary-20260903

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/adr0069-ai-input-boundary-20260903
          fetch-depth: 0

      - name: ADRとStage 5正本を同期する
        run: python .github/scripts/apply_adr0069_input_boundary_once.py

      - name: 正本文書を検証する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage-adr0069.txt
          test -s /tmp/triage-adr0069.txt
          git diff --check
          grep -F '### D5: generic Document IR と task-local structured input の適用境界' 01_Plans/adr/ADR-0069-llm-input-ir-as-the-actual-ai-input-path.md
          grep -F '11/11をgeneric Document IRへ揃えること自体を完了条件にしない' 01_Plans/adr/ADR-0069-llm-input-ir-as-the-actual-ai-input-path.md
          grep -F '### task-local structured inputとして境界確定' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md
          grep -F '**次: `suggest-merges` の利用仕事と受入条件を決める。**' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md
          grep -F '残る実装判断は `suggest-merges` と `check-narrative`' 01_Plans/issues/issue-AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path.md

      - name: docs_checkの既知main基盤不整合を確認する
        run: |
          set +e
          python 01_Plans/docs_check.py >/tmp/docs-check.txt 2>&1
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo 'docs_check is now healthy.'
          else
            grep -F '.github/workflows/ci.yml' /tmp/docs-check.txt
          fi

      - name: 一回限りファイルを除去してpushする
        run: |
          rm .github/workflows/adr0069-ai-input-boundary-once.yml
          rm .github/scripts/apply_adr0069_input_boundary_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: ADR-0069にAI入力契約の適用境界を追補する'
          git push origin HEAD:docs/adr0069-ai-input-boundary-20260903
