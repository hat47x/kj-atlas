          from pathlib import Path

          def patch(path: str, old: str, new: str, expected: int = 1) -> None:
              p = Path(path)
              data = p.read_bytes()
              # Preserve each file's dominant newline style; fall back to LF pattern for mixed files.
              newline = "\r\n" if data.count(b"\r\n") > max(1, data.count(b"\n") // 2) else "\n"
              old_b = old.replace("\n", newline).encode("utf-8")
              new_b = new.replace("\n", newline).encode("utf-8")
              count = data.count(old_b)
              if count != expected and newline == "\r\n":
                  old_b = old.encode("utf-8")
                  new_b = new.encode("utf-8")
                  count = data.count(old_b)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} match(es), got {count}: {old[:100]!r}")
