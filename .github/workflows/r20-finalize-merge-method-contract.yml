import { validateDocumentV1Strict } from "./validate_doc";
import { validateImportedDocument } from "./validate";

function baseDocument(mergeMethod?: unknown) {
  const decision: Record<string, unknown> = {
    id: "d1",
    groupId: "g1",
    decision: "accept",
    decidedAt: "2026-09-04T00:00:00.000Z",
    cardIds: ["c1", "c2"],
    mergedTextDraft: "alpha",
    editedText: "alpha merged",
  };
  if (mergeMethod !== undefined) decision.mergeMethod = mergeMethod;
  return {
    version: 1,
    id: "doc-merge-method",
    createdAt: "2026-09-04T00:00:00.000Z",
    updatedAt: "2026-09-04T00:00:00.000Z",
    transform: { panX: 0, panY: 0, zoom: 1 },
    cards: [
      { id: "c1", text: "alpha", x: 0, y: 0 },
      { id: "c2", text: "beta", x: 100, y: 0 },
    ],
    edges: [],
    islands: [],
    mergeSuggestionDecisions: [decision],
  };
}

describe("mergeMethod Document persistence contract", () => {
  it.each(["near_duplicate", "kernel_fusion"] as const)("round-trips known method %s", (mergeMethod) => {
    const doc = baseDocument(mergeMethod);
    expect(validateDocumentV1Strict(doc).ok).toBe(true);
    const lenient = validateImportedDocument(doc);
    expect(lenient.ok).toBe(true);
    if (lenient.ok) expect(lenient.value.mergeSuggestionDecisions?.[0]?.mergeMethod).toBe(mergeMethod);
  });

  it("keeps legacy method-less decisions readable without inventing a method", () => {
    const doc = baseDocument();
    expect(validateDocumentV1Strict(doc).ok).toBe(true);
    const lenient = validateImportedDocument(doc);
    expect(lenient.ok).toBe(true);
    if (lenient.ok) expect(lenient.value.mergeSuggestionDecisions?.[0]?.mergeMethod).toBeUndefined();
  });

  it("rejects an unknown persisted method in strict mode and drops only that field in lenient mode", () => {
    const doc = baseDocument("unknown_method");
    expect(validateDocumentV1Strict(doc).ok).toBe(false);
    const lenient = validateImportedDocument(doc);
    expect(lenient.ok).toBe(true);
    if (lenient.ok) expect(lenient.value.mergeSuggestionDecisions?.[0]?.mergeMethod).toBeUndefined();
  });
});
''', encoding="utf-8")

          Path("03_Implement/frontend/src/import/agent_merge_method_contract.test.ts").write_text(r'''import { describe, expect, it } from "vitest";
import { parseAgentResponse } from "./agent_response_import";

function response(content: Record<string, unknown>): string {
  return JSON.stringify({
    schemaVersion: "agent-response.v1",
    taskId: "task-1",
    correlation: {
      schemaVersion: "agent-task.v1",
      taskId: "task-1",
      createdAt: "2026-09-04T00:00:00.000Z",
      docId: "doc-1",
      baseDocSignature: "doc-1:sig",
      bundleHash: "bundle",
      queryCanonicalHash: "query",
      taskKind: "merge_candidates",
      locale: "ja",
    },
    proposals: [{
      proposalId: "p1",
      kind: "merge_candidate",
      targetRef: { cardIds: ["c1", "c2"] },
      content,
      rationale: "統合理由",
    }],
  });
}

describe("external agent mergeMethod contract", () => {
  it.each(["near_duplicate", "kernel_fusion"] as const)("preserves known method %s in strict import", (mergeMethod) => {
    const result = parseAgentResponse(response({ mergedText: "統合", mergeMethod }), "strict");
    expect(result.ok).toBe(true);
    if (result.ok) expect(result.response.proposals[0]?.content.mergeMethod).toBe(mergeMethod);
  });

  it.each([
    { mergedText: "統合" },
    { mergedText: "統合", mergeMethod: "unknown_method" },
  ])("strictly rejects missing/unknown method, while lenient import preserves the proposal without guessing", (content) => {
    const strict = parseAgentResponse(response(content), "strict");
    expect(strict.ok).toBe(false);
    const lenient = parseAgentResponse(response(content), "lenient");
    expect(lenient.ok).toBe(true);
    if (lenient.ok) {
      expect(lenient.response.proposals).toHaveLength(1);
      expect(lenient.response.proposals[0]?.content.mergeMethod).toBeUndefined();
      expect(lenient.warnings.some((warning) => warning.includes("merge_candidate_missing_or_invalid_merge_method"))).toBe(true);
    }
  });
});
''', encoding="utf-8")
