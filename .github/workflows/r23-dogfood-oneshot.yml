name: R23 dogfood one-shot

on:
  push:
    branches:
      - dogfood/r23-stale-diagnostic-operational-evidence-20260906

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dogfood validator unit tests
        run: python -m unittest 01_Plans/dogfood/test_validate_dogfood_docs.py
      - name: Dogfood documents
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Active issue memos
        run: python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Triage
        run: python 01_Plans/triage_actionable_plans.py --format json
      - name: Diff check
        run: git diff --check origin/main...HEAD
