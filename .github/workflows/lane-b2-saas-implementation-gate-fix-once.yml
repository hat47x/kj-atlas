name: Lane B2 SaaS implementation gate fix once

on:
  push:
    branches:
      - fix/lane-b2-saas-implementation-gate-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align SaaS implementation-gate wording
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('02_Architecture/runtime_parameter_registry.md')
          text = registry_path.read_text(encoding='utf-8')
          old = 'runtime safety policyはPostgreSQL、JIT無効、external access-control、`deny` fail-safe、external document binding、external tenant capabilityを必須とし、実componentも'
          new = 'runtime safety policyはPostgreSQL、JIT無効、external access-control、`deny` fail-safe、external document binding、external tenant capability、SaaS OAuth broker authorize endpoint、auth-session hash keyを必須とし、実componentも'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale implementation-gate phrase, got {text.count(old)}')
          registry_path.write_text(text.replace(old, new), encoding='utf-8', newline='')

          test_path = Path('01_Plans/tests/test_saas_profile_hard_gate_contract.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    def test_saas_profile_requires_admin_api_key_across_public_profile_docs(self) -> None:\n'
          method = '''    def test_registry_implementation_gate_matches_trusted_saas_runtime_policy(self) -> None:\n        source = _policy_validate_source()\n        self.assertIn("self.saas_oauth_broker_http_authorize_endpoint is not None", source)\n        self.assertIn("self.saas_auth_session_hash_key is not None", source)\n\n        implementation_gate = REGISTRY_PATH.read_text(encoding="utf-8").split(\n            "### SaaS profile implementation gate", 1\n        )[1].split("### Drift check gates", 1)[0]\n        self.assertIn("SaaS OAuth broker authorize endpoint", implementation_gate)\n        self.assertIn("auth-session hash key", implementation_gate)\n\n'''
          if method in test:
              raise SystemExit('implementation-gate contract already present')
          if test.count(anchor) != 1:
              raise SystemExit('test insertion anchor drifted')
          test_path.write_text(test.replace(anchor, method + anchor), encoding='utf-8')
          PY
      - name: Verify focused contract
        run: python -m unittest 01_Plans.tests.test_saas_profile_hard_gate_contract
      - name: Verify planning suite
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--name-only','HEAD^'], text=True).splitlines()
          allowed = {
              '.github/workflows/lane-b2-saas-implementation-gate-fix-once.yml',
              '01_Plans/tests/test_saas_profile_hard_gate_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
          }
          unexpected = [path for path in files if path not in allowed]
          if unexpected:
              raise SystemExit(f'unexpected diff: {unexpected}')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_saas_profile_hard_gate_contract.py 02_Architecture/runtime_parameter_registry.md
          git commit -m "docs(config): SaaS implementation gateを完全化する"
          git rm .github/workflows/lane-b2-saas-implementation-gate-fix-once.yml
          git commit -m "ci: retire Lane B2 SaaS implementation gate workflow"
          git push
