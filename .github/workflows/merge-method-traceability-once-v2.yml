name: Temporary merge method traceability v2

on:
  push:
    branches:
      - feat/merge-method-traceability-20260904
    paths:
      - .github/workflows/merge-method-traceability-once-v2.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/merge-method-traceability-20260904
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Apply corrected implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/merge-method-traceability-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          lines = []
          for line in embedded.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'

          section_start = script.index('# Append-only audit record carries the same method when known.')
          section_end = script.index('# App decision + audit wiring.', section_start)
          corrected = '''# Append-only audit record carries the same method when known.\nreplace_in_block(\n    '03_Implement/frontend/src/domain/merge/decision_audit_events.ts',\n    'export type MergeDecisionAuditEvent = {\\n',\n    '\\n};\\n\\nfunction sortCardIds',\n    '  snapshotVersion: string;\\n  decisionReason?: string;\\n',\n    '  snapshotVersion: string;\\n  decisionReason?: string;\\n  mergeMethod?: "near_duplicate" | "kernel_fusion";\\n',\n)\nreplace_in_block(\n    '03_Implement/frontend/src/domain/merge/decision_audit_events.ts',\n    'export function createMergeDecisionAuditEvent(input: {\\n',\n    '\\n}): MergeDecisionAuditEvent {\\n',\n    '  snapshotVersion: string;\\n  decisionReason?: string;\\n',\n    '  snapshotVersion: string;\\n  decisionReason?: string;\\n  mergeMethod?: "near_duplicate" | "kernel_fusion";\\n',\n)\nreplace_once(\n    '03_Implement/frontend/src/domain/merge/decision_audit_events.ts',\n    '    snapshotVersion: input.snapshotVersion,\\n    decisionReason: input.decisionReason,\\n',\n    '    snapshotVersion: input.snapshotVersion,\\n    decisionReason: input.decisionReason,\\n    mergeMethod: input.mergeMethod,\\n',\n)\nreplace_in_block(\n    '03_Implement/frontend/src/domain/merge/decision_audit_events.test.ts',\n    '    const event = createMergeDecisionAuditEvent({\\n',\n    '\\n    });\\n\\n    expect(event).toEqual({',\n    '      decisionReason: "Reviewed by operator",\\n',\n    '      decisionReason: "Reviewed by operator",\\n      mergeMethod: "kernel_fusion",\\n',\n)\nreplace_in_block(\n    '03_Implement/frontend/src/domain/merge/decision_audit_events.test.ts',\n    '    expect(event).toEqual({\\n',\n    '\\n    });\\n  });',\n    '      decisionReason: "Reviewed by operator",\\n',\n    '      decisionReason: "Reviewed by operator",\\n      mergeMethod: "kernel_fusion",\\n',\n)\n\n'''
          script = script[:section_start] + corrected + script[section_end:]
          exec(compile(script, '<merge-method-traceability>', 'exec'))
          PY

      - name: Inspect merge-related fixture surfaces
        run: git grep -n "mergedTextDraft" -- ':!03_Implement/frontend/package-lock.json' | head -100 || true

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Format and lint changed Python
        working-directory: 03_Implement/backend
        run: |
          python -m ruff format src/kj_atlas_api/models.py src/kj_atlas_api/routes/ai.py tests/test_ai_merge_ir.py
          python -m ruff check src/kj_atlas_api/models.py src/kj_atlas_api/routes/ai.py tests/test_ai_merge_ir.py

      - name: Run backend merge regressions
        working-directory: 03_Implement/backend
        run: python -m pytest tests/test_ai_merge_semantics.py tests/test_ai_merge_ir.py tests/test_ai_llm_input_ir_coverage.py -q

      - name: Run frontend merge regressions
        working-directory: 03_Implement/frontend
        run: |
          npx vitest run \
            src/api/client.test.ts \
            src/domain/merge_candidates.test.ts \
            src/domain/merge_suggestion_decisions.test.ts \
            src/domain/merge/decision_audit_events.test.ts \
            src/i18n/key_consistency.test.ts
          npm run typecheck

      - name: Run focused merge persistence E2E
        working-directory: 03_Implement/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/merge_suggestion_apply_persistence.spec.ts

      - name: Run planning and docs checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/triage_actionable_plans.py >/tmp/triage.txt
          cat /tmp/triage.txt
          git diff --check

      - name: Commit verified implementation and remove one-shot workflows
        shell: bash
        run: |
          git rm .github/workflows/merge-method-traceability-once.yml
          git rm .github/workflows/merge-method-traceability-once-v2.yml
          git config user.name "hat47x"
          git config user.email "hat47x@gmail.com"
          git add -A
          git status --short
          git commit -m "feat: merge方式を判断記録まで追跡する"
          git push origin HEAD:feat/merge-method-traceability-20260904
