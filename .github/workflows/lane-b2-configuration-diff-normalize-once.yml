name: Lane B2 configuration diff normalize once

on:
  push:
    branches:
      - fix/lane-b2-configuration-compose-delivery-20260907

permissions:
  contents: write

jobs:
  normalize-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore latest main bytes and reapply narrow documentation changes
        run: |
          git fetch origin main
          git checkout origin/main -- 04_Documentation/configuration.md
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          path = Path("04_Documentation/configuration.md")
          raw = path.read_bytes()
          text = raw.decode("utf-8")
          nl = "\r\n" if b"\r\n" in raw else "\n"

          def lines(value: str) -> str:
              return dedent(value).replace("\n", nl)

          old = (
              "このページの `export KJ_ATLAS_*` 例は、backend を直接起動する場合の設定例です。"
              "標準 Docker Compose (`docker-compose.yml`) は `KJ_ATLAS_DATABASE_URL` と "
              "`KJ_ATLAS_LLM_PROVIDER` の2キーだけを `api` コンテナへ配送します。"
              "他のキー（`KJ_ATLAS_API_KEY` や `KJ_ATLAS_ALLOW_JIT_PROVISIONING` を含む）は、"
              "Compose の `api.environment` に明示的に追加しない限り、`export` しても標準 Compose "
              "経由では `api` へ届きません。キーごとの配送範囲は "
              "[runtime_parameter_registry.md の Backend settings 表]"
              "(https://github.com/hat47x/kj-atlas/blob/main/02_Architecture/runtime_parameter_registry.md#backend-settings)"
              "（`Delivery surface` 列）で確認してください。" + nl
          )
          new = lines("""\
          このページの `export KJ_ATLAS_*` 例は、特記がない限り backend を直接起動する場合の設定例です。標準 Docker Compose (`docker-compose.yml`) は、次の公開キーを明示的な配送面として持ちます。この2行は `01_Plans/tests/test_configuration_compose_delivery_contract.py` で Compose 定義と照合します。

          | Compose surface | 配送される公開キー | 挙動 |
          | --- | --- | --- |
          | `api.environment` | `KJ_ATLAS_RUNTIME_PROFILE`, `KJ_ATLAS_DATABASE_URL`, `KJ_ATLAS_LLM_PROVIDER`, `KJ_ATLAS_APP_REVISION`, `KJ_ATLAS_API_KEY`, `KJ_ATLAS_ALLOW_JIT_PROVISIONING` | profile・DB・provider は Compose 既定値を持つ。revision・API key・JIT は host で設定された場合だけ pass-through する。 |
          | `web.build.args` | `KJ_ATLAS_FRONTEND_API_BASE`, `KJ_ATLAS_RUNTIME_PROFILE`, `KJ_ATLAS_APP_REVISION` | API base は標準 Compose では `/api` に固定。profile と revision は frontend build 時に確定する。 |

          これとは別に、`KJ_ATLAS_WEB_PORT` は loopback 公開ポートを、`KJ_ATLAS_POSTGRES_DB` / `KJ_ATLAS_POSTGRES_USER` / `KJ_ATLAS_POSTGRES_PASSWORD` は db コンテナの vendor 設定と既定 DB URL の組み立てを制御します。上表にない backend 設定は、`Delivery surface` が `direct` の場合、標準 Compose へは届きません。必要な接続系設定は組織側 overlay で関連キーを一組として配送してください。キーごとの正本は [runtime_parameter_registry.md の Backend settings 表](https://github.com/hat47x/kj-atlas/blob/main/02_Architecture/runtime_parameter_registry.md#backend-settings)です。
          """)
          if text.count(old) != 1:
              raise SystemExit("expected stale Compose delivery paragraph exactly once")
          text = text.replace(old, new, 1)

          old_intro = "次の表は Docker Compose と frontend build で利用者が設定できる全環境変数です。これらもすべて `KJ_ATLAS_` で始まります。" + nl
          new_intro = "次の表は、標準 Docker Compose が host から参照する公開キーと、frontend を直接 build するときに設定できる公開キーです。これらもすべて `KJ_ATLAS_` で始まります。標準 Compose で host から変更できない build 値は用途欄に明記します。" + nl
          if text.count(old_intro) != 1:
              raise SystemExit("expected Compose/frontend section intro exactly once")
          text = text.replace(old_intro, new_intro, 1)

          old_frontend_row = "| `KJ_ATLAS_FRONTEND_API_BASE` | `/api` | frontend が呼び出す API base path |" + nl
          new_frontend_row = "| `KJ_ATLAS_FRONTEND_API_BASE` | `/api` | frontend direct build の API base path。標準 Compose は `/api` を固定注入するため host 側の値では変更できない |" + nl
          if text.count(old_frontend_row) != 1:
              raise SystemExit("expected frontend API base row exactly once")
          text = text.replace(old_frontend_row, new_frontend_row, 1)

          runtime_row = "| `KJ_ATLAS_RUNTIME_PROFILE` | `evaluation`（Compose） | backendとfrontendへ同じ実行profileを渡す。`saas-multitenant`はPostgreSQL共有認証表と必須外部adapterが必要 |" + nl
          revision_row = "| `KJ_ATLAS_APP_REVISION` | `unknown` | backend `/version`・全アプリケーションログと frontend 診断bundleを同じbuildへ結び付ける。標準 Compose は api へ pass-through し、web build へも渡す |" + nl
          if text.count(runtime_row) != 1:
              raise SystemExit("expected Compose runtime profile row exactly once")
          text = text.replace(runtime_row, runtime_row + revision_row, 1)

          minimal_old = lines("""\
          export KJ_ATLAS_LLM_PROVIDER=none
          export KJ_ATLAS_RUNTIME_PROFILE=evaluation
          export KJ_ATLAS_DATABASE_URL='postgresql+asyncpg://kj_atlas:kj_atlas@db:5432/kj_atlas'
          export KJ_ATLAS_FRONTEND_API_BASE=/api
          export KJ_ATLAS_WEB_PORT=8080
          """)
          minimal_new = lines("""\
          export KJ_ATLAS_LLM_PROVIDER=none
          export KJ_ATLAS_RUNTIME_PROFILE=evaluation
          export KJ_ATLAS_DATABASE_URL='postgresql+asyncpg://kj_atlas:kj_atlas@db:5432/kj_atlas'
          export KJ_ATLAS_WEB_PORT=8080
          """)
          if text.count(minimal_old) != 1:
              raise SystemExit("expected standard Compose minimal block exactly once")
          text = text.replace(minimal_old, minimal_new, 1)

          compose_eval_old = lines("""\
          export KJ_ATLAS_LLM_PROVIDER=none
          export KJ_ATLAS_RUNTIME_PROFILE=evaluation
          export KJ_ATLAS_WEB_PORT=8080
          export KJ_ATLAS_FRONTEND_API_BASE=/api
          """)
          compose_eval_new = lines("""\
          export KJ_ATLAS_LLM_PROVIDER=none
          export KJ_ATLAS_RUNTIME_PROFILE=evaluation
          export KJ_ATLAS_WEB_PORT=8080
          """)
          if text.count(compose_eval_old) != 1:
              raise SystemExit("expected Docker Compose evaluation block exactly once")
          text = text.replace(compose_eval_old, compose_eval_new, 1)

          if text.count("export KJ_ATLAS_FRONTEND_API_BASE=/api" + nl) != 1:
              raise SystemExit("direct frontend build should be the sole API-base export example")

          path.write_bytes(text.encode("utf-8"))
          PY

      - name: Verify focused configuration delivery contract
        run: python 01_Plans/tests/test_configuration_compose_delivery_contract.py

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify Compose syntax
        run: docker compose -f 03_Implement/deploy/docker-compose.yml config >/dev/null

      - name: Verify narrow configuration diff
        run: |
          python - <<'PY'
          import subprocess
          out = subprocess.check_output([
              "git", "diff", "--numstat", "origin/main", "--", "04_Documentation/configuration.md"
          ], text=True).strip()
          if not out:
              raise SystemExit("configuration diff unexpectedly empty")
          added, deleted, _ = out.split("\t", 2)
          if int(added) > 30 or int(deleted) > 20:
              raise SystemExit(f"configuration diff is too broad: +{added}/-{deleted}")
          print(f"narrow configuration diff: +{added}/-{deleted}")
          PY
          git -c core.whitespace=cr-at-eol diff --check origin/main

      - name: Commit normalized patch and retire one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane-b2-configuration-diff-normalize-once.yml
          git add 04_Documentation/configuration.md
          git commit -m "chore(config): documentation差分を原改行へ正規化する"
          git push
