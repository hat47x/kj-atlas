name: Temporary lane C close stale AUTHEDGE issue

on:
  push:
    branches:
      - chore/lane-c-close-stale-authedge-20260904

permissions:
  contents: write

jobs:
  close-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-close-stale-authedge-20260904
          fetch-depth: 0

      - name: Complete AUTHEDGE memo and synchronize references
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          source = Path('01_Plans/issues/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md')
          target = Path('01_Plans/issues/done/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md')
          text = source.read_text(encoding='utf-8')
          text = text.replace('- Status: Draft', '- Status: Done', 1)
          old = '- [ ] saas-multitenant profile の起動拒否を緩める条件を `SAAS-TENANT-01` 側で再評価する（本 issue では緩めない。`settings.py` の無条件 `ValueError` は削除済みだが、`TrustedSaasRuntimePolicy.validate()` と lifespan preflight が必須設定の完備を検証する）。'
          new = '- [x] saas-multitenant profile の起動拒否を緩める条件を `SAAS-TENANT-01` 側で再評価した。本 issue では緩めず、親issueの後続checkpointでも実auth edge以外の未充足ゲートを理由に起動拒否を維持している。`settings.py` の無条件 `ValueError` は削除済みで、`TrustedSaasRuntimePolicy.validate()` と lifespan preflight が必須設定の完備を検証する。'
          if old not in text:
              raise SystemExit('AUTHEDGE final acceptance anchor not found')
          text = text.replace(old, new, 1)
          text += '''\n## 完了整理（2026-09-04）\n\n- 2026-08-08の記録どおり、ADR-0063受理、`JwtSaasIdentityContextResolver`、trusted runtime配線、HTTP-level tenant isolation E2Eまで本issue固有の実装は完了している。\n- 唯一未チェックだった項目は「SaaS起動拒否の解除」ではなく、親`SAAS-TENANT-01`で解除条件を再評価することだった。親issueは後続checkpointでこの判断を繰り返し更新し、auth edge以外の未充足ゲートが残るため起動拒否を維持している。\n- したがって残存作業は親issueおよび個別follow-upの所管であり、本issueをDraftのままactive triageへ残す根拠にはならない。\n'''
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(text, encoding='utf-8')
          source.unlink()

          old_path = '01_Plans/issues/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md'
          new_path = '01_Plans/issues/done/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md'
          for path in [
              Path('01_Plans/adr/ADR-0063-saas-multitenant-trusted-auth-edge.md'),
              Path('01_Plans/issues/done/issue-SEC-ADMIN-PLANE-01-admin-surface-authorization-and-saas-bootstrap.md'),
          ]:
              body = path.read_text(encoding='utf-8')
              if old_path not in body:
                  raise SystemExit(f'expected active-path reference missing: {path}')
              path.write_text(body.replace(old_path, new_path), encoding='utf-8')
          PY

      - name: Verify planning source of truth
        shell: bash
        run: |
          set -euo pipefail
          test ! -e 01_Plans/issues/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md
          test -e 01_Plans/issues/done/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md
          if git grep -n -F '01_Plans/issues/issue-SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation.md' -- ':!.github/workflows/lane-c-close-authedge-once.yml'; then
            echo 'stale active-path reference remains' >&2
            exit 1
          fi

          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          target = [
              item for item in report['actionable_issues']
              if item['backlog_id'] == 'SAAS-TENANT-AUTHEDGE-01-no-concrete-trusted-auth-edge-implementation'
          ]
          if target:
              raise SystemExit(f'AUTHEDGE remains active: {target}')
          expected = {
              'active_issue_count': 50,
              'ready_issue_count': 14,
              'blocked_issue_count': 36,
              'actionable_adr_count': 0,
          }
          print(json.dumps(report['summary'], ensure_ascii=False))
          if report['summary'] != expected:
              raise SystemExit(f'unexpected triage summary: {report["summary"]}')
          PY
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          git diff --check

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-close-authedge-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'plan: 完了済みAUTHEDGE issueをDoneへ正規化する'
          git push origin HEAD:chore/lane-c-close-stale-authedge-20260904
