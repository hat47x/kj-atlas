name: Lane C E2E Compose preflight roundtrip once

on:
  push:
    branches:
      - qa/lane-c-e2e-compose-preflight-roundtrip-20260907

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'ci: verify ADR-0019 E2E storage roundtrip once'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch runbook to canonical roundtrip
        run: python .github/scripts/lane_c_e2e_preflight_runbook_patch.py
      - name: Retire one-shot inputs before guards
        run: rm .github/scripts/lane_c_e2e_preflight_runbook_patch.py .github/workflows/lane-c-e2e-compose-preflight-roundtrip-once.yml
      - name: Check preflight script syntax and runbook contract
        run: |
          node --check 03_Implement/frontend/scripts/e2e_storage_preflight.mjs
          grep -F 'e2e_storage_preflight.mjs' 03_Implement/frontend/docs/e2e_testing.md
          ! grep -F 'doc_phase1_canvas' 03_Implement/frontend/docs/e2e_testing.md
      - name: Start standard Compose stack
        working-directory: 03_Implement/deploy
        run: docker compose up --build -d
      - name: ADR-0019 health and storage roundtrip preflight
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/healthz >/tmp/healthz.json; then
              echo "compose_health=pass attempt=$i"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo 'compose_health=fail'
              exit 1
            fi
            sleep 2
          done
          node 03_Implement/frontend/scripts/e2e_storage_preflight.mjs \
            --write-base-url http://127.0.0.1:8080/api | tee /tmp/storage-preflight.json
          grep -F '"status":"pass"' /tmp/storage-preflight.json
      - name: Run frontend typecheck, full unit suite, and Compose-backed S1-S4 E2E
        run: |
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            mcr.microsoft.com/playwright:v1.58.2-jammy \
            bash -lc '
              set -euo pipefail
              mkdir -p /tmp/kj-atlas
              cp -a /repo/. /tmp/kj-atlas/
              cd /tmp/kj-atlas/03_Implement/frontend
              npm ci
              npm run typecheck
              npx vitest run
              cat > playwright.compose.once.config.ts <<"EOF"
          import { defineConfig } from "@playwright/test";
          export default defineConfig({
            testDir: "./e2e",
            timeout: 30_000,
            retries: 0,
            use: {
              baseURL: "http://127.0.0.1:8080",
              trace: "off",
            },
          });
          EOF
              npx playwright test e2e/realistic_user_journey_expansion.spec.ts \
                --config=playwright.compose.once.config.ts \
                --reporter=line \
                --workers=1
            '
      - name: Planning and docs guards
        run: |
          python -m pip install pytest
          python -m pytest -q 01_Plans/tests
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check
      - name: Compose diagnostics on failure
        if: failure()
        working-directory: 03_Implement/deploy
        run: |
          docker compose ps
          docker compose logs api --tail=200
          docker compose logs web --tail=100
      - name: Stop Compose stack
        if: always()
        working-directory: 03_Implement/deploy
        run: docker compose down -v
      - name: Commit verified tree
        if: success()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(qa): Compose E2E preflightをdoc roundtripへ戻す'
          git push origin HEAD:qa/lane-c-e2e-compose-preflight-roundtrip-20260907
