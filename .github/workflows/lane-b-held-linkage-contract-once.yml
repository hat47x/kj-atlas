name: lane-b-held-linkage-contract-once

on:
  push:
    branches:
      - lane-b/final-judgement-held-linkage-contract

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/final-judgement-held-linkage-contract
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate issue contracts
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
          python - <<'PY'
          from pathlib import Path

          parent = Path('01_Plans/issues/issue-AI-ROUTE-01-multi-model-routing-and-final-judgment-boundary.md').read_text()
          child = Path('01_Plans/issues/issue-AI-ROUTE-HELD-LINKAGE-01-link-final-judgement-failure-to-proposal-state.md').read_text()
          assert '- [ ] final_judgement 利用不能時に held へ遷移し' in parent
          assert 'AI-ROUTE-HELD-LINKAGE-01' in parent
          assert 'proposalをdocument ID、作成時刻、最新順、内容類似度等から推測しない' in child
          assert 'system holdを人間の `accept/reject/hold` decisionとして偽装しない' in child
          assert '`held` 後の明示的recovery contract' in child
          assert '- [ ] `AI-ROUTE-01` MMR-06は上記integration evidenceが揃うまで未完了のままとする。' in child
          PY
          git diff --check
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-b-held-linkage-contract-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove held linkage one-shot validator'
          git push origin HEAD:lane-b/final-judgement-held-linkage-contract
