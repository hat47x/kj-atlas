name: R40 dogfood tree-noop verify once

on:
  push:
    branches:
      - dogfood/r40-prospective-tree-noop-refresh-20260907

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: R40を継続dogfood索引へ同期する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          if 'cognitive-dogfood-continuous-2026-09-07-r40.md' not in text:
              marker = '- `doc_kj_atlas_dogfood_r39.json`'
              start = text.index(marker)
              next_entry = text.find('\n- ', start + len(marker))
              if next_entry < 0:
                  raise SystemExit('R39 index insertion boundary not found')
              addition = (
                  '\n- `cognitive-dogfood-continuous-2026-09-07-r40.md`\n'
                  '  - R40。PR #3072で、すでにmainへ適用済みのcloseout branchを再mergeし、PR diffは残るのに直前main→merge commitのchanged filesが0だった実陽性を分析し、merge-base差分とcurrent mainへのnet tree effectを分離した記録。\n'
                  '- `doc_kj_atlas_dogfood_r40.json`\n'
                  '  - R40のKJキャンバス。R22 strong inversionを維持したまま、prospective merge treeがbase treeと同一になるalready-applied deltaをreview signalとして分け、required checkへはまだ昇格しない構造を保持する。'
              )
              text = text[:next_entry] + addition + text[next_entry:]
              path.write_text(text, encoding='utf-8')
          PY

      - name: Focused prospective tree-noop regression
        run: python 01_Plans/tests/test_stale_merge_reintroduction_tree_noop.py

      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Docs check
        run: python 01_Plans/docs_check.py

      - name: Working-tree hygiene
        run: git diff --check

      - name: 検証済みR40をbranchへ記録しone-shotを退役する
        shell: bash
        run: |
          rm .github/workflows/r40-dogfood-tree-noop-verify-once.yml
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'dogfood: verify R40 tree-noop signal once'
          git push
