name: lane-b-r43-record-once

on:
  push:
    branches:
      - lane-b/production-output-budget-contract

permissions:
  contents: write

jobs:
  record-and-self-delete:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/production-output-budget-contract
      - name: Record R43 in canonical issue
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md')
          text = path.read_text(encoding='utf-8')

          lines = text.splitlines()
          prefix = '- [x] 300カード規模のroute-required regressionをテストスイートへ固定する。'
          matches = [index for index, line in enumerate(lines) if line.startswith(prefix)]
          assert len(matches) == 1
          index = matches[0]
          lines[index] = (
              prefix
              + 'R22以降branch-only GitHub Actionsで関連回帰を繰り返し実行し、'
              + 'R43 run `33963862577` ではR23〜R43関連を含む81 test・ruff・`git diff --check` が成功した。'
              + 'provider実測reportについてもR32/R33/R35/R37でroute/task/provider/model/usage、canonical user prompt fingerprint、primary call provenanceに加え、'
              + 'DeepSeekでは実transportが送るsystem+user message content fingerprintまでfail-closed検証を固定し、'
              + 'R39ではmeasurementの `max_tokens=1` と現行production output reserveを分離したcontext hard-fit計算、'
              + 'R41ではcontext-window値と資料source provenanceの対、R43ではそのproduction output reserve前提と実route call siteの一致を回帰で固定した。'
              + '恒久workflowの有無とは分けて記録する。'
          )
          text = '\n'.join(lines) + '\n'

          test_entry = '  - `tests/test_ai_route_production_output_budget_contract.py`\n'
          if test_entry not in text:
              anchor = '  - `tests/test_ai_route_provider_measurement_analysis.py`\n'
              assert anchor in text
              text = text.replace(anchor, anchor + test_entry, 1)

          assert '## R43 — production output reserve前提の回帰固定' not in text
          text += '''\n\n## R43 — production output reserve前提の回帰固定\n\nR39のcontext hard-fit計算は、provider実測時の `max_tokens=1` とは別に、現行production routeが確保するoutput token予算を加算する。R39時点では4つの測定対象production taskが `LLMRequest` の共通既定値を使うことを前提にしていたが、その前提と実call siteの間に恒久回帰はなかった。将来1 routeだけが `max_tokens` を個別指定すると、provider-reported input token自体は正しくてもhard-fitだけが黙って古いreserveで計算される余地があった。\n\nR43ではproduction本体を測定都合で変更せず、`tests/test_ai_route_production_output_budget_contract.py` を追加して次を固定した。\n\n- analyzerの `CORE_ROUTE_TASKS` が表すunique production taskは `suggest_card_groups` / `re_layout` / `generate_narrative` / `check_narrative` の4つであり、実production functionと一致する。\n- 各production functionの実sourceを `inspect` + ASTで確認し、対象 `LLMRequest` がちょうど1件、期待task idを持つことを確認する。\n- 現状4routeはいずれもroute固有 `max_tokens` overrideを持たず、`LLMRequest` 共通既定reserveを使う。analyzerの `CURRENT_PRODUCTION_OUTPUT_RESERVE_TOKENS` も同じ既定値から導出される。\n- 将来どれかのrouteが個別 `max_tokens` を導入した場合、この回帰を単に緩めず、先にanalyzerをroute別reserveへ更新する必要がある。\n\nGitHub Actions run `33963862577` でR23〜R43関連 **81 test**、ruff、`git diff --check` が成功した。one-shot workflowはrun内で自己削除済みである。\n\n**非主張**: R43でも外部providerは呼んでいない。実input token、実model context-window、十分な安全余裕、費用、latency、品質は未測定であり、A2/B/Cの採択、production cap、route挙動は変更していない。\n'''
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit record and remove temporary workflow
        run: |
          rm .github/workflows/lane-b-r43-record-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): record R43 production output budget contract'
          git push origin HEAD:lane-b/production-output-budget-contract
