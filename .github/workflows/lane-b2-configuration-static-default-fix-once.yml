name: Lane B2 configuration static default fix once

on:
  push:
    branches:
      - fix/lane-b2-configuration-static-default-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align task model map documented default with Settings
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("04_Documentation/configuration.md")
          raw = path.read_bytes()
          text = raw.decode("utf-8")
          old = "| `KJ_ATLAS_LLM_TASK_MODEL_MAP` | 未設定 | タスク別モデル割当（`task=model,...`）。未設定タスクは既定モデル |"
          new = "| `KJ_ATLAS_LLM_TASK_MODEL_MAP` | 未設定（空文字） | タスク別モデル割当（`task=model,...`）。未設定タスクは既定モデル |"
          if text.count(old) != 1:
              raise SystemExit("expected stale task model map default exactly once")
          text = text.replace(old, new, 1)
          path.write_bytes(text.encode("utf-8"))
          PY
      - name: Verify focused backend default contract
        run: python 01_Plans/tests/test_runtime_parameter_backend_registry_contract.py
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git config core.whitespace cr-at-eol
          git diff --check
          git diff --stat origin/main...HEAD
          git diff --stat
          changed=$(git diff --name-only origin/main...HEAD; git diff --name-only)
          printf '%s\n' "$changed" | sed '/^$/d' | sort -u
          unexpected=$(printf '%s\n' "$changed" | sed '/^$/d' | sort -u | grep -Ev '^(01_Plans/tests/test_runtime_parameter_backend_registry_contract.py|04_Documentation/configuration.md|\.github/workflows/lane-b2-configuration-static-default-fix-once.yml)$' || true)
          test -z "$unexpected"
      - name: Commit patch and retire one-shot workflow
        run: |
          git rm .github/workflows/lane-b2-configuration-static-default-fix-once.yml
          git add 04_Documentation/configuration.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs(config): task model mapの空文字defaultを明示する"
          git push
