name: Temporary lane C retired one-shot guard verification

on:
  push:
    branches:
      - test/lane-c-retired-one-shot-path-guard-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: test/lane-c-retired-one-shot-path-guard-20260904
          fetch-depth: 0

      - name: Verify guard and planning contracts
        run: |
          set -euo pipefail
          python -m unittest 01_Plans.tests.test_retired_one_shot_assets
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json
          python -c 'import json; from pathlib import Path; report=json.loads(Path("/tmp/triage.json").read_text(encoding="utf-8")); assert not report.get("errors"), report.get("errors")'
          git -c core.whitespace=cr-at-eol diff --check

      - name: Mutation check retired path restoration is detected
        run: |
          set -euo pipefail
          mkdir -p .github/workflows
          printf '%s\n' 'name: retired-probe' > .github/workflows/apply-ai-merge-ir-once.yml
          set +e
          python -m unittest 01_Plans.tests.test_retired_one_shot_assets > /tmp/mutation.log 2>&1
          status=$?
          set -e
          cat /tmp/mutation.log
          test "$status" -ne 0
          grep -F 'apply-ai-merge-ir-once.yml' /tmp/mutation.log
          rm .github/workflows/apply-ai-merge-ir-once.yml
