name: R21 transfer validity one-shot

on:
  push:
    branches:
      - dogfood/r21-formal-snapshot-transfer-validity-20260904

permissions:
  contents: write

jobs:
  patch-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with full history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: dogfood/r21-formal-snapshot-transfer-validity-20260904

      - name: Apply R21 operator clarifications
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # 1) Continuous-dogfood index: add R21 after R20 without changing formal inputs.
          index = root / '01_Plans/dogfood/cognitive-dogfood-index.md'
          text = index.read_text(encoding='utf-8')
          marker = '''- `doc_kj_atlas_dogfood_r20.json`
            - R20のKJキャンバス。方式の意味が利用経路のどこでも落ちないことと、formal Case・第三者価値実証・scale課題を別境界として残すことを示す。
          '''
          addition = marker + '''- `cognitive-dogfood-continuous-2026-09-04-r21.md`
            - R21。8月27日のformal product snapshotと9月4日のcurrent mainを混同せず、元比較の内的妥当性と現在mainへの移送妥当性を二段階へ分離した記録。C/D runtimeも既存freeze契約どおり固定product commitを使うことをoperator手順へ戻す。
          - `doc_kj_atlas_dogfood_r21.json`
            - R21のKJキャンバス。commit距離と意味ドリフトを分け、元portfolioを書き換えず後段のcurrent-state replicationで現在性を確かめる構造を保持する。
          '''
          if 'cognitive-dogfood-continuous-2026-09-04-r21.md' not in text:
              if marker not in text:
                  raise SystemExit('R20 index marker not found')
              text = text.replace(marker, addition, 1)
              index.write_text(text, encoding='utf-8')

          # 2) Common C/D UI runbook: make the already-frozen runtime ref executable.
          runbook = root / '01_Plans/dogfood/cognitive-dogfood-cd-ui-runbook.md'
          text = runbook.read_text(encoding='utf-8')
          anchor = '\n## 3. 実装上確認済みのUI経路\n'
          runtime = '''
          ### 2.1 KJ Atlas runtimeも固定product commitを使う

          formal Round 1のC/Dで操作するKJ Atlas runtimeは、evidence bundleと同じ `hat47x/kj-atlas@2232b3bb26647e5c4a083f55bdbf83c161698649` を基準とする。Arm packageはruntime本体を同梱しないため、操作者が固定commitのcheckout / worktreeからKJ Atlasを起動する。

          current mainや別commitのUIを、同じformal runのruntimeとして黙って代用しない。固定commitで本書の必要操作経路を実行できない場合は、UI探索時間をM9へ算入して帳尻を合わせるのではなく、そのrunを`blocked / invalid / partial`として理由を残し、別revisionが必要かを判断する。

          この明示はproduct snapshotやtreatmentを変更するものではない。`cognitive-dogfood-case-portfolio-freeze.md`に既にある「3Caseで同じKJ Atlas product commitを使用する」という不変条件を、操作者が実行できる形へ展開したものである。
          '''
          if '### 2.1 KJ Atlas runtimeも固定product commitを使う' not in text:
              if anchor not in text:
                  raise SystemExit('C/D runbook section 3 anchor not found')
              text = text.replace(anchor, '\n' + runtime + anchor, 1)
              runbook.write_text(text, encoding='utf-8')

          # 3) Case 001 launch procedure: same runtime boundary at the concrete first-run entry.
          procedure = root / '01_Plans/dogfood/cognitive-dogfood-case-001-launch-procedure.md'
          text = procedure.read_text(encoding='utf-8')
          anchor = '\n## 2. Armの実行順と入力\n'
          runtime = '''
          ### 1.3 Frozen KJ Atlas runtime — C/Dのみ

          C/Dで実際に操作するKJ Atlasは、formal product snapshotと同じ `2232b3bb26647e5c4a083f55bdbf83c161698649` のcheckout / worktreeから起動する。Actions artifactは分析入力を隔離するためのpackageであり、KJ Atlas runtimeそのものを含まない。

          run開始前に、操作者は固定commitでC/D共通runbookの必要UI経路を使用できることを確認する。現在mainや別commitしか起動できない場合、それを元のRound 1へ黙って代用しない。固定runtimeで実行不能なら`blocked / invalid / partial`として理由を保存し、別revisionとして扱う。

          A/BはKJ Atlas UIをtreatmentとして使用しないため、このruntime起動手順の対象外である。
          '''
          if '### 1.3 Frozen KJ Atlas runtime — C/Dのみ' not in text:
              if anchor not in text:
                  raise SystemExit('Case 001 procedure section 2 anchor not found')
              text = text.replace(anchor, '\n' + runtime + anchor, 1)
              procedure.write_text(text, encoding='utf-8')
          PY

      - name: Validate planning and dogfood contracts
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python -m unittest 01_Plans/dogfood/test_validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check

      - name: Commit validated R21 changes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/r21-transfer-validity-once.yml
          git add \
            01_Plans/dogfood/cognitive-dogfood-index.md \
            01_Plans/dogfood/cognitive-dogfood-cd-ui-runbook.md \
            01_Plans/dogfood/cognitive-dogfood-case-001-launch-procedure.md \
            01_Plans/dogfood/cognitive-dogfood-continuous-2026-09-04-r21.md \
            01_Plans/dogfood/doc_kj_atlas_dogfood_r21.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "dogfood: 凍結runtimeと現在性の境界を明示する"
          git push origin HEAD:dogfood/r21-formal-snapshot-transfer-validity-20260904
