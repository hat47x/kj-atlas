name: Lane C guest admission R1 persistence governance once

on:
  push:
    branches:
      - lane-c/guest-admission-primitive-r1-20260906

permissions:
  contents: write

jobs:
  govern-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KJ_ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      KJ_ATLAS_TEST_POSTGRES_RUNTIME_DATABASE_URL: postgresql+psycopg://kj_runtime:runtime@localhost:5432/postgres
      KJ_ATLAS_RUN_PG_RLS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Register guest models in central persistence governance
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          shapes = root / '03_Implement/backend/src/kj_atlas_api/persistence_shapes.py'
          text = shapes.read_text()
          marker = '    "tenant_identity_providers.tenant_id": INTERNAL_ID,\n'
          block = '''    # ADR-0080: guest identity is tenant-scoped but deliberately not a TenantMembership.\n    # Keep every persisted guest string under the same portable shape catalog as existing SaaS state.\n    "guest_principals.tenant_id": INTERNAL_ID,\n    "guest_principals.guest_principal_id": INTERNAL_ID,\n    "guest_principals.invited_email": _bounded(320, "email address acceptance bound"),\n    "guest_principals.status": STATE,\n    "guest_principals.verification_method": STATE,\n    "guest_principals.verified_issuer": _bounded(\n        OIDC_ISSUER_MAX_CHARS, "verified guest identity issuer acceptance bound"\n    ),\n    "guest_principals.verified_subject": EXTERNAL_ID,\n    "guest_principals.created_by": EXTERNAL_ID,\n    "guest_principals.created_at": TIMESTAMP,\n    "guest_principals.expires_at": TIMESTAMP,\n    "guest_principals.redeemed_at": TIMESTAMP,\n    "guest_principals.revoked_at": TIMESTAMP,\n    "guest_document_grants.tenant_id": INTERNAL_ID,\n    "guest_document_grants.guest_principal_id": INTERNAL_ID,\n    "guest_document_grants.doc_id": INTERNAL_ID,\n    "guest_document_grants.granted_by": EXTERNAL_ID,\n    "guest_document_grants.granted_at": TIMESTAMP,\n    "guest_document_grants.revoked_at": TIMESTAMP,\n'''
          if '"guest_principals.tenant_id"' not in text:
              if marker not in text:
                  raise SystemExit('persistence catalog insertion marker not found')
              text = text.replace(marker, block + marker, 1)
              shapes.write_text(text)

          models = root / '03_Implement/backend/src/kj_atlas_api/guest_admission_models.py'
          text = models.read_text()
          text = text.replace(
              'from sqlalchemy import CheckConstraint, ForeignKey, ForeignKeyConstraint, String, UniqueConstraint',
              'from sqlalchemy import CheckConstraint, ForeignKey, ForeignKeyConstraint, Text, UniqueConstraint',
          )
          if 'from kj_atlas_api.persistence_shapes import apply_persistent_text_shapes' not in text:
              text = text.replace(
                  'from kj_atlas_api.models import Base\n',
                  'from kj_atlas_api.models import Base\nfrom kj_atlas_api.persistence_shapes import apply_persistent_text_shapes\n',
                  1,
              )
          text = re.sub(r'String\(\d+\)', 'Text', text)
          if 'apply_persistent_text_shapes(Base.metadata)' not in text:
              text = text.rstrip() + '\n\n\n# Register these late-defined tables in the same portable shape contract as models.py.\napply_persistent_text_shapes(Base.metadata)\n'
          models.write_text(text)

          env = root / '03_Implement/backend/alembic/env.py'
          text = env.read_text()
          import_line = 'from kj_atlas_api import guest_admission_models as _guest_admission_models  # noqa: E402,F401\n'
          if import_line not in text:
              anchor = 'from kj_atlas_api.models import Base\n'
              if anchor not in text:
                  raise SystemExit('alembic env import marker not found')
              text = text.replace(anchor, anchor + import_line, 1)
              env.write_text(text)

          tests = root / '03_Implement/backend/tests/test_persistence_shapes.py'
          text = tests.read_text()
          import_line = 'from kj_atlas_api.guest_admission_models import GuestDocumentGrantRow, GuestPrincipalRow\n'
          if import_line not in text:
              anchor = 'from kj_atlas_api.models import Base\n'
              if anchor not in text:
                  raise SystemExit('persistence test import marker not found')
              text = text.replace(anchor, import_line + anchor, 1)
          if 'def test_guest_admission_shapes_are_centrally_governed()' not in text:
              text = text.rstrip() + '''\n\n\ndef test_guest_admission_shapes_are_centrally_governed() -> None:\n    assert GuestPrincipalRow.__table__.metadata is Base.metadata\n    assert GuestDocumentGrantRow.__table__.metadata is Base.metadata\n    expected = {\n        "guest_principals.tenant_id": 128,\n        "guest_principals.guest_principal_id": 128,\n        "guest_principals.invited_email": 320,\n        "guest_principals.verified_issuer": 512,\n        "guest_principals.verified_subject": 512,\n        "guest_document_grants.tenant_id": 128,\n        "guest_document_grants.guest_principal_id": 128,\n        "guest_document_grants.doc_id": 128,\n    }\n    for qualified_name, max_chars in expected.items():\n        assert PERSISTENT_TEXT_SPECS[qualified_name].proposed_max_chars == max_chars\n        table_name, column_name = qualified_name.split(".", 1)\n        assert Base.metadata.tables[table_name].columns[column_name].type.length == max_chars\n\n'''
          tests.write_text(text)
          PY
      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test,postgres]'
      - name: Create restricted runtime role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kj_runtime LOGIN PASSWORD 'runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE postgres TO kj_runtime;
          GRANT USAGE ON SCHEMA public TO kj_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kj_runtime;
          SQL
      - name: Ruff governed guest surface
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            alembic/env.py \
            alembic/versions/20260906_0033_add_guest_admission_primitive.py \
            src/kj_atlas_api/guest_admission_models.py \
            src/kj_atlas_api/guest_admission_repository.py \
            src/kj_atlas_api/persistence_shapes.py \
            src/kj_atlas_api/tenant_db_guard.py \
            tests/test_guest_admission_repository.py \
            tests/test_guest_admission_postgres_rls.py \
            tests/test_persistence_shapes.py \
            tests/test_tenant_db_guard.py \
            tests/test_alembic_lineage.py
      - name: Focused integration and persistence tests
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_guest_admission_repository.py \
            tests/test_guest_admission_postgres_rls.py \
            tests/test_tenant_db_guard.py \
            tests/test_alembic_lineage.py \
            tests/test_persistence_shapes.py \
            tests/test_database_support.py
      - name: Diff check
        run: git diff --check
      - name: Commit governed persistence surface and retire verifier
        run: |
          rm .github/workflows/lane-c-guest-admission-r1-governance-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            03_Implement/backend/src/kj_atlas_api/persistence_shapes.py \
            03_Implement/backend/src/kj_atlas_api/guest_admission_models.py \
            03_Implement/backend/alembic/env.py \
            03_Implement/backend/tests/test_persistence_shapes.py \
            .github/workflows/lane-c-guest-admission-r1-governance-once.yml
          git commit -m 'fix(saas): register guest persistence in central metadata governance'
          git push
