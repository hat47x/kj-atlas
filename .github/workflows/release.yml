name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  backend-docker-build:
    name: Backend Docker build (no push)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./03_Implement/backend
          file: ./03_Implement/backend/Dockerfile
          push: false
          tags: kj-atlas-api:${{ github.ref_name }}

  frontend-build:
    name: Frontend dist build + artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Build frontend dist
        working-directory: 03_Implement/frontend
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.ref_name }}
          path: 03_Implement/frontend/dist
          if-no-files-found: error
