name: Lane B2 compose delivery verify once

on:
  push:
    branches:
      - fix/lane-b2-compose-env-uniqueness-20260906

permissions:
  contents: write

jobs:
  verify-and-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/lane-b2-compose-env-uniqueness-20260906

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify focused Compose delivery contract
        run: python 01_Plans/tests/test_compose_runtime_delivery_contract.py

      - name: Verify repository planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify docs contracts
        run: python 01_Plans/docs_check.py

      - name: Verify Compose syntax when Docker is available
        run: docker compose -f 03_Implement/deploy/docker-compose.yml config >/dev/null

      - name: Verify diff hygiene
        run: git diff --check HEAD^..HEAD || git diff --check

      - name: Retire one-shot workflow
        env:
          BRANCH: fix/lane-b2-compose-env-uniqueness-20260906
        run: |
          rm .github/workflows/lane-b2-compose-delivery-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/lane-b2-compose-delivery-verify-once.yml
          git commit -m 'ci: retire Lane B2 compose delivery verifier'
          git push origin HEAD:"$BRANCH"
