name: Lane B2 LOG_LEVEL output scope fix once

on:
  push:
    branches:
      - fix/lane-b2-log-level-output-scope-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align LOG_LEVEL public wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('04_Documentation/configuration.md')
          raw = path.read_bytes()
          old = ('| `KJ_ATLAS_LOG_LEVEL` | `INFO` | 構造化（JSON）ログの出力レベル（OPS-OBSERV-01）。'
                 '`CRITICAL`/`ERROR`/`WARNING`/`INFO`/`DEBUG`、未知値（`NOTSET` を含む）は `INFO` へフォールバック |').encode('utf-8')
          new = ('| `KJ_ATLAS_LOG_LEVEL` | `INFO` | アプリケーションログ（JSON／人間可読）とuvicornログの出力レベル（OPS-OBSERV-01）。'
                 '`CRITICAL`/`ERROR`/`WARNING`/`INFO`/`DEBUG`、未知値（`NOTSET` を含む）は `INFO` へフォールバック |').encode('utf-8')
          count = raw.count(old)
          if count != 1:
              raise SystemExit(f'expected one LOG_LEVEL row to patch, got {count}')
          path.write_bytes(raw.replace(old, new, 1))
          PY

      - name: Verify focused observability contract
        run: python -m unittest discover -s 01_Plans/tests -p 'test_log_json_observability_surface_contract.py' -v

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify narrow diff and EOL preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '01_Plans/tests/test_log_json_observability_surface_contract.py',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-log-level-output-scope-fix-once.yml',
          }
          changed = set(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD']
          ).decode().splitlines())
          changed |= set(subprocess.check_output(
              ['git', 'diff', '--name-only']
          ).decode().splitlines())
          extra = changed - allowed
          if extra:
              raise SystemExit(f'unexpected changed files: {sorted(extra)}')

          current = Path('04_Documentation/configuration.md').read_bytes()
          base = subprocess.check_output(
              ['git', 'show', 'origin/main:04_Documentation/configuration.md']
          )
          def eol_shape(data: bytes) -> tuple[int, int]:
              return data.count(b'\r\n'), data.count(b'\n') - data.count(b'\r\n')
          if eol_shape(current) != eol_shape(base):
              raise SystemExit(
                  f'configuration EOL shape changed: base={eol_shape(base)} current={eol_shape(current)}'
              )
          PY
          git diff --check -- 01_Plans/tests/test_log_json_observability_surface_contract.py
          git -c core.whitespace=cr-at-eol diff --check -- 04_Documentation/configuration.md

      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 04_Documentation/configuration.md
          git commit -m "docs(config): LOG_LEVEL scopeを全ログ形式へ同期する"
          git rm .github/workflows/lane-b2-log-level-output-scope-fix-once.yml
          git commit -m "ci(b2): retire LOG_LEVEL output scope helper"
          git push
