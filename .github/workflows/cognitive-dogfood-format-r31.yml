name: Cognitive dogfood format R31

on:
  push:
    branches:
      - fix/cognitive-arm-package-frozen-anchor-20260905

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore section spacing and validate issue
        run: |
          set -euo pipefail
          issue='01_Plans/issues/issue-COGNITIVE-DOGFOOD-01-product-development-cognitive-workbench.md'
          python -c 'from pathlib import Path; p=Path("01_Plans/issues/issue-COGNITIVE-DOGFOOD-01-product-development-cognitive-workbench.md"); s=p.read_text(encoding="utf-8"); p.write_text(s.replace("残るT9へ実使用証拠を返すことである。\n### Formal Case", "残るT9へ実使用証拠を返すことである。\n\n### Formal Case"), encoding="utf-8")'
          python 01_Plans/issues/validate_active_issue_memos.py
          git diff --check
      - name: Commit formatting and retire one-shot workflow
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add 01_Plans/issues/issue-COGNITIVE-DOGFOOD-01-product-development-cognitive-workbench.md
          git rm .github/workflows/cognitive-dogfood-format-r31.yml
          git commit -m 'docs: cognitive dogfood checkpointの段落を整える'
          git push origin HEAD:${GITHUB_REF_NAME}
