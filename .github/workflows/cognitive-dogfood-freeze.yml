name: Cognitive dogfood freeze

on:
  pull_request:
    paths:
      - "01_Plans/dogfood/cognitive-dogfood-case-*-launch-*.md"
      - "01_Plans/dogfood/cognitive-dogfood-case-*-round1-source-manifest.json"
      - "01_Plans/dogfood/cognitive-dogfood-case-001-skill-manifest.json"
      - "01_Plans/dogfood/cognitive-dogfood-run-record-template.md"
      - "01_Plans/dogfood/doc_cognitive_case_*_starter.json"
      - "01_Plans/dogfood/validate_cognitive_launch_packets.py"
      - "01_Plans/dogfood/validate_cognitive_run_records.py"
      - "01_Plans/dogfood/test_validate_cognitive_run_records.py"
      - "01_Plans/dogfood/build_cognitive_blind_package.py"
      - "01_Plans/dogfood/test_build_cognitive_blind_package.py"
      - "01_Plans/dogfood/prepare_cognitive_frozen_source_bundle.py"
      - "01_Plans/dogfood/prepare_cognitive_case001_skill_bundle.py"
      - ".github/workflows/cognitive-dogfood-freeze.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-input-preflight:
    name: Frozen input preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout KJ Atlas
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Checkout frozen cultural-substrate-weaving skill
        uses: actions/checkout@v5
        with:
          repository: hat47x/cultural-substrate-weaving
          ref: 3988e12e5f7f316f377d3391e9486c8467a111d5
          path: _skill_repo
          fetch-depth: 1
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate frozen launch packets
        run: python 01_Plans/dogfood/validate_cognitive_launch_packets.py
      - name: Test run intake and blind-package contracts
        working-directory: 01_Plans/dogfood
        run: python -m unittest test_validate_cognitive_run_records.py test_build_cognitive_blind_package.py
      - name: Reproduce frozen product evidence bundles
        shell: bash
        run: |
          set -euo pipefail
          for case_number in 001 002 003; do
            python 01_Plans/dogfood/prepare_cognitive_frozen_source_bundle.py \
              --repo-root . \
              --manifest "01_Plans/dogfood/cognitive-dogfood-case-${case_number}-round1-source-manifest.json" \
              --output "/tmp/cognitive-dogfood-case-${case_number}-bundle"
          done
      - name: Reproduce frozen skill bundle
        run: |
          python 01_Plans/dogfood/prepare_cognitive_case001_skill_bundle.py \
            --skill-repo-root _skill_repo \
            --manifest 01_Plans/dogfood/cognitive-dogfood-case-001-skill-manifest.json \
            --output /tmp/cognitive-dogfood-skill-bundle
      - name: Assemble all case arm packages
        shell: bash
        run: |
          set -euo pipefail
          for case_number in 001 002 003; do
            root="/tmp/cognitive-dogfood-case-${case_number}-arms"
            for arm in A B C D; do
              mkdir -p "$root/$arm/product"
              cp -a "/tmp/cognitive-dogfood-case-${case_number}-bundle/." "$root/$arm/product/"
            done

            cp "01_Plans/dogfood/cognitive-dogfood-case-${case_number}-launch-ordinary.md" "$root/A/launch.md"
            cp "01_Plans/dogfood/cognitive-dogfood-case-${case_number}-launch-skill.md" "$root/B/launch.md"
            cp "01_Plans/dogfood/cognitive-dogfood-case-${case_number}-launch-atlas.md" "$root/C/launch.md"
            cp "01_Plans/dogfood/cognitive-dogfood-case-${case_number}-launch-atlas-skill.md" "$root/D/launch.md"

            mkdir -p "$root/B/skill" "$root/D/skill"
            cp -a /tmp/cognitive-dogfood-skill-bundle/. "$root/B/skill/"
            cp -a /tmp/cognitive-dogfood-skill-bundle/. "$root/D/skill/"

            cp "01_Plans/dogfood/doc_cognitive_case_${case_number}_starter.json" "$root/C/starter.json"
            cp "01_Plans/dogfood/doc_cognitive_case_${case_number}_starter.json" "$root/D/starter.json"
          done

      - name: Upload Case 001 Arm A package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-001-arm-a
          path: /tmp/cognitive-dogfood-case-001-arms/A
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 001 Arm B package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-001-arm-b
          path: /tmp/cognitive-dogfood-case-001-arms/B
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 001 Arm C package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-001-arm-c
          path: /tmp/cognitive-dogfood-case-001-arms/C
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 001 Arm D package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-001-arm-d
          path: /tmp/cognitive-dogfood-case-001-arms/D
          if-no-files-found: error
          retention-days: 14

      - name: Upload Case 002 Arm A package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-002-arm-a
          path: /tmp/cognitive-dogfood-case-002-arms/A
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 002 Arm B package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-002-arm-b
          path: /tmp/cognitive-dogfood-case-002-arms/B
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 002 Arm C package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-002-arm-c
          path: /tmp/cognitive-dogfood-case-002-arms/C
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 002 Arm D package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-002-arm-d
          path: /tmp/cognitive-dogfood-case-002-arms/D
          if-no-files-found: error
          retention-days: 14

      - name: Upload Case 003 Arm A package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-003-arm-a
          path: /tmp/cognitive-dogfood-case-003-arms/A
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 003 Arm B package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-003-arm-b
          path: /tmp/cognitive-dogfood-case-003-arms/B
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 003 Arm C package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-003-arm-c
          path: /tmp/cognitive-dogfood-case-003-arms/C
          if-no-files-found: error
          retention-days: 14
      - name: Upload Case 003 Arm D package
        uses: actions/upload-artifact@v4
        with:
          name: cognitive-dogfood-case-003-arm-d
          path: /tmp/cognitive-dogfood-case-003-arms/D
          if-no-files-found: error
          retention-days: 14
