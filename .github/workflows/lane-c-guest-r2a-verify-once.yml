name: Lane C guest auth edge R2a verify once

on:
  push:
    branches:
      - lane-c/guest-admission-auth-edge-r2-20260906

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KJ_ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      KJ_ATLAS_TEST_POSTGRES_RUNTIME_DATABASE_URL: postgresql+psycopg://kj_runtime:runtime@localhost:5432/postgres
      KJ_ATLAS_RUN_PG_RLS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply R2a integration patch
        run: python .github/scripts/lane_c_guest_r2a_apply.py
      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test,postgres]'
      - name: Create restricted runtime role before migrations
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kj_runtime LOGIN PASSWORD 'runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE postgres TO kj_runtime;
          GRANT USAGE ON SCHEMA public TO kj_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kj_runtime;
          SQL
      - name: Ruff R2a surface
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            alembic/env.py \
            alembic/versions/20260906_0034_add_guest_auth_sessions.py \
            src/kj_atlas_api/guest_auth_session_models.py \
            src/kj_atlas_api/guest_auth_state.py \
            src/kj_atlas_api/guest_request_auth.py \
            src/kj_atlas_api/main.py \
            src/kj_atlas_api/persistence_shapes.py \
            src/kj_atlas_api/routes/docs.py \
            src/kj_atlas_api/tenant_context.py \
            tests/test_guest_auth_session_store.py \
            tests/test_guest_auth_session_postgres.py \
            tests/test_guest_docs_http_authorization.py \
            tests/test_persistence_shapes.py
      - name: Focused guest R2a tests
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_guest_auth_session_store.py \
            tests/test_guest_auth_session_postgres.py \
            tests/test_guest_docs_http_authorization.py \
            tests/test_guest_admission_repository.py \
            tests/test_guest_admission_postgres_rls.py \
            tests/test_tenant_db_guard.py \
            tests/test_alembic_lineage.py \
            tests/test_persistence_shapes.py \
            tests/test_database_support.py
      - name: Planning and diff hygiene
        run: |
          python 01_Plans/docs_check.py
          git diff --check
      - name: Commit verified R2a surface and retire one-shot tooling
        run: |
          rm .github/scripts/lane_c_guest_r2a_apply.py
          rm .github/workflows/lane-c-guest-r2a-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'feat(saas): wire guest server session to exact document read authorization'
          git push
