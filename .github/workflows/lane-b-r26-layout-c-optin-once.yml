name: lane-b-r26-layout-c-optin-once

on:
  push:
    branches:
      - lane-b/provider-token-layout-c-optin

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-token-layout-c-optin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply R26 patch
        run: |
          echo ' ' | base64 -d | python

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Dry-run default and explicit C comparison
        working-directory: 03_Implement/backend
        run: |
          python scripts/measure_ai_route_provider_tokens.py --provider named-test-provider --model named-model > /tmp/default.json
          python scripts/measure_ai_route_provider_tokens.py --provider named-test-provider --model named-model --include-layout-c > /tmp/layout-c.json
          python -c "import json; a=json.load(open('/tmp/default.json')); b=json.load(open('/tmp/layout-c.json')); assert len(a['routes']) == 6; assert len(b['routes']) == 37; assert b['layout_c_summary']['requests'] == 31; assert b['layout_c_summary']['prompt']['aggregate_utf8_bytes'] == 87705"

      - name: Run focused regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_route_projection_candidates.py

      - name: Lint and hygiene
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            scripts/measure_ai_route_provider_tokens.py \
            tests/test_ai_route_provider_token_measurement.py
          git diff --check

      - name: Commit tested slice and self-delete workflow
        run: |
          rm .github/workflows/lane-b-r26-layout-c-optin-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'test(ai): add explicit layout C provider measurement opt-in'
          git push origin HEAD:lane-b/provider-token-layout-c-optin
