name: Temporary lane C issue identity verification

on:
  push:
    branches:
      - chore/lane-c-issue-identity-guard-20260904

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-issue-identity-guard-20260904
          fetch-depth: 0
      - name: Run issue identity and planning checks
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans/issues/tests/test_validate_active_issue_memos.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python 03_Implement/backend/scripts/check_design_consistency.py
          python - <<'PY'
          from collections import defaultdict
          from pathlib import Path
          import re

          root = Path('01_Plans/issues')
          status_re = re.compile(r'^- Status:\s*(.+)$', re.M)
          active = {'Draft', 'Open', 'In Progress'}
          by_name = defaultdict(list)
          active_in_done = []

          for path in sorted(root.rglob('issue-*.md')):
              rel = path.relative_to(root).as_posix()
              by_name[path.name].append(rel)
              match = status_re.search(path.read_text(encoding='utf-8'))
              status = match.group(1).strip().strip('`') if match else '<missing>'
              if rel.startswith('done/') and status in active:
                  active_in_done.append((rel, status))

          duplicates = {name: paths for name, paths in by_name.items() if len(paths) > 1}
          print(f'duplicate_basenames={len(duplicates)}')
          print(f'active_in_done={len(active_in_done)}')
          if duplicates or active_in_done:
              for name, paths in sorted(duplicates.items()):
                  print(f'DUPLICATE {name}: {paths}')
              for rel, status in active_in_done:
                  print(f'ACTIVE_IN_DONE {status} {rel}')
              raise SystemExit(1)
          PY
          git diff --check
      - name: Remove one-shot workflow after successful verification
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-issue-identity-verify-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove verified lane C issue identity workflow'
          git push origin HEAD:chore/lane-c-issue-identity-guard-20260904
