name: OPS SaaS AC6 close once

on:
  push:
    branches:
      - test/ops-saas-ac6-failclosed-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ops-saas-ac6-failclosed-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate completed issue move
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          test ! -e 01_Plans/issues/issue-OPS-SAAS-SCALE-01-in-process-state-blocks-horizontal-scaling.md
          grep -q -- '- Status: Done' 01_Plans/issues/done/issue-OPS-SAAS-SCALE-01-in-process-state-blocks-horizontal-scaling.md
          grep -q -- '- \[x\] AC-6:' 01_Plans/issues/done/issue-OPS-SAAS-SCALE-01-in-process-state-blocks-horizontal-scaling.md
          git fetch origin main
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
      - name: Remove one-shot workflow after success
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/ops-saas-ac6-close-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'ci: OPS SaaS AC-6完了検証workflowを削除する'
          git push origin HEAD:test/ops-saas-ac6-failclosed-20260904
