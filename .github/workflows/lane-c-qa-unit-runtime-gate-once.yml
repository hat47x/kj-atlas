name: Lane C QA UNIT runtime gate once

on:
  push:
    branches:
      - qa/lane-c-qa-unit-runtime-gate-r1-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stage Open sync and state-transition tests
        run: python .github/scripts/lane_c_qa_unit_runtime_gate.py

      - name: Install file-local DOM test environment under repository Node contract
        working-directory: 03_Implement/frontend
        env:
          npm_config_engine_strict: 'true'
        run: |
          set -euo pipefail
          npm ci
          echo "Node: $(node --version)"
          echo "happy-dom latest engines: $(npm view happy-dom@latest engines.node)"
          npm install --save-dev happy-dom@latest
          npm ls happy-dom

      - name: Verify targeted runtime gate and full frontend unit profile
        working-directory: 03_Implement/frontend
        run: |
          set -euo pipefail
          npm run typecheck
          npx vitest run src/ui/TenantSessionRuntimeGate.test.ts
          npm run test

      - name: Retire one-shot inputs before repository guards
        run: |
          rm .github/scripts/lane_c_qa_unit_runtime_gate.py
          rm .github/workflows/lane-c-qa-unit-runtime-gate-once.yml

      - name: Verify scope and planning/docs guards
        run: |
          set -euo pipefail
          grep -F 'environment: "node"' 03_Implement/frontend/vite.config.ts
          grep -F '// @vitest-environment happy-dom' 03_Implement/frontend/src/ui/TenantSessionRuntimeGate.test.ts
          grep -F -- '- Status: Open' 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md
          grep -F '## 2026-09-07 Open化同期 / 第2バッチ再開' 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md
          python -m pip install pytest
          python -m pytest -q 01_Plans/tests
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check

      - name: Show final narrow diff
        run: |
          git status --short
          git diff --stat origin/main
          git diff -- 03_Implement/frontend/package.json 03_Implement/frontend/package-lock.json 03_Implement/frontend/src/ui/TenantSessionRuntimeGate.test.ts 01_Plans/issues/issue-QA-UNIT-01-unit-test-coverage-improvement.md

      - name: Commit verified second batch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'test(qa): TenantSessionRuntimeGateの状態遷移をunit固定する'
          git push origin HEAD:${GITHUB_REF_NAME}
