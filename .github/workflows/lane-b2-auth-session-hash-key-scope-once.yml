name: Lane B2 auth session hash key scope once

on:
  push:
    branches:
      - fix/lane-b2-auth-session-hash-key-scope-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch public key scope and add focused contract
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f 01_Plans/tests/test_auth_session_hash_key_scope_contract.py; then
            python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              raw = path.read_bytes()
              old_b = old.encode('utf-8')
              count = raw.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}')
              path.write_bytes(raw.replace(old_b, new.encode('utf-8')))

          replace_once(
              Path('02_Architecture/runtime_parameter_registry.md'),
              '| `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY` | 未設定 | auth-session cookie 値の HMAC-SHA256 ハッシュ用キー（ADR-0074 decision 2、64文字 lowercase hex = 32 bytes）。生値を平文保存しない。ローテーション時は新キー設定＋再起動で既存セッションを無効化する | direct | 秘密値 | キー変更で既存セッションが無効化され再ログインへ導かれることを確認する |',
              '| `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY` | 未設定 | member SaaS auth session、guest auth session、guest redeem state のHMAC-SHA256導出に共有するキー（ADR-0074 decision 2 / ADR-0080、64文字 lowercase hex = 32 bytes）。guest redeem state は `guest-redeem-v1` domain separation を通す。生cookie/state値は平文保存せず、ローテーション時は新キー設定＋再起動で既存member/guest sessionと未使用redeem stateを無効化する | direct | 秘密値 | キー変更で既存member/guest sessionと未使用redeem stateが無効化され、sessionは再ログイン／guest sign-inへ導かれることを確認する |',
          )
          replace_once(
              Path('04_Documentation/configuration.md'),
              '| `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY` | 未設定 | ADR-0074 decision 2: 認証 session cookie の HMAC-SHA256 キー（64 文字 lowercase hex = 32 bytes）。`saas-multitenant` では必須。生cookie値はDBへ保存せず、このキーでハッシュする |',
              '| `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY` | 未設定 | ADR-0074 / ADR-0080: member SaaS auth session、guest auth session、guest redeem state のHMAC-SHA256導出に共有するキー（64文字 lowercase hex = 32 bytes）。`saas-multitenant` では必須。guest redeem state はdomain separationを通し、生cookie/state値はDBへ平文保存しない。キーをローテーションすると既存member/guest sessionと未使用redeem stateは無効化される |',
          )
          PY

            cat > 01_Plans/tests/test_auth_session_hash_key_scope_contract.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import unittest

          ROOT = Path(__file__).resolve().parents[2]
          MAIN = ROOT / '03_Implement/backend/src/kj_atlas_api/main.py'
          GUEST_ROUTE = ROOT / '03_Implement/backend/src/kj_atlas_api/routes/guest_session.py'
          GUEST_AUTH = ROOT / '03_Implement/backend/src/kj_atlas_api/guest_request_auth.py'
          GUEST_REDEEM = ROOT / '03_Implement/backend/src/kj_atlas_api/guest_redeem.py'
          CONFIG = ROOT / '04_Documentation/configuration.md'
          REGISTRY = ROOT / '02_Architecture/runtime_parameter_registry.md'


          class AuthSessionHashKeyScopeContractTest(unittest.TestCase):
              def test_one_runtime_key_is_wired_to_member_guest_and_redeem_consumers(self) -> None:
                  main = MAIN.read_text(encoding='utf-8')
                  self.assertIn('app.state.saas_auth_session_hash_key = _saas_auth_session_hash_key', main)
                  self.assertIn('app.state.guest_auth_session_hash_key = _saas_auth_session_hash_key', main)
                  self.assertIn('app.state.guest_redeem_state_hash_key = _saas_auth_session_hash_key', main)

                  guest_route = GUEST_ROUTE.read_text(encoding='utf-8')
                  self.assertIn('guest_redeem_state_hash_key', guest_route)
                  self.assertIn('guest_auth_session_hash_key', guest_route)

                  guest_auth = GUEST_AUTH.read_text(encoding='utf-8')
                  self.assertIn('guest_auth_session_hash_key', guest_auth)
                  self.assertIn('derive_session_key_hash(raw_session_id, key=hash_key)', guest_auth)

                  redeem = GUEST_REDEEM.read_text(encoding='utf-8')
                  self.assertIn('_REDEEM_STATE_DOMAIN = "guest-redeem-v1\\x00"', redeem)
                  self.assertIn('derive_session_key_hash(_REDEEM_STATE_DOMAIN + raw_state, key=hash_key)', redeem)

              def test_public_contract_names_all_rotation_impacts(self) -> None:
                  for path in (CONFIG, REGISTRY):
                      text = path.read_text(encoding='utf-8')
                      row = next(
                          line for line in text.splitlines()
                          if line.startswith('| `KJ_ATLAS_SAAS_AUTH_SESSION_HASH_KEY` |')
                      )
                      self.assertIn('member', row)
                      self.assertIn('guest auth session', row)
                      self.assertIn('guest redeem state', row)
                      self.assertIn('未使用redeem state', row)
                      self.assertIn('無効化', row)


          if __name__ == '__main__':
              unittest.main()
          PY
          fi
      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans.tests.test_auth_session_hash_key_scope_contract -v
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check
          changed="$( { git diff --name-only HEAD; git ls-files --others --exclude-standard; } | sort -u )"
          printf '%s\n' "$changed"
          test "$(printf '%s\n' "$changed" | sed '/^$/d' | wc -l)" -eq 3
          printf '%s\n' "$changed" | grep -Fx '01_Plans/tests/test_auth_session_hash_key_scope_contract.py'
          printf '%s\n' "$changed" | grep -Fx '02_Architecture/runtime_parameter_registry.md'
          printf '%s\n' "$changed" | grep -Fx '04_Documentation/configuration.md'
          test "$(git diff --numstat -- 04_Documentation/configuration.md | awk '{print $1+$2}')" -le 2
      - name: Commit verified payload
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet || test -n "$(git ls-files --others --exclude-standard)"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 01_Plans/tests/test_auth_session_hash_key_scope_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
            git commit -m 'docs(auth): session hash keyのconsumer範囲をruntimeへ同期する'
            git push origin HEAD:fix/lane-b2-auth-session-hash-key-scope-20260907
          fi
