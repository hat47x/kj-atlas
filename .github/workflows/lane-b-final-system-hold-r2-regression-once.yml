name: lane-b-final-system-hold-r2-regression-once

on:
  push:
    branches:
      - lane-b/final-judgement-system-hold-r2

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/final-judgement-system-hold-r2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add detect-contradiction wiring regression
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('03_Implement/backend/tests/test_final_judgement_system_hold.py')
          text = path.read_text(encoding='utf-8')
          old = 'from kj_atlas_api.models_ai import CheckNarrativeRequest, ExternalProposalReference\n'
          new = '''from kj_atlas_api.models_ai import (\n    CheckNarrativeRequest,\n    DetectContradictionRequest,\n    ExternalProposalReference,\n)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'DetectContradictionRequest' not in text:
              raise SystemExit('models_ai import marker not found')

          marker = 'def test_detect_contradiction_linked_unavailable_holds('
          if marker not in text:
              text += '''\n\ndef test_detect_contradiction_linked_unavailable_holds(\n    monkeypatch: pytest.MonkeyPatch,\n) -> None:\n    engine = create_engine("sqlite:///:memory:")\n    Base.metadata.create_all(bind=engine)\n    with Session(engine) as db:\n        doc = _register_external(db)\n        cards = doc.cards[:2]\n        payload = DetectContradictionRequest(\n            cardA={"id": cards[0].id, "text": cards[0].text, "textReviewed": True},\n            cardB={"id": cards[1].id, "text": cards[1].text, "textReviewed": True},\n            doc=doc,\n            externalProposalRef={\n                "proposalId": "proposal-ext-1",\n                "sourceBundleHash": HASH_A,\n            },\n        )\n        monkeypatch.setattr(ai, "_resolve_audit_tenant", lambda *_args, **_kwargs: TENANT)\n        monkeypatch.setattr(ai, "_reject_unreviewed_cards", lambda *_args, **_kwargs: None)\n        monkeypatch.setattr(ai, "_detect_contradiction_ir", lambda _payload: {})\n        monkeypatch.setattr(ai, "adjudicated_contradiction", lambda *_args, **_kwargs: None)\n        monkeypatch.setattr(\n            ai,\n            "generate_with_fallback",\n            lambda _request: (_ for _ in ()).throw(\n                ProviderRequestError.unavailable(\n                    "final provider unavailable", _metadata("detect-unavailable")\n                )\n            ),\n        )\n\n        with pytest.raises(HTTPException) as exc:\n            ai.detect_contradiction(payload, _request(_CaptureDispatcher()), db)\n        assert exc.value.status_code == 503\n        assert _state(db, doc.id).status == "held"\n'''
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install backend and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest

      - name: Run focused backend regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q tests/test_final_judgement_system_hold.py tests/test_final_judgement_proposal_linkage.py tests/test_ai_eval_pipeline.py
          python -m compileall -q src/kj_atlas_api

      - name: Run repository contract checks
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check

          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              for error in result.errors:
                  print(error)
              raise SystemExit(1)
          print(
              'docs contract checks passed without repository-wide unittest suite: '
              f'active_memos={result.active_count}, tracked_markdown={result.markdown_count}'
          )
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check

      - name: Commit regression and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane-b-final-system-hold-r2-regression-once.yml
          git add 03_Implement/backend/tests/test_final_judgement_system_hold.py
          git commit -m "test(ai): cover contradiction system hold wiring"
          git push origin HEAD:lane-b/final-judgement-system-hold-r2
