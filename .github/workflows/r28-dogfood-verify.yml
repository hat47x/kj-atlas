name: R28 navigation authority verification

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py' -v
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
