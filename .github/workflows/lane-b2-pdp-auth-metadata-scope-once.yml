name: Lane B2 PDP auth-metadata scope once

on:
  push:
    branches:
      - docs/lane-b2-pdp-auth-metadata-scope-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply PDP auth-metadata scope patch
        run: python .github/lane-b2-pdp-auth-metadata-scope-patch.py
      - name: Verify focused PDP auth-metadata scope contract
        run: python -m unittest 01_Plans.tests.test_pdp_auth_metadata_scope_contract
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        shell: bash
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          python - <<'PY'
          import subprocess
          expected = {
              '01_Plans/tests/test_pdp_auth_metadata_scope_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
          }
          tracked = set(filter(None, subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()))
          untracked = set(filter(None, subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard'], text=True).splitlines()))
          actual = tracked | untracked
          if actual != expected:
              raise SystemExit(f'narrow diff mismatch: expected={sorted(expected)} actual={sorted(actual)}')
          PY
      - name: Commit patch and retire one-shot helpers
        shell: bash
        run: |
          rm .github/lane-b2-pdp-auth-metadata-scope-patch.py
          rm .github/workflows/lane-b2-pdp-auth-metadata-scope-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(config): PDP auth metadataのscopeを明示する'
          git push
