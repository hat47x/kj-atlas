name: Lane B2 audit dedup effect scope fix once

on:
  push:
    branches:
      - fix/lane-b2-audit-dedup-effect-scope-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align audit dedup public effect scope
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('02_Architecture/runtime_parameter_registry.md')
          text = registry.read_text(encoding='utf-8')
          old = '| `KJ_ATLAS_AUDIT_DEDUP_WINDOW_SECONDS` | `5.0` | 監査イベントの同一論理操作dedupウィンドウ（SEC-AUDIT-DUP-01）。`0` で無効化 | direct | 通常値 | 同一論理操作の二重POSTで外部シンクへ1件のみ送出されることを確認する |'
          new = '| `KJ_ATLAS_AUDIT_DEDUP_WINDOW_SECONDS` | `5.0` | `context-audit` / `export-audit` が渡す同一論理操作のdedup keyに対する重複排除ウィンドウ（SEC-AUDIT-DUP-01）。`view` / `LLM` / `proposal` 監査には適用しない。`0` で無効化 | direct | 通常値 | `context-audit` / `export-audit` の同一論理操作を二重POSTして外部シンクへ1件のみ送出されることを確認する。`view` / `LLM` / `proposal` はdedup対象として扱わない |'
          if text.count(old) != 1:
              raise SystemExit(f'expected one registry dedup row, got {text.count(old)}')
          registry.write_text(text.replace(old, new, 1), encoding='utf-8')

          config = Path('04_Documentation/configuration.md')
          raw = config.read_bytes()
          old_b = ('| `KJ_ATLAS_AUDIT_DEDUP_WINDOW_SECONDS` | `5.0` | 同一論理操作の監査イベント重複排除ウィンドウ（SEC-AUDIT-DUP-01）。`0` で無効化 |').encode('utf-8')
          new_b = ('| `KJ_ATLAS_AUDIT_DEDUP_WINDOW_SECONDS` | `5.0` | `context-audit` / `export-audit` が渡す同一論理操作のdedup keyに対する重複排除ウィンドウ（SEC-AUDIT-DUP-01）。`view` / `LLM` / `proposal` 監査には適用しない。`0` で無効化 |').encode('utf-8')
          if raw.count(old_b) != 1:
              raise SystemExit(f'expected one configuration dedup row, got {raw.count(old_b)}')
          config.write_bytes(raw.replace(old_b, new_b, 1))
          PY

      - name: Verify focused audit effect scope contract
        run: python -m unittest discover -s 01_Plans/tests -p 'test_audit_transport_effect_scope_contract.py' -v

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify narrow diff and configuration EOL preservation
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '01_Plans/tests/test_audit_transport_effect_scope_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-audit-dedup-effect-scope-fix-once.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD']).decode().splitlines())
          changed |= set(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          extra = changed - allowed
          if extra:
              raise SystemExit(f'unexpected changed files: {sorted(extra)}')

          current = Path('04_Documentation/configuration.md').read_bytes()
          base = subprocess.check_output(['git', 'show', 'origin/main:04_Documentation/configuration.md'])
          def eol_shape(data: bytes) -> tuple[int, int]:
              return data.count(b'\r\n'), data.count(b'\n') - data.count(b'\r\n')
          if eol_shape(current) != eol_shape(base):
              raise SystemExit(f'configuration EOL shape changed: base={eol_shape(base)} current={eol_shape(current)}')
          PY
          git diff --check -- 01_Plans/tests/test_audit_transport_effect_scope_contract.py 02_Architecture/runtime_parameter_registry.md
          git -c core.whitespace=cr-at-eol diff --check -- 04_Documentation/configuration.md

      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(audit): dedup windowの作用範囲を2routeへ限定する"
          git rm .github/workflows/lane-b2-audit-dedup-effect-scope-fix-once.yml
          git commit -m "ci(b2): retire audit dedup effect scope helper"
          git push
