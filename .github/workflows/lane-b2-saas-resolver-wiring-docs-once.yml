name: Lane B2 SaaS resolver wiring docs once

on:
  push:
    branches:
      - fix/lane-b2-saas-resolver-wiring-docs-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align SaaS resolver wiring documentation with current runtime
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path("04_Documentation/configuration.md"): (
                  (
                      "| `KJ_ATLAS_DOCUMENT_POLICY_BINDING_RESOLVER` | `none` | 文書の非秘密binding IDを外部policy参照へ解決するresolver。`none`, `external_http`。現行releaseではSaaS runtime未配線 |",
                      "| `KJ_ATLAS_DOCUMENT_POLICY_BINDING_RESOLVER` | `none` | 文書の非秘密binding IDを外部policy参照へ解決するresolver。`none`, `external_http`。`saas-multitenant` では `external_http` が必須で、起動前にexternal componentを検査し、server-owned document resource解決へ配線 |",
                  ),
                  (
                      "| `KJ_ATLAS_TENANT_CAPABILITY_RESOLVER` | `none` | tenantごとの有効権限を解決するresolver。`none`, `external_http`。現行releaseではauth edge未配線 |",
                      "| `KJ_ATLAS_TENANT_CAPABILITY_RESOLVER` | `none` | tenantごとの有効権限を解決するresolver。`none`, `external_http`。`saas-multitenant` では `external_http` が必須で、起動前にexternal componentを検査し、tenant-scoped capability resolverとして配線 |",
                  ),
              ),
              Path("02_Architecture/runtime_parameter_registry.md"): (
                  (
                      "| `KJ_ATLAS_DOCUMENT_POLICY_BINDING_RESOLVER` | `none` | server-owned binding IDを一時的なpolicyRefへ解決するresolver。`none`, `external_http`。adapter実装済みだがSaaS runtime未配線 | direct | 通常値 | 選択した resolver 名が起動ログに反映されることを確認する |",
                      "| `KJ_ATLAS_DOCUMENT_POLICY_BINDING_RESOLVER` | `none` | server-owned binding IDを一時的なpolicyRefへ解決するresolver。`none`, `external_http`。`saas-multitenant` では `external_http` が必須で、起動前にexternal componentを検査し、`ServerOwnedDocumentResourceResolver` の policy binding resolver として配線 | direct | 通常値 | 選択した resolver 名が起動ログに反映されることを確認する |",
                  ),
                  (
                      "| `KJ_ATLAS_TENANT_CAPABILITY_RESOLVER` | `none` | tenant-scoped effective capability resolver。`none`, `external_http`。adapterとlifecycle境界は実装済み | direct | 通常値 | 選択した resolver 名が起動ログに反映されることを確認する |",
                      "| `KJ_ATLAS_TENANT_CAPABILITY_RESOLVER` | `none` | tenant-scoped effective capability resolver。`none`, `external_http`。`saas-multitenant` では `external_http` が必須で、起動前にexternal componentを検査し、runtimeの tenant capability resolver として配線 | direct | 通常値 | 選択した resolver 名が起動ログに反映されることを確認する |",
                  ),
              ),
          }

          for path, pairs in replacements.items():
              raw = path.read_bytes()
              text = raw.decode("utf-8")
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f"expected stale row exactly once: {path}: {old[:80]}")
                  text = text.replace(old, new, 1)
              path.write_bytes(text.encode("utf-8"))
          PY

      - name: Verify focused documentation wiring contract
        run: python 01_Plans/tests/test_saas_resolver_wiring_documentation_contract.py

      - name: Install focused backend test dependencies
        run: python -m pip install -q -e '03_Implement/backend[test]'

      - name: Verify existing trusted SaaS runtime contract
        run: pytest -q 03_Implement/backend/tests/test_trusted_saas_runtime.py

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify narrow diff
        run: |
          git -c core.whitespace=cr-at-eol diff --check
          python - <<'PY'
          import subprocess
          out = subprocess.check_output([
              "git", "diff", "--numstat", "HEAD", "--",
              "02_Architecture/runtime_parameter_registry.md",
              "04_Documentation/configuration.md",
          ], text=True).strip().splitlines()
          for line in out:
              added, deleted, path = line.split("\t", 2)
              if int(added) > 4 or int(deleted) > 4:
                  raise SystemExit(f"documentation diff is too broad: {path} +{added}/-{deleted}")
          PY

      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane-b2-saas-resolver-wiring-docs-once.yml
          git add 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(saas): resolver配線状態を現行runtimeへ同期する"
          git push
