name: lane-b-r50-measurement-runbook-once

on:
  push:
    branches:
      - lane-b/ai-ir-scale-r50-measurement-runbook

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/ai-ir-scale-r50-measurement-runbook
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend
        working-directory: 03_Implement/backend
        run: python -m pip install -e . pytest
      - name: Exercise network-free measurement entrypoints
        working-directory: 03_Implement/backend
        shell: bash
        run: |
          set -euo pipefail
          python scripts/measure_ai_route_provider_tokens.py \
            --provider deepseek \
            --model deepseek-v4-flash \
            --deepseek-thinking-mode disabled \
            > /tmp/ai-ir-scale-dry-run.json
          set +e
          python scripts/measure_ai_route_provider_tokens.py \
            --provider deepseek \
            --model deepseek-v4-flash \
            --deepseek-thinking-mode disabled \
            --execute \
            > /tmp/ai-ir-scale-no-opt-in.json
          rc=$?
          set -e
          test "$rc" -eq 2
          cd ../..
          python _tmp_r50_verify.py
      - name: Add R50 runbook and completion boundary
        env:
          R50_RUN_ID: ${{ github.run_id }}
        run: python _tmp_r50_patch.py
      - name: Validate docs contract
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python -m unittest discover -s 01_Plans/issues/tests -p "test_*.py"
          python 01_Plans/docs_check.py
          grep -Fq "### 外部実測runbook（R50）" 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -Fq "### 事前整備の完了境界（R50）" 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -Fq "dry-run -> core 6外部実測 -> analyzer -> 必要時だけA2/C追加" 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          git diff --check
      - name: Commit R50 and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm _tmp_r50_patch.py _tmp_r50_verify.py .github/workflows/lane-b-r50-measurement-runbook-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(ai): freeze provider measurement runbook boundary"
          git push origin HEAD:lane-b/ai-ir-scale-r50-measurement-runbook
