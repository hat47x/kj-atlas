name: Lane B2 OAuth trusted URL contract fix once

on:
  push:
    branches:
      - fix/lane-b2-oauth-endpoint-trusted-url-contract-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Align OAuth endpoint trusted URL wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('02_Architecture/runtime_parameter_registry.md'): [
                  (
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT` | 未設定 | BFF が authorization code 交換の前にリダイレクトする IdP の authorize endpoint（SAAS-TENANT-SESSION-BINDING-01 / ADR-0074）。format 検証のみで必須性は TrustedSaasRuntimePolicy が担う',
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT` | 未設定 | BFF が authorization code 交換の前にリダイレクトする IdP の authorize endpoint（SAAS-TENANT-SESSION-BINDING-01 / ADR-0074）。credential/query/fragment なしの HTTPS、または loopback HTTP だけを許可し、必須性は TrustedSaasRuntimePolicy が担う',
                  ),
                  (
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT` | 未設定 | BFF が authorization code を token へ交換する IdP の token endpoint（ADR-0074）',
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT` | 未設定 | BFF が authorization code を token へ交換する IdP の token endpoint（ADR-0074）。credential/query/fragment なしの HTTPS、または loopback HTTP だけを許可',
                  ),
                  (
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI` | 未設定 | OAuth フローの redirect URI（ADR-0074）。path は `/session/callback` 固定',
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI` | 未設定 | OAuth フローの redirect URI（ADR-0074）。credential/query/fragment なしの HTTPS、または loopback HTTP だけを許可し、path は `/session/callback` 固定',
                  ),
              ],
              Path('04_Documentation/configuration.md'): [
                  (
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT` | 未設定 | ADR-0074 BFF: OAuth authorization-code フロー開始 URL。`saas-multitenant` では必須（`TrustedSaasRuntimePolicy` が起動前検査）',
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT` | 未設定 | ADR-0074 BFF: OAuth authorization-code フロー開始 URL。credential/query/fragment なしの HTTPS、または loopback HTTP だけを許可。`saas-multitenant` では必須（`TrustedSaasRuntimePolicy` が起動前検査）',
                  ),
                  (
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT` | 未設定 | ADR-0074 BFF: code 交換用 token endpoint',
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT` | 未設定 | ADR-0074 BFF: code 交換用 token endpoint。credential/query/fragment なしの HTTPS、または loopback HTTP だけを許可',
                  ),
                  (
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI` | 未設定 | ADR-0074 BFF: OAuth callback の redirect URI。path は `/session/callback` 固定',
                      '`KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI` | 未設定 | ADR-0074 BFF: OAuth callback の redirect URI。credential/query/fragment なしの HTTPS、または loopback HTTP だけを許可し、path は `/session/callback` 固定',
                  ),
              ],
          }

          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  old_b = old.encode('utf-8')
                  new_b = new.encode('utf-8')
                  count = data.count(old_b)
                  if count != 1:
                      raise SystemExit(f'{path}: expected one match, got {count}: {old}')
                  data = data.replace(old_b, new_b, 1)
              path.write_bytes(data)

          test_path = Path('01_Plans/tests/test_security_format_contract.py')
          test = test_path.read_text(encoding='utf-8')
          marker = '    def test_jwt_public_policy_keeps_default_and_hmac_none_rejection(self) -> None:\n'
          addition = '''    def test_oauth_endpoint_trusted_url_contract_matches_public_docs(self) -> None:\n        validator = _settings_validator_source()\n        endpoints = (\n            (\n                "self.saas_oauth_broker_http_authorize_endpoint",\n                "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_AUTHORIZE_ENDPOINT",\n            ),\n            (\n                "self.saas_oauth_broker_http_token_endpoint",\n                "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_TOKEN_ENDPOINT",\n            ),\n            (\n                "self.saas_oauth_broker_http_redirect_uri",\n                "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_REDIRECT_URI",\n            ),\n        )\n\n        for field, key in endpoints:\n            self.assertIn(\n                f'endpoint={field}',\n                validator,\n            )\n            self.assertIn(\n                f'endpoint_key="{key}"',\n                validator,\n            )\n            for row in (\n                _public_row(REGISTRY_PATH, key),\n                _public_row(CONFIG_PATH, key),\n            ):\n                for term in ("HTTPS", "loopback", "credential", "query", "fragment"):\n                    self.assertIn(term, row)\n\n'''
          if test.count(marker) != 1:
              raise SystemExit('security format test insertion marker drifted')
          test = test.replace(marker, addition + marker, 1)
          test_path.write_text(test, encoding='utf-8', newline='\n')
          PY

      - name: Verify focused security format contract
        run: python -m unittest 01_Plans.tests.test_security_format_contract -v

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py

      - name: Verify narrow diff
        run: |
          python - <<'PY'
          import subprocess
          expected = {
              '01_Plans/tests/test_security_format_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          if changed != expected:
              raise SystemExit(f'unexpected patch scope: {sorted(changed)}')
          for path in expected:
              data = open(path, 'rb').read().splitlines()
              bad = [i for i, line in enumerate(data, 1) if line.rstrip(b' \t\r') != line.rstrip(b'\r')]
              if bad:
                  raise SystemExit(f'{path}: trailing space/tab on lines {bad[:10]}')
          PY
          git diff --check -- 01_Plans/tests/test_security_format_contract.py 02_Architecture/runtime_parameter_registry.md

      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_security_format_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): OAuth endpointのtrusted URL制約を明示する"
          git rm .github/workflows/lane-b2-oauth-endpoint-trusted-url-fix-once.yml
          git commit -m "ci: retire Lane B2 OAuth trusted URL workflow"
          git push
