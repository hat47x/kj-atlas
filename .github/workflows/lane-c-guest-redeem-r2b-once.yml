name: Lane C guest redeem R2b once

on:
  push:
    branches:
      - lane-c/guest-admission-redeem-r2b-20260906

permissions:
  contents: write

jobs:
  implement-and-verify:
    if: "github.event.head_commit.message == 'chore: guest redeem R2b実装workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-c/guest-admission-redeem-r2b-20260906
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply R2b transformation
        run: python .github/scripts/lane_c_guest_redeem_r2b.py
      - name: Retire one-shot implementation inputs from final tree
        run: rm .github/scripts/lane_c_guest_redeem_r2b.py .github/workflows/lane-c-guest-redeem-r2b-once.yml
      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'
      - name: Ruff focused R2b surface
        working-directory: 03_Implement/backend
        run: >-
          python -m ruff check
          src/kj_atlas_api/guest_redeem.py
          src/kj_atlas_api/guest_redeem_state_models.py
          src/kj_atlas_api/guest_auth_state.py
          src/kj_atlas_api/routes/guest_session.py
          tests/test_guest_redeem_http.py
          tests/test_guest_auth_session_store.py
          tests/test_guest_docs_http_authorization.py
          tests/test_alembic_lineage.py
          tests/test_persistence_shapes.py
      - name: Focused R2b integration and regressions
        working-directory: 03_Implement/backend
        run: >-
          python -m pytest -q
          tests/test_guest_redeem_http.py
          tests/test_guest_auth_session_store.py
          tests/test_guest_docs_http_authorization.py
          tests/test_guest_admission_repository.py
          tests/test_alembic_lineage.py
          tests/test_persistence_shapes.py
          tests/test_database_support.py
      - name: Documentation contract check
        run: python 01_Plans/docs_check.py
      - name: Working tree diff check
        run: git diff --check
      - name: Commit verified R2b tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat(saas): guest invitation redeemをserver-owned sessionへ接続する'
          git push origin HEAD:lane-c/guest-admission-redeem-r2b-20260906
