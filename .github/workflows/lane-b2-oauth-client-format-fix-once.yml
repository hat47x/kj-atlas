name: Lane B2 OAuth client format contract fix once

on:
  push:
    branches:
      - fix/lane-b2-oauth-client-format-contract-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align OAuth client credential format wording
        run: |
          python - <<'PY'
          from pathlib import Path

          registry = Path('02_Architecture/runtime_parameter_registry.md')
          config = Path('04_Documentation/configuration.md')
          test = Path('01_Plans/tests/test_security_format_contract.py')

          replacements = {
              registry: (
                  (
                      b'confidential-client OAuth \xe3\x81\xae client ID\xef\xbc\x88ADR-0074\xef\xbc\x89\xe3\x80\x82process startup hard gate',
                      b'confidential-client OAuth \xe3\x81\xae client ID\xef\xbc\x88ADR-0074\xef\xbc\x89\xe3\x80\x822,048\xe6\x96\x87\xe5\xad\x97\xe4\xbb\xa5\xe4\xb8\x8b\xe3\x81\xaecanonical\xe5\x80\xa4\xef\xbc\x88\xe7\xa9\xba\xe7\x99\xbd\xe3\x83\xbb\xe5\x88\xb6\xe5\xbe\xa1\xe6\x96\x87\xe5\xad\x97\xe4\xb8\x8d\xe5\x8f\xaf\xef\xbc\x89\xe3\x80\x82process startup hard gate',
                  ),
                  (
                      b'confidential-client OAuth \xe3\x81\xae client secret\xef\xbc\x88ADR-0074\xef\xbc\x89\xe3\x80\x82process startup hard gate',
                      b'confidential-client OAuth \xe3\x81\xae client secret\xef\xbc\x88ADR-0074\xef\xbc\x89\xe3\x80\x82\xe9\x9d\x9e\xe7\xa9\xba\xe3\x81\xaecanonical bearer\xe5\x80\xa4\xef\xbc\x88\xe7\xa9\xba\xe7\x99\xbd\xe3\x83\xbb\xe5\x88\xb6\xe5\xbe\xa1\xe6\x96\x87\xe5\xad\x97\xe4\xb8\x8d\xe5\x8f\xaf\xef\xbc\x89\xe3\x80\x82process startup hard gate',
                  ),
              ),
              config: (
                  (
                      b'ADR-0074 BFF: OAuth client ID\xe3\x80\x82\xe8\xb5\xb7\xe5\x8b\x95\xe5\xbf\x85\xe9\xa0\x88\xe3\x81\xa7\xe3\x81\xaf\xe3\x81\xaa\xe3\x81\x84\xe3\x81\x8c',
                      b'ADR-0074 BFF: OAuth client ID\xe3\x80\x822,048\xe6\x96\x87\xe5\xad\x97\xe4\xbb\xa5\xe4\xb8\x8b\xe3\x81\xaecanonical\xe5\x80\xa4\xef\xbc\x88\xe7\xa9\xba\xe7\x99\xbd\xe3\x83\xbb\xe5\x88\xb6\xe5\xbe\xa1\xe6\x96\x87\xe5\xad\x97\xe4\xb8\x8d\xe5\x8f\xaf\xef\xbc\x89\xe3\x80\x82\xe8\xb5\xb7\xe5\x8b\x95\xe5\xbf\x85\xe9\xa0\x88\xe3\x81\xa7\xe3\x81\xaf\xe3\x81\xaa\xe3\x81\x84\xe3\x81\x8c',
                  ),
                  (
                      b'ADR-0074 BFF: OAuth client secret\xef\xbc\x88\xe7\xa7\x98\xe5\xaf\x86\xe3\x80\x82\xe3\x83\xad\xe3\x82\xb0\xe3\x83\xbb\xe7\x9b\xa3\xe6\x9f\xbb\xe3\x83\xbbDB\xe3\x81\xb8\xe4\xbf\x9d\xe5\xad\x98\xe3\x81\x97\xe3\x81\xaa\xe3\x81\x84\xef\xbc\x89\xe3\x80\x82\xe8\xb5\xb7\xe5\x8b\x95\xe5\xbf\x85\xe9\xa0\x88\xe3\x81\xa7\xe3\x81\xaf\xe3\x81\xaa\xe3\x81\x84\xe3\x81\x8c',
                      b'ADR-0074 BFF: OAuth client secret\xef\xbc\x88\xe7\xa7\x98\xe5\xaf\x86\xe3\x80\x82\xe3\x83\xad\xe3\x82\xb0\xe3\x83\xbb\xe7\x9b\xa3\xe6\x9f\xbb\xe3\x83\xbbDB\xe3\x81\xb8\xe4\xbf\x9d\xe5\xad\x98\xe3\x81\x97\xe3\x81\xaa\xe3\x81\x84\xef\xbc\x89\xe3\x80\x82\xe9\x9d\x9e\xe7\xa9\xba\xe3\x81\xaecanonical bearer\xe5\x80\xa4\xef\xbc\x88\xe7\xa9\xba\xe7\x99\xbd\xe3\x83\xbb\xe5\x88\xb6\xe5\xbe\xa1\xe6\x96\x87\xe5\xad\x97\xe4\xb8\x8d\xe5\x8f\xaf\xef\xbc\x89\xe3\x80\x82\xe8\xb5\xb7\xe5\x8b\x95\xe5\xbf\x85\xe9\xa0\x88\xe3\x81\xa7\xe3\x81\xaf\xe3\x81\xaa\xe3\x81\x84\xe3\x81\x8c',
                  ),
              ),
          }

          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  if data.count(old) != 1:
                      raise SystemExit(f'expected one patch target in {path}: {old!r}')
                  data = data.replace(old, new, 1)
              path.write_bytes(data)

          text = test.read_text(encoding='utf-8')
          marker = '    def test_jwt_public_policy_keeps_default_and_hmac_none_rejection(self) -> None:\n'
          method = '''    def test_oauth_client_credentials_use_canonical_public_format_contract(self) -> None:\n        settings_text = SETTINGS_PATH.read_text(encoding="utf-8")\n        tree = ast.parse(settings_text)\n\n        def function_source(name: str) -> str:\n            node = next(\n                item\n                for item in ast.walk(tree)\n                if isinstance(item, (ast.FunctionDef, ast.AsyncFunctionDef))\n                and item.name == name\n            )\n            if node.end_lineno is None:\n                raise AssertionError(f"source range unavailable for {name}")\n            return "\\n".join(\n                settings_text.splitlines()[node.lineno - 1 : node.end_lineno]\n            )\n\n        validator = _settings_validator_source()\n        header_helper = function_source("_validate_optional_header_value")\n        bearer_helper = function_source("_validate_canonical_bearer")\n\n        self.assertIn("len(value) > 2048", header_helper)\n        self.assertIn("any(character.isspace() for character in value)", header_helper)\n        self.assertIn("any(not character.isprintable() for character in value)", header_helper)\n        self.assertIn("not api_key", bearer_helper)\n        self.assertIn("any(character.isspace() for character in api_key)", bearer_helper)\n        self.assertIn("any(not character.isprintable() for character in api_key)", bearer_helper)\n\n        self.assertIn("value=self.saas_oauth_broker_http_client_id", validator)\n        self.assertIn(\n            'value_key="KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_ID"',\n            validator,\n        )\n        self.assertIn("api_key=self.saas_oauth_broker_http_client_secret", validator)\n        self.assertIn(\n            'api_key_key="KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_SECRET"',\n            validator,\n        )\n\n        for row in (\n            _public_row(REGISTRY_PATH, "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_ID"),\n            _public_row(CONFIG_PATH, "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_ID"),\n        ):\n            self.assertIn("2,048", row)\n            self.assertIn("canonical", row)\n            self.assertIn("空白", row)\n            self.assertIn("制御文字", row)\n\n        for row in (\n            _public_row(REGISTRY_PATH, "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_SECRET"),\n            _public_row(CONFIG_PATH, "KJ_ATLAS_SAAS_OAUTH_BROKER_HTTP_CLIENT_SECRET"),\n        ):\n            self.assertIn("非空", row)\n            self.assertIn("canonical bearer", row)\n            self.assertIn("空白", row)\n            self.assertIn("制御文字", row)\n\n'''
          if text.count(marker) != 1:
              raise SystemExit('JWT test insertion marker drifted')
          test.write_text(text.replace(marker, method + marker, 1), encoding='utf-8')
          PY
      - name: Verify focused security format contract
        run: python -m unittest 01_Plans.tests.test_security_format_contract -v
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              '01_Plans/tests/test_security_format_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-oauth-client-format-fix-once.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'HEAD']).decode().splitlines())
          untracked = set(subprocess.check_output(['git', 'ls-files', '--others', '--exclude-standard']).decode().splitlines())
          actual = changed | untracked
          if actual != expected:
              raise SystemExit(f'unexpected diff scope: {sorted(actual)}')
          diff = subprocess.check_output(['git', 'diff', '--numstat', 'HEAD']).decode()
          print(diff)
          config = Path('04_Documentation/configuration.md').read_bytes()
          if b'\r\n' not in config or b'\n' not in config:
              raise SystemExit('configuration EOL shape unexpectedly collapsed')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_security_format_contract.py 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): OAuth client credential format制約を明示する"
          git rm .github/workflows/lane-b2-oauth-client-format-fix-once.yml
          git commit -m "ci: retire Lane B2 OAuth client format workflow"
          git push
