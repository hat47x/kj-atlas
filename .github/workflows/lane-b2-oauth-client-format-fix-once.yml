name: Lane B2 OAuth client format contract fix once

on:
  push:
    branches:
      - fix/lane-b2-oauth-client-format-contract-20260908

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public docs
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('02_Architecture/runtime_parameter_registry.md'): [
                  ('confidential-client OAuth の client ID（ADR-0074）。process startup hard gate', 'confidential-client OAuth の client ID（ADR-0074）。2,048文字以下のcanonical値（空白・制御文字不可）。process startup hard gate'),
                  ('confidential-client OAuth の client secret（ADR-0074）。process startup hard gate', 'confidential-client OAuth の client secret（ADR-0074）。非空のcanonical bearer値（空白・制御文字不可）。process startup hard gate'),
              ],
              Path('04_Documentation/configuration.md'): [
                  ('ADR-0074 BFF: OAuth client ID。起動必須ではないが', 'ADR-0074 BFF: OAuth client ID。2,048文字以下のcanonical値（空白・制御文字不可）。起動必須ではないが'),
                  ('ADR-0074 BFF: OAuth client secret（秘密。ログ・監査・DBへ保存しない）。起動必須ではないが', 'ADR-0074 BFF: OAuth client secret（秘密。ログ・監査・DBへ保存しない）。非空のcanonical bearer値（空白・制御文字不可）。起動必須ではないが'),
              ],
          }
          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  old_b = old.encode('utf-8')
                  if data.count(old_b) != 1:
                      raise SystemExit(f'expected one patch target in {path}: {old}')
                  data = data.replace(old_b, new.encode('utf-8'), 1)
              path.write_bytes(data)
          PY
      - name: Verify focused contract
        run: python -m unittest 01_Plans.tests.test_oauth_client_format_contract -v
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify docs
        run: python 01_Plans/docs_check.py
      - name: Verify diff scope
        run: |
          test "$(git diff --name-only HEAD | sort)" = "$(printf '%s\n' '02_Architecture/runtime_parameter_registry.md' '04_Documentation/configuration.md' | sort)"
      - name: Commit verified docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): OAuth client credential format制約を明示する"
          git push
