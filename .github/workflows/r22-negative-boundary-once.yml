name: R22 negative-boundary verification (one-shot)

on:
  push:
    branches:
      - dogfood/r22-stale-branch-reintroduction-20260904

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Fetch current main
        run: git fetch origin main
      - name: R22 synthetic tests
        working-directory: 01_Plans
        run: python -m unittest test_check_stale_merge_reintroduction.py
      - name: Dogfood docs
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Active issue memos
        run: python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Triage
        run: |
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/triage.json', encoding='utf-8'))
          errors = data.get('errors', [])
          print(json.dumps({'errors': errors}, ensure_ascii=False, indent=2))
          if errors:
              raise SystemExit(1)
          PY
      - name: Current-main stale-state diagnostic
        run: |
          python 01_Plans/check_stale_merge_reintroduction.py \
            --base-ref origin/main \
            --head-ref HEAD \
            --json
          python 01_Plans/check_stale_merge_reintroduction.py \
            --base-ref origin/main \
            --head-ref HEAD \
            --fail-on-strong
      - name: Diff check
        run: git diff --check origin/main...HEAD
