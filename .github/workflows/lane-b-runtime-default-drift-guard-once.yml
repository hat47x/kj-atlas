name: Lane B runtime default drift guard once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lane-b-runtime-default-drift-guard-use-this
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply one-shot patch
        run: python .github/scripts/lane_b_runtime_default_drift_guard_once.py
      - name: Fix dynamic module fixture for Python 3.12
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/tests/test_runtime_parameter_default_contract.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('import importlib.util\nimport tempfile', 'import importlib.util\nimport sys\nimport tempfile', 1)
          text = text.replace('MODULE = importlib.util.module_from_spec(SPEC)\nSPEC.loader.exec_module(MODULE)', 'MODULE = importlib.util.module_from_spec(SPEC)\nsys.modules[SPEC.name] = MODULE\nSPEC.loader.exec_module(MODULE)', 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused runtime-default regressions
        run: python -m unittest 01_Plans/tests/test_runtime_parameter_default_contract.py 01_Plans/tests/test_docs_contract_checks.py
      - name: Run docs contract
        run: python 01_Plans/docs_check.py
      - name: Run issue lifecycle regressions
        run: python -m unittest 01_Plans/issues/tests/test_issue_lifecycle_contract.py
      - name: Check diff whitespace
        run: git diff --check
      - name: Commit verified result and remove one-shot files
        env:
          BRANCH: fix/lane-b-runtime-default-drift-guard-use-this
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/scripts/lane_b_runtime_default_drift_guard_once.py .github/workflows/lane-b-runtime-default-drift-guard-once.yml
          git add 01_Plans/docs_contract_checks.py 01_Plans/tests/test_runtime_parameter_default_contract.py
          git commit -m "test(docs): runtime parameter default driftを検出する"
          git push origin HEAD:${BRANCH}
