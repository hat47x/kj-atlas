name: Cognitive dogfood issue sync R31

on:
  push:
    branches:
      - fix/cognitive-arm-package-frozen-anchor-20260905

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync F1 preflight checkpoint into COGNITIVE-DOGFOOD-01
        run: |
          set -euo pipefail
          issue='01_Plans/issues/issue-COGNITIVE-DOGFOOD-01-product-development-cognitive-workbench.md'
          marker='### Formal Case package preflight hardening（2026-09-05）'
          if ! grep -Fq "$marker" "$issue"; then
            cat >> "$issue" <<'EOF'

### Formal Case package preflight hardening（2026-09-05）

- F1として、正式Case 001〜003を実行する前のassembled arm package検証を強化した。これはCase結果やarm内の推論には触れず、fresh-context比較へ渡す凍結入力の同一性だけを守るpreflightである。
- `validate_cognitive_arm_packages.py` は、従来のtop-level構成・SHA-256・starter空状態に加え、arm別`launch.md`の凍結packetとの完全一致、product/skillのrepository・commit・manifest ID、事前登録source path＋Git blob SHA、実ファイルから再計算したGit blob SHAをfail-closedで照合する。
- Run `33916954615` でdogfood tooling unit test 32件、Cases 001〜003のlaunch treatment equivalence、凍結product source（20/18/18件）とskill canonical source 12件から実組立した全12 arm package、dogfood構造検査、active Issue検査を通過した。
- このcheckpointは「3ケースの正式比較を完了した」証拠ではない。未完受入条件はそのまま維持し、正式armは引き続き別fresh sessionで実行する。
EOF
          fi
          python 01_Plans/issues/validate_active_issue_memos.py
          git diff --check
      - name: Commit checkpoint and retire one-shot workflow
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add 01_Plans/issues/issue-COGNITIVE-DOGFOOD-01-product-development-cognitive-workbench.md
          git rm .github/workflows/cognitive-dogfood-issue-sync-r31.yml
          git commit -m 'docs: cognitive dogfoodの凍結package preflightを記録する'
          git push origin HEAD:${GITHUB_REF_NAME}
