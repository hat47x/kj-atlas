name: Lane B2 app revision log surface once

on:
  push:
    branches:
      - fix/lane-b2-app-revision-log-surface-20260906

permissions:
  contents: write

jobs:
  patch-verify-retire:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Wire canonical revision into every log record
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              eol = '\r\n' if b'\r\n' in data else '\n'
              old_bytes = old.replace('\n', eol).encode('utf-8')
              new_bytes = new.replace('\n', eol).encode('utf-8')
              count = data.count(old_bytes)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              target.write_bytes(data.replace(old_bytes, new_bytes, 1))

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/observability.py',
              '''        "requestId",\n        "actorRefHash",\n    }''',
              '''        "requestId",\n        "actorRefHash",\n        "appRevision",\n    }''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/observability.py',
              '''class RequestIdFilter(logging.Filter):\n    """Attach the current request id and actor pseudo-identifier to every record.\n\n    Applied as a filter rather than inside the formatter so that a future\n    non-JSON formatter still gets both fields. `actorRefHash` is `None` for any\n    record emitted outside a request that resolved a principal (health checks,\n    unauthenticated single-tenant requests, background/startup code) -- that is\n    the expected, common case, not an error.\n    """\n\n    def filter(self, record: logging.LogRecord) -> bool:\n        record.requestId = request_id_var.get()\n        record.actorRefHash = actor_ref_hash_var.get()\n        return True''',
              '''class RequestIdFilter(logging.Filter):\n    """Attach request correlation plus the process build revision to each record.\n\n    `requestId` / `actorRefHash` vary by request. `appRevision` is process-wide\n    and is injected here for the same reason: JSON and human-readable formatters\n    must not diverge on which deployed build produced a line.\n    """\n\n    def __init__(self, app_revision: str = "unknown") -> None:\n        super().__init__()\n        self._app_revision = app_revision or "unknown"\n\n    def filter(self, record: logging.LogRecord) -> bool:\n        record.requestId = request_id_var.get()\n        record.actorRefHash = actor_ref_hash_var.get()\n        record.appRevision = self._app_revision\n        return True''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/observability.py',
              '''        actor_ref_hash = getattr(record, "actorRefHash", None)\n        if actor_ref_hash:\n            payload["actorRefHash"] = actor_ref_hash\n\n        for key, value in record.__dict__.items():''',
              '''        actor_ref_hash = getattr(record, "actorRefHash", None)\n        if actor_ref_hash:\n            payload["actorRefHash"] = actor_ref_hash\n\n        payload["appRevision"] = getattr(record, "appRevision", "unknown") or "unknown"\n\n        for key, value in record.__dict__.items():''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/observability.py',
              '''def configure_logging(*, level: str, json_format: bool) -> None:''',
              '''def configure_logging(\n    *,\n    level: str,\n    json_format: bool,\n    app_revision: str = "unknown",\n) -> None:''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/observability.py',
              '''            "format": "%(asctime)s %(levelname)s %(name)s [%(requestId)s] [actor=%(actorRefHash)s] %(message)s"\n        }''',
              '''            "format": (\n                "%(asctime)s %(levelname)s %(name)s [%(requestId)s] "\n                "[actor=%(actorRefHash)s] [rev=%(appRevision)s] %(message)s"\n            )\n        }''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/observability.py',
              '''            "filters": {"request_id": {"()": f"{__name__}.RequestIdFilter"}},''',
              '''            "filters": {\n                "request_id": {\n                    "()": f"{__name__}.RequestIdFilter",\n                    "app_revision": app_revision or "unknown",\n                }\n            },''',
          )

          replace_once(
              '03_Implement/backend/src/kj_atlas_api/main.py',
              '''configure_logging(level=settings.log_level, json_format=settings.log_json)''',
              '''configure_logging(\n    level=settings.log_level,\n    json_format=settings.log_json,\n    app_revision=settings.app_revision,\n)''',
          )

          replace_once(
              '02_Architecture/runtime_parameter_registry.md',
              '| `KJ_ATLAS_APP_REVISION` | `unknown` | OPS-OBSERV-01: 稼働中のcanonicalビルド識別子。1〜64文字のASCII `A-Za-z0-9._-` のみ受理し、それ以外（空文字、前後空白、slash、記号、改行、65文字以上）は `unknown` に丸める。backend は `GET /version` で返し、frontend は同じ規則で診断バンドルの `app.revision` に載せる。frontend へは build ARG として渡す（`vite.config.ts` の `envPrefix` 経由）ため、ビルド時に確定する | direct / base Compose | 通常値 | canonical値では `GET /version.revision` と診断バンドル `app.revision` が同値になること、不正値では双方が `unknown` になることを確認する |',
              '| `KJ_ATLAS_APP_REVISION` | `unknown` | OPS-OBSERV-01: 稼働中のcanonicalビルド識別子。1〜64文字のASCII `A-Za-z0-9._-` のみ受理し、それ以外（空文字、前後空白、slash、記号、改行、65文字以上）は `unknown` に丸める。backend は `GET /version` と全アプリケーションログの `appRevision` で返し、frontend は同じ規則で診断バンドルの `app.revision` に載せる。frontend へは build ARG として渡す（`vite.config.ts` の `envPrefix` 経由）ため、ビルド時に確定する | direct / base Compose | 通常値 | canonical値では `GET /version.revision`・ログ `appRevision`・診断バンドル `app.revision` が同値になること、不正値ではすべて `unknown` になることを確認する |',
          )
          PY

      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test]'

      - name: Verify app revision logging contract
        working-directory: 03_Implement/backend
        run: pytest -q tests/test_app_revision_logging_contract.py tests/test_observability.py

      - name: Verify backend lint
        working-directory: 03_Implement/backend
        run: ruff check src/kj_atlas_api/observability.py src/kj_atlas_api/main.py tests/test_app_revision_logging_contract.py

      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Verify docs contracts
        run: python 01_Plans/docs_check.py

      - name: Verify diff hygiene
        run: git -c core.whitespace=cr-at-eol diff --check

      - name: Commit patch and retire one-shot workflow
        env:
          BRANCH: fix/lane-b2-app-revision-log-surface-20260906
        run: |
          rm .github/workflows/lane-b2-app-revision-log-surface-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            02_Architecture/runtime_parameter_registry.md \
            03_Implement/backend/src/kj_atlas_api/main.py \
            03_Implement/backend/src/kj_atlas_api/observability.py \
            .github/workflows/lane-b2-app-revision-log-surface-once.yml
          git commit -m 'fix(observability): app revisionをログへ配線する'
          git push origin HEAD:"$BRANCH"
