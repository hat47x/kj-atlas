name: Lane C guest admission R1 verify once

on:
  push:
    branches:
      - lane-c/guest-admission-primitive-r1-20260906

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      KJ_ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/postgres
      KJ_ATLAS_TEST_POSTGRES_RUNTIME_DATABASE_URL: postgresql+psycopg://kj_runtime:runtime@localhost:5432/postgres
      KJ_ATLAS_RUN_PG_RLS_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test,postgres]'
      - name: Create restricted runtime role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE kj_runtime LOGIN PASSWORD 'runtime'
            NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOBYPASSRLS;
          GRANT CONNECT ON DATABASE postgres TO kj_runtime;
          GRANT USAGE ON SCHEMA public TO kj_runtime;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO kj_runtime;
          SQL
      - name: Ruff focused guest admission surface
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            src/kj_atlas_api/guest_admission_models.py \
            src/kj_atlas_api/guest_admission_repository.py \
            src/kj_atlas_api/tenant_db_guard.py \
            tests/test_guest_admission_repository.py \
            tests/test_guest_admission_postgres_rls.py \
            tests/test_tenant_db_guard.py \
            tests/test_alembic_lineage.py \
            alembic/versions/20260906_0033_add_guest_admission_primitive.py
      - name: Guest admission focused integration tests
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_guest_admission_repository.py \
            tests/test_guest_admission_postgres_rls.py \
            tests/test_tenant_db_guard.py \
            tests/test_alembic_lineage.py
      - name: Persistence and migration regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_persistence_shapes.py \
            tests/test_database_support.py \
            tests/test_alembic_lineage.py
      - name: Repository diff check
        run: git diff --check origin/main...HEAD
      - name: Retire this one-shot verifier
        if: success()
        run: |
          rm .github/workflows/lane-c-guest-admission-r1-verify-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/lane-c-guest-admission-r1-verify-once.yml
          git commit -m 'chore(ci): retire guest admission R1 verifier'
          git push
