name: lane-b-required-relations-once

on:
  push:
    branches:
      - lane-b/ai-ir-required-relations

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/ai-ir-required-relations

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic required-relation slice
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}, found {count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          ir_path = "03_Implement/backend/src/kj_atlas_api/llm_input_ir.py"
          replace_once(
              ir_path,
              '''    allow_unreviewed_text: bool = False,
              required_card_ids: Sequence[str] = (),
          ) -> dict[str, Any]:
          ''',
              '''    allow_unreviewed_text: bool = False,
              required_card_ids: Sequence[str] = (),
              required_relation_ids: Sequence[str] = (),
          ) -> dict[str, Any]:
          ''',
          )
          replace_once(
              ir_path,
              '''    `required_card_ids` is an input-only route contract. A caller may name cards
              whose meaning is indispensable for that operation; those cards are reserved
              before deterministic size truncation. The ids are not serialized into the
              IR, and an empty sequence preserves the historical projection byte-for-byte.
          ''',
              '''    `required_card_ids` and `required_relation_ids` are input-only route contracts.
              A caller may name cards or normalized relations whose meaning is indispensable for
              that operation; they are reserved before deterministic size truncation. A required
              relation also reserves both endpoint cards so the retained edge stays referentially
              closed. These ids are not serialized into the IR, and empty sequences preserve the
              historical projection byte-for-byte.
          ''',
          )
          replace_once(
              ir_path,
              '''    card_ids = {card.id for card in cards}
              required = frozenset(required_card_ids)
              if not required <= card_ids:
                  raise IRGenerationError(
                      "required_card_missing",
                      "A route-required card is not present in the normalized IR source.",
                  )
              if len(required) > MAX_CARDS:
                  raise IRGenerationError(
                      "required_card_budget_exceeded",
                      "The route-required card set exceeds the IR card budget.",
                  )

              relations = _normalize_relations(source.relations, card_ids)
              islands = _normalize_islands(source.islands, card_ids)
              evidence_links = _normalize_evidence_links(source.evidence_links, card_ids)
          ''',
              '''    card_ids = {card.id for card in cards}
              explicit_required_cards = frozenset(required_card_ids)
              if not explicit_required_cards <= card_ids:
                  raise IRGenerationError(
                      "required_card_missing",
                      "A route-required card is not present in the normalized IR source.",
                  )

              relations = _normalize_relations(source.relations, card_ids)
              relation_by_id = {relation["id"]: relation for relation in relations}
              required_relations = frozenset(required_relation_ids)
              if not required_relations <= set(relation_by_id):
                  raise IRGenerationError(
                      "required_relation_missing",
                      "A route-required relation is not present in the normalized IR source.",
                  )
              if len(required_relations) > MAX_RELATIONS:
                  raise IRGenerationError(
                      "required_relation_budget_exceeded",
                      "The route-required relation set exceeds the IR relation budget.",
                  )

              relation_endpoint_card_ids = {
                  endpoint
                  for required_relation_id in required_relations
                  for endpoint in (
                      relation_by_id[required_relation_id]["from"],
                      relation_by_id[required_relation_id]["to"],
                  )
              }
              required = frozenset(set(explicit_required_cards) | relation_endpoint_card_ids)
              if len(required) > MAX_CARDS:
                  raise IRGenerationError(
                      "required_card_budget_exceeded",
                      "The route-required card set exceeds the IR card budget.",
                  )

              islands = _normalize_islands(source.islands, card_ids)
              evidence_links = _normalize_evidence_links(source.evidence_links, card_ids)
          ''',
          )
          replace_once(
              ir_path,
              '''        rank_by_card,
                  required_card_ids=required,
              )
          ''',
              '''        rank_by_card,
                  required_card_ids=required,
                  required_relation_ids=required_relations,
              )
          ''',
          )
          replace_once(
              ir_path,
              '''    *,
              required_card_ids: frozenset[str] = frozenset(),
          ) -> tuple[
          ''',
              '''    *,
              required_card_ids: frozenset[str] = frozenset(),
              required_relation_ids: frozenset[str] = frozenset(),
          ) -> tuple[
          ''',
          )
          replace_once(
              ir_path,
              '''    if len(relations) > MAX_RELATIONS:  # step 3b
                  relations = relations[:MAX_RELATIONS]
                  truncation.reasons.add("MAX_RELATIONS")
          ''',
              '''    if len(relations) > MAX_RELATIONS:  # step 3b
                  required_relations = [
                      relation for relation in relations if relation["id"] in required_relation_ids
                  ]
                  if len(required_relations) != len(required_relation_ids):
                      raise IRGenerationError(
                          "required_relation_missing",
                          "A route-required relation was lost before relation-budget selection.",
                      )
                  optional_relations = [
                      relation for relation in relations if relation["id"] not in required_relation_ids
                  ]
                  relations = required_relations + optional_relations[
                      : MAX_RELATIONS - len(required_relations)
                  ]
                  relations.sort(key=lambda item: (item["type"], item["from"], item["to"]))
                  truncation.reasons.add("MAX_RELATIONS")
          ''',
          )

          ai_path = "03_Implement/backend/src/kj_atlas_api/routes/ai.py"
          replace_once(
              ai_path,
              '''    derived_island_relations,
              held_card_ids,
              source_from_document,
          )
          ''',
              '''    derived_island_relations,
              held_card_ids,
              relation_id,
              source_from_document,
          )
          ''',
          )
          replace_once(
              ai_path,
              '''    return tuple(sorted(required))


          def _generate_narrative_ir(payload: GenerateNarrativeRequest) -> dict:
          ''',
              '''    return tuple(sorted(required))


          def _narrative_required_relation_ids(source: IRSource) -> tuple[str, ...]:
              """Normalized causal/oppositional relations required by narrative generation."""
              card_ids = {card.id for card in source.cards}
              required: set[str] = set()
              for relation in source.relations:
                  if relation.type not in ("causal", "negate"):
                      continue
                  if relation.from_kind == "island" or relation.to_kind == "island":
                      continue
                  if relation.from_id not in card_ids or relation.to_id not in card_ids:
                      continue
                  required.add(relation_id(relation.type, relation.from_id, relation.to_id))
              return tuple(sorted(required))


          def _generate_narrative_ir(payload: GenerateNarrativeRequest) -> dict:
          ''',
          )
          replace_once(
              ai_path,
              '''    At representative scale, the card endpoints of normalized `causal` /
              `negate` relations are route-required meaning. Reserve those endpoints
              before `MAX_CARDS` selection so the reading order cannot survive while its
              logical joints silently disappear. If that required endpoint set itself
              exceeds the card budget, the shared IR contract fails closed rather than
              sending an incomplete spine to the model.
          ''',
              '''    At representative scale, normalized `causal` / `negate` relations and their
              card endpoints are route-required meaning. Reserve the relations before
              `MAX_RELATIONS` selection and their endpoints before `MAX_CARDS` selection so the
              reading order cannot survive while its logical joints silently disappear. If either
              required set itself exceeds its shared IR budget, fail closed rather than sending an
              incomplete spine to the model.
          ''',
          )
          replace_once(
              ai_path,
              '''    source = source_from_document(payload.doc)
              required_spine_ids = _narrative_required_card_ids(source)
              try:
          ''',
              '''    source = source_from_document(payload.doc)
              required_spine_ids = _narrative_required_card_ids(source)
              required_spine_relation_ids = _narrative_required_relation_ids(source)
              try:
          ''',
          )
          replace_once(
              ai_path,
              '''            allow_unreviewed_text=allow_unreviewed,
                      required_card_ids=required_spine_ids,
                  )
          ''',
              '''            allow_unreviewed_text=allow_unreviewed,
                      required_card_ids=required_spine_ids,
                      required_relation_ids=required_spine_relation_ids,
                  )
          ''',
          )

          spec_path = "02_Architecture/llm_input_ir_spec.md"
          replace_once(
              spec_path,
              '''7. 段階3では、除外カードを参照する `coordinates` / `islands[*].card_ids` / `evidence_links` も同時に除外する（参照整合を IR 内で保つ）。島は `card_ids` が空になっても保持する（§2.2A 規則7）。required card同士を結ぶ relation / evidence linkは、両端点が残る限り同じ参照整合規則によって保持される。
          8. 段階3の後もなお `len(relations) > MAX_RELATIONS` の場合、`(type, from, to)` 昇順で先頭 `MAX_RELATIONS` 件だけを残す。理由コード `MAX_RELATIONS`。
          ''',
              '''7. 段階3では、除外カードを参照する `coordinates` / `islands[*].card_ids` / `evidence_links` も同時に除外する（参照整合を IR 内で保つ）。島は `card_ids` が空になっても保持する（§2.2A 規則7）。required card同士を結ぶ relation / evidence linkも、カード除外の段階では両端点が残る限り保持される。relation件数上限に対する保護は規則8および§5.2.2に従う。
          8. 段階3の後もなお `len(relations) > MAX_RELATIONS` の場合、callerが `required_relation_ids` を指定していればその正規化済みrelationを先に保持し、残り枠を `(type, from, to)` 昇順の非required relationで埋める。required集合が空なら従来どおり `(type, from, to)` 昇順で先頭 `MAX_RELATIONS` 件だけを残す。理由コード `MAX_RELATIONS`。
          ''',
          )
          replace_once(
              spec_path,
              '''6. 現時点で `POST /ai/detect-contradiction` は `cardA.id` / `cardB.id` をrequired集合として渡す。この2枚と、その両端点に対応する `confirmed` / `held` の `evidence_links` は、人間が既に下した判断を再提案しないためのroute固有の必要意味である。

          ### 5.3 記録
          ''',
              '''6. 現時点で `POST /ai/detect-contradiction` は `cardA.id` / `cardB.id` をrequired集合として渡す。この2枚と、その両端点に対応する `confirmed` / `held` の `evidence_links` は、人間が既に下した判断を再提案しないためのroute固有の必要意味である。
          7. `POST /ai/generate-narrative` は、正規化対象となる card-to-card `causal` / `negate` relation の両端点をrequired cardとして渡す。さらにrelation自体も§5.2.2の `required_relation_ids` として渡し、端点だけ残って論理接続が失われる状態を許可しない。

          ### 5.2.2 route契約上の必須relation（`required_relation_ids`）

          `required_relation_ids` は、callerが「このAI操作の論理接続そのもの」として明示した正規化relationを、汎用的な件数切り詰めから保護するための**IRビルダー入力専用制約**である。relationの重要度をAIやIRビルダーが推測する仕組みではない。

          1. `required_relation_ids` はIRへ直列化しない。relation IDは§2.3の正規化後ID（`<type>:<fromId>:<toId>`）で指定する。
          2. required集合は正規化済み `relations.id` の部分集合でなければならない。欠落IDを含む場合は `required_relation_missing` でfail-closedし、失敗応答へ欠落IDそのものを反射してはならない。
          3. required集合の件数が `MAX_RELATIONS` を超える場合は `required_relation_budget_exceeded` でfail-closedする。
          4. required relationの両端点は自動的に `required_card_ids` と同じ保護集合へ加える。これによりrelationを保持しながら端点カードだけを切り落とすことを禁止する。結果として必要端点が `MAX_CARDS` を超える場合は `required_card_budget_exceeded` でfail-closedする。
          5. relation件数が `MAX_RELATIONS` を超える場合はrequired relationを先に全件保持し、残り枠を正規化済み `(type, from, to)` 昇順で埋め、最終配列も同じ順に再整列する。
          6. required集合の入力順は選別結果へ影響させない。同一入力と同一required集合からは同一IRを生成する。
          7. required集合が空の場合、relationの切り詰め結果は本規則追加前と同一でなければならない。既存fixtureのcanonical JSON / SHA-256を変えてはならない。
          8. `POST /ai/generate-narrative` は、§2.3で正規化可能な card-to-card `causal` / `negate` relationをrequired集合として渡す。required relationが `MAX_RELATIONS` を超える場合は、B型文章化の論理骨格を部分的に送信せずfail-closedする。

          ### 5.3 記録
          ''',
          )

          required_relations_test = Path(
              "03_Implement/backend/tests/test_llm_input_ir_required_relations.py"
          )
          required_relations_test.write_text(
              '''"""Regression tests for route-required relation preservation under IR budgets."""

          from __future__ import annotations

          import pytest

          from kj_atlas_api.llm_input_ir import (
              IRGenerationError,
              IRSource,
              MAX_RELATIONS,
              SourceCard,
              SourceRelation,
              build_llm_input_ir,
              relation_id,
          )


          def _cards(count: int = 300) -> tuple[SourceCard, ...]:
              return tuple(
                  SourceCard(id=f"c{i:03d}", text=f"観察 c{i:03d}", text_reviewed=True)
                  for i in range(count)
              )


          def _directed_relations(count: int, *, relation_type: str = "causal") -> tuple[SourceRelation, ...]:
              relations: list[SourceRelation] = []
              for source_index in range(30):
                  for target_index in range(30):
                      if source_index == target_index:
                          continue
                      relations.append(
                          SourceRelation(
                              from_id=f"c{source_index:03d}",
                              to_id=f"c{target_index:03d}",
                              type=relation_type,
                          )
                      )
                      if len(relations) == count:
                          return tuple(relations)
              raise AssertionError("fixture requested more unique relations than available")


          def test_required_relation_is_reserved_before_global_relation_cut() -> None:
              causal = _directed_relations(MAX_RELATIONS + 1)
              required = SourceRelation(from_id="c298", to_id="c299", type="negate")
              source = IRSource(
                  doc_id="required-relation-scale",
                  doc_version=1,
                  cards=_cards(),
                  relations=causal + (required,),
              )
              required_id = relation_id("negate", "c298", "c299")

              historical = build_llm_input_ir(source)
              protected = build_llm_input_ir(source, required_relation_ids=(required_id,))

              assert required_id not in {item["id"] for item in historical["relations"]}
              assert required_id in {item["id"] for item in protected["relations"]}
              assert len(protected["relations"]) == MAX_RELATIONS
              assert protected["truncation"]["reason_codes"] == ["MAX_CARDS", "MAX_RELATIONS"]
              assert protected["relations"] == sorted(
                  protected["relations"], key=lambda item: (item["type"], item["from"], item["to"])
              )


          def test_required_relation_implicitly_reserves_both_endpoint_cards() -> None:
              star = tuple(
                  SourceRelation(from_id="c000", to_id=f"c{i:03d}", type="related")
                  for i in range(1, 251)
              )
              tail = SourceRelation(from_id="c298", to_id="c299", type="negate")
              source = IRSource(
                  doc_id="required-relation-endpoints",
                  doc_version=1,
                  cards=_cards(),
                  relations=star + (tail,),
              )
              required_id = relation_id("negate", "c298", "c299")

              historical = build_llm_input_ir(source)
              protected = build_llm_input_ir(source, required_relation_ids=(required_id,))

              historical_cards = {card["id"] for card in historical["cards"]}
              protected_cards = {card["id"] for card in protected["cards"]}
              assert {"c298", "c299"}.isdisjoint(historical_cards)
              assert {"c298", "c299"} <= protected_cards
              assert required_id in {item["id"] for item in protected["relations"]}


          def test_missing_required_relation_fails_closed_without_echoing_the_id() -> None:
              missing_id = "negate:not-in-source:also-missing"
              with pytest.raises(IRGenerationError) as captured:
                  build_llm_input_ir(
                      IRSource(doc_id="missing", doc_version=1, cards=_cards(2)),
                      required_relation_ids=(missing_id,),
                  )

              assert captured.value.code == "required_relation_missing"
              assert missing_id not in captured.value.message


          def test_required_relation_set_cannot_exceed_relation_budget() -> None:
              relations = _directed_relations(MAX_RELATIONS + 1)
              required_ids = tuple(
                  relation_id(item.type, item.from_id, item.to_id) for item in relations
              )
              source = IRSource(
                  doc_id="required-relation-over-budget",
                  doc_version=1,
                  cards=_cards(30),
                  relations=relations,
              )

              with pytest.raises(IRGenerationError) as captured:
                  build_llm_input_ir(source, required_relation_ids=required_ids)

              assert captured.value.code == "required_relation_budget_exceeded"
          ''',
              encoding="utf-8",
          )

          narrative_test = Path(
              "03_Implement/backend/tests/test_ai_narrative_required_relation_scale.py"
          )
          narrative_test.write_text(
              '''"""Scale contract for narrative-required causal/negate relation identities."""

          from __future__ import annotations

          import pytest
          from fastapi import HTTPException

          from kj_atlas_api.llm_input_ir import MAX_RELATIONS, IRSource, SourceCard, SourceRelation
          from kj_atlas_api.models_ai import GenerateNarrativeRequest
          from kj_atlas_api.routes.ai import (
              _generate_narrative_ir,
              _narrative_required_relation_ids,
          )
          from scripts.measure_ai_route_prompt_coverage import representative_document


          def _logical_edges(count: int, *, relation_type: str) -> list[dict[str, str]]:
              edges: list[dict[str, str]] = []
              for source_index in range(21):
                  for target_index in range(21):
                      if source_index == target_index:
                          continue
                      edges.append(
                          {
                              "id": f"logic-{len(edges):03d}",
                              "fromId": f"c{source_index:03d}",
                              "toId": f"c{target_index:03d}",
                              "type": relation_type,
                          }
                      )
                      if len(edges) == count:
                          return edges
              raise AssertionError("fixture requested more unique relations than available")


          def test_required_relation_ids_match_only_normalizable_narrative_spine() -> None:
              source = IRSource(
                  doc_id="narrative-required-relation-boundary",
                  doc_version=1,
                  cards=(
                      SourceCard(id="a", text="A", text_reviewed=True),
                      SourceCard(id="b", text="B", text_reviewed=True),
                      SourceCard(id="c", text="C", text_reviewed=True),
                  ),
                  relations=(
                      SourceRelation(from_id="a", to_id="b", type="causal"),
                      SourceRelation(from_id="b", to_id="c", type="negate"),
                      SourceRelation(from_id="c", to_id="a", type="related"),
                      SourceRelation(
                          from_id="island-a",
                          to_id="a",
                          type="causal",
                          from_kind="island",
                          to_kind="card",
                      ),
                      SourceRelation(from_id="a", to_id="missing", type="negate"),
                  ),
              )

              assert _narrative_required_relation_ids(source) == (
                  "causal:a:b",
                  "negate:b:c",
              )


          def test_narrative_required_relation_survives_optional_relation_pressure() -> None:
              doc = representative_document(include_evidence=False)
              doc["edges"] = _logical_edges(MAX_RELATIONS, relation_type="related")
              doc["edges"].append(
                  {
                      "id": "required-tail",
                      "fromId": "c298",
                      "toId": "c299",
                      "type": "negate",
                  }
              )
              payload = GenerateNarrativeRequest.model_validate({"doc": doc})

              ir = _generate_narrative_ir(payload)
              relation_ids = {item["id"] for item in ir["relations"]}

              assert "negate:c298:c299" in relation_ids
              assert len(ir["relations"]) == MAX_RELATIONS
              assert ir["truncation"]["reason_codes"] == ["MAX_CARDS", "MAX_RELATIONS"]


          def test_more_than_max_relations_of_narrative_spine_fails_closed() -> None:
              doc = representative_document(include_evidence=False)
              doc["edges"] = _logical_edges(MAX_RELATIONS + 1, relation_type="causal")
              payload = GenerateNarrativeRequest.model_validate({"doc": doc})

              with pytest.raises(HTTPException) as excinfo:
                  _generate_narrative_ir(payload)

              assert excinfo.value.status_code == 422
              assert excinfo.value.detail["code"] == "required_relation_budget_exceeded"
          ''',
              encoding="utf-8",
          )

          issue = Path(
              "01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md"
          )
          issue_text = issue.read_text(encoding="utf-8")
          marker = "## R22 — required relation budget の fail-closed 化"
          if marker not in issue_text:
              issue_text += '''

          ## R22 — required relation budget の fail-closed 化

          named provider/model の token 実測待ちとは独立に、`generate-narrative` の論理骨格について `MAX_RELATIONS` 境界を詰めた。

          - 従来は `causal` / `negate` の**端点カード**だけが `required_card_ids` として保護され、relation自体は `(type, from, to)` 順の先頭400件で通常切り詰めされていた。このため端点がIRに残っても、必要な論理接続だけが消える余地があった。
          - shared IR builder に入力専用 `required_relation_ids` を追加した。正規化済みrelation IDだけを受け付け、欠落は `required_relation_missing`、required relation自体が400件を超える場合は `required_relation_budget_exceeded` でfail-closedする。
          - required relationの両端点はrequired card集合へ自動的に合流させる。relationを残してendpointを捨てる状態を作らない。
          - relation全体が400件を超える場合、required relationを先に予約し、残りだけを従来の決定論的順序で埋める。required指定が空の既存callerでは従来結果を変えない。
          - `generate-narrative` は正規化可能な card-to-card `causal` / `negate` のrelation IDを明示的にrequired指定する。これにより「required endpoint <= 200 だが required logical relation > 400」のcharacterizationは、黙った欠落ではなく422で停止する契約になった。
          - 回帰テストでは (1) optional relation圧力下で末尾のrequired `negate` が残ること、(2) required relationがendpoint cardも保護すること、(3) 欠落IDを反射せずfail-closedすること、(4) required relation 401件でfail-closedすること、(5) narrative route統合を固定する。

          **非主張**: 本変更はproviderが報告するtoken数を測定したものではない。named provider/model実測は引き続き本Issueの別ゲートであり、A2/B/Cの最終選択をここでは行わない。
          '''
              issue.write_text(issue_text, encoding="utf-8")
          PY

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run lane B regression tests
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
