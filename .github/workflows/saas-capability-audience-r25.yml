name: SaaS capability audience R25

on:
  push:
    branches:
      - fix/saas-capability-audience-separation-20260904
    paths:
      - .github/workflows/saas-capability-audience-r25.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'
      - name: Targeted backend tests
        working-directory: 03_Implement/backend
        run: |
          pytest -q \
            tests/test_capability_audience_separation.py \
            tests/test_session_context_routes.py \
            tests/test_control_plane_authorization.py \
            tests/test_document_access_admin_routes.py
      - name: Ruff changed Python seams
        working-directory: 03_Implement/backend
        run: |
          ruff check \
            src/kj_atlas_api/session_context.py \
            src/kj_atlas_api/routes/session.py \
            tests/test_capability_audience_separation.py
      - name: Diff check
        run: git diff --check origin/main...HEAD -- . ':!.github/workflows/saas-capability-audience-r25.yml'
      - name: Retire one-shot workflow
        if: success()
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git rm .github/workflows/saas-capability-audience-r25.yml
          git commit -m 'chore: retire R25 capability audience validator'
          git push
