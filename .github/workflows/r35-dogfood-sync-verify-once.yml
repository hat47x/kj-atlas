name: R35 dogfood sync and verify once

on:
  push:
    branches:
      - dogfood/r35-contract-carrier-parseability-20260907

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/r35-contract-carrier-parseability-20260907
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R35を継続dogfood索引へ同期する
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          anchor = "- `doc_kj_atlas_dogfood_r34.json`\n  - R34のKJキャンバス。scalar/default、finite enum、delivery surface、wiring state、ADR factual premiseを一種類の文字列guardで扱わず、消せる第二正本は消し、残す必要があるcurrent factだけをshape-awareなconformanceへ戻す構造を保持する。\n"
          addition = anchor + "- `cognitive-dogfood-continuous-2026-09-07-r35.md`\n  - R35。PR #3036で、DeepSeek thinking enumの意味集合は正しいままraw pipeがMarkdown table delimiterと衝突し、enum監査でcellが切断された実陽性を分析し、carrier integrityをsemantic conformanceの前段として分離した記録。\n- `doc_kj_atlas_dogfood_r35.json`\n  - R35のKJキャンバス。machine-checkedなcurrent-contract surfaceだけを対象に、表現を一意にparseできること→shape-awareな意味照合の順で守り、全Markdownをgeneric grammar化しない構造を保持する。\n"
          if 'doc_kj_atlas_dogfood_r35.json' not in text:
              if anchor not in text:
                  raise SystemExit('R34 index anchor not found')
              text = text.replace(anchor, addition, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py' -v
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Working-tree hygiene
        run: git diff --check
      - name: 検証済みR35をbranchへ記録しone-shotを退役する
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/dogfood/cognitive-dogfood-index.md
          git rm .github/workflows/r35-dogfood-sync-verify-once.yml
          git commit -m "dogfood: sync R35 index and retire verifier"
          git push origin HEAD:dogfood/r35-contract-carrier-parseability-20260907
