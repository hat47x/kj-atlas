name: Temporary lane C restore frontend typecheck

on:
  push:
    branches:
      - fix/lane-c-restore-frontend-typecheck-20260904

permissions:
  contents: read

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-restore-frontend-typecheck-20260904
          fetch-depth: 0

      - name: Apply narrow repair
        run: python .github/lane_c_restore_frontend_typecheck_patch.py

      - name: Verify frontend type contract
        working-directory: 03_Implement/frontend
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npx vitest run \
            src/domain/merge_suggestion_decisions.test.ts \
            src/domain/stream_b_contract_handoff.test.ts \
            src/domain/stream_b_mock_validation.test.ts \
            src/import/agent_response_import.test.ts \
            src/import/agent_response_merge_method.test.ts \
            src/ui/MergeSuggestionsPanel.test.ts

      - name: Verify planning contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json
          python -c 'import json; from pathlib import Path; report=json.loads(Path("/tmp/triage.json").read_text(encoding="utf-8")); assert not report.get("errors"), report.get("errors")'
          git diff --check
