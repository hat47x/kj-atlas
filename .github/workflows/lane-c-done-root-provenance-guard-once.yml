name: Lane C Done root provenance guard once

on:
  push:
    branches:
      - fix/lane-c-done-root-provenance-guard-20260905

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/lane-c-done-root-provenance-guard-20260905
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Done root provenance guard tests
        run: python -m unittest 01_Plans.tests.test_legacy_done_root_references
      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: 成功したone-shot workflowを削除する
        shell: bash
        run: |
          rm .github/workflows/lane-c-done-root-provenance-guard-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove completed Done root provenance guard workflow'
          git push origin HEAD:fix/lane-c-done-root-provenance-guard-20260905
