name: lane-b-llm-usage-provenance-once

on:
  push:
    branches:
      - lane-b/llm-usage-reporting-provenance

permissions:
  contents: write

jobs:
  apply-verify-cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: lane-b/llm-usage-reporting-provenance
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Apply AC-4 usage provenance patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/lane_b_llm_usage_provenance_apply.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise SystemExit(f"{label}: expected exactly 1 match, found {count}")\n    return text.replace(old, new, 1)\n'''
          new = '''    if label == "update local alias provider status contract" and count == 2:\n        return text.replace(old, new, 1)\n    if count != 1:\n        raise SystemExit(f"{label}: expected exactly 1 match, found {count}")\n    return text.replace(old, new, 1)\n'''
          if text.count(old) != 1:
              raise SystemExit('replace_once helper shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python .github/scripts/lane_b_llm_usage_provenance_apply.py
      - name: Install backend test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./03_Implement/backend pytest
      - name: Run provider usage regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q tests/test_ai_provider_status_route.py tests/test_llm_provider.py
          python -m compileall -q src/kj_atlas_api
      - name: Typecheck frontend provider status contract
        working-directory: 03_Implement/frontend
        run: |
          npm ci
          npm run typecheck
      - name: Run repository contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              print('docs contract failures:')
              for error in result.errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print(f'docs contracts passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          git diff --check
      - name: Commit verified AC-4 and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/lane_b_llm_usage_provenance_apply.py
          git rm .github/workflows/lane-b-llm-usage-provenance-once.yml
          git add 03_Implement/backend/src/kj_atlas_api/llm/provider.py \
                  03_Implement/backend/src/kj_atlas_api/models_ai.py \
                  03_Implement/backend/src/kj_atlas_api/routes/ai.py \
                  03_Implement/backend/tests/test_ai_provider_status_route.py \
                  03_Implement/frontend/src/api/client.ts \
                  01_Plans/issues/issue-OPS-LLM-COST-01-cost-control-contract-unimplemented.md
          git commit -m "feat(ops): distinguish missing LLM usage from zero"
          git push origin HEAD:lane-b/llm-usage-reporting-provenance
