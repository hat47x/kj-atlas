name: suggest-merges route IR validation (one-shot)

on:
  push:
    branches:
      - feat/suggest-merges-route-ir-20260903

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/suggest-merges-route-ir-20260903
          fetch-depth: 0

      - name: Apply route IR wiring
        run: python .github/scripts/apply_suggest_merges_route_ir_once.py

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run suggest-merges focused regression
        working-directory: 03_Implement/backend
        run: |
          pytest tests/test_ai_merge_ir.py -q
          pytest tests/test_ai_merge_semantics.py -q
          pytest tests/test_ai_llm_input_ir_coverage.py -q
          pytest tests/test_ai_prompt.py -q

      - name: Confirm main baseline for retired ci.yml checks
        run: |
          git worktree add /tmp/kj-atlas-main origin/main
          test ! -e /tmp/kj-atlas-main/.github/workflows/ci.yml

      - name: Run backend regression excluding current main ci.yml absence
        working-directory: 03_Implement/backend
        run: |
          pytest tests/ -q \
            --deselect=tests/test_database_support_declarations.py::test_driver_extras_markers_tests_and_ci_stay_synchronized \
            --deselect=tests/test_database_support_declarations.py::test_every_external_verified_backend_ci_image_matches_registry \
            --deselect=tests/test_settings_env_prefix_migration.py::test_backend_ci_uses_canonical_database_test_keys

      - name: Run static and planning checks
        run: |
          cd 03_Implement/backend
          ruff check src tests/test_ai_merge_ir.py tests/test_ai_merge_semantics.py tests/test_ai_llm_input_ir_coverage.py tests/test_ai_prompt.py
          cd ../..
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage.txt
          test -s /tmp/triage.txt
          git diff --check

      - name: Remove one-shot files and push validated implementation
        run: |
          rm .github/workflows/apply-suggest-merges-route-ir-once.yml
          rm .github/scripts/apply_suggest_merges_route_ir_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: suggest-mergesをroute固有IRへ移行する'
          git push origin HEAD:feat/suggest-merges-route-ir-20260903
