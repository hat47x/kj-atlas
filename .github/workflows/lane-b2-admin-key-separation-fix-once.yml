name: Lane B2 admin key separation contract fix once

on:
  push:
    branches:
      - fix/lane-b2-admin-key-separation-contract-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align public admin-key separation wording
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('04_Documentation/configuration.md')
          raw = path.read_bytes()
          old = 'Stage B では trusted SaaS session の `tenant.provision` capability でも `/admin/provision/**` を認可でき、request に admin bearer は不要。業務面 `KJ_ATLAS_API_KEY` は管理面で受理しない。`enterprise-production` / `saas-multitenant` では設定自体が**必須**'
          new = 'Stage B では trusted SaaS session の `tenant.provision` capability でも `/admin/provision/**` を認可でき、request に admin bearer は不要。業務面 `KJ_ATLAS_API_KEY` は管理面で受理せず、同じ秘密値を `KJ_ATLAS_API_KEY` と `KJ_ATLAS_ADMIN_API_KEY` の両方へ設定する構成も起動時に拒否する。`enterprise-production` / `saas-multitenant` では設定自体が**必須**'
          old_b = old.encode('utf-8')
          new_b = new.encode('utf-8')
          if raw.count(old_b) != 1:
              raise SystemExit(f'expected one configuration admin-key wording target, got {raw.count(old_b)}')
          path.write_bytes(raw.replace(old_b, new_b, 1))
          PY

          cat > 01_Plans/tests/test_control_plane_credential_separation_contract.py <<'PY'
          from __future__ import annotations

          import ast
          import unittest
          from pathlib import Path


          ROOT = Path(__file__).resolve().parents[2]
          SETTINGS_PATH = ROOT / "03_Implement/backend/src/kj_atlas_api/settings.py"
          REGISTRY_PATH = ROOT / "02_Architecture/runtime_parameter_registry.md"
          CONFIG_PATH = ROOT / "04_Documentation/configuration.md"


          def _public_row(path: Path, key: str) -> str:
              prefix = f"| `{key}` |"
              rows = [
                  line
                  for line in path.read_text(encoding="utf-8").splitlines()
                  if line.startswith(prefix)
              ]
              if len(rows) != 1:
                  raise AssertionError(
                      f"expected one public row for {key} in {path}, got {len(rows)}"
                  )
              return rows[0]


          def _settings_validator_source() -> str:
              text = SETTINGS_PATH.read_text(encoding="utf-8")
              tree = ast.parse(text)
              settings_class = next(
                  node
                  for node in tree.body
                  if isinstance(node, ast.ClassDef) and node.name == "Settings"
              )
              validator = next(
                  node
                  for node in settings_class.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "validate_llm_provider_guards"
              )
              if validator.end_lineno is None:
                  raise AssertionError("Settings validator source range is unavailable")
              return "\n".join(
                  text.splitlines()[validator.lineno - 1 : validator.end_lineno]
              )


          class ControlPlaneCredentialSeparationContractTests(unittest.TestCase):
              def test_business_and_admin_api_keys_must_be_distinct_everywhere_public(self) -> None:
                  validator = _settings_validator_source()
                  self.assertIn("self.api_key == self.admin_api_key", validator)
                  self.assertIn(
                      "KJ_ATLAS_API_KEY and KJ_ATLAS_ADMIN_API_KEY must be distinct",
                      validator,
                  )

                  for row in (
                      _public_row(REGISTRY_PATH, "KJ_ATLAS_ADMIN_API_KEY"),
                      _public_row(CONFIG_PATH, "KJ_ATLAS_ADMIN_API_KEY"),
                  ):
                      self.assertIn("KJ_ATLAS_API_KEY", row)
                      self.assertIn("同じ秘密値", row)
                      self.assertIn("起動時に拒否", row)


          if __name__ == "__main__":
              unittest.main()
          PY
      - name: Verify focused relational contract
        run: python -m unittest 01_Plans.tests.test_control_plane_credential_separation_contract -v
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff and EOL preservation
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path

          expected = {
              '01_Plans/tests/test_control_plane_credential_separation_contract.py',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-admin-key-separation-fix-once.yml',
          }
          changed = set(
              subprocess.check_output(
                  ['git', 'diff', '--name-only', 'HEAD^', '--'], text=True
              ).splitlines()
          )
          # The branch initially contains only the workflow commit; after the in-job
          # patch, compare the working tree plus committed workflow separately.
          working = set(
              subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines()
          )
          if working != {
              '01_Plans/tests/test_control_plane_credential_separation_contract.py',
              '04_Documentation/configuration.md',
          }:
              raise SystemExit(f'unexpected working-tree diff: {sorted(working)}')

          cfg = Path('04_Documentation/configuration.md').read_bytes()
          base = subprocess.check_output(
              ['git', 'show', 'HEAD:04_Documentation/configuration.md']
          )
          for marker in (b'\r\n', b'\n'):
              if cfg.count(marker) != base.count(marker):
                  raise SystemExit('configuration.md EOL shape changed')

          for path in working:
              data = Path(path).read_bytes()
              for lineno, line in enumerate(data.splitlines(), 1):
                  if line.endswith((b' ', b'\t')):
                      raise SystemExit(f'{path}:{lineno}: trailing whitespace')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_control_plane_credential_separation_contract.py 04_Documentation/configuration.md
          git commit -m "docs(config): business/admin API key分離制約を明示する"
          git rm .github/workflows/lane-b2-admin-key-separation-fix-once.yml
          git commit -m "ci: retire Lane B2 admin key separation workflow"
          git push
