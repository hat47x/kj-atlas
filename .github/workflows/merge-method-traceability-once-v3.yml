name: Temporary merge method traceability v3

on:
  push:
    branches:
      - feat/merge-method-traceability-20260904
    paths:
      - .github/workflows/merge-method-traceability-once-v3.yml

permissions:
  contents: write

jobs:
  implement-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/merge-method-traceability-20260904
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Apply corrected implementation script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/merge-method-traceability-once.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          embedded = workflow[start:end]
          lines = []
          for line in embedded.splitlines():
              if line.startswith('          '):
                  line = line[10:]
              lines.append(line)
          script = '\n'.join(lines) + '\n'

          section_start = script.index('# Append-only audit record carries the same method when known.')
          section_end = script.index('# App decision + audit wiring.', section_start)
          corrected = r'''# Append-only audit record carries the same method when known.
audit_path = '03_Implement/frontend/src/domain/merge/decision_audit_events.ts'
audit = read_text(audit_path)
newline = '\r\n' if '\r\n' in audit else '\n'

def audit_replace(old: str, new: str) -> None:
    global audit
    old_native = adapt(old, newline)
    new_native = adapt(new, newline)
    count = audit.count(old_native)
    if count != 1:
        raise SystemExit(f'{audit_path}: expected one explicit audit contract fragment, found {count}: {old!r}')
    audit = audit.replace(old_native, new_native, 1)

audit_replace(
    '''export type MergeDecisionAuditEvent = {
  eventId: string;
  groupId: string;
  decision: MergeSuggestionDecision;
  decidedAt: string;
  decidedBy: "human";
  cardIds: string[];
  snapshotVersion: string;
  decisionReason?: string;
};
''',
    '''export type MergeDecisionAuditEvent = {
  eventId: string;
  groupId: string;
  decision: MergeSuggestionDecision;
  decidedAt: string;
  decidedBy: "human";
  cardIds: string[];
  snapshotVersion: string;
  decisionReason?: string;
  mergeMethod?: "near_duplicate" | "kernel_fusion";
};
''',
)
audit_replace(
    '''export function createMergeDecisionAuditEvent(input: {
  eventId: string;
  groupId: string;
  decision: MergeSuggestionDecision;
  decidedAt: string;
  cardIds: string[];
  snapshotVersion: string;
  decisionReason?: string;
}): MergeDecisionAuditEvent {
''',
    '''export function createMergeDecisionAuditEvent(input: {
  eventId: string;
  groupId: string;
  decision: MergeSuggestionDecision;
  decidedAt: string;
  cardIds: string[];
  snapshotVersion: string;
  decisionReason?: string;
  mergeMethod?: "near_duplicate" | "kernel_fusion";
}): MergeDecisionAuditEvent {
''',
)
audit_replace(
    '''    snapshotVersion: input.snapshotVersion,
    decisionReason: input.decisionReason,
''',
    '''    snapshotVersion: input.snapshotVersion,
    decisionReason: input.decisionReason,
    mergeMethod: input.mergeMethod,
''',
)
write_text(audit_path, audit)

audit_test_path = '03_Implement/frontend/src/domain/merge/decision_audit_events.test.ts'
audit_test = read_text(audit_test_path)
newline = '\r\n' if '\r\n' in audit_test else '\n'
old = adapt('''      snapshotVersion: "CTR-2B-02-DECISION-LOG-V1",
      decisionReason: "Reviewed by operator",
    });
''', newline)
new = adapt('''      snapshotVersion: "CTR-2B-02-DECISION-LOG-V1",
      decisionReason: "Reviewed by operator",
      mergeMethod: "kernel_fusion",
    });
''', newline)
if audit_test.count(old) != 2:
    raise SystemExit(f'{audit_test_path}: expected two decisionReason fragments, found {audit_test.count(old)}')
audit_test = audit_test.replace(old, new, 1)
old_expected = adapt('''      snapshotVersion: "CTR-2B-02-DECISION-LOG-V1",
      decisionReason: "Reviewed by operator",
    });
''', newline)
new_expected = adapt('''      snapshotVersion: "CTR-2B-02-DECISION-LOG-V1",
      decisionReason: "Reviewed by operator",
      mergeMethod: "kernel_fusion",
    });
''', newline)
if audit_test.count(old_expected) != 1:
    raise SystemExit(f'{audit_test_path}: expected one remaining expected-event fragment, found {audit_test.count(old_expected)}')
audit_test = audit_test.replace(old_expected, new_expected, 1)
write_text(audit_test_path, audit_test)

'''
          script = script[:section_start] + corrected + script[section_end:]
          exec(compile(script, '<merge-method-traceability>', 'exec'))
          PY

      - name: Inspect merge-related fixture surfaces
        run: git grep -n "mergedTextDraft" -- ':!03_Implement/frontend/package-lock.json' | head -100 || true

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Format and lint changed Python
        working-directory: 03_Implement/backend
        run: |
          python -m ruff format src/kj_atlas_api/models.py src/kj_atlas_api/routes/ai.py tests/test_ai_merge_ir.py
          python -m ruff check src/kj_atlas_api/models.py src/kj_atlas_api/routes/ai.py tests/test_ai_merge_ir.py

      - name: Run backend merge regressions
        working-directory: 03_Implement/backend
        run: python -m pytest tests/test_ai_merge_semantics.py tests/test_ai_merge_ir.py tests/test_ai_llm_input_ir_coverage.py -q

      - name: Run frontend merge regressions
        working-directory: 03_Implement/frontend
        run: |
          npx vitest run \
            src/api/client.test.ts \
            src/domain/merge_candidates.test.ts \
            src/domain/merge_suggestion_decisions.test.ts \
            src/domain/merge/decision_audit_events.test.ts \
            src/i18n/key_consistency.test.ts
          npm run typecheck

      - name: Run focused merge persistence E2E
        working-directory: 03_Implement/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/merge_suggestion_apply_persistence.spec.ts

      - name: Run planning and docs checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/triage_actionable_plans.py >/tmp/triage.txt
          cat /tmp/triage.txt
          git diff --check

      - name: Commit verified implementation and remove one-shot workflows
        shell: bash
        run: |
          git rm .github/workflows/merge-method-traceability-once.yml
          git rm .github/workflows/merge-method-traceability-once-v2.yml
          git rm .github/workflows/merge-method-traceability-once-v3.yml
          git config user.name "hat47x"
          git config user.email "hat47x@gmail.com"
          git add -A
          git status --short
          git commit -m "feat: merge方式を判断記録まで追跡する"
          git push origin HEAD:feat/merge-method-traceability-20260904
