name: OPS admin console once

on:
  push:
    branches:
      - feat/ops-admin-concurrency-console-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/ops-admin-concurrency-console-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Install Chromium
        working-directory: 03_Implement/frontend
        run: npx playwright install --with-deps chromium
      - name: Typecheck and build
        working-directory: 03_Implement/frontend
        run: |
          npm run typecheck
          npm run build
      - name: Unit test admin conflict contract
        working-directory: 03_Implement/frontend
        run: npx vitest run src/admin/model_allowlist_admin.test.ts
      - name: E2E admin conflict UX
        working-directory: 03_Implement/frontend
        run: npx playwright test e2e/admin_model_allowlist_conflict.spec.ts
      - name: Validate repository contracts
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
      - name: Remove one-shot workflow after success
        run: |
          rm -f .github/workflows/ops-admin-console-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'ci: OPS admin console one-shot workflowを削除する'
          git push origin HEAD:feat/ops-admin-concurrency-console-20260904
