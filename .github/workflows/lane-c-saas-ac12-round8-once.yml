name: Lane C SAAS AC12 finalize one-shot

on:
  push:
    branches:
      - lane-c/saas-tenant-ac12-round8-browser-20260906

permissions:
  contents: write

jobs:
  finalize-ac12:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Record successful Round 8 evidence and remove one-shot
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md")
          text = path.read_text(encoding="utf-8")

          old_perf = "- 性能予算（`ADR-0046` PB-1..5）: 代表規模でのKJ主要操作=bootstrap完了後は不変 / 100ms超同期処理=追加なし。PB-2初期表示はruntime policy確認とsession context取得を逐次実行するため**要改善（所要時間未計測）**。現在は両待機中に`aria-busy`付きloading viewを表示してPB-5の無反応状態を避ける。AC-12の実ブラウザ検証で、代表環境の操作可能化時間を計測し、数秒超なら段階表示または待機理由の具体化を行う。"
          new_perf = "- 性能予算（`ADR-0046` PB-1..5）: 代表規模でのKJ主要操作=bootstrap完了後は不変 / 100ms超同期処理=追加なし。PB-2初期表示はruntime policy確認とsession context取得を逐次実行する。**2026-09-06 AC-12実測済み**: real Chromium（Ubuntu hosted runner、ja/en × 390/768/1440px）でstart panel操作可能化=485.2〜552.6ms、active tenant文書＋tenant switcher操作可能化=577.7〜635.0ms。数秒超には該当せず、現時点で段階表示または待機理由の追加は不要と判断する。両待機中の`aria-busy`付きloading viewはPB-5の無反応状態回避として維持する。"
          if old_perf not in text:
              raise SystemExit("performance budget anchor not found")
          text = text.replace(old_perf, new_perf, 1)

          old_ac12 = "- [ ] AC-12: Round 8 R8-E/FはAC-1〜11完了後だけ有効化され、390/768/1440px、ja/en、keyboard/focus、tenant切替時の旧DOM/cache破棄を検証する。"
          new_ac12 = "- [x] AC-12: Round 8 R8-E/FはAC-1〜11完了後だけ有効化され、390/768/1440px、ja/en、keyboard/focus、tenant切替時の旧DOM/cache破棄を検証する。— **2026-09-06 Lane C完了確認**: `tenant_session_round8_acceptance.spec.ts`をSaaS専用Playwright configへ追加し、ja/en × 390/768/1440pxの6条件でnative keyboardによるtenant切替、`:focus-visible`、旧tenant DOM/scoped cache破棄、horizontal overflowなし、操作可能化時間をreal Chromiumで固定した。GitHub Actions Run `33997373678` は既存SaaS回帰9件＋新規Round 8 1件の10/10 pass。"
          if old_ac12 not in text:
              raise SystemExit("AC-12 anchor not found")
          text = text.replace(old_ac12, new_ac12, 1)

          anchor = "### Lane C checkpoint 2026-09-05: AC-10 consumer-specific negative matrix"
          checkpoint = (
              "### Lane C checkpoint 2026-09-06: AC-12 Round 8 real-browser acceptance\n\n"
              "- `03_Implement/frontend/e2e/tenant_session_round8_acceptance.spec.ts`を追加し、SaaS runtimeでja/en × 390/768/1440pxの6条件を1本の受入matrixとして固定した。各条件でtenant switcherへTab到達でき`:focus-visible`になること、native selectのkeyboard操作でtenant A→Bへ切り替わること、tenant Aの文書DOMとtenant-scoped localStorageが残らないこと、横overflowが生じないことを確認する。\n"
              "- GitHub Actions Run `33997373678` では既存`tenant_session_multitab.spec.ts` 9件を含む10/10がreal Chromiumでpassした。6条件のstart panel操作可能化は485.2〜552.6ms、active tenant文書＋switcher操作可能化は577.7〜635.0msで、Issueが改善条件としていた「数秒超」には該当しなかった。\n"
              "- AC-12を完了とする。一時workflowはこのcheckpointと同じcommitで削除し、恒久CIを復活させない。AC-13は実backendを通す同一認証session・複数tab競合matrixが残る別軸のため、`[~]`のまま維持する。\n\n"
          )
          if anchor not in text:
              raise SystemExit("AC-10 checkpoint anchor not found")
          text = text.replace(anchor, checkpoint + anchor, 1)
          path.write_text(text, encoding="utf-8")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/lane-c-saas-ac12-round8-once.yml
          git add 01_Plans/issues/issue-SAAS-TENANT-01-tenant-context-and-storage-foundation.md
          git commit -m "docs(saas): complete AC-12 Round 8 browser acceptance"
          git push origin "HEAD:${GITHUB_REF_NAME}"
