name: Lane C SAAS AC12 Round 8 one-shot

on:
  push:
    branches:
      - lane-c/saas-tenant-ac12-round8-browser-20260906

permissions:
  contents: read

jobs:
  round8-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup frontend
        id: frontend
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: 03_Implement/frontend

      - name: Typecheck
        working-directory: 03_Implement/frontend
        run: ${{ steps.frontend.outputs.run }} typecheck

      - name: Install Chromium
        working-directory: 03_Implement/frontend
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Run SaaS browser acceptance
        working-directory: 03_Implement/frontend
        env:
          KJ_ATLAS_E2E_SAAS: "1"
        run: ./node_modules/.bin/playwright test --config=playwright.saas.config.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lane-c-saas-ac12-round8-evidence
          path: |
            03_Implement/frontend/test-results
            03_Implement/frontend/playwright-report
          if-no-files-found: ignore
          retention-days: 7
