name: verify merge semantics issue closure (one-shot)

on:
  push:
    branches:
      - docs/close-ai-merge-semantics-r20-20260904
    paths:
      - .github/workflows/verify-close-ai-merge-semantics-once.yml

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/close-ai-merge-semantics-r20-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate issue lifecycle and triage
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text > /tmp/triage.txt
          test -s /tmp/triage.txt
          test ! -e 01_Plans/issues/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          test -e 01_Plans/issues/done/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          test "$(find 01_Plans/issues -name 'issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md' | wc -l)" -eq 1
          grep -F -- '- Status: Done' 01_Plans/issues/done/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          grep -F -- '- [x] `mergeMethod` をprovider出力、frontend共通契約、fallback、Document decision snapshotへ実装した。' 01_Plans/issues/done/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          git -c core.whitespace=cr-at-eol diff --check HEAD^..HEAD

      - name: Remove one-shot workflow
        run: |
          rm .github/workflows/verify-close-ai-merge-semantics-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'chore: merge意味論Issue完了検証workflowを削除する'
          git push origin HEAD:docs/close-ai-merge-semantics-r20-20260904
