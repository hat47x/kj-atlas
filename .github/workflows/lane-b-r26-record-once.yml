name: lane-b-r26-record-once

on:
  push:
    branches:
      - lane-b/provider-token-layout-c-optin

permissions:
  contents: write

jobs:
  record-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-token-layout-c-optin

      - name: Record R26
        run: python .github/lane-b-r26-append-issue.py

      - name: Commit note and remove temporary files
        run: |
          rm .github/lane-b-r26-append-issue.py
          rm .github/workflows/lane-b-r26-record-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): record explicit layout C token measurement opt-in'
          git push origin HEAD:lane-b/provider-token-layout-c-optin
