name: R25 frozen manifest verification

on:
  push:
    branches:
      - dogfood/r25-frozen-manifest-immutability-20260906
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused frozen manifest identity tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_frozen_dogfood_manifest_identity.py' -v
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py' -v
      - name: Dogfood validator tests
        run: python -m unittest discover -s 01_Plans/dogfood -p 'test_*.py' -v
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
