name: Lane B2 SaaS admin key profile gate fix once

on:
  push:
    branches:
      - fix/lane-b2-saas-admin-key-profile-gate-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align SaaS admin key profile gate
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('02_Architecture/runtime_parameter_registry.md')
          text = registry_path.read_text(encoding='utf-8')
          old = '- PostgreSQL共有認証状態、trusted SaaS auth edge、external access control、external document binding、external tenant capability、JIT無効、`deny` fail-safe、SaaS OAuth broker authorize endpoint、auth-session hash keyなど、`TrustedSaasRuntimePolicy` の必須条件を満たす。'
          new = '- `KJ_ATLAS_ADMIN_API_KEY` を設定し、PostgreSQL共有認証状態、trusted SaaS auth edge、external access control、external document binding、external tenant capability、JIT無効、`deny` fail-safe、SaaS OAuth broker authorize endpoint、auth-session hash keyなど、`TrustedSaasRuntimePolicy` の必須条件を満たす。'
          if text.count(old) != 1:
              raise SystemExit(f'expected one SaaS profile criteria line, got {text.count(old)}')
          registry_path.write_text(text.replace(old, new), encoding='utf-8', newline='')

          test_path = Path('01_Plans/tests/test_saas_profile_hard_gate_contract.py')
          test = test_path.read_text(encoding='utf-8')
          anchor = '    def test_request_time_oauth_completeness_is_not_promoted_to_startup_gate(self) -> None:\n'
          method = '''    def test_saas_profile_requires_admin_api_key_across_public_profile_docs(self) -> None:\n        settings = (ROOT / "03_Implement/backend/src/kj_atlas_api/settings.py").read_text(encoding="utf-8")\n        self.assertIn("if self.admin_api_key is None:", settings)\n        self.assertIn('missing.append("KJ_ATLAS_ADMIN_API_KEY")', settings)\n        self.assertIn('_AUTH_REQUIRED_PROFILES = ("enterprise-production", "saas-multitenant")', settings)\n\n        registry_profile = REGISTRY_PATH.read_text(encoding="utf-8").split(\n            "## Profile selection criteria", 1\n        )[1].split("### SaaS profile implementation gate", 1)[0]\n        config_profile = CONFIG_PATH.read_text(encoding="utf-8").split(\n            "## Runtime profiles（推奨プロファイル）", 1\n        )[1].split("## 最小設定", 1)[0]\n        self.assertIn("`KJ_ATLAS_ADMIN_API_KEY`", registry_profile)\n        self.assertIn("`KJ_ATLAS_ADMIN_API_KEY`", config_profile)\n\n'''
          if method in test:
              raise SystemExit('admin-key profile contract already present')
          if test.count(anchor) != 1:
              raise SystemExit('test insertion anchor drifted')
          test_path.write_text(test.replace(anchor, method + anchor), encoding='utf-8')
          PY
      - name: Verify focused contract
        run: python -m unittest 01_Plans.tests.test_saas_profile_hard_gate_contract
      - name: Verify planning suite
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git diff --check
          python - <<'PY'
          import subprocess
          files = subprocess.check_output(['git','diff','--name-only','HEAD^'], text=True).splitlines()
          allowed = {
              '.github/workflows/lane-b2-saas-admin-key-profile-fix-once.yml',
              '01_Plans/tests/test_saas_profile_hard_gate_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
          }
          unexpected = [path for path in files if path not in allowed]
          if unexpected:
              raise SystemExit(f'unexpected diff: {unexpected}')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_saas_profile_hard_gate_contract.py 02_Architecture/runtime_parameter_registry.md
          git commit -m "docs(config): SaaS admin key profile gateを明示する"
          git rm .github/workflows/lane-b2-saas-admin-key-profile-fix-once.yml
          git commit -m "ci: retire Lane B2 SaaS admin key profile workflow"
          git push
