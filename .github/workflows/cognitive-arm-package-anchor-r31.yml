name: Cognitive arm package frozen anchor R31

on:
  push:
    branches:
      - fix/cognitive-arm-package-frozen-anchor-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main in validation workspace
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Cognitive dogfood unit tests
        run: |
          cd 01_Plans/dogfood
          python -m unittest discover -p 'test_*.py'
          python validate_cognitive_launch_packets.py
      - name: Assemble frozen Cases 001-003 arm packages
        run: |
          set -euo pipefail
          DOGFOOD="$GITHUB_WORKSPACE/01_Plans/dogfood"
          ROOT=/tmp/cognitive-arm-packages
          CSW=/tmp/cultural-substrate-weaving
          SKILL=/tmp/cognitive-shared-skill
          rm -rf "$ROOT" "$CSW" "$SKILL"
          mkdir -p "$ROOT"

          git clone --quiet https://github.com/hat47x/cultural-substrate-weaving.git "$CSW"
          git -C "$CSW" checkout --quiet 3988e12e5f7f316f377d3391e9486c8467a111d5
          python "$DOGFOOD/prepare_cognitive_case001_skill_bundle.py" \
            --skill-repo-root "$CSW" \
            --output "$SKILL"

          for case in 001 002 003; do
            product="$ROOT/product-$case"
            python "$DOGFOOD/prepare_cognitive_frozen_source_bundle.py" \
              --repo-root "$GITHUB_WORKSPACE" \
              --manifest "$DOGFOOD/cognitive-dogfood-case-$case-round1-source-manifest.json" \
              --output "$product"

            base="$ROOT/cognitive-dogfood-case-$case-arms"
            for arm in A B C D; do
              mkdir -p "$base/$arm"
              cp -a "$product" "$base/$arm/product"
            done
            cp "$DOGFOOD/cognitive-dogfood-case-$case-launch-ordinary.md" "$base/A/launch.md"
            cp "$DOGFOOD/cognitive-dogfood-case-$case-launch-skill.md" "$base/B/launch.md"
            cp "$DOGFOOD/cognitive-dogfood-case-$case-launch-atlas.md" "$base/C/launch.md"
            cp "$DOGFOOD/cognitive-dogfood-case-$case-launch-atlas-skill.md" "$base/D/launch.md"
            cp -a "$SKILL" "$base/B/skill"
            cp -a "$SKILL" "$base/D/skill"
            cp "$DOGFOOD/doc_cognitive_case_${case}_starter.json" "$base/C/starter.json"
            cp "$DOGFOOD/doc_cognitive_case_${case}_starter.json" "$base/D/starter.json"
          done

          python "$DOGFOOD/validate_cognitive_arm_packages.py" --root "$ROOT"
      - name: Dogfood and issue governance checks
        run: |
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py
      - name: Diff checks
        run: |
          git diff --check origin/main...HEAD
          test "$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/cognitive-arm-package-anchor-r31.yml$' | wc -l)" -eq 2
      - name: Retire one-shot workflow
        if: always()
        run: |
          git merge --abort || true
          git rm .github/workflows/cognitive-arm-package-anchor-r31.yml
          git commit -m 'chore: retire R31 cognitive package validation'
          git push origin HEAD:${GITHUB_REF_NAME}
