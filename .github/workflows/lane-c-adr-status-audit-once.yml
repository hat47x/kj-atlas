name: Temporary lane C ADR status audit

on:
  push:
    branches:
      - chore/lane-c-plan-triage-20260904

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-plan-triage-20260904
      - name: Audit raw ADR Status metadata
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import re

          status_re = re.compile(r'^- Status:\s*(.+)$', re.M)
          rows = []
          for path in sorted(Path('01_Plans/adr').glob('ADR-*.md')):
              text = path.read_text(encoding='utf-8')
              match = status_re.search(text)
              raw = match.group(1).strip() if match else '<missing>'
              rows.append((path.name, raw))

          print(f'adr_count={len(rows)}')
          print('raw_status_counts:')
          for status, count in Counter(raw for _, raw in rows).most_common():
              print(f'  {count:3d} {status}')
          print('non_simple_statuses:')
          simple = {'Accepted', 'Proposed', 'Superseded', 'Deprecated', 'Rejected'}
          for name, raw in rows:
              if raw not in simple:
                  print(f'  {name}: {raw}')
          PY
      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-adr-status-audit-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove lane C ADR status audit workflow'
          git push origin HEAD:chore/lane-c-plan-triage-20260904
