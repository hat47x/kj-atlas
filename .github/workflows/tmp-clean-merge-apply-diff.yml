name: Temporary clean merge apply diff

on:
  push:
    branches:
      - test/merge-apply-persistence-e2e-20260903

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore App from main and apply CRLF-preserving patch
        run: |
          git fetch origin main
          git checkout origin/main -- 03_Implement/frontend/src/App.tsx
          python - <<'PY'
          from pathlib import Path
          p = Path('03_Implement/frontend/src/App.tsx')
          b = p.read_bytes()
          replacements = [
              (
                  b'      options?: {\r\n        preserveSuggestionPreview?: boolean;\r\n      }\r\n',
                  b'      options?: {\r\n        preserveSuggestionPreview?: boolean;\r\n        preserveMergeSuggestions?: boolean;\r\n      }\r\n',
              ),
              (
                  b'      setMergeSuggestions([]);\r\n      setMergeSuggestionError(null);\r\n',
                  b'      if (!options?.preserveMergeSuggestions) {\r\n        setMergeSuggestions([]);\r\n      }\r\n      setMergeSuggestionError(null);\r\n',
              ),
              (
                  b'      applyDocumentChange(\r\n        nextDocument,\r\n        t("app.history.merge_suggestion.decision_recorded", { decision: decisionLabel })\r\n      );\r\n',
                  b'      applyDocumentChange(\r\n        nextDocument,\r\n        t("app.history.merge_suggestion.decision_recorded", { decision: decisionLabel }),\r\n        { preserveMergeSuggestions: true },\r\n      );\r\n',
              ),
              (
                  b'      const changed = applyDocumentChange(\r\n        result.document,\r\n        t("app.history.merge_suggestion_applied"),\r\n        { preserveSuggestionPreview: true },\r\n      );\r\n',
                  b'      const changed = applyDocumentChange(\r\n        result.document,\r\n        t("app.history.merge_suggestion_applied"),\r\n        { preserveSuggestionPreview: true, preserveMergeSuggestions: true },\r\n      );\r\n',
              ),
          ]
          for old, new in replacements:
              n = b.count(old)
              if n != 1:
                  raise SystemExit(f'expected one match, found {n}')
              b = b.replace(old, new, 1)
          p.write_bytes(b)
          PY
      - name: Assert minimal App diff
        run: |
          git -c core.whitespace=cr-at-eol diff --check origin/main -- 03_Implement/frontend/src/App.tsx
          stats=$(git diff --numstat origin/main -- 03_Implement/frontend/src/App.tsx)
          echo "$stats"
          adds=$(echo "$stats" | awk '{print $1}')
          dels=$(echo "$stats" | awk '{print $2}')
          test "$adds" -le 10
          test "$dels" -le 5
      - name: Remove temporary workflow and push cleanup
        run: |
          rm .github/workflows/tmp-clean-merge-apply-diff.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: merge適用修正の改行差分を清掃する'
          git push origin HEAD:test/merge-apply-persistence-e2e-20260903
