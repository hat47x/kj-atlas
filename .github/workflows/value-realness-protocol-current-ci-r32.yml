name: Value realness protocol current CI R32

on:
  push:
    branches:
      - docs/value-realness-protocol-current-ci-20260905

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Merge current main in validation workspace
        run: |
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git fetch origin main
          git merge --no-commit --no-ff origin/main
      - name: Replace retired permanent-workflow claim
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/issues/issue-VALUE-REALNESS-01-third-party-beachhead-validation.md')
          text = path.read_text(encoding='utf-8')
          old = "- `.github/workflows/third-party-value-protocol.yml`\n  - 上記validatorをGitHub Actionsで実行する。"
          new = "- 検証実行\n  - mainへ恒久workflowは置かず、protocol変更時または実参加前preflightで `python 01_Plans/dogfood/validate_third_party_value_protocol.py` を直接、またはbranch限定の一回限り検証から実行する。"
          if old not in text:
              raise SystemExit('stale workflow claim anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate protocol and issue governance
        run: |
          python 01_Plans/dogfood/validate_third_party_value_protocol.py
          python 01_Plans/issues/validate_active_issue_memos.py
          git diff --check
      - name: Commit sync and retire one-shot workflow
        run: |
          git add 01_Plans/issues/issue-VALUE-REALNESS-01-third-party-beachhead-validation.md
          git rm .github/workflows/value-realness-protocol-current-ci-r32.yml
          git commit -m 'docs: VALUE-REALNESS protocolの検証経路を現行化する'
          git push origin HEAD:${GITHUB_REF_NAME}
