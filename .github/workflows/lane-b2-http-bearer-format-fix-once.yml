name: Lane B2 outbound HTTP bearer format contract fix once

on:
  push:
    branches:
      - fix/lane-b2-http-bearer-format-contract-20260908

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch public docs
        run: |
          python - <<'PY'
          from pathlib import Path
          replacements = {
              Path('02_Architecture/runtime_parameter_registry.md'): [
                  ('監査ログHTTP連携用 API key', '監査ログHTTP連携用 API key。非空のcanonical bearer値（空白・制御文字不可）'),
                  ('`external_http` adapter の固定 bearer token', '`external_http` adapter の固定 bearer token。非空のcanonical bearer値（空白・制御文字不可）'),
                  ('binding resolver専用の固定bearer token。DB・監査・diagnosticsへ出力しない', 'binding resolver専用の固定bearer token。非空のcanonical bearer値（空白・制御文字不可）。DB・監査・diagnosticsへ出力しない'),
                  ('capability resolver専用の固定bearer token。DB・監査・diagnosticsへ出力しない', 'capability resolver専用の固定bearer token。非空のcanonical bearer値（空白・制御文字不可）。DB・監査・diagnosticsへ出力しない'),
              ],
              Path('04_Documentation/configuration.md'): [
                  ('監査ログの HTTP 連携用 API key', '監査ログの HTTP 連携用 API key。非空のcanonical bearer値（空白・制御文字不可）'),
                  ('`external_http` adapter の固定 bearer token', '`external_http` adapter の固定 bearer token。非空のcanonical bearer値（空白・制御文字不可）'),
                  ('binding resolver専用bearer token。Git、DB、監査へ保存しない', 'binding resolver専用bearer token。非空のcanonical bearer値（空白・制御文字不可）。Git、DB、監査へ保存しない'),
                  ('capability resolver専用bearer token。Git、DB、監査へ保存しない', 'capability resolver専用bearer token。非空のcanonical bearer値（空白・制御文字不可）。Git、DB、監査へ保存しない'),
              ],
          }
          for path, pairs in replacements.items():
              data = path.read_bytes()
              for old, new in pairs:
                  old_b = old.encode('utf-8')
                  if data.count(old_b) != 1:
                      raise SystemExit(f'expected one patch target in {path}: {old}')
                  data = data.replace(old_b, new.encode('utf-8'), 1)
              path.write_bytes(data)
          PY
      - name: Verify focused contract
        run: python -m unittest 01_Plans.tests.test_http_bearer_format_contract -v
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify docs
        run: python 01_Plans/docs_check.py
      - name: Verify diff scope
        run: |
          test "$(git diff --name-only HEAD | sort)" = "$(printf '%s\n' '02_Architecture/runtime_parameter_registry.md' '04_Documentation/configuration.md' | sort)"
      - name: Commit verified docs
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): outbound HTTP bearer format制約を明示する"
          git push
