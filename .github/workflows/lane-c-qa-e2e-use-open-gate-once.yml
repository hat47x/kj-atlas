name: Lane C QA-E2E-USE-01 Open gate once

on:
  push:
    branches:
      - docs/lane-c-qa-e2e-use-open-gate-20260907

permissions:
  contents: write

jobs:
  normalize-and-verify:
    if: "github.event.head_commit.message == 'ci: verify QA-E2E-USE-01 Open gate once'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize current lifecycle state
        run: python .github/scripts/lane_c_qa_e2e_use_open_gate.py
      - name: Retire one-shot inputs before guards
        run: rm .github/scripts/lane_c_qa_e2e_use_open_gate.py .github/workflows/lane-c-qa-e2e-use-open-gate-once.yml
      - name: Install planning test dependency
        run: python -m pip install pytest
      - name: Planning lifecycle suite
        run: python -m pytest -q 01_Plans/tests
      - name: Active issue and docs guards
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format text | tee /tmp/triage.txt
          grep -F 'QA-E2E-USE-01-realistic-user-journey-expansion [Open/P0]' /tmp/triage.txt
          grep -F 'ready=6' /tmp/triage.txt
          git diff --check
      - name: Commit verified lifecycle normalization
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(qa): QA-E2E-USE-01のOpen gateを現在状態へ同期する'
          git push origin HEAD:docs/lane-c-qa-e2e-use-open-gate-20260907
