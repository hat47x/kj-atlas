name: Temporary lane C dogfood frozen history preflight

on:
  push:
    branches:
      - fix/lane-c-dogfood-frozen-history-preflight-20260904

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-dogfood-frozen-history-preflight-20260904

      - name: Patch frozen-history preflight and tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path('01_Plans/dogfood/validate_dogfood_docs.py')
          text = validator.read_text(encoding='utf-8')

          anchor = '''def git_blob_at(commit: str, path: str) -> tuple[str | None, str | None]:\n'''
          addition = '''def git_commit_available(commit: str) -> tuple[bool, str | None]:\n    """Check whether a preregistered commit is available without fetching it.\n\n    Frozen-source validation is deliberately side-effect free. A caller with a\n    shallow clone must fetch the preregistered commit (or unshallow the clone)\n    before blob identity can be verified.\n    """\n    command = ["git", "-C", str(ROOT), "cat-file", "-e", f"{commit}^{{commit}}"]\n    try:\n        subprocess.run(\n            command,\n            check=True,\n            stdout=subprocess.PIPE,\n            stderr=subprocess.PIPE,\n            text=True,\n        )\n    except FileNotFoundError:\n        return (\n            False,\n            f"cannot verify frozen product commit {commit}: git executable was not found",\n        )\n    except subprocess.CalledProcessError:\n        return (\n            False,\n            f"frozen product commit {commit} is unavailable in local Git history; "\n            "fetch the preregistered commit (or use a non-shallow checkout) "\n            "before running frozen-source validation",\n        )\n    return True, None\n\n\n'''
          if anchor not in text:
              raise SystemExit('git_blob_at anchor not found')
          text = text.replace(anchor, addition + anchor, 1)

          old = 'def validate_product_source_manifest(case_id: str, expected_count: int) -> list[str]:\n'
          new = '''def validate_product_source_manifest(\n    case_id: str,\n    expected_count: int,\n    *,\n    verify_frozen_blobs: bool = True,\n) -> list[str]:\n'''
          if old not in text:
              raise SystemExit('manifest signature anchor not found')
          text = text.replace(old, new, 1)

          old = '        if path_valid and blob_valid:\n            actual_blob, error = git_blob_at(PRODUCT_COMMIT, raw_path)\n'
          new = '        if path_valid and blob_valid and verify_frozen_blobs:\n            actual_blob, error = git_blob_at(PRODUCT_COMMIT, raw_path)\n'
          if old not in text:
              raise SystemExit('blob verification anchor not found')
          text = text.replace(old, new, 1)

          old = '''    all_issues.extend(validate_continuous_index())\n    all_issues.extend(validate_cognitive_tools())\n    for case_id, expected_count in PRODUCT_MANIFEST_SPECS.items():\n        all_issues.extend(validate_product_source_manifest(case_id, expected_count))\n    all_issues.extend(validate_shared_skill_manifest())\n'''
          new = '''    all_issues.extend(validate_continuous_index())\n    all_issues.extend(validate_cognitive_tools())\n\n    frozen_history_available, frozen_history_issue = git_commit_available(PRODUCT_COMMIT)\n    if frozen_history_issue:\n        all_issues.append(frozen_history_issue)\n    for case_id, expected_count in PRODUCT_MANIFEST_SPECS.items():\n        all_issues.extend(\n            validate_product_source_manifest(\n                case_id,\n                expected_count,\n                verify_frozen_blobs=frozen_history_available,\n            )\n        )\n    all_issues.extend(validate_shared_skill_manifest())\n'''
          if old not in text:
              raise SystemExit('main product manifest anchor not found')
          text = text.replace(old, new, 1)
          validator.write_text(text, encoding='utf-8')

          readme = Path('01_Plans/dogfood/README.md')
          text = readme.read_text(encoding='utf-8')
          anchor = '''5. 空白を発見したら言語化し、次のラウンド（R2）の材料とする\n\n## 週次運用（W型サイクル）— 2026-08-11 開始\n'''
          addition = '''5. 空白を発見したら言語化し、次のラウンド（R2）の材料とする\n\n### `validate_dogfood_docs.py` のGit履歴前提\n\n`validate_dogfood_docs.py` は、Case 001〜003で事前登録したproduct sourceを固定commit `2232b3bb26647e5c4a083f55bdbf83c161698649` のblobと照合する。このため、そのcommitがローカルGit object databaseに存在する必要がある。shallow checkoutで実行する場合は、固定commitを明示的にfetchするか、非shallow checkoutを使う。validator自身はnetwork fetchを行わず、固定commitがなければ1件の実行環境エラーとしてfail-closedする。\n\n## 週次運用（W型サイクル）— 2026-08-11 開始\n'''
          if anchor not in text:
              raise SystemExit('README usage anchor not found')
          text = text.replace(anchor, addition, 1)
          readme.write_text(text, encoding='utf-8')
          PY

          cat > 01_Plans/dogfood/test_validate_dogfood_docs.py <<'PY'
          import importlib.util
          import io
          import json
          import subprocess
          import sys
          import unittest
          from pathlib import Path
          from unittest import mock

          MODULE_PATH = Path(__file__).resolve().parent / "validate_dogfood_docs.py"
          SPEC = importlib.util.spec_from_file_location("validate_dogfood_docs", MODULE_PATH)
          MODULE = importlib.util.module_from_spec(SPEC)
          assert SPEC.loader is not None
          sys.modules[SPEC.name] = MODULE
          SPEC.loader.exec_module(MODULE)


          class ValidateDogfoodDocsTest(unittest.TestCase):
              def test_missing_frozen_commit_has_one_actionable_history_diagnostic(self):
                  failure = subprocess.CalledProcessError(
                      128,
                      ["git", "cat-file"],
                      stderr="fatal: Not a valid object name",
                  )
                  with mock.patch.object(MODULE.subprocess, "run", side_effect=failure):
                      available, issue = MODULE.git_commit_available(MODULE.PRODUCT_COMMIT)

                  self.assertFalse(available)
                  self.assertIsNotNone(issue)
                  self.assertIn(MODULE.PRODUCT_COMMIT, issue)
                  self.assertIn("unavailable in local Git history", issue)
                  self.assertIn("fetch", issue)

              def test_manifest_structure_is_checked_without_blob_resolution(self):
                  with mock.patch.object(MODULE, "git_blob_at") as blob_lookup:
                      issues = MODULE.validate_product_source_manifest(
                          "case-001",
                          20,
                          verify_frozen_blobs=False,
                      )

                  self.assertEqual(issues, [])
                  blob_lookup.assert_not_called()

              def test_available_history_keeps_every_registered_blob_check(self):
                  manifest_path = (
                      MODULE.DOGFOOD_DIR
                      / "cognitive-dogfood-case-001-round1-source-manifest.json"
                  )
                  manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                  expected_blobs = {
                      source["path"]: source["blobSha"]
                      for source in manifest["commonSources"]
                  }

                  def lookup(commit, path):
                      self.assertEqual(commit, MODULE.PRODUCT_COMMIT)
                      return expected_blobs[path], None

                  with mock.patch.object(MODULE, "git_blob_at", side_effect=lookup) as blob_lookup:
                      issues = MODULE.validate_product_source_manifest(
                          "case-001",
                          20,
                          verify_frozen_blobs=True,
                      )

                  self.assertEqual(issues, [])
                  self.assertEqual(blob_lookup.call_count, 20)

              def test_main_fails_once_for_missing_history_without_path_noise(self):
                  message = (
                      f"frozen product commit {MODULE.PRODUCT_COMMIT} is unavailable "
                      "in local Git history; fetch it"
                  )
                  stdout = io.StringIO()
                  with mock.patch.object(
                      MODULE,
                      "git_commit_available",
                      return_value=(False, message),
                  ), mock.patch("sys.stdout", stdout):
                      result = MODULE.main()

                  output = stdout.getvalue()
                  self.assertEqual(result, 1)
                  self.assertIn("ISSUES FOUND (1)", output)
                  self.assertIn(message, output)
                  self.assertNotIn("source cannot resolve at frozen commit", output)


          if __name__ == "__main__":
              unittest.main()
          PY

      - name: Verify shallow-clone diagnosis
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans/dogfood/test_validate_dogfood_docs.py

          set +e
          python 01_Plans/dogfood/validate_dogfood_docs.py > /tmp/shallow-dogfood.log 2>&1
          status=$?
          set -e
          cat /tmp/shallow-dogfood.log
          test "$status" -eq 1
          grep -F "ISSUES FOUND (1)" /tmp/shallow-dogfood.log
          grep -F "frozen product commit 2232b3bb26647e5c4a083f55bdbf83c161698649 is unavailable in local Git history" /tmp/shallow-dogfood.log
          if grep -F "source cannot resolve at frozen commit" /tmp/shallow-dogfood.log; then
            echo "per-path noise still present under shallow checkout" >&2
            exit 1
          fi

      - name: Fetch history and verify frozen blobs
        shell: bash
        run: |
          set -euo pipefail
          git fetch --unshallow --no-tags origin
          git cat-file -e '2232b3bb26647e5c4a083f55bdbf83c161698649^{commit}'
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python -m unittest 01_Plans/dogfood/test_validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          git diff --check

      - name: Complete issue and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          issue='01_Plans/issues/issue-DOGFOOD-VERIFY-HISTORY-01-frozen-commit-history-preflight.md'
          done='01_Plans/issues/done/issue-DOGFOOD-VERIFY-HISTORY-01-frozen-commit-history-preflight.md'
          python - <<'PY'
          from pathlib import Path
          import os

          path = Path('01_Plans/issues/issue-DOGFOOD-VERIFY-HISTORY-01-frozen-commit-history-preflight.md')
          text = path.read_text(encoding='utf-8')
          text = text.replace('- Status: In Progress', '- Status: Done', 1)
          text = text.replace('- [ ]', '- [x]')
          text += f'''\n## 対応結果（2026-09-04）\n\n- `validate_dogfood_docs.py` に固定product commitの事前確認を追加した。\n- shallow checkoutでは固定commit不足を1件のactionableな環境エラーとしてfail-closedし、56件のpath欠落へ展開しないことを確認した。\n- manifestの構造検査は履歴不足時も継続し、固定commit取得後はCase 001の20 sourceを含む従来のpath/blob照合を維持した。\n- validator自身はfetchを行わず、READMEへ呼び出し側の履歴前提を明記した。\n- 一回限り検証 run `{os.environ.get('GITHUB_RUN_ID', 'N/A')}` で shallow再現 → `git fetch --unshallow` → 全dogfood検証、unit、active issue validator、docs-check、diff-checkを通過した。\n'''
          path.write_text(text, encoding='utf-8')
          PY
          mkdir -p 01_Plans/issues/done
          mv "$issue" "$done"

          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python -m unittest 01_Plans/dogfood/test_validate_dogfood_docs.py

          rm .github/workflows/lane-c-dogfood-history-preflight-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: frozen source検証のGit履歴前提を明示する'
          git push origin HEAD:fix/lane-c-dogfood-frozen-history-preflight-20260904
