name: R20 one-shot document sync

on:
  push:
    branches:
      - dogfood/r20-merge-method-traceability-20260904

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch current contracts without rewriting history
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path_text: str, old: str, new: str) -> None:
              path = Path(path_text)
              data = path.read_bytes()
              old_b = old.encode("utf-8")
              new_b = new.encode("utf-8")
              count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one target, found {count}")
              path.write_bytes(data.replace(old_b, new_b, 1))

          replace_once(
              "02_Architecture/api.md",
              "  - `suggestions: MergeSuggestion[]` — 統合候補の配列。各要素のAPI契約は `groupId`、2件以上の `cardIds`、`mergedTextDraft`、任意の `rationale`。",
              "  - `suggestions: MergeSuggestion[]` — 統合候補の配列。各要素のAPI契約は `groupId`、2件以上の `cardIds`、`mergedTextDraft`、必須の `mergeMethod`（`near_duplicate` | `kernel_fusion`）、任意の `rationale`。方式欠落・未知値は信頼境界で拒否する。",
          )

          replace_once(
              "02_Architecture/api.md",
              "Responseの外形は従来どおり `SuggestMergesResponse` / `MergeSuggestion` を維持する。現時点では `groupId`、`cardIds`、`mergedTextDraft`、任意の `rationale` であり、統合方法や残差を表す追加フィールドは、実merge適用時の来歴・残差保持を監査した後に判断する。",
              "Responseは `SuggestMergesResponse` / `MergeSuggestion` とし、各候補に `groupId`、`cardIds`、`mergedTextDraft`、`mergeMethod`、任意の `rationale` を持つ。`mergeMethod` は `near_duplicate`（類似カードの整理・04ステップ型）または `kernel_fusion`（意味核の統合・核融合法型）の2値で、promptが選んだ方法を人間レビューと後続decisionへ渡す意味属性である。決定論ローカルfallbackは実装上の性質から `near_duplicate` を付与する。保存済みの旧decisionに方式が無い場合は推測補完しない。元カードとlineageを保持しているため、独立した `residuals` フィールドは現契約の必須要素にしない。",
          )

          replace_once(
              "01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md",
              "採用後の実merge、保存・再読込までの意味保存も別Issue `AI-MERGE-APPLY-01` で完了している。方式追跡性だけが `AI-MERGE-SEMANTICS-01` のP2残差として残る。",
              "採用後の実merge、保存・再読込までの意味保存も別Issue `AI-MERGE-APPLY-01` で完了している。方式追跡性はR19で契約を確定し、R20で `mergeMethod` をprovider提案からDocument decisionまで通した。Stage 5固有の未完は引き続き `check-narrative` のscale境界だけである。",
          )

          replace_once(
              "01_Plans/dogfood/cognitive-dogfood-index.md",
              "- `doc_kj_atlas_dogfood_r18.json`\n  - R18のKJキャンバス。既存testが誤った契約前提を非退行条件として固定し得ること、Done-at-rootの計画legacy差、merge方式の追跡性を別の残差として保持する。\n- `ai-ir-required-semantic-coverage-map-2026-09-03.md`",
              "- `doc_kj_atlas_dogfood_r18.json`\n  - R18のKJキャンバス。既存testが誤った契約前提を非退行条件として固定し得ること、Done-at-rootの計画legacy差、merge方式の追跡性を別の残差として保持する。\n- `cognitive-dogfood-continuous-2026-09-04-r19.md`\n  - R19。promptが04ステップ型／核融合法型を選ばせながら方式をreview契約で失っていたことを分析し、`near_duplicate | kernel_fusion` をproposal・decisionの独立した意味属性として確定した記録。\n- `doc_kj_atlas_dogfood_r19.json`\n  - R19のKJキャンバス。AI理由・人間理由・方式を分離し、新規記録は厳格、旧記録は推測しない境界を保持する。\n- `cognitive-dogfood-continuous-2026-09-04-r20.md`\n  - R20。R19の契約をbackend provider、frontend decoder、決定論fallback、UI、人間の採否、Document decisionへ通し、欠落・未知値・後方互換の回帰契約を追加した記録。\n- `doc_kj_atlas_dogfood_r20.json`\n  - R20のKJキャンバス。方式の意味が利用経路のどこでも落ちないことと、formal Case・第三者価値実証・scale課題を別境界として残すことを示す。\n- `ai-ir-required-semantic-coverage-map-2026-09-03.md`",
          )

      - name: Remove one-shot workflow
        run: rm .github/workflows/r20-one-shot-doc-sync.yml

      - name: Commit synchronized contracts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_Architecture/api.md 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md 01_Plans/dogfood/cognitive-dogfood-index.md .github/workflows/r20-one-shot-doc-sync.yml
          git diff --cached --check
          git commit -m "docs: merge方式の現行契約へ正本を同期する"
          git push origin HEAD:dogfood/r20-merge-method-traceability-20260904
