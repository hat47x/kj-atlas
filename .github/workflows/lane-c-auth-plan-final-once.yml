name: Lane C auth plan final once

on:
  push:
    branches:
      - fix/lane-c-auth-bff-session-proxy-e2e-r2-20260905

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Planning unit tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py

      - name: Documentation contract check
        run: python 01_Plans/docs_check.py

      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json
