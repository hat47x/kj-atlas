name: Temporary lane C fix ADR status triage

on:
  push:
    branches:
      - chore/lane-c-plan-triage-20260904

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/lane-c-plan-triage-20260904
      - name: Patch ADR status normalization and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          triage = Path('01_Plans/triage_actionable_plans.py')
          text = triage.read_text(encoding='utf-8')
          old = '''ADR_ACTIONABLE_STATUSES = {"Accepted", "Proposed"}\nMETA_RE = re.compile'''
          new = '''ADR_ACTIONABLE_STATUSES = {"Accepted", "Proposed"}\nCANONICAL_ADR_STATUSES = ("Accepted", "Proposed", "Superseded", "Deprecated", "Rejected")\nMETA_RE = re.compile'''
          if old not in text:
              raise SystemExit('ADR constant insertion anchor not found')
          text = text.replace(old, new, 1)

          old = '''def normalize_status(raw: str) -> str:\n    for prefix in ("Draft", "Open", "In Progress", "Done", "Blocked", "Ready", "Active"):\n        if raw == prefix or raw.startswith(prefix + " ") or raw.startswith(prefix + "("):\n            return prefix\n    return raw\n'''
          new = '''def normalize_adr_status(raw: str) -> str:\n    """Return the canonical ADR status while preserving free-form annotations in docs.\n\n    ADR metadata historically allows a canonical status followed by a note,\n    using whitespace, ASCII parentheses, or Japanese full-width parentheses.\n    Only those explicit delimiters are accepted so values such as\n    ``AcceptedButPending`` cannot be mistaken for ``Accepted``.\n    """\n    for status in CANONICAL_ADR_STATUSES:\n        if raw == status or any(raw.startswith(status + delimiter) for delimiter in (" ", "(", "（")):\n            return status\n    return raw\n'''
          if old not in text:
              raise SystemExit('normalize_status anchor not found')
          text = text.replace(old, new, 1)
          old = 'status=normalize_status(meta.get("Status", "Unknown")),'
          new = 'status=normalize_adr_status(meta.get("Status", "Unknown")),'
          if old not in text:
              raise SystemExit('parse_adr status call anchor not found')
          text = text.replace(old, new, 1)
          triage.write_text(text, encoding='utf-8')

          tests = Path('01_Plans/tests/test_triage_actionable_plans.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '''    def test_missing_dependency_adr_is_a_triage_error(self):\n'''
          addition = '''    def test_adr_status_normalization_accepts_annotations_but_not_prefix_collisions(self):\n        self.assertEqual(MODULE.normalize_adr_status("Accepted (note)"), "Accepted")\n        self.assertEqual(MODULE.normalize_adr_status("Accepted（注釈）"), "Accepted")\n        self.assertEqual(MODULE.normalize_adr_status("Proposed (note)"), "Proposed")\n        self.assertEqual(MODULE.normalize_adr_status("AcceptedButPending"), "AcceptedButPending")\n\n    def test_annotated_accepted_dependency_adr_does_not_block_issue(self):\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            (root / "adr").mkdir()\n            (root / "issues").mkdir()\n            (root / "issues" / "issue-AAA-01.md").write_text(textwrap.dedent("""\\\n                # Issue: AAA-01\n                - Type: Contract\n                - Status: Open\n                - Source Issue: N/A\n                - Priority: P1\n                - Owner: Maintainer\n                - Expected verification level: `unit`\n\n                ## Dependencies\n                - `ADR-9999-sample.md`\n            """), encoding="utf-8")\n            (root / "adr" / "ADR-9999-sample.md").write_text(textwrap.dedent("""\\\n                # ADR-9999: sample\n                - Status: Accepted（2026-09-04、条件付き採択）\n                - Date: 2026-09-04\n                - Deciders: Maintainer\n            """), encoding="utf-8")\n\n            report = MODULE.collect(root)\n\n        issue = report["actionable_issues"][0]\n        self.assertTrue(issue["ready"])\n        self.assertEqual(issue["blockers"], ())\n\n    def test_annotated_proposed_dependency_adr_still_blocks_issue(self):\n        with tempfile.TemporaryDirectory() as td:\n            root = Path(td)\n            (root / "adr").mkdir()\n            (root / "issues").mkdir()\n            (root / "issues" / "issue-AAA-01.md").write_text(textwrap.dedent("""\\\n                # Issue: AAA-01\n                - Status: Open\n                - Priority: P1\n\n                ## Dependencies\n                - `ADR-9999-sample.md`\n            """), encoding="utf-8")\n            (root / "adr" / "ADR-9999-sample.md").write_text(textwrap.dedent("""\\\n                # ADR-9999: sample\n                - Status: Proposed (review pending)\n                - Date: 2026-09-04\n            """), encoding="utf-8")\n\n            report = MODULE.collect(root)\n\n        issue = report["actionable_issues"][0]\n        self.assertFalse(issue["ready"])\n        self.assertEqual(issue["blockers"], ("ADR-9999:Proposed",))\n\n'''
          if anchor not in text:
              raise SystemExit('test insertion anchor not found')
          text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text, encoding='utf-8')
          PY
      - name: Verify focused and real-repository triage
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans/tests/test_triage_actionable_plans.py
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          target = next(
              item for item in report['actionable_issues']
              if item['backlog_id'] == 'AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path'
          )
          false_accepted = [
              (item['backlog_id'], blocker)
              for item in report['actionable_issues']
              for blocker in item['blockers']
              if ':Accepted' in blocker
          ]
          print(f"AI-IR-PROJECTION ready={target['ready']} blockers={target['blockers']}")
          print(f"accepted_status_blockers={len(false_accepted)}")
          print(f"summary={report['summary']}")
          if not target['ready'] or target['blockers']:
              raise SystemExit('AI-IR-PROJECTION-01 is still falsely blocked')
          if false_accepted:
              raise SystemExit(f'annotated Accepted ADR still used as blocker: {false_accepted}')
          PY
          python 01_Plans/docs_check.py
          git diff --check
      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-fix-adr-status-triage-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: 注釈付きAccepted ADRをtriageで正規化する'
          git push origin HEAD:chore/lane-c-plan-triage-20260904
