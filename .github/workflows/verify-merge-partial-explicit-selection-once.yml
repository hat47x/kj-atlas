name: Verify explicit partial merge selection (one-shot)

on:
  push:
    branches:
      - feat/merge-partial-explicit-selection-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merge-partial-explicit-selection-20260904
          fetch-depth: 0

      - name: Import only the validated partial product delta
        run: |
          git fetch origin plan/ai-merge-partial-contract-20260903
          git checkout origin/plan/ai-merge-partial-contract-20260903 -- \
            03_Implement/frontend/e2e/merge_suggestion_partial_persistence.spec.ts \
            03_Implement/frontend/src/App.tsx \
            03_Implement/frontend/src/domain/merge/decision_audit_events.test.ts \
            03_Implement/frontend/src/domain/merge/decision_audit_events.ts \
            03_Implement/frontend/src/domain/merge_suggestion_apply.test.ts \
            03_Implement/frontend/src/domain/merge_suggestion_apply.ts \
            03_Implement/frontend/src/domain/merge_suggestion_decisions.test.ts \
            03_Implement/frontend/src/domain/merge_suggestion_decisions.ts \
            03_Implement/frontend/src/i18n/locales/en.json \
            03_Implement/frontend/src/i18n/locales/ja.json \
            03_Implement/frontend/src/ui/MergeSuggestionsPanel.test.ts \
            03_Implement/frontend/src/ui/MergeSuggestionsPanel.tsx

      - name: Add reload visibility and current planning contracts
        run: python .github/scripts/assemble_merge_partial_once.py

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Install Chromium
        working-directory: 03_Implement/frontend
        run: npx playwright install --with-deps chromium

      - name: Run merge, client, UI and i18n regressions
        working-directory: 03_Implement/frontend
        run: |
          npm test -- \
            src/domain/merge_suggestion_decisions.test.ts \
            src/domain/merge_suggestion_apply.test.ts \
            src/domain/merge/decision_audit_events.test.ts \
            src/ui/MergeSuggestionsPanel.test.ts \
            src/api/client.test.ts \
            src/domain/merge_candidates.test.ts \
            src/i18n/translate.test.ts \
            src/i18n/key_consistency.test.ts \
            src/i18n/catalog_integrity.test.ts \
            src/i18n/dynamic_key_coverage.test.ts
          npm run typecheck

      - name: Run decision-reload-apply persistence E2E
        working-directory: 03_Implement/frontend
        run: npx playwright test e2e/merge_suggestion_partial_persistence.spec.ts

      - name: Validate planning and issue lifecycle
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format json >/tmp/triage.json
          test -s /tmp/triage.json
          test -e 01_Plans/issues/done/issue-AI-MERGE-PARTIAL-01-define-partial-merge-selection-contract.md
          test ! -e 01_Plans/issues/issue-AI-MERGE-PARTIAL-01-define-partial-merge-selection-contract.md
          test -e 01_Plans/issues/issue-AI-MERGE-METHOD-TRACE-01-track-merge-method-through-decision-audit.md
          grep -F -- 'AI-MERGE-PARTIAL-01' 01_Plans/issues/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          grep -F -- 'AI-MERGE-METHOD-TRACE-01' 01_Plans/issues/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          git -c core.whitespace=cr-at-eol diff --check

      - name: Guard App.tsx against line-ending explosion
        run: |
          stats=$(git diff --numstat origin/main -- 03_Implement/frontend/src/App.tsx)
          echo "$stats"
          added=$(echo "$stats" | awk '{print $1}')
          deleted=$(echo "$stats" | awk '{print $2}')
          test "$added" -le 15
          test "$deleted" -le 10

      - name: Remove one-shot files and push validated product delta
        run: |
          rm .github/workflows/verify-merge-partial-explicit-selection-once.yml
          rm .github/scripts/assemble_merge_partial_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'merge: partialの明示選択を判断から再読込まで固定する'
          git push origin HEAD:feat/merge-partial-explicit-selection-20260904
