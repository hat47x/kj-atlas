name: lane-b-r45-line-ending-cleanup-once

on:
  push:
    branches:
      - lane-b/deepseek-v4-migration

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/deepseek-v4-migration
      - name: Restore configuration CRLF and reapply intended rows
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:04_Documentation/configuration.md > /tmp/configuration.md
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/configuration.md')
          data = p.read_bytes()
          assert b'\r\n' in data
          old = (
              b'| `KJ_ATLAS_DEEPSEEK_MODEL` | `deepseek-chat` | DeepSeek API '
              b'\xe3\x81\xab\xe6\xb8\xa1\xe3\x81\x99model ID |\r\n'
          )
          new = (
              b'| `KJ_ATLAS_DEEPSEEK_MODEL` | `deepseek-v4-flash` | DeepSeek API '
              b'\xe3\x81\xab\xe6\xb8\xa1\xe3\x81\x99model ID |\r\n'
              b'| `KJ_ATLAS_DEEPSEEK_THINKING_MODE` | `disabled` | DeepSeek V4 thinking mode'
              b'\xef\xbc\x88`disabled` / `enabled`\xef\xbc\x89\xe3\x80\x82\xe6\x97\xa7\xe6\x97\xa2\xe5\xae\x9a\xe3\x81\x91\xe3\x81\xaenon-thinking'
              b'\xe6\x8c\x99\xe5\x8b\x95\xe3\x82\x92\xe7\xb6\xad\xe6\x8c\x81\xe3\x81\x99\xe3\x82\x8b\xe3\x81\x9f\xe3\x82\x81\xe6\x97\xa2\xe5\xae\x9a\xe3\x81\xafdisabled |\r\n'
          )
          assert data.count(old) == 1
          data = data.replace(old, new)
          Path('04_Documentation/configuration.md').write_bytes(data)
          PY
      - name: Verify minimal diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --numstat -- 04_Documentation/configuration.md)" = $'2\t1\t04_Documentation/configuration.md'
          python - <<'PY'
          from pathlib import Path
          data = Path('04_Documentation/configuration.md').read_bytes()
          assert b'\r\n' in data
          assert data.count(b'\n') == data.count(b'\r\n')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-b-r45-line-ending-cleanup-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(docs): preserve configuration CRLF in R45'
          git push origin HEAD:lane-b/deepseek-v4-migration
