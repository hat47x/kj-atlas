name: final-information-network-contract-once

on:
  push:
    branches:
      - architecture/final-information-network-contract-20260912

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run formal projection and D0 tests
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m unittest -v
      - name: Compile research Python
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m py_compile *.py
      - name: Reject legacy executable imports
        run: |
          ! grep -R "context_projection_r0\|compile_projection_request\|compiledContextQuery" 01_Plans/research/qualitative_query_d0
      - name: Documentation checks
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
