name: validate check-narrative token baseline once

on:
  push:
    branches:
      - measure/check-narrative-token-baseline-20260904

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: measure/check-narrative-token-baseline-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run token measurement regression
        working-directory: 03_Implement/backend
        run: pytest tests/test_ai_route_provider_token_measurement.py -q

      - name: Run dry-run measurement without provider access
        working-directory: 03_Implement/backend
        run: |
          python scripts/measure_ai_route_provider_tokens.py \
            --provider named-test-provider \
            --model named-model > /tmp/check-narrative-token-baseline.json
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path('/tmp/check-narrative-token-baseline.json').read_text())
          assert report['executed'] is False
          assert report['measurement_complete'] is False
          assert set(report['routes']) == {
              'suggest-layout',
              'generate-narrative',
              'check-narrative',
          }
          check = report['routes']['check-narrative']
          assert check['status'] == 'dry-run'
          assert check['prompt']['unicode_chars'] > 0
          assert check['prompt']['utf8_bytes'] > 0
          assert check['ir']['cards'] == 0
          assert check['ir']['truncation'] is None
          print(json.dumps({
              name: row['prompt']
              for name, row in report['routes'].items()
          }, ensure_ascii=False, indent=2))
          PY

      - name: Run static checks
        working-directory: 03_Implement/backend
        run: |
          ruff check scripts/measure_ai_route_provider_tokens.py tests/test_ai_route_provider_token_measurement.py
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
