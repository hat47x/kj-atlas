name: Lane B2 fix OAuth format diff-scope check once

on:
  push:
    branches:
      - fix/lane-b2-oauth-client-format-contract-20260908

permissions:
  contents: write

jobs:
  fix-and-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix committed-workflow diff expectation and retire helper
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/lane-b2-oauth-client-format-fix-once.yml')
          text = path.read_text(encoding='utf-8')
          target = "              '.github/workflows/lane-b2-oauth-client-format-fix-once.yml',\n"
          if text.count(target) != 1:
              raise SystemExit('diff-scope target drifted')
          path.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/lane-b2-oauth-client-format-fix-once.yml
          git rm .github/workflows/lane-b2-fix-diff-scope-once.yml
          git commit -m "ci(b2): correct OAuth format diff-scope expectation"
          git push
