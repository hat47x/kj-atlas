name: OPS SaaS docs finalize once

on:
  push:
    branches:
      - test/ops-saas-two-app-postgres-20260904

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ops-saas-two-app-postgres-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 最新mainを取り込む
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: 運用文書とIssueの実証結果を同期する
        run: python .github/scripts/ops_saas_docs_finalize.py
      - name: 文書とIssue契約を検証する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          git -c core.whitespace=cr-at-eol diff --check
      - name: 一時ファイルを削除して同期結果を保存する
        run: |
          rm -f .github/workflows/ops-saas-docs-finalize-once.yml
          rm -f .github/scripts/ops_saas_docs_finalize.py
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'docs: SaaS複数app運用を実証結果へ同期する'
          git push origin HEAD:test/ops-saas-two-app-postgres-20260904
