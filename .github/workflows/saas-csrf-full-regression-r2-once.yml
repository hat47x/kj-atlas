name: SaaS session CSRF full regression r2 once

on:
  push:
    branches:
      - fix/saas-session-csrf-binding-20260904
    paths:
      - .github/workflows/saas-csrf-full-regression-r2-once.yml

permissions:
  contents: write

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/saas-session-csrf-binding-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Install backend
        run: python -m pip install -e '03_Implement/backend[test]'
      - name: Run backend full default suite
        working-directory: 03_Implement/backend
        run: pytest -q
      - name: Install frontend
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Run frontend full unit suite and typecheck
        working-directory: 03_Implement/frontend
        run: |
          npm test
          npm run typecheck
      - name: Revalidate repository contracts
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          git -c core.whitespace=cr-at-eol diff --check
      - name: Self-clean and push verified head
        run: |
          rm .github/workflows/saas-csrf-full-regression-once.yml
          rm .github/workflows/saas-csrf-full-regression-r2-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'ci: CSRF全体回帰one-shotを削除する'
          git push origin HEAD:fix/saas-session-csrf-binding-20260904
