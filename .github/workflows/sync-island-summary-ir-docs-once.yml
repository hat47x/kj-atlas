name: 表札候補IR文書同期（一回限り）

on:
  push:
    branches:
      - feat/island-summary-ir-context-20260903

permissions:
  contents: write

jobs:
  sync:
    name: IssueとAPI契約を同期する
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: feat/island-summary-ir-context-20260903
          fetch-depth: 0

      - name: 正本文書を同期する
        run: python .github/scripts/sync_island_summary_ir_docs_once.py

      - name: 計画文書とAPI文書を検査する
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --check

      - name: 文書変更をコミットして一時ファイルを削除する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sync-island-summary-ir-docs-once.yml
          git rm .github/scripts/sync_island_summary_ir_docs_once.py
          git add 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md
          git add 01_Plans/issues/issue-AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path.md
          git add 02_Architecture/api.md
          git commit -m "docs: 表札候補IR移行結果を正本へ同期する"
          git push origin HEAD:feat/island-summary-ir-context-20260903
