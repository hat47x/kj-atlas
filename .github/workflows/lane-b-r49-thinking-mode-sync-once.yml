name: lane-b-r49-thinking-mode-sync-once

on:
  push:
    branches:
      - lane-b/ai-ir-scale-r49-thinking-mode-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/ai-ir-scale-r49-thinking-mode-sync
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync operational measurement instructions to R48
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md')
          text = path.read_text()

          old = '''- [x] 300カード規模のroute-required regressionをテストスイートへ固定する。R22以降branch-only GitHub Actionsで関連回帰を繰り返し実行し、R43 run `33963862577` ではR23〜R43関連を含む81 test・ruff・`git diff --check` が成功した。provider実測reportについてもR32/R33/R35/R37でroute/task/provider/model/usage、canonical user prompt fingerprint、primary call provenanceに加え、DeepSeekでは実transportが送るsystem+user message content fingerprintまでfail-closed検証を固定し、R39ではmeasurementの `max_tokens=1` と現行production output reserveを分離したcontext hard-fit計算、R41ではcontext-window値と資料source provenanceの対、R43ではそのproduction output reserve前提と実route call siteの一致を回帰で固定した。恒久workflowの有無とは分けて記録する。'''
          new = '''- [x] 300カード規模のroute-required regressionをテストスイートへ固定する。R22以降branch-only GitHub Actionsで関連回帰を繰り返し実行し、R48 run `33997380006` ではprovider/measurement/analyzerとR23〜R43近接回帰を含む129 test、compile check、fatal/static lint、`git diff --check` が成功した。provider実測reportについてもR32/R33/R35/R37でroute/task/provider/model/usage、canonical user prompt fingerprint、primary call provenanceに加え、DeepSeekでは実transportが送るsystem+user message content fingerprintまでfail-closed検証を固定し、R39ではmeasurementの `max_tokens=1` と現行production output reserveを分離したcontext hard-fit計算、R41ではcontext-window値と資料source provenanceの対、R43ではそのproduction output reserve前提と実route call siteの一致、R48ではDeepSeek V4の `thinking.type` request-mode provenanceを回帰で固定した。恒久workflowの有無とは分けて記録する。'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''  - 明示的に選んだnamed model/providerで1回以上の代表規模requestを行い、provider-reported usage、canonical user prompt SHA-256、primary call provenanceを含むmeasurement reportを保存する。DeepSeekの場合はさらに、実transportと同じbuilderから得たsystem+user message contentのprovider-input SHA-256を保存する。保存reportは `scripts/analyze_ai_route_provider_measurement.py` を通し、route/task/provider/model/usage/user-prompt fingerprint、transport/requested_at/trace_id、fallbackなし、primary execution pathに加え、DeepSeekではprovider-input fingerprintが現在のtransport inputと一致した場合だけ方式比較の入力にする。named model/providerの文書化されたcontext-window値を確認できる場合は `--context-window-tokens` と、その値を採ったprovider/model資料URL・文書ID等の `--context-window-source` を対で明示し、provider-reported input usageに現行production output reserveを加えた最低context必要量がhard-fitするかを別途確認する。sourceは監査用provenanceでありanalyzerが真正性・最新性を自動保証するものではない。hard-fitはR21の「十分な余裕」そのものとは扱わない。'''
          new = '''  - 明示的に選んだnamed model/providerで1回以上の代表規模requestを行い、provider-reported usage、canonical user prompt SHA-256、primary call provenanceを含むmeasurement reportを保存する。DeepSeekの場合はさらに、実transportと同じbuilderから得たsystem+user message contentのprovider-input SHA-256と、実requestの `thinking.type` をprovider-generation provenanceとして保存する。production既定と比較するDeepSeek V4実測では `KJ_ATLAS_DEEPSEEK_THINKING_MODE=disabled` と CLIの `--deepseek-thinking-mode disabled` を一致させ、R48のpreflightを通った場合だけ外部送信する。保存reportは `scripts/analyze_ai_route_provider_measurement.py` を通し、route/task/provider/model/usage/user-prompt fingerprint、transport/requested_at/trace_id、fallbackなし、primary execution pathに加え、DeepSeekではprovider-input fingerprintと `thinking.type` が現在のtransport/期待modeと一致した場合だけ方式比較の入力にする。named model/providerの文書化されたcontext-window値を確認できる場合は `--context-window-tokens` と、その値を採ったprovider/model資料URL・文書ID等の `--context-window-source` を対で明示し、provider-reported input usageに現行production output reserveを加えた最低context必要量がhard-fitするかを別途確認する。sourceは監査用provenanceでありanalyzerが真正性・最新性を自動保証するものではない。hard-fitはR21の「十分な余裕」そのものとは扱わない。'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          old = '''1. **named provider/modelの実入力tokenを測り、保存reportをR32/R33/R35/R37/R39/R41 analyzerへ通す。** R37まで拡張したR20ハーネスを使う。既定はgroups/layoutのcurrent/Bとnarrative/checkの6比較、groups A2も測る場合だけ `--include-groups-a2` で1件追加、layout Cも測る場合だけ `--include-layout-c` で31件追加する。layout A2はR29でroute-Bとrendered promptが完全一致したため、同じprovider/model/task/max_tokens条件では重複requestを送らず `suggest-layout-route-b` のusageを同一prompt観測として扱う。reportにはexact UTF-8 user promptのSHA-256とprimary provider call provenanceを含め、DeepSeekでは実transportが送るsystem+user message contentのSHA-256も含める。現在のcanonical builder/transport inputと一致しないstale/legacy report、fallback/non-primary call、trace欠落reportは比較根拠へ使わない。'''
          new = '''1. **named provider/modelの実入力tokenを測り、保存reportをR32/R33/R35/R37/R39/R41/R48 analyzerへ通す。** R48まで拡張したR20ハーネスを使う。既定はgroups/layoutのcurrent/Bとnarrative/checkの6比較、groups A2も測る場合だけ `--include-groups-a2` で1件追加、layout Cも測る場合だけ `--include-layout-c` で31件追加する。layout A2はR29でroute-Bとrendered promptが完全一致したため、同じprovider/model/task/max_tokens条件では重複requestを送らず `suggest-layout-route-b` のusageを同一prompt観測として扱う。DeepSeek V4をproduction既定と比較する場合は、環境の `KJ_ATLAS_DEEPSEEK_THINKING_MODE=disabled` に加えて `--deepseek-thinking-mode disabled` を明示する。reportにはexact UTF-8 user promptのSHA-256とprimary provider call provenanceを含め、DeepSeekでは実transportが送るsystem+user message contentのSHA-256と実 `thinking.type` も含める。現在のcanonical builder/transport input/期待thinking modeと一致しないstale/legacy report、fallback/non-primary call、trace欠落reportは比較根拠へ使わない。'''
          assert text.count(old) == 1
          text = text.replace(old, new, 1)

          heading = '## R49 — R48 thinking-mode実測手順をIssue前半へ同期'
          assert heading not in text
          text = text.rstrip() + f'''\n\n\n{heading}\n\nR48でDeepSeek V4の `thinking.type` をmeasurement reportのrequest-mode provenanceへ追加した一方、Issue前半の「実使用/外部依存確認」と「次の判断順序」はR37時点のprovider-input fingerprintまでしか記載しておらず、外部実測時に新必須引数を落とす余地が残っていた。R49ではproduction既定と比較するDeepSeek V4実測を `KJ_ATLAS_DEEPSEEK_THINKING_MODE=disabled` + `--deepseek-thinking-mode disabled` と明示し、保存report/analyzerのgeneration-mode検証まで前半手順へ同期した。\n\n併せて、checked済みroute-required regressionの証拠行をR43の81 testからR48 run `33997380006` の129 testへ更新した。未完了ACは変更せず、外部provider実測、provider-reported token取得、A2/B/C採択、production cap/route、十分な余裕policyは変更しない。\n'''
          path.write_text(text.rstrip() + '\n')
          PY
      - name: Validate R49 docs sync
        shell: bash
        run: |
          set -euo pipefail
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
          python - <<'PY'
          from pathlib import Path
          text = Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md').read_text()
          before_history = text.split('## R49 — R48 thinking-mode実測手順をIssue前半へ同期', 1)[0]
          history = text.split('## R49 — R48 thinking-mode実測手順をIssue前半へ同期', 1)[1]
          assert before_history.count('--deepseek-thinking-mode disabled') == 2
          assert history.count('--deepseek-thinking-mode disabled') == 1
          assert 'R32/R33/R35/R37/R39/R41/R48 analyzer' in before_history
          assert 'provider-generation provenance' in before_history
          assert 'R48 run `33997380006`' in before_history
          PY
          git diff --check
      - name: Commit sync and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-b-r49-thinking-mode-sync-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): sync DeepSeek thinking-mode measurement procedure'
          git push origin HEAD:lane-b/ai-ir-scale-r49-thinking-mode-sync
