name: Temporary merge lineage verification

on:
  push:
    branches:
      - verify/ai-merge-apply-lineage-20260903-r18

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification head
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Run merge lineage regressions
        working-directory: 03_Implement/frontend
        run: >-
          npx vitest run
          src/domain/representative_merge.test.ts
          src/domain/merge_traceability.test.ts
          src/domain/merge_suggestion_decisions.test.ts
          src/domain/merge_decision_audit.test.ts
      - name: Typecheck frontend
        working-directory: 03_Implement/frontend
        run: npm run typecheck
      - name: Run full frontend unit suite
        working-directory: 03_Implement/frontend
        run: npm test
