name: research-d0-qualitative-query

on:
  push:
    branches:
      - research/qualitative-query-d0-20260912

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run D0 research tests
        working-directory: 01_Plans/research/qualitative_query_d0
        run: python -m unittest -v
