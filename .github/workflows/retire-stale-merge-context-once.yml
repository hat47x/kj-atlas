name: Retire stale merge context one-shot

on:
  push:
    branches:
      - fix/retire-stale-merge-suggestion-context-20260905

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Confirm retired module has no tracked references
        run: |
          if git grep -n 'merge_suggestion_context' -- ':!.github/workflows/retire-stale-merge-context-once.yml'; then
            echo 'stale merge_suggestion_context reference remains' >&2
            exit 1
          fi

      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'

      - name: Merge-related backend regression
        working-directory: 03_Implement/backend
        run: pytest -q -k 'merge'

      - name: Full backend test suite
        working-directory: 03_Implement/backend
        run: pytest -q

      - name: Documentation checks
        run: python 01_Plans/docs_check.py

      - name: Diff check
        run: git diff --check origin/main...HEAD

      - name: Retire one-shot workflow
        if: success()
        run: |
          rm .github/workflows/retire-stale-merge-context-once.yml
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add .github/workflows/retire-stale-merge-context-once.yml
          git commit -m 'chore: retire stale merge context validator'
          git push origin HEAD:${GITHUB_REF_NAME}
