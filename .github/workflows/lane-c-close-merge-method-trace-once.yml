name: Temporary lane C close merge method trace

on:
  push:
    branches:
      - docs/lane-c-close-merge-method-trace-20260904

permissions:
  contents: write

jobs:
  verify-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/lane-c-close-merge-method-trace-20260904
          fetch-depth: 0

      - name: Verify planning contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json
          cat /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/triage.json').read_text(encoding='utf-8'))
          if report.get('errors'):
              raise SystemExit(f"triage errors remain: {report['errors']}")
          if report['summary']['active_issue_count'] != 50:
              raise SystemExit(f"unexpected active issue count: {report['summary']['active_issue_count']}")
          PY
          git diff --check

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-close-merge-method-trace-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: merge方式追跡完了検証workflowを削除する"
          git push origin HEAD:docs/lane-c-close-merge-method-trace-20260904
