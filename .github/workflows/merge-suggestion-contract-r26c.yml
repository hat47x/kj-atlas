name: Merge suggestion contract final R26c

on:
  push:
    branches:
      - fix/merge-suggestion-fixture-contract-drift-20260905

permissions:
  contents: write

jobs:
  validate-current-main:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -e './03_Implement/backend[test]'
      - name: Merge suggestion regression
        run: pytest -q 03_Implement/backend/tests/test_ai_merge_suggestion_context.py
      - name: Full backend suite
        working-directory: 03_Implement/backend
        run: pytest -q
      - name: Documentation checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/issues/validate_active_issue_memos.py
      - name: Ruff changed test
        run: python -m ruff check 03_Implement/backend/tests/test_ai_merge_suggestion_context.py
      - name: Diff check
        run: git diff --check origin/main...HEAD -- . ':!.github/workflows/merge-suggestion-contract-r26c.yml'
      - name: Retire one-shot workflow
        if: success()
        run: |
          rm .github/workflows/merge-suggestion-contract-r26c.yml
          git config user.name 'kj-atlas-validation-bot'
          git config user.email 'kj-atlas-validation-bot@users.noreply.github.com'
          git add .github/workflows/merge-suggestion-contract-r26c.yml
          git commit -m 'chore: retire R26c merge suggestion validator'
          git push origin HEAD:${GITHUB_REF_NAME}
