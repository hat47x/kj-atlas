name: lane-b-ai-route-closeout-once

on:
  push:
    branches:
      - docs/lane-b-ai-route-01-closeout-20260906

permissions:
  contents: write

jobs:
  closeout-verify-cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/lane-b-ai-route-01-closeout-20260906
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply AI-ROUTE-01 closeout
        run: python .github/scripts/lane_b_ai_route_closeout.py
      - name: Verify lifecycle and documentation contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          import sys
          sys.path.insert(0, str(Path('01_Plans').resolve()))
          from docs_check import run_docs_check
          result = run_docs_check(Path('.'), run_tests=False)
          if result.errors:
              print('docs contract failures:')
              for error in result.errors:
                  print(f'- {error}')
              raise SystemExit(1)
          print(f'docs contracts passed: active_memos={result.active_count}, tracked_markdown={result.markdown_count}')
          PY
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          test -f 01_Plans/issues/done/issue-AI-ROUTE-01-multi-model-routing-and-final-judgment-boundary.md
          test ! -f 01_Plans/issues/issue-AI-ROUTE-01-multi-model-routing-and-final-judgment-boundary.md
          git diff --check
      - name: Commit verified closeout and remove one-shot files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/scripts/lane_b_ai_route_closeout.py
          git rm .github/workflows/lane-b-ai-route-closeout-once.yml
          git add -A
          git commit -m "docs(ai): close AI-ROUTE-01 after MMR-05 merge"
          git push origin HEAD:docs/lane-b-ai-route-01-closeout-20260906
