name: OPS SaaS AC6 final main once

on:
  push:
    branches:
      - test/ops-saas-ac6-failclosed-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ops-saas-ac6-failclosed-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Merge latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: Verify frontend on clean main baseline
        working-directory: 03_Implement/frontend
        run: |
          npm ci
          npm run typecheck
          npx vitest run src/api/client_tenant_switch_no_retry.test.ts src/api/client.test.ts
      - name: Validate completed issue move
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          test ! -e 01_Plans/issues/issue-OPS-SAAS-SCALE-01-in-process-state-blocks-horizontal-scaling.md
          grep -q -- '- Status: Done' 01_Plans/issues/done/issue-OPS-SAAS-SCALE-01-in-process-state-blocks-horizontal-scaling.md
          grep -q -- '- \[x\] AC-6:' 01_Plans/issues/done/issue-OPS-SAAS-SCALE-01-in-process-state-blocks-horizontal-scaling.md
          git -c core.whitespace=cr-at-eol diff --check origin/main...HEAD
      - name: Remove one-shot workflow and save merged main
        run: |
          rm -f .github/workflows/ops-saas-ac6-final-main-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'ci: OPS SaaS AC-6最終検証workflowを削除する'
          git push origin HEAD:test/ops-saas-ac6-failclosed-20260904
