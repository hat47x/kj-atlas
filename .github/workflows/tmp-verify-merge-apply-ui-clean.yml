name: Temporary clean merge apply UI verification

on:
  push:
    branches:
      - feat/merge-apply-ui-clean-20260903
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merge-apply-ui-clean-20260903
          fetch-depth: 0
      - name: Apply clean UI patch
        run: python .github/scripts/apply_merge_apply_ui_clean_once.py
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Merge apply regressions
        working-directory: 03_Implement/frontend
        run: |
          npx vitest run src/domain/merge_suggestion_apply.test.ts src/domain/representative_merge.test.ts src/domain/merge_traceability.test.ts src/domain/merge_suggestion_decisions.test.ts src/ui/MergeSuggestionsPanel.test.ts
          npm run typecheck
          npm run test:i18n
      - name: Planning document checks
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage.txt
          test -s /tmp/triage.txt
          git -c core.whitespace=cr-at-eol diff --check
      - name: Diff size guard
        run: |
          git diff --numstat origin/main -- 03_Implement/frontend/src/App.tsx 03_Implement/frontend/src/ui/MergeSuggestionsPanel.test.ts
          app_lines=$(git diff --numstat origin/main -- 03_Implement/frontend/src/App.tsx | awk '{print $1+$2}')
          test "${app_lines:-0}" -lt 200
      - name: Commit validated product changes
        run: |
          rm .github/workflows/tmp-verify-merge-apply-ui-clean.yml
          rm .github/scripts/apply_merge_apply_ui_clean_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: 記録済みacceptの明示適用UIを追加する'
          git push origin HEAD:feat/merge-apply-ui-clean-20260903
