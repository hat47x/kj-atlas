name: Lane C SaaS tenant consumer matrix sync once

on:
  push:
    branches:
      - docs/lane-c-saas-tenant-consumer-matrix-sync-20260905

permissions:
  contents: write

jobs:
  verify-and-sync:
    if: "github.event.head_commit.message == 'chore: SAAS tenant consumer matrix同期workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Backend same-docId tenant matrix
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e '03_Implement/backend[test]'
          cd 03_Implement/backend
          pytest -q tests/test_saas_e2e_tenant_isolation.py

      - name: MCP SaaS fail-fast boundary
        shell: bash
        run: |
          set -euo pipefail
          cd 03_Implement/mcp
          npm ci
          npm test -- --run src/document_client.test.ts
          npm run typecheck

      - name: Frontend tenant generation guard
        shell: bash
        run: |
          set -euo pipefail
          cd 03_Implement/frontend
          npm ci
          npm test -- --run src/session/tenant_session_generation.test.ts src/ui/ux_operability_regression.test.ts
          npm run typecheck

      - name: Install Chromium
        shell: bash
        run: |
          cd 03_Implement/frontend
          npx playwright install --with-deps chromium

      - name: Real browser SaaS tenant lifecycle matrix
        shell: bash
        env:
          KJ_ATLAS_E2E_SAAS: '1'
        run: |
          set -euo pipefail
          cd 03_Implement/frontend
          npx playwright test --config=playwright.saas.config.ts

      - name: Synchronize SAAS-TENANT-01 ledger
        run: python .github/scripts/lane_c_sync_saas_tenant_consumer_matrix_once.py

      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
      - name: Planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py
      - name: Documentation contract check
        run: python 01_Plans/docs_check.py
      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json
      - name: Diff check
        run: git diff --check

      - name: Commit verified ledger synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add -A
          git commit -m 'docs: SAAS-TENANT-01 consumer matrixを現行境界へ同期する'
          git push origin HEAD
