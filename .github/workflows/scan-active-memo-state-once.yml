name: Temporary merge client contract fix

on:
  push:
    branches:
      - dogfood/r18-active-memo-state-drift-20260904

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dogfood/r18-active-memo-state-drift-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - name: Apply contract separation
        run: python .github/scripts/fix_merge_client_contract_once.py
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Run focused frontend regressions
        working-directory: 03_Implement/frontend
        run: npm test -- src/api/client.test.ts src/domain/merge_candidates.test.ts
      - name: Typecheck frontend
        working-directory: 03_Implement/frontend
        run: npm run typecheck
      - name: Run planning checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          git diff --check
      - name: Record resolved issue
        run: python .github/scripts/record_merge_client_contract_issue_once.py
      - name: Commit verified fix and remove one-shot helpers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/fix_merge_client_contract_once.py
          rm .github/scripts/record_merge_client_contract_issue_once.py
          rm .github/workflows/scan-active-memo-state-once.yml
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align remote merge suggestion client contract'
          git push origin HEAD:dogfood/r18-active-memo-state-drift-20260904
