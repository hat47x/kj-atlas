name: Temporary merge contract scan

on:
  push:
    branches:
      - dogfood/r18-active-memo-state-drift-20260904

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Locate merge suggestion contract surfaces
        shell: bash
        run: |
          echo '=== MergeSuggestion / mergedTextDraft references ==='
          git grep -n -E 'MergeSuggestion|mergedTextDraft|merge_suggestions|mergeSuggestions' -- \
            '03_Implement/backend/**' '03_Implement/frontend/**' '02_Architecture/**' \
            | head -n 400
