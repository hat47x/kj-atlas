name: 反対視点IR必須本文境界の一回限り同期

on:
  push:
    branches:
      - feat/opposing-viewpoint-ir-context-20260903

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: 作業ブランチを取得する
        uses: actions/checkout@v4
        with:
          ref: feat/opposing-viewpoint-ir-context-20260903
          fetch-depth: 0

      - name: 必須本文境界を正本文書へ同期する
        run: python .github/scripts/sync_opposing_required_text_once.py

      - name: 計画文書と差分を検査する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text >/tmp/triage-opposing-required-text.txt
          test -s /tmp/triage-opposing-required-text.txt
          git diff --check
          grep -F 'required_text_truncated' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md
          grep -F '1470 passed / 39 skipped / 12 deselected' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md
          grep -F 'required_text_truncated' 01_Plans/issues/issue-AI-IR-PROJECTION-01-llm-input-ir-as-ai-input-path.md
          grep -F 'required_text_truncated' 02_Architecture/api.md

      - name: 一時ファイルを除去して同期結果を確定する
        run: |
          rm .github/workflows/sync-opposing-required-text-once.yml
          rm .github/scripts/sync_opposing_required_text_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: 反対視点IRの必須本文境界を正本へ同期する'
          git fetch origin feat/opposing-viewpoint-ir-context-20260903
          git rebase origin/feat/opposing-viewpoint-ir-context-20260903
          git push origin HEAD:feat/opposing-viewpoint-ir-context-20260903
