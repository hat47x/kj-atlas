name: R19 merge method traceability validation (one-shot)

on:
  push:
    branches:
      - feat/merge-method-traceability-r19-20260904
    paths:
      - .github/workflows/merge-method-traceability-r19-once.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: feat/merge-method-traceability-r19-20260904
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Align one-shot script with current types.ts layout
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/apply_merge_method_r19_once.py')
          text = path.read_text(encoding='utf-8')
          old = '''replace_once(
              "03_Implement/frontend/src/domain/types.ts",
              'import type { InquiryBundleV1 } from "./inquiry_bundle";\\n',
              'import type { InquiryBundleV1 } from "./inquiry_bundle";\\n'
              'import type { MergeMethod } from "./merge_method";\\n',
          )'''
          new = '''replace_once(
              "03_Implement/frontend/src/domain/types.ts",
              'export type Transform = {\\n',
              'import type { MergeMethod } from "./merge_method";\\n\\nexport type Transform = {\\n',
          )'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale types.ts import patch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply R19 mergeMethod changes
        run: python .github/scripts/apply_merge_method_r19_once.py

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run backend merge regressions
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            src/kj_atlas_api/models.py \
            src/kj_atlas_api/routes/ai.py \
            tests/test_ai_merge_semantics.py \
            tests/test_ai_merge_ir.py
          python -m pytest \
            tests/test_ai_merge_semantics.py \
            tests/test_ai_merge_ir.py \
            tests/test_ai_llm_input_ir_coverage.py \
            -q

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Run frontend merge and contract regressions
        working-directory: 03_Implement/frontend
        run: |
          npx vitest run \
            src/api/client.test.ts \
            src/domain/merge_candidates.test.ts \
            src/domain/merge_suggestion_decisions.test.ts \
            src/domain/merge_suggestion_apply.test.ts \
            src/ui/MergeSuggestionsPanel.test.ts \
            src/i18n/key_consistency.test.ts \
            src/i18n/catalog_integrity.test.ts
          npm run typecheck

      - name: Run merge save/reload E2E
        working-directory: 03_Implement/frontend
        run: |
          npx playwright install --with-deps chromium
          npx playwright test e2e/merge_suggestion_apply_persistence.spec.ts

      - name: Verify R19 scope boundaries
        run: |
          grep -R 'mergeMethod' \
            03_Implement/backend/src/kj_atlas_api/models.py \
            03_Implement/backend/src/kj_atlas_api/routes/ai.py \
            03_Implement/frontend/src/api/client.ts \
            03_Implement/frontend/src/domain/merge_candidates.ts \
            03_Implement/frontend/src/domain/merge_suggestion_decisions.ts \
            03_Implement/frontend/src/App.tsx \
            03_Implement/frontend/src/ui/MergeSuggestionsPanel.tsx
          ! grep -q 'mergeMethod' 03_Implement/frontend/src/domain/merge/decision_audit_events.ts
          ! git diff --name-only | grep -E 'merge_suggestion_partial|AI-MERGE-PARTIAL'

      - name: Run planning and docs checks
        run: |
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/triage_actionable_plans.py --format json >/tmp/triage.json
          test -s /tmp/triage.json
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit verified implementation and remove one-shot files
        run: |
          git rm .github/scripts/apply_merge_method_r19_once.py
          git rm .github/workflows/merge-method-traceability-r19-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'feat: merge方式を判断記録まで追跡する'
          git push origin HEAD:feat/merge-method-traceability-r19-20260904
