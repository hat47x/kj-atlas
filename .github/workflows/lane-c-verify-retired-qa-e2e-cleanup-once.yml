name: Lane C verify retired QA E2E cleanup once

on:
  push:
    branches:
      - lane-c/remove-retired-qa-e2e-saas-one-shot-20260906

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'chore: verify retired QA E2E one-shot cleanup'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify planning and docs contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format json
          python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong
          git diff --check
      - name: Remove one-shot verification workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          rm .github/workflows/lane-c-verify-retired-qa-e2e-cleanup-once.yml
          git add -A
          git commit -m 'chore: remove Lane C cleanup verification workflow'
          git push origin HEAD
