name: Lane C verify retired QA E2E cleanup once

on:
  push:
    branches:
      - lane-c/remove-retired-qa-e2e-saas-one-shot-20260906

permissions:
  contents: write

jobs:
  verify:
    if: "github.event.head_commit.message == 'chore: verify final Lane C cleanup baseline'"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Ratchet historical exception set and fix R25 prose citation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          test_path = Path('01_Plans/tests/test_legacy_done_root_references.py')
          body = test_path.read_text(encoding='utf-8')
          old = '''EXTERNAL_HISTORICAL_EXCEPTIONS = {
              (
                  "01_Plans/dogfood/doc_kj_atlas_dogfood_r15.json",
                  "issue-AI-IR-PROMPT-EVIDENCE-01-render-ir-evidence-in-provider-prompts.md",
              ),
              (
                  "01_Plans/dogfood/doc_kj_atlas_dogfood_r18.json",
                  "issue-DOC-ISSUE-LIFECYCLE-01-done-memos-remain-at-active-root.md",
              ),
              (
                  "01_Plans/dogfood/doc_kj_atlas_dogfood_r2.json",
                  "issue-DX-CI-MCP-01-mcp-tests-not-run-in-ci.md",
              ),
              (
                  "01_Plans/research/phase-exit-evaluation-ENV-ARCH-01-2026-03-11.md",
                  "issue-ENV-ARCH-01-global-env-prefix-migration.md",
              ),
              (
                  "01_Plans/research/core-value-realization-priorities-2026-07-18.md",
                  "issue-MVP-EXIT-01-productization-readiness.md",
              ),
              (
                  "01_Plans/research/mvp-exit-01-human-acceptance-handoff.md",
                  "issue-MVP-EXIT-01-productization-readiness.md",
              ),
          }'''
          new = '''EXTERNAL_HISTORICAL_EXCEPTIONS = {
              (
                  "01_Plans/research/phase-exit-evaluation-ENV-ARCH-01-2026-03-11.md",
                  "issue-ENV-ARCH-01-global-env-prefix-migration.md",
              ),
          }'''
          if body.count(old) != 1:
              raise SystemExit('expected exactly one historical exception block')
          test_path.write_text(body.replace(old, new, 1), encoding='utf-8')

          r25_path = Path('01_Plans/dogfood/cognitive-dogfood-continuous-2026-09-06-r25.md')
          r25 = r25_path.read_text(encoding='utf-8')
          old_sentence = 'frozen commit上でこのblobが存在した座標は`01_Plans/issues/issue-AI-ROUTE-01-...md`であり、current `done/` pathではない。したがって#3001の変更はcurrent lifecycle参照としては自然でも、frozen snapshot coordinateとしては不正だった。'
          new_sentence = 'frozen commit上でこのblobが存在した座標は、当時のactive-rootに置かれていた同Issueファイルであり、current `done/` pathではない。したがって#3001の変更はcurrent lifecycle参照としては自然でも、frozen snapshot coordinateとしては不正だった。'
          if r25.count(old_sentence) != 1:
              raise SystemExit('expected exactly one R25 historical-coordinate sentence')
          r25_path.write_text(r25.replace(old_sentence, new_sentence, 1), encoding='utf-8')
          PY
      - name: Verify planning and docs contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest 01_Plans.tests.test_legacy_done_root_references
          python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --format json
          python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong
          git diff --check
      - name: Commit verified cleanup and remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          rm .github/workflows/lane-c-verify-retired-qa-e2e-cleanup-once.yml
          git add 01_Plans/tests/test_legacy_done_root_references.py 01_Plans/dogfood/cognitive-dogfood-continuous-2026-09-06-r25.md .github/workflows/lane-c-verify-retired-qa-e2e-cleanup-once.yml
          git commit -m 'test(planning): close Lane C retired-path baseline gaps'
          git push origin HEAD
