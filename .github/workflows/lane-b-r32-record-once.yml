name: lane-b-r32-record-once

on:
  push:
    branches:
      - lane-b/provider-measurement-result-analyzer

permissions:
  contents: write

jobs:
  record-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/provider-measurement-result-analyzer

      - name: Record R32
        run: |
          python .github/lane-b-r32-record.py
          grep -F '## R32 — provider実測結果のfail-closed検証・比較analyzer' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          grep -F '54 test' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md
          git diff --check

      - name: Commit record and remove temporary files
        run: |
          rm .github/lane-b-r32-record.py
          rm .github/workflows/lane-b-r32-record-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): record R32 provider measurement analyzer'
          git push origin HEAD:lane-b/provider-measurement-result-analyzer
