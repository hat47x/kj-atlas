name: sync check-narrative token baseline docs once

on:
  push:
    branches:
      - measure/check-narrative-token-baseline-20260904

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: measure/check-narrative-token-baseline-20260904
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply documentation synchronization
        run: python .github/scripts/sync_check_narrative_token_docs_once.py

      - name: Validate active plan documents
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/triage_actionable_plans.py --format text > /tmp/triage.txt
          test -s /tmp/triage.txt
          grep -F 'check-narrative' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md >/dev/null
          grep -F '171,426' 01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md >/dev/null
          grep -F 'token数ではない' 01_Plans/issues/issue-AI-IR-STAGE5-SCOPE-01-classify-remaining-ai-input-paths.md >/dev/null
          git -c core.whitespace=cr-at-eol diff --check

      - name: Remove one-shot files and push synchronized docs
        run: |
          rm .github/workflows/sync-check-narrative-token-docs-once.yml
          rm .github/scripts/sync_check_narrative_token_docs_once.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: check-narrativeのtoken計測基準を同期する'
          git push origin HEAD:measure/check-narrative-token-baseline-20260904
