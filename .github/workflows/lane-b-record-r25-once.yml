name: lane-b-record-r25-once

on:
  push:
    branches:
      - lane-b/layout-c-hierarchical-characterization

permissions:
  contents: write

jobs:
  record-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/layout-c-hierarchical-characterization

      - name: Append R25 and self-delete
        run: |
          python -c "import base64,pathlib; p=pathlib.Path('01_Plans/issues/issue-AI-IR-SCALE-01-preserve-large-round-evidence-under-token-budget.md'); p.write_text(p.read_text(encoding='utf-8') + base64.b64decode('').decode('utf-8'), encoding='utf-8')"
          rm .github/workflows/lane-b-record-r25-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs(ai): record hierarchical layout C characterization'
          git push origin HEAD:lane-b/layout-c-hierarchical-characterization
