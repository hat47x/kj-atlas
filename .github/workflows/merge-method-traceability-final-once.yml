name: merge method traceability final validation (one-shot)

on:
  push:
    branches:
      - feat/merge-method-traceability-final-r2-20260904

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/merge-method-traceability-final-r2-20260904
          fetch-depth: 0

      - name: Load validated patch script and R20 source
        run: |
          git fetch origin feat/merge-method-traceability-final-20260904 dogfood/r20-merge-method-traceability-20260904
          git show origin/feat/merge-method-traceability-final-20260904:.github/scripts/apply_merge_method_traceability_final_once.py > /tmp/apply_merge_method.py
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/apply_merge_method.py')
          text = path.read_text(encoding='utf-8')
          old = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              old_bytes = old.encode("utf-8")
              new_bytes = new.encode("utf-8")
              count = data.count(old_bytes)
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              target.write_bytes(data.replace(old_bytes, new_bytes, 1))
          '''
          new = '''def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              old_bytes = old.encode("utf-8")
              new_bytes = new.encode("utf-8")
              count = data.count(old_bytes)
              if count == 0 and "\\n" in old and "\\r\\n" not in old:
                  old_crlf = old.replace("\\n", "\\r\\n").encode("utf-8")
                  crlf_count = data.count(old_crlf)
                  if crlf_count == 1:
                      new_crlf = new.replace("\\n", "\\r\\n").encode("utf-8")
                      target.write_bytes(data.replace(old_crlf, new_crlf, 1))
                      return
              if count != 1:
                  raise RuntimeError(f"{path}: expected one replacement, found {count}")
              target.write_bytes(data.replace(old_bytes, new_bytes, 1))
          '''
          if text.count(old) != 1:
              raise SystemExit('replace_once helper shape changed unexpectedly')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python /tmp/apply_merge_method.py apply

      - name: Complete mergeMethod boundary wiring
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              data = target.read_bytes()
              old_b = old.encode('utf-8')
              new_b = new.encode('utf-8')
              count = data.count(old_b)
              if count == 0 and '\n' in old and '\r\n' not in old:
                  old_b = old.replace('\n', '\r\n').encode('utf-8')
                  new_b = new.replace('\n', '\r\n').encode('utf-8')
                  count = data.count(old_b)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement, found {count}')
              target.write_bytes(data.replace(old_b, new_b, 1))

          # External agent merge proposals are new untrusted proposals, not old
          # persisted decisions. Require an explicit known method; never infer it.
          path = '03_Implement/frontend/src/import/agent_response_import.ts'
          replace_once(
              path,
              'import type { AgentResponseProvenance } from "../storage/agent_task_ledger";\n',
              'import type { AgentResponseProvenance } from "../storage/agent_task_ledger";\nimport { isMergeMethod, type MergeMethod } from "../domain/merge_method";\n',
          )
          replace_once(
              path,
              'export type AgentResponseProposalContent = {\n  title?: string;\n  text?: string;\n  mergedText?: string;\n};',
              'export type AgentResponseProposalContent = {\n  title?: string;\n  text?: string;\n  mergedText?: string;\n  mergeMethod?: MergeMethod;\n};',
          )
          replace_once(
              path,
              '    mergedText: sanitizeString(value.mergedText),\n  };',
              '    mergedText: sanitizeString(value.mergedText),\n    mergeMethod: isMergeMethod(value.mergeMethod) ? value.mergeMethod : undefined,\n  };',
          )
          replace_once(
              path,
              '  const proposal: ParsedAgentProposal = {\n    proposalId: sanitizeMarkdownForDisplay(proposalId),\n    kind,\n    targetRef: parseTargetRef(value.targetRef),\n    content: parseContent(value.content),',
              '  const content = parseContent(value.content);\n  if (kind === "merge_candidate" && !isMergeMethod(content.mergeMethod)) {\n    return { errors: ["proposal.merge_candidate_missing_or_invalid_merge_method"], warnings };\n  }\n\n  const proposal: ParsedAgentProposal = {\n    proposalId: sanitizeMarkdownForDisplay(proposalId),\n    kind,\n    targetRef: parseTargetRef(value.targetRef),\n    content,',
          )

          path = '03_Implement/frontend/src/import/agent_response_import.test.ts'
          anchor = '  describe("patch proposals", () => {'
          addition = '''  describe("merge candidate method boundary", () => {\n    const mergeCandidate = {\n      proposalId: "merge-1",\n      kind: "merge_candidate",\n      targetRef: { cardIds: ["c1", "c2"] },\n      content: { mergedText: "統合候補", mergeMethod: "kernel_fusion" },\n      rationale: "二枚から共通する意味核を立てる",\n    };\n\n    it("keeps an explicit known merge method", () => {\n      const result = parseAgentResponse(buildValidResponseJson({ proposals: [mergeCandidate] }), "strict");\n      expect(result.ok).toBe(true);\n      if (!result.ok) return;\n      expect(result.response.proposals[0].content.mergeMethod).toBe("kernel_fusion");\n    });\n\n    it("discards a merge candidate with no method in lenient mode instead of inferring one", () => {\n      const { mergeMethod: _ignored, ...contentWithoutMethod } = mergeCandidate.content;\n      const result = parseAgentResponse(\n        buildValidResponseJson({ proposals: [{ ...mergeCandidate, content: contentWithoutMethod }] }),\n        "lenient",\n      );\n      expect(result.ok).toBe(true);\n      if (!result.ok) return;\n      expect(result.response.proposals).toHaveLength(0);\n      expect(result.warnings.some((warning) => warning.includes("merge_candidate_missing_or_invalid_merge_method"))).toBe(true);\n    });\n\n    it("rejects an unknown merge method in strict mode", () => {\n      const result = parseAgentResponse(\n        buildValidResponseJson({\n          proposals: [{ ...mergeCandidate, content: { ...mergeCandidate.content, mergeMethod: "semantic_similarity" } }],\n        }),\n        "strict",\n      );\n      expect(result.ok).toBe(false);\n      if (result.ok) return;\n      expect(result.errors[0]).toContain("merge_candidate_missing_or_invalid_merge_method");\n    });\n  });\n\n'''
          replace_once(path, anchor, addition + anchor)

          # App only admits the already-validated external method into the common
          # MergeSuggestion shape; missing method remains non-adoptable.
          path = '03_Implement/frontend/src/App.tsx'
          replace_once(
              path,
              '          const mergedText = review.content.mergedText ?? review.content.text;\n          if (cardIds.length < 2 || !mergedText) break;',
              '          const mergedText = review.content.mergedText ?? review.content.text;\n          const mergeMethod = review.content.mergeMethod;\n          if (cardIds.length < 2 || !mergedText || !mergeMethod) break;',
          )
          replace_once(
              path,
              '              mergedTextDraft: mergedText,\n              rationale: review.rationale,',
              '              mergedTextDraft: mergedText,\n              mergeMethod,\n              rationale: review.rationale,',
          )

          # mergeMethod is a structural enum in inquiry bundles, so preserve it;
          # free-text rationale/note remain redacted under the existing policy.
          replace_once(
              '03_Implement/frontend/src/domain/inquiry_bundle_safe_mode.ts',
              '  rationale: "redact",\n  // R3-tier-1:',
              '  rationale: "redact",\n  mergeMethod: "preserve",\n  // R3-tier-1:',
          )

          # New Stream-B decision records must carry the method explicitly.
          path = '03_Implement/frontend/src/domain/stream_b_contract_handoff.ts'
          replace_once(
              path,
              'import type { DocumentV1 } from "./types";\n',
              'import type { DocumentV1 } from "./types";\nimport type { MergeMethod } from "./merge_method";\n',
          )
          replace_once(
              path,
              '  mergedTextDraft: string;\n  editedText: string;\n};',
              '  mergedTextDraft: string;\n  editedText: string;\n  mergeMethod: MergeMethod;\n};',
          )
          replace_once(
              path,
              '    entry.action === input.decision &&\n    entry.decisionId !== undefined &&',
              '    entry.action === input.decision &&\n    entry.mergeMethod === input.mergeMethod &&\n    entry.decisionId !== undefined &&',
          )

          replace_once(
              '03_Implement/frontend/src/domain/stream_b_contract_handoff.test.ts',
              '        mergedTextDraft: "risk mitigation",\n        editedText: "risk mitigation (reviewed)",',
              '        mergedTextDraft: "risk mitigation",\n        editedText: "risk mitigation (reviewed)",\n        mergeMethod: "near_duplicate",',
          )
          replace_once(
              '03_Implement/frontend/src/domain/stream_b_mock_validation.test.ts',
              '          mergedTextDraft: "risk mitigation",\n          editedText: `risk mitigation (${action})`,',
              '          mergedTextDraft: "risk mitigation",\n          editedText: `risk mitigation (${action})`,\n          mergeMethod: "near_duplicate",',
          )
          PY

      - name: Update provider-switch fixture to the new response contract
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('03_Implement/backend/tests/test_llm_provider.py')
          text = path.read_text(encoding='utf-8')
          old = '\"mergedTextDraft\":\"merged\"}'
          new = '\"mergedTextDraft\":\"merged\",\"mergeMethod\":\"near_duplicate\"}'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected two provider-switch merge fixtures, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Validate backend merge method contract
        working-directory: 03_Implement/backend
        run: |
          pytest tests/test_ai_merge_semantics.py tests/test_ai_merge_ir.py -q
          pytest tests/ -k 'suggest_merges or merge_suggestion' -q
          ruff check src tests/test_ai_merge_semantics.py tests/test_ai_merge_ir.py tests/test_llm_provider.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci

      - name: Validate frontend merge method contract
        working-directory: 03_Implement/frontend
        run: |
          npx vitest run \
            src/api/client.test.ts \
            src/domain/merge_candidates.test.ts \
            src/domain/merge_suggestion_decisions.test.ts \
            src/domain/merge_suggestion_apply.test.ts \
            src/domain/validate_doc.test.ts \
            src/domain/stream_b_contract_handoff.test.ts \
            src/domain/stream_b_mock_validation.test.ts \
            src/import/agent_response_import.test.ts \
            src/ui/MergeSuggestionsPanel.test.ts
          npm run typecheck
          npm run test:i18n

      - name: Install Chromium
        working-directory: 03_Implement/frontend
        run: npx playwright install --with-deps chromium

      - name: Validate decision to persistence traceability
        working-directory: 03_Implement/frontend
        run: npx playwright test e2e/merge_suggestion_apply_persistence.spec.ts

      - name: Finalize API and issue memo
        run: python /tmp/apply_merge_method.py finalize-docs

      - name: Validate planning and documentation contracts
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/dogfood/validate_dogfood_docs.py
          python 01_Plans/triage_actionable_plans.py --format text > /tmp/triage.txt
          test -s /tmp/triage.txt
          test ! -e 01_Plans/issues/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          test -e 01_Plans/issues/done/issue-AI-MERGE-SEMANTICS-01-define-card-merge-semantics.md
          git -c core.whitespace=cr-at-eol diff --check

      - name: Remove one-shot workflow and push validated changes
        run: |
          rm .github/workflows/merge-method-traceability-final-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: merge方式を提案から判断履歴まで追跡する'
          git push origin HEAD:feat/merge-method-traceability-final-r2-20260904
