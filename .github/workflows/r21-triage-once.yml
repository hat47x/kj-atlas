name: R21 triage once

on:
  push:
    branches:
      - dogfood/r21-triage-20260904
    paths:
      - .github/workflows/r21-triage-once.yml

permissions:
  contents: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dogfood/r21-triage-20260904
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run current planning triage
        run: |
          python 01_Plans/triage_actionable_plans.py --format json > /tmp/triage.json
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('/tmp/triage.json').read_text())
          print('SUMMARY', json.dumps(report['summary'], ensure_ascii=False, sort_keys=True))
          print('ERRORS', json.dumps(report['errors'], ensure_ascii=False, sort_keys=True))
          for item in report['actionable_issues'][:25]:
              print('ISSUE', json.dumps(item, ensure_ascii=False, sort_keys=True))
          PY
      - name: Remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/r21-triage-once.yml
          git add -A
          git commit -m 'ci: R21 triage one-shotを削除する'
          git push origin HEAD:dogfood/r21-triage-20260904
