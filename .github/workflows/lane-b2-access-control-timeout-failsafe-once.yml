name: Lane B2 access-control timeout fail-safe once

on:
  push:
    branches:
      - test/lane-b2-access-control-timeout-failsafe-20260907

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add focused timeout fail-safe contract
        shell: bash
        run: |
          set -euo pipefail
          test_file='03_Implement/backend/tests/test_access_control_external_http_adapter.py'
          if ! grep -q 'test_external_http_adapter_timeout_uses_configured_fail_safe' "$test_file"; then
            cat >> "$test_file" <<'PY'


@pytest.mark.parametrize(
    ("fail_safe_mode", "expected_allow", "expected_read_only"),
    [
        ("deny", False, False),
        ("read_only", True, True),
    ],
)
def test_external_http_adapter_timeout_uses_configured_fail_safe(
    monkeypatch: pytest.MonkeyPatch,
    fail_safe_mode: str,
    expected_allow: bool,
    expected_read_only: bool,
) -> None:
    def _raise_timeout(request, timeout_seconds):  # noqa: ANN001, ARG001
        raise TimeoutError("simulated PDP timeout")

    monkeypatch.setattr("kj_atlas_api.access_control.open_trusted_http", _raise_timeout)
    adapter = ExternalPolicyAccessControlAdapter(
        config=ExternalPolicyAdapterConfig(endpoint="https://policy.example.local/evaluate")
    )
    request = AccessRequest(
        action="read",
        auth=AuthContext(actor_ref="user-1"),
        resource=AccessResource(
            doc_id="doc-1",
            visibility="Org",
            policy_ref="opa://policy/v1",
        ),
    )

    decision = resolve_access_decision(
        adapter=adapter,
        request=request,
        fail_safe_mode=fail_safe_mode,
    )

    assert decision.allow is expected_allow
    assert decision.read_only is expected_read_only
    assert decision.reason == "policy_ref_unreachable"
PY
          fi
      - name: Verify contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q -e '03_Implement/backend[test]'
          python -m pytest -q 03_Implement/backend/tests/test_access_control_external_http_adapter.py
          ruff check 03_Implement/backend/tests/test_access_control_external_http_adapter.py
          python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
          python 01_Plans/docs_check.py
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git -c core.whitespace=cr-at-eol diff --check
          changed="$(git diff --name-only HEAD)"
          printf '%s\n' "$changed"
          test "$changed" = '03_Implement/backend/tests/test_access_control_external_http_adapter.py'
      - name: Commit verified payload
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add 03_Implement/backend/tests/test_access_control_external_http_adapter.py
            git commit -m 'test(authz): timeout fail-safe contractを固定する'
            git push origin HEAD:test/lane-b2-access-control-timeout-failsafe-20260907
          fi
