name: Lane B2 SaaS implementation admin-key gate fix once

on:
  push:
    branches:
      - fix/lane-b2-saas-implementation-admin-key-20260908

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align implementation gate with admin-key startup requirement
        run: |
          python - <<'PY'
          from pathlib import Path

          registry_path = Path('02_Architecture/runtime_parameter_registry.md')
          registry = registry_path.read_text(encoding='utf-8')
          old = 'runtime safety policyはPostgreSQL、JIT無効、external access-control、`deny` fail-safe、external document binding、external tenant capability、SaaS OAuth broker authorize endpoint、auth-session hash keyを必須とし'
          new = 'runtime safety policyに加え、profile cross-key validationは`KJ_ATLAS_ADMIN_API_KEY`を必須とする。runtime safety policyはPostgreSQL、JIT無効、external access-control、`deny` fail-safe、external document binding、external tenant capability、SaaS OAuth broker authorize endpoint、auth-session hash keyを必須とし'
          if registry.count(old) != 1:
              raise SystemExit(f'expected one implementation-gate target, got {registry.count(old)}')
          registry_path.write_text(registry.replace(old, new), encoding='utf-8')

          test_path = Path('01_Plans/tests/test_saas_profile_hard_gate_contract.py')
          test = test_path.read_text(encoding='utf-8')
          old_test = '        self.assertIn("auth-session hash key", implementation_gate)\n'
          new_test = old_test + '        self.assertIn("`KJ_ATLAS_ADMIN_API_KEY`", implementation_gate)\n'
          if test.count(old_test) != 1:
              raise SystemExit(f'expected one focused assertion target, got {test.count(old_test)}')
          test_path.write_text(test.replace(old_test, new_test), encoding='utf-8')
          PY
      - name: Verify focused SaaS profile hard-gate contract
        run: python -m unittest 01_Plans.tests.test_saas_profile_hard_gate_contract
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git diff --check
          git diff --name-only origin/main...HEAD
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "01_Plans/tests/test_saas_profile_hard_gate_contract.py 02_Architecture/runtime_parameter_registry.md "
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 01_Plans/tests/test_saas_profile_hard_gate_contract.py 02_Architecture/runtime_parameter_registry.md
          git commit -m "docs(config): SaaS implementation gateへadmin keyを反映する"
          git rm .github/workflows/lane-b2-saas-implementation-admin-key-fix-once.yml
          git commit -m "ci: retire Lane B2 SaaS implementation admin-key workflow"
          git push
