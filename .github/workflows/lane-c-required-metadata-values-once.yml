name: Temporary lane C required metadata values fix

on:
  push:
    branches:
      - fix/lane-c-required-metadata-values-20260904

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-required-metadata-values-20260904

      - name: Apply validator fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          validator = Path('01_Plans/issues/validate_active_issue_memos.py')
          text = validator.read_text(encoding='utf-8')

          old_extract = '''def extract_field_value(memo_text: str, field_name: str) -> str | None:
              pattern = rf"^- {re.escape(field_name)}:\\s*(.+)$"
              match = re.search(pattern, memo_text, re.M)
              if not match:
                  return None
              return match.group(1).strip()


          def extract_verification_level(memo_text: str) -> str | None:
              match = re.search(r"^- Expected verification level:\\s*`([^`]+)`", memo_text, re.M)
              if not match:
                  return None
              return match.group(1).strip()
          '''
          new_extract = '''def extract_field_value(memo_text: str, field_name: str) -> str | None:
              # Keep metadata parsing line-local. ``\\s`` also matches newlines, so an
              # empty field could otherwise consume the next metadata line as its value.
              pattern = rf"^- {re.escape(field_name)}:[ \\t]*(.*)$"
              match = re.search(pattern, memo_text, re.M)
              if not match:
                  return None
              value = match.group(1).strip()
              return value or None


          def extract_verification_level(memo_text: str) -> str | None:
              raw = extract_field_value(memo_text, "Expected verification level")
              if raw is None:
                  return None
              if len(raw) >= 2 and raw.startswith("`") and raw.endswith("`"):
                  raw = raw[1:-1].strip()
              return raw or None
          '''
          if old_extract not in text:
              raise SystemExit('extract helper block did not match expected main content')
          text = text.replace(old_extract, new_extract, 1)

          old_required = '''        text = memo_path.read_text(encoding="utf-8")
              for field in REQUIRED_FIELDS:
                  if field not in text:
                      errors.append(f"{row.memo}: missing field {field}")

              level = extract_verification_level(text)
          '''
          new_required = '''        text = memo_path.read_text(encoding="utf-8")
              for field in REQUIRED_FIELDS:
                  field_name = field.removeprefix("- ").removesuffix(":")
                  if extract_field_value(text, field_name) is None:
                      errors.append(f"{row.memo}: missing or empty field {field}")

              level = extract_verification_level(text)
          '''
          if old_required not in text:
              raise SystemExit('required field block did not match expected main content')
          text = text.replace(old_required, new_required, 1)

          old_priority = '''        memo_status = extract_field_value(text, "Status")
              memo_source = extract_field_value(text, "Source Issue")
              memo_priority = extract_field_value(text, "Priority")

              if row.status not in ACTIVE_ISSUE_STATUSES:
          '''
          new_priority = '''        memo_status = extract_field_value(text, "Status")
              memo_source = extract_field_value(text, "Source Issue")

              if row.status not in ACTIVE_ISSUE_STATUSES:
          '''
          if old_priority not in text:
              raise SystemExit('priority extraction block did not match expected main content')
          text = text.replace(old_priority, new_priority, 1)

          old_priority_check = '''        if memo_priority is None or not memo_priority.strip():
                  errors.append(f"{row.memo}: missing or empty Priority value")

          '''
          if old_priority_check not in text:
              raise SystemExit('priority validation block did not match expected main content')
          text = text.replace(old_priority_check, '', 1)
          validator.write_text(text, encoding='utf-8')

          test_path = Path('01_Plans/issues/tests/test_required_metadata_values.py')
          test_path.write_text('''from __future__ import annotations

import importlib.util
import sys
import tempfile
import textwrap
import unittest
from pathlib import Path

MODULE_PATH = Path(__file__).resolve().parents[1] / "validate_active_issue_memos.py"
sys.path.insert(0, str(MODULE_PATH.parent))
SPEC = importlib.util.spec_from_file_location("validate_active_issue_memos_required_values", MODULE_PATH)
MODULE = importlib.util.module_from_spec(SPEC)
assert SPEC and SPEC.loader
sys.modules[SPEC.name] = MODULE
SPEC.loader.exec_module(MODULE)

extract_field_value = MODULE.extract_field_value
validate = MODULE.validate


class RequiredMetadataValuesTest(unittest.TestCase):
    REQUIRED_FIELDS = (
        "Type",
        "Status",
        "Source Issue",
        "Priority",
        "Scope",
        "Related ADR/Spec",
        "Expected verification level",
    )

    def memo(self, *, empty_field: str | None = None, verification: str = "`unit`") -> str:
        values = {
            "Type": "Process / Documentation quality",
            "Status": "Draft",
            "Source Issue": "N/A",
            "Priority": "P1",
            "Scope": "`01_Plans/issues/`",
            "Related ADR/Spec": "N/A",
            "Expected verification level": verification,
        }
        if empty_field is not None:
            values[empty_field] = ""
        return "\\n".join(f"- {name}: {values[name]}" for name in self.REQUIRED_FIELDS) + "\\n"

    def test_extract_field_value_does_not_cross_metadata_line_boundary(self) -> None:
        text = "- Source Issue:\\n- Priority: P1\\n"
        self.assertIsNone(extract_field_value(text, "Source Issue"))
        self.assertEqual("P1", extract_field_value(text, "Priority"))

    def test_validate_rejects_empty_required_metadata_values(self) -> None:
        for field in self.REQUIRED_FIELDS:
            with self.subTest(field=field), tempfile.TemporaryDirectory() as tmp:
                root = Path(tmp)
                (root / "issue-required-value.md").write_text(
                    self.memo(empty_field=field),
                    encoding="utf-8",
                )
                errors = validate(root)
                self.assertTrue(errors, f"empty {field} unexpectedly passed validation")
                if field != "Status":
                    self.assertTrue(
                        any("missing or empty field" in error and f"- {field}:" in error for error in errors),
                        errors,
                    )

    def test_validate_rejects_invalid_unquoted_verification_level(self) -> None:
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            (root / "issue-invalid-level.md").write_text(
                self.memo(verification="smoke"),
                encoding="utf-8",
            )
            errors = validate(root)
        self.assertTrue(any("invalid Expected verification level `smoke`" in error for error in errors), errors)

    def test_validate_accepts_complete_required_metadata(self) -> None:
        with tempfile.TemporaryDirectory() as tmp:
            root = Path(tmp)
            (root / "issue-complete.md").write_text(self.memo(), encoding="utf-8")
            errors = validate(root)
        self.assertEqual([], errors)


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          readme = Path('01_Plans/issues/README.md')
          readme_text = readme.read_text(encoding='utf-8')
          marker = '''- `Expected verification level`

### `Owner` フィールドの意味'''
          replacement = '''- `Expected verification level`

必須メタデータはラベルだけでなく値も必須とし、空欄は許容しない。`Source Issue` に外部Issueがない場合は `N/A` を明記する。`Expected verification level` は `docs-check / unit / integration / e2e` のいずれかを値として指定する。

### `Owner` フィールドの意味'''
          if marker not in readme_text:
              raise SystemExit('README required metadata marker did not match expected main content')
          readme.write_text(readme_text.replace(marker, replacement, 1), encoding='utf-8')

          done = Path('01_Plans/issues/done/issue-DOC-ISSUE-METADATA-01.md')
          done.write_text('''# issue-DOC-ISSUE-METADATA-01 — 必須メタデータの空値をvalidatorで拒否する

- Type: Process / Documentation quality
- Status: Done
- Source Issue: N/A
- Priority: P1
- Scope: `01_Plans/issues/validate_active_issue_memos.py`, `01_Plans/issues/tests/`, `01_Plans/issues/README.md`
- Related ADR/Spec: `ADR-0000`, `DOC-ISSUE-LIFECYCLE-01`
- Expected verification level: `unit`

## 課題

必須メタデータ検証が一部の項目でラベル文字列の存在だけを確認しており、空値を拒否できない。また `extract_field_value()` の `\\s*` が改行を含むため、空欄の次のメタデータ行を値として誤読し得る。

## 対応

- メタデータ抽出を行単位に限定し、空値を `None` として扱う。
- Active issue memoの全必須メタデータに非空値を要求する。
- verification levelはバッククォート有無に依存せず値を抽出し、許可集合を検査する。
- 空欄の行跨ぎ誤読と各必須項目の空値を回帰テストで固定する。

## 受入条件

- 空の必須メタデータがvalidatorを通過しない。
- 空欄が次行の値を取り込まない。
- `docs-check / unit / integration / e2e` 以外のverification levelを表記形式によらず拒否する。
- 既存のissue validatorテストと実リポジトリ検証が成功する。

## 検証結果

このmemoを含む変更で `python -m unittest discover -s 01_Plans/issues/tests -p "test_*.py"` と `python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues` を実行し、成功した状態だけをcommitする。
