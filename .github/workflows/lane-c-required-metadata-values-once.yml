name: Temporary lane C required metadata values fix

on:
  push:
    branches:
      - fix/lane-c-required-metadata-values-20260904

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/lane-c-required-metadata-values-20260904
      - name: Apply validator fix and regression tests
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d > /tmp/lane_c_patch.py
          python /tmp/lane_c_patch.py
      - name: Run issue memo validator tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/issues/tests -p "test_*.py"
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
      - name: Commit tested changes and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-required-metadata-values-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: issue memo必須メタデータの空値を拒否する'
          git push origin HEAD:fix/lane-c-required-metadata-values-20260904
