name: Domain KJ causal direction verify once

on:
  push:
    branches:
      - fix/domain-kj-causal-direction-20260910

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frontend dependencies
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: Install backend test dependencies
        run: python -m pip install -e '03_Implement/backend[test]'
      - name: Targeted frontend causal direction tests
        working-directory: 03_Implement/frontend
        run: npm test -- src/domain/island_edge_aggregate.test.ts src/domain/island_edge_aggregate.python_equivalence.test.ts
      - name: Targeted backend equivalence tests
        working-directory: 03_Implement/backend
        run: python -m pytest tests/test_derived_island_relations_ts_equivalence.py
      - name: Full frontend tests
        working-directory: 03_Implement/frontend
        run: npm test
      - name: Typecheck
        working-directory: 03_Implement/frontend
        run: npm run typecheck
      - name: Verify diff scope
        run: |
          git diff --check 7d8df2748f5f35b53061341df2fe156634a2c990...HEAD
          git diff --name-only 7d8df2748f5f35b53061341df2fe156634a2c990...HEAD
      - name: Retire one-shot
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/domain-kj-causal-direction-once.yml
          git commit -m "ci: retire causal direction verification one-shot"
          git push origin HEAD:fix/domain-kj-causal-direction-20260910
