name: Lane B2 OAuth redirect path contract fix once

on:
  push:
    branches:
      - fix/lane-b2-oauth-redirect-path-contract-20260907

permissions:
  contents: write

jobs:
  patch-verify-retire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Align OAuth redirect path wording
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              '02_Architecture/runtime_parameter_registry.md': (
                  'OAuth フローの redirect URI（ADR-0074）',
                  'OAuth フローの redirect URI（ADR-0074）。path は `/session/callback` 固定',
              ),
              '04_Documentation/configuration.md': (
                  'ADR-0074 BFF: OAuth callback の redirect URI',
                  'ADR-0074 BFF: OAuth callback の redirect URI。path は `/session/callback` 固定',
              ),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              data = path.read_bytes()
              old_bytes = old.encode('utf-8')
              if data.count(old_bytes) != 1:
                  raise SystemExit(f'unexpected match count for {name}: {data.count(old_bytes)}')
              path.write_bytes(data.replace(old_bytes, new.encode('utf-8'), 1))
          PY
      - name: Verify focused security format contract
        run: python -m unittest 01_Plans.tests.test_security_format_contract
      - name: Verify planning contracts
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'
      - name: Verify documentation contracts
        run: python 01_Plans/docs_check.py
      - name: Verify narrow diff
        run: |
          git diff --check --ws-error-highlight=all -- 01_Plans/tests/test_security_format_contract.py 02_Architecture/runtime_parameter_registry.md
          python - <<'PY'
          from pathlib import Path
          import subprocess

          allowed = {
              '01_Plans/tests/test_security_format_contract.py',
              '02_Architecture/runtime_parameter_registry.md',
              '04_Documentation/configuration.md',
              '.github/workflows/lane-b2-oauth-redirect-path-fix-once.yml',
          }
          changed = set(subprocess.check_output(['git', 'diff', '--name-only', 'origin/main...HEAD']).decode().splitlines())
          changed.update(subprocess.check_output(['git', 'diff', '--name-only']).decode().splitlines())
          unexpected = changed - allowed
          if unexpected:
              raise SystemExit(f'unexpected changed files: {sorted(unexpected)}')

          current = Path('04_Documentation/configuration.md').read_bytes()
          baseline = subprocess.check_output(['git', 'show', 'origin/main:04_Documentation/configuration.md'])
          def eol_shape(data: bytes) -> tuple[int, int]:
              crlf = data.count(b'\r\n')
              return crlf, data.count(b'\n') - crlf
          if eol_shape(current) != eol_shape(baseline):
              raise SystemExit(f'configuration.md EOL shape changed: {eol_shape(baseline)} -> {eol_shape(current)}')
          PY
      - name: Commit patch and retire one-shot workflow
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add 02_Architecture/runtime_parameter_registry.md 04_Documentation/configuration.md
          git commit -m "docs(config): OAuth redirect path制約を明示する"
          git rm .github/workflows/lane-b2-oauth-redirect-path-fix-once.yml
          git commit -m "ci: retire Lane B2 OAuth redirect path workflow"
          git push
