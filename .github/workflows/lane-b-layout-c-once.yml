name: lane-b-layout-c-once

on:
  push:
    branches:
      - lane-b/layout-c-hierarchical-characterization

permissions:
  contents: write

jobs:
  verify-and-self-delete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: lane-b/layout-c-hierarchical-characterization

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        working-directory: 03_Implement/backend
        run: python -m pip install -e '.[test]'

      - name: Run hierarchical characterization
        working-directory: 03_Implement/backend
        run: |
          python scripts/measure_ai_layout_hierarchical_candidate.py > /tmp/layout-c.json
          cat /tmp/layout-c.json

      - name: Run focused regressions
        working-directory: 03_Implement/backend
        run: |
          python -m pytest -q \
            tests/test_ai_layout_hierarchical_candidate.py \
            tests/test_ai_route_projection_candidates.py \
            tests/test_ai_route_provider_token_measurement.py \
            tests/test_ai_route_required_meaning_scale.py

      - name: Lint and hygiene
        working-directory: 03_Implement/backend
        run: |
          python -m ruff check \
            scripts/measure_ai_layout_hierarchical_candidate.py \
            tests/test_ai_layout_hierarchical_candidate.py
          git diff --check

      - name: Self-delete workflow
        run: |
          rm .github/workflows/lane-b-layout-c-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore(ci): remove lane-b layout C verification workflow'
          git push origin HEAD:lane-b/layout-c-hierarchical-characterization
