name: Temporary lane C SaaS E2E ledger sync r2 verification

on:
  push:
    branches:
      - docs/lane-c-sync-saas-e2e-ledgers-r2-20260904

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/lane-c-sync-saas-e2e-ledgers-r2-20260904
          fetch-depth: 0

      - name: Apply previously verified ledger diff
        run: |
          set -euo pipefail
          git checkout origin/docs/lane-c-sync-saas-e2e-ledgers-20260904 -- \
            01_Plans/issues/issue-AUTH-ONE-TIME-JWT-01-request-token-supply-contract.md \
            01_Plans/issues/issue-QA-E2E-SAAS-01-tenant-session-coverage-gap.md \
            01_Plans/issues/done/issue-DOC-SAAS-E2E-LEDGER-SYNC-01-current-evidence-boundaries.md

      - name: Verify planning and stale-state contracts
        run: |
          set -euo pipefail
          python -m unittest discover -s 01_Plans/tests -p "test_*.py"
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          python 01_Plans/triage_actionable_plans.py --root 01_Plans --format json > /tmp/triage.json
          python -c 'import json; from pathlib import Path; report=json.loads(Path("/tmp/triage.json").read_text(encoding="utf-8")); assert not report.get("errors"), report.get("errors")'
          python 01_Plans/check_stale_merge_reintroduction.py --base-ref origin/main --head-ref HEAD --json --fail-on-strong > /tmp/stale.json
          python -c 'import json; from pathlib import Path; report=json.loads(Path("/tmp/stale.json").read_text(encoding="utf-8")); assert report["strongCount"] == 0, report'
          git -c core.whitespace=cr-at-eol diff --check

      - name: Commit verified final changes and remove temporary workflow
        run: |
          set -euo pipefail
          rm .github/workflows/lane-c-saas-e2e-ledger-sync-r2-verify.yml
          git config user.name "hat47x"
          git config user.email "hat47x@gmail.com"
          git add -A
          git commit -m "docs: SaaS E2E台帳を現在の実証境界へ同期する"
          git push origin HEAD:docs/lane-c-sync-saas-e2e-ledgers-r2-20260904
