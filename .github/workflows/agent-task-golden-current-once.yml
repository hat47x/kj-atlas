name: Agent task golden current once

on:
  push:
    branches:
      - fix/agent-task-golden-merge-method-current-20260904
    paths:
      - .github/workflows/agent-task-golden-current-once.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/agent-task-golden-merge-method-current-20260904
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 03_Implement/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 最新のmainを取り込む
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git merge --no-edit origin/main
      - name: フロントエンドの依存関係を導入する
        working-directory: 03_Implement/frontend
        run: npm ci
      - name: フロントエンド全体と型を検証する
        working-directory: 03_Implement/frontend
        run: |
          npm test
          npm run typecheck
      - name: リポジトリの契約を再検証する
        run: |
          python 01_Plans/issues/validate_active_issue_memos.py
          python 01_Plans/docs_check.py
          python 03_Implement/backend/scripts/check_design_consistency.py
          git -c core.whitespace=cr-at-eol diff --check
      - name: 一時workflowを削除して検証済みheadを保存する
        run: |
          rm .github/workflows/agent-task-golden-current-once.yml
          git add -A
          git -c core.whitespace=cr-at-eol diff --cached --check
          git commit -m 'ci: agent task goldenの検証用workflowを削除する'
          git push origin HEAD:fix/agent-task-golden-merge-method-current-20260904
