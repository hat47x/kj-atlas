name: Lane C QA E2E USE closeout diagnostic once

on:
  push:
    branches:
      - docs/lane-c-qa-e2e-use-01-closeout-20260907

permissions:
  contents: read

jobs:
  diagnose:
    if: "github.event.head_commit.message == 'ci: diagnose QA-E2E-USE-01 closeout once'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enumerate exact canonical references
        run: |
          set -euo pipefail
          OLD='01_Plans/issues/issue-QA-E2E-USE-01-realistic-user-journey-expansion.md'
          echo '=== exact references ==='
          git grep -n -F "$OLD" -- ':!/.github/workflows/lane-c-qa-e2e-use-closeout-diagnostic-once.yml' || true
          echo '=== issue metadata / unchecked items ==='
          grep -nE '^(Status:|Open Readiness:|Execution:)|^- \[ \]' "$OLD" || true
          echo '=== Done issue metadata samples ==='
          grep -R -h -E '^(Status:|Open Readiness:|Execution:)' 01_Plans/issues/done/ | sort | uniq -c | head -80 || true
          echo '=== lifecycle validator status vocabulary ==='
          grep -R -n -E 'Execution|Status|Done|Open Readiness' 01_Plans/issues/validate_active_issue_memos.py 01_Plans/tests | head -200 || true
      - name: Baseline planning and docs guards
        run: |
          python -m pip install pytest
          python -m pytest -q 01_Plans/tests
          python 01_Plans/issues/validate_active_issue_memos.py --root 01_Plans/issues
          python 01_Plans/docs_check.py
          if test -f 01_Plans/issues/triage_active_issue_memos.py; then
            python 01_Plans/issues/triage_active_issue_memos.py --root 01_Plans/issues || true
          fi
