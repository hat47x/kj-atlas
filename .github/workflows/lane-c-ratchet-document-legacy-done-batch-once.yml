name: Lane C document legacy Done ratchet once

on:
  push:
    branches:
      - chore/lane-c-ratchet-document-legacy-done-batch-20260905

permissions:
  contents: write

jobs:
  migrate-and-verify:
    if: "github.event.head_commit.message == 'chore: 文書系legacy Done移行workflowを起動する'"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 文書系legacy Doneを3件移行する
        run: python .github/scripts/lane_c_ratchet_document_legacy_done_batch_once.py

      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py'

      - name: Planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Active issue memo validation
        run: python 01_Plans/issues/validate_active_issue_memos.py

      - name: Documentation contract check
        run: python 01_Plans/docs_check.py

      - name: Live triage
        run: python 01_Plans/triage_actionable_plans.py --format json

      - name: Diff check
        run: git diff --check

      - name: 検証済み移行をbranchへ記録する
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add 01_Plans
          git commit -m 'docs: 文書系legacy Doneを正規配置へ移す'
          git push origin HEAD
