name: R43 dogfood cross-key relational invariant verify once

on:
  push:
    branches:
      - dogfood/r43-cross-key-relational-invariant-20260908

permissions:
  contents: write

jobs:
  sync-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: R43を継続dogfood索引へ同期する
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          text = path.read_text(encoding='utf-8')
          if 'cognitive-dogfood-continuous-2026-09-08-r43.md' not in text:
              marker = '- `ai-ir-required-semantic-coverage-map-2026-09-03.md`'
              if marker not in text:
                  raise SystemExit('R43 index insertion boundary not found')
              addition = (
                  '- `cognitive-dogfood-continuous-2026-09-08-r43.md`\n'
                  '  - R43。PR #3104/#3105/#3107で、各key単体は有効でも同値credentialやselectorとleftover dependent settingsの組合せが起動時拒否される実陽性を分析し、per-key acceptanceとconfiguration-state validityを分離した記録。\n'
                  '- `doc_kj_atlas_dogfood_r43.json`\n'
                  '  - R43のKJキャンバス。credential separation、selector dependency、presence/absence relationをcross-key relational invariantとして統合し、R36/R37/R42との責務差を保ちつつgeneric dependency graphへ一般化しない構造を保持する。\n'
              )
              text = text.replace(marker, addition + marker, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py

      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py'

      - name: Docs check
        run: python 01_Plans/docs_check.py

      - name: Working-tree hygiene
        run: |
          git diff --check
          python - <<'PY'
          import subprocess

          expected = {
              '.github/workflows/r43-dogfood-cross-key-relational-verify-once.yml',
              '01_Plans/dogfood/cognitive-dogfood-continuous-2026-09-08-r43.md',
              '01_Plans/dogfood/cognitive-dogfood-index.md',
              '01_Plans/dogfood/doc_kj_atlas_dogfood_r43.json',
          }
          committed = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'], text=True
          ).splitlines()
          working = subprocess.check_output(
              ['git', 'diff', '--name-only'], text=True
          ).splitlines()
          actual = set(committed) | set(working)
          if actual != expected:
              raise SystemExit(f'unexpected R43 diff: {sorted(actual)}')
          PY

      - name: 検証済みR43をbranchへ記録しone-shotを退役する
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 01_Plans/dogfood/cognitive-dogfood-index.md
          git rm .github/workflows/r43-dogfood-cross-key-relational-verify-once.yml
          git diff --cached --check
          git commit -m 'dogfood: sync R43 index and retire one-shot'
          git push origin HEAD:${GITHUB_REF_NAME}
