name: R29 dogfood sync and verify once

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync-and-verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: R29を継続dogfood索引へ同期する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('01_Plans/dogfood/cognitive-dogfood-index.md')
          body = path.read_text(encoding='utf-8')
          anchor = """- `doc_kj_atlas_dogfood_r28.json`\n  - R28のKJキャンバス。索引はtopic・ID・関係・正本への導線を持てる一方、current state authorityは各正本へ戻し、一例だけで状態語一般を禁止するguardへ飛躍しない構造を保持する。\n- `ai-ir-required-semantic-coverage-map-2026-09-03.md`\n"""
          replacement = """- `doc_kj_atlas_dogfood_r28.json`\n  - R28のKJキャンバス。索引はtopic・ID・関係・正本への導線を持てる一方、current state authorityは各正本へ戻し、一例だけで状態語一般を禁止するguardへ飛躍しない構造を保持する。\n- `cognitive-dogfood-continuous-2026-09-06-r29.md`\n  - R29。PR #3003で実装default 50,000に対して公開registry/configurationが10,000のまま残った実driftと、#3014でkey existenceからdefault値の意味一致へcontractを引き上げた経路を分析した記録。\n- `doc_kj_atlas_dogfood_r29.json`\n  - R29のKJキャンバス。契約項目の存在と意味値一致を分け、静的に安全に読めるdefaultだけを照合し、R28の「複製をやめる」境界とは別に「必要な複製は意味まで守る」構造を保持する。\n- `ai-ir-required-semantic-coverage-map-2026-09-03.md`\n"""
          count = body.count(anchor)
          if count != 1:
              raise SystemExit(f'expected one R28 index anchor, got {count}')
          path.write_text(body.replace(anchor, replacement, 1), encoding='utf-8')
          PY
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py' -v
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
      - name: 検証済みR29をbranchへ記録しone-shotを退役する
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/r29-dogfood-once.yml
          git config user.name 'hat47x'
          git config user.email 'hat47x@gmail.com'
          git add 01_Plans/dogfood/cognitive-dogfood-index.md .github/workflows/r29-dogfood-once.yml
          git commit -m 'dogfood: R29索引を同期してone-shotを退役する'
          git push origin HEAD:${{ github.head_ref }}
