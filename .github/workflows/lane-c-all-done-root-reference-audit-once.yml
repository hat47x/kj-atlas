name: Lane C all Done root reference audit once

on:
  push:
    branches:
      - audit/lane-c-all-done-root-references-20260905

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 全Done memoの旧root参照を完全一致監査する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          done_root = Path('01_Plans/issues/done')
          workflow = '.github/workflows/lane-c-all-done-root-reference-audit-once.yml'
          names = sorted(path.name for path in done_root.glob('issue-*.md'))
          stale = []
          for name in names:
              retired = f'01_Plans/issues/{name}'
              completed = subprocess.run(
                  ['git', 'grep', '-n', '-F', retired, '--', '.', f':!{workflow}'],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  encoding='utf-8',
              )
              if completed.returncode not in (0, 1):
                  raise SystemExit(completed.stderr.strip() or f'git grep failed: {retired}')
              if completed.returncode == 0:
                  stale.extend(completed.stdout.splitlines())
          print(f'canonical_done_issue_count={len(names)}')
          print(f'stale_root_reference_count={len(stale)}')
          for line in stale:
              print(line)
          if stale:
              raise SystemExit('stale root references found')
          PY
