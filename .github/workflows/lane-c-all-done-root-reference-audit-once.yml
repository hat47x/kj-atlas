name: Lane C all Done root reference audit once

on:
  push:
    branches:
      - audit/lane-c-all-done-root-references-20260905

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 全Done memoの旧root参照を履歴内部と外部参照に分ける
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          done_root = Path('01_Plans/issues/done')
          workflow = '.github/workflows/lane-c-all-done-root-reference-audit-once.yml'
          names = sorted(path.name for path in done_root.glob('issue-*.md'))
          inside_done = []
          outside_done = []
          for name in names:
              retired = f'01_Plans/issues/{name}'
              completed = subprocess.run(
                  ['git', 'grep', '-n', '-F', retired, '--', '.', f':!{workflow}'],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  encoding='utf-8',
              )
              if completed.returncode not in (0, 1):
                  raise SystemExit(completed.stderr.strip() or f'git grep failed: {retired}')
              if completed.returncode != 0:
                  continue
              for line in completed.stdout.splitlines():
                  if line.startswith('01_Plans/issues/done/'):
                      inside_done.append(line)
                  else:
                      outside_done.append(line)
          print(f'canonical_done_issue_count={len(names)}')
          print(f'historical_inside_done_count={len(inside_done)}')
          print(f'external_stale_root_reference_count={len(outside_done)}')
          for line in outside_done:
              print(line)
          if outside_done:
              raise SystemExit('external stale root references found')
          PY
