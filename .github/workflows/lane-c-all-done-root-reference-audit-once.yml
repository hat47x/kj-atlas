name: Lane C all Done root reference audit once

on:
  push:
    branches:
      - audit/lane-c-all-done-root-references-20260905

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/lane-c-all-done-root-references-20260905
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Done旧root参照を来歴と現行参照へ分けて監査する
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          done_root = Path('01_Plans/issues/done')
          workflow = '.github/workflows/lane-c-all-done-root-reference-audit-once.yml'
          historical_prefixes = (
              '01_Plans/dogfood/',
              '01_Plans/research/',
          )
          names = sorted(path.name for path in done_root.glob('issue-*.md'))
          inside_done = []
          historical_provenance = []
          live_stale = []

          for name in names:
              retired = f'01_Plans/issues/{name}'
              completed = subprocess.run(
                  ['git', 'grep', '-n', '-F', retired, '--', '.', f':!{workflow}'],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  encoding='utf-8',
              )
              if completed.returncode not in (0, 1):
                  raise SystemExit(completed.stderr.strip() or f'git grep failed: {retired}')
              if completed.returncode != 0:
                  continue

              for line in completed.stdout.splitlines():
                  if line.startswith('01_Plans/issues/done/'):
                      inside_done.append(line)
                  elif line.startswith(historical_prefixes):
                      historical_provenance.append(line)
                  else:
                      live_stale.append(line)

          print(f'canonical_done_issue_count={len(names)}')
          print(f'historical_inside_done_count={len(inside_done)}')
          print(f'historical_provenance_reference_count={len(historical_provenance)}')
          for line in historical_provenance:
              print(f'provenance:{line}')
          print(f'live_stale_root_reference_count={len(live_stale)}')
          for line in live_stale:
              print(f'live-stale:{line}')

          if live_stale:
              raise SystemExit('live stale root references found')
          PY
      - name: 成功したone-shot workflowを削除する
        shell: bash
        run: |
          rm .github/workflows/lane-c-all-done-root-reference-audit-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove completed Done root reference audit workflow'
          git push origin HEAD:audit/lane-c-all-done-root-references-20260905
