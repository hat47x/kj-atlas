name: R26 one-shot retirement verification

on:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Focused retired one-shot guard
        run: python -m unittest discover -s 01_Plans/tests -p 'test_retired_one_shot_assets.py' -v
      - name: Repository-wide planning tests
        run: python -m unittest discover -s 01_Plans/tests -p 'test_*.py' -v
      - name: Dogfood validator tests
        run: python -m unittest discover -s 01_Plans/dogfood -p 'test_*.py' -v
      - name: Dogfood validation
        run: python 01_Plans/dogfood/validate_dogfood_docs.py
      - name: Issue lifecycle tests
        run: python -m unittest discover -s 01_Plans/issues/tests -p 'test_*.py' -v
      - name: Active issue validation
        run: python 01_Plans/issues/validate_active_issue_memos.py
      - name: Docs check
        run: python 01_Plans/docs_check.py
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
