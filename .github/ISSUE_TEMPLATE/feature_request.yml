name: "✨ Feature request"
description: "機能提案 / Suggest an improvement"
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "課題 / Problem statement"
      description: "どんな課題を解決したいか"
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: "提案する解決策 / Proposed solution"
      description: "UI・API・ドキュメント等、想定変更を具体的に"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "検討した代替案 / Alternatives considered"
      description: "代替案やトレードオフ"
  - type: textarea
    id: context
    attributes:
      label: "補足コンテキスト / Additional context"
