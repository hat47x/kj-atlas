name: Setup frontend toolchain
description: Detect the Node version and package manager, set up Node.js with dependency caching, and install frontend dependencies.

inputs:
  working-directory:
    description: Directory that contains the frontend package manifest and lockfile.
    required: false
    default: 03_Implement/frontend
  token:
    description: Token handed to actions/setup-node for authenticated runtime downloads.
    required: false
    default: ${{ github.token }}

outputs:
  manager:
    description: Detected package manager (npm, pnpm, or yarn).
    value: ${{ steps.pm.outputs.manager }}
  run:
    description: Command prefix that executes a package script (for example `npm run`).
    value: ${{ steps.pm.outputs.run }}
  lockfile:
    description: Lockfile name that identified the package manager.
    value: ${{ steps.pm.outputs.lockfile }}
  node-version:
    description: Node version resolved from .nvmrc, or lts/* when .nvmrc is absent.
    value: ${{ steps.node.outputs.version }}

runs:
  using: composite
  steps:
    - name: Detect Node version
      id: node
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f "$GITHUB_WORKSPACE/.nvmrc" ]; then
          echo "version=$(cat "$GITHUB_WORKSPACE/.nvmrc")" >> "$GITHUB_OUTPUT"
        else
          echo "version=lts/*" >> "$GITHUB_OUTPUT"
        fi

    - name: Detect package manager
      id: pm
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if [ -f pnpm-lock.yaml ]; then
          echo "manager=pnpm" >> "$GITHUB_OUTPUT"
          echo "install=pnpm install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          echo "run=pnpm" >> "$GITHUB_OUTPUT"
          echo "lockfile=pnpm-lock.yaml" >> "$GITHUB_OUTPUT"
        elif [ -f yarn.lock ]; then
          echo "manager=yarn" >> "$GITHUB_OUTPUT"
          echo "install=yarn install --frozen-lockfile" >> "$GITHUB_OUTPUT"
          echo "run=yarn" >> "$GITHUB_OUTPUT"
          echo "lockfile=yarn.lock" >> "$GITHUB_OUTPUT"
        elif [ -f package-lock.json ]; then
          echo "manager=npm" >> "$GITHUB_OUTPUT"
          echo "install=npm ci" >> "$GITHUB_OUTPUT"
          echo "run=npm run" >> "$GITHUB_OUTPUT"
          echo "lockfile=package-lock.json" >> "$GITHUB_OUTPUT"
        else
          echo "No supported lockfile found" >&2
          exit 1
        fi

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: ${{ steps.node.outputs.version }}
        cache: ${{ steps.pm.outputs.manager }}
        cache-dependency-path: ${{ inputs.working-directory }}/${{ steps.pm.outputs.lockfile }}
        token: ${{ inputs.token }}

    - name: Enable corepack (pnpm/yarn)
      if: steps.pm.outputs.manager != 'npm'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: corepack enable

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        install_cmd="${{ steps.pm.outputs.install }}"
        for attempt in 1 2 3; do
          echo "Install attempt ${attempt}/3"
          $install_cmd && break
          if [ "$attempt" = "3" ]; then
            echo "All install attempts failed" >&2
            exit 1
          fi
          echo "Retrying in $((attempt * 15))s..."
          sleep $((attempt * 15))
        done
